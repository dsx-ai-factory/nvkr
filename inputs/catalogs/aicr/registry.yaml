  aicr-gb300-generic-training-terraform:
    fromSource: true
    source: aicr
    cgo: false
    platforms: [linux/amd64, linux/arm64]
    outputType: tarball
    artifactPath: bin/nvkr-aicr/bundle.tar.gz
    writeDir: bin/nvkr-aicr
    versionStamp:
      BUILD_VERSION: '{{.Version}}'
      GIT_VERSION: '{{.Commit}}'
    buildCommand:
      - bash
      - -euo
      - pipefail
      - -c
      - *render-aicr-bundle
      - nvkr-aicr-bundle
      - generic
      - gb300
