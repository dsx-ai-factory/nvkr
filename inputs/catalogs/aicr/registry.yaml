kind: SourceBuildRegistry
metadata:
  description: Shared aicr domain catalog; explicit producer variants preserve existing
    build and acquisition contracts.
  name: aicr
sources:
  aicr:
    repo: https://github.com/NVIDIA/aicr
    toolchainImage: golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c
    vendorCommand:
    - bash
    - -euo
    - pipefail
    - -c
    - |
      export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=readonly
      pins="$(sha256sum go.mod go.sum)"
      timeout --kill-after=10s 900s go mod download
      timeout --kill-after=10s 180s go mod verify
      GOPROXY=off timeout --kill-after=10s 900s go mod vendor
      printf '%s\n' "$pins" | sha256sum -c -
  aicr-aicr:
    constraint: 1.1.x
    repo: https://github.com/NVIDIA/aicr
    tool:
      companions:
      - aicr-attestation.sigstore.json
      executablePath: aicr
      format: tar-gzip
      platform: linux/arm64
      url: https://github.com/NVIDIA/aicr/releases/download/{{.Tag}}/aicr_{{.Version}}_linux_arm64.tar.gz
