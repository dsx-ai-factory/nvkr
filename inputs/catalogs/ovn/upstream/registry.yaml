apiVersion: nvkr.dev/catalog/v3
components:
  nvke-cni-ovn:
    artifactPath: nvkr-output/nvke-cni-ovn.tar
    buildCommand:
    - bash
    - -ec
    - {file: scripts/build-nvke-cni-ovn.sh.tmpl}
    fromSource: true
    materials:
      ovn-chart: ovn-kubernetes-chart
      ovn-image: ovn-kube-ubuntu
    outputType: tarball
    platforms:
    - linux/amd64
    - linux/arm64
    source: ovn-kubernetes
    sourceMetadata:
      NVKR_SOURCE_COMMIT: '{{.Commit}}'
      NVKR_SOURCE_REVISION: 1+git.{{printf "%.12s" .Commit}}
      NVKR_SOURCE_STREAM: '{{.ReleaseVersion}}'
    writeDir: nvkr-output
  ovn-kube-ubuntu:
    artifactPath: nvkr-output/ovn-kube-ubuntu.oci.tar
    buildCommand:
    - sh
    - -ec
    - |
      echo 'OVN IMAGE BUILD: source-owned Dockerfile acquires OVS/OVN and kubectl through APT; not hermetic or NV FIPS/STIG.' >&2
      exec buildctl-daemonless.sh build --frontend dockerfile.v0 \
        --local context=/src --local dockerfile=/src/dist/images \
        --opt filename=Dockerfile.ubuntu --opt platform=linux/{{.Arch}} \
        --opt build-arg:OVN_KUBERNETES_DIR=. \
        --opt build-arg:BUILDER_IMAGE=quay.io/projectquay/golang@sha256:d5acf07940fb5e6e2d07542abd853cece623d95ffd364769ec825aab5471d3b8 \
        --opt build-arg:KUBECTL_MINOR=1.34 \
        --opt build-arg:UBUNTU_BASE_IMAGE=docker.io/library/ubuntu@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78 \
        --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
        --output type=oci,dest=/src/nvkr-output/ovn-kube-ubuntu.oci.tar,oci-mediatypes=true,rewrite-timestamp=true,name=localhost/nvke/ovn-kubernetes:git-"${NVKR_SOURCE_COMMIT:?}"
    builderType: buildkit-rootless
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: ovn-kubernetes
    sourceMetadata:
      NVKR_SOURCE_COMMIT: '{{.Commit}}'
    toolchainImage: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    writeDir: nvkr-output
  ovn-kubernetes-chart:
    artifactPath: nvkr-output/ovn-kubernetes-chart.tar
    buildCommand:
    - bash
    - -ec
    - |
      readonly chart=/src/helm/ovn-kubernetes
      readonly out=/src/nvkr-output/ovn-kubernetes
      readonly stream="${NVKR_SOURCE_STREAM:?}"
      [[ "$stream" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]
      test -f "$chart/Chart.yaml"
      grep -Fqx "version: $stream" "$chart/Chart.yaml"
      test ! -e "$chart/values.yaml"
      mkdir -p "$out"
      cp -a "$chart/." "$out/"
      cp "$chart/../../LICENSE" "$out/LICENSE"
      # Preserve the source-owned template: getImage uses repository:tag.
      # A fixed repository@sha256 plus the authenticated hex slot gives an
      # exact digest reference without changing upstream Helm templates.
      test "$(grep -c '^    repository: ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu$' "$chart/values-single-node-zone.yaml")" = 1
      test "$(grep -c '^    tag: master$' "$chart/values-single-node-zone.yaml")" = 1
      sed -e 's|^    repository: ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu$|    repository: localhost/nvke/ovn-kubernetes@sha256|' \
        -e 's|^    tag: master$|    tag: ""|' \
        -e 's|^  enableOvnKubeIdentity: true$|  enableOvnKubeIdentity: false|' \
        -e '/^tags:$/a\
        ovnkube-control-plane: true\
        ovnkube-single-node-zone: true\
        ovnkube-identity: false\
        ovs-node: false' \
        "$chart/values-single-node-zone.yaml" >"$out/values.yaml"
      tar --format=ustar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
        --numeric-owner -C /src/nvkr-output -cf /src/nvkr-output/ovn-kubernetes-chart.tar ovn-kubernetes
    fromSource: true
    helm:
      chart: .
      images:
        ovn:
          values:
            digest: global.image.tag
            digestFormat: sha256-hex
    outputType: tarball
    platforms:
    - linux/amd64
    - linux/arm64
    source: ovn-kubernetes
    sourceMetadata:
      NVKR_SOURCE_STREAM: '{{.ReleaseVersion}}'
    writeDir: nvkr-output
kind: SourceBuildRegistry
metadata:
  description: Shared ovn/upstream domain catalog; explicit producer variants preserve
    existing build and acquisition contracts.
  name: ovn/upstream
sources:
  ovn-kubernetes:
    repo: https://github.com/ovn-kubernetes/ovn-kubernetes
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
