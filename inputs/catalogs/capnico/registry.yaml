apiVersion: nvkr.dev/catalog/v3
components:
  capnico-controller:
    artifactPath: bin/capnico-controller-{{.Arch}}.oci.tar
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/.
      --local dockerfile=/src --opt platform=linux/{{.Arch}} --output type=oci,dest=/src/bin/capnico-controller-{{.Arch}}.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: capnico
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    writeDir: bin
imports:
- path: ../shared/capnico.yaml
  sha256: 55a1243a2a690110edefd3ae46e025ad869981bbd76be1a05e799c123292ec06
  sources:
    capnico: capnico
kind: SourceBuildRegistry
metadata:
  description: Shared capnico domain catalog; explicit producer variants preserve
    existing build and acquisition contracts.
  name: capnico
sources: {}
