apiVersion: nvkr.dev/catalog/v3
components:

kind: SourceBuildRegistry
metadata:
  description: Kubernetes v1.34.12 client with explicit hash-checked dependency updates, built with the maintained Go toolchain for the disposable v1.34.2 demo tenant; diagnostic candidate only.
  name: validation-kubectl-demo-1-34-reviewed-candidate
sources:
  kubectl:
    constraint: 1.34.12
    repo: https://github.com/kubernetes/kubernetes
    toolchainImagesByArch:
      arm64: docker.io/library/golang@sha256:a83e961ad968e2e7abc2a59554e356f00c2a270a15fbb39f2c84a4caf13be9c3
    vendorCommand:
      - bash
      - -euc
      - |
        export GOENV=off GOWORK=/src/go.work GOTOOLCHAIN=local GOFLAGS=
        printf '%s\n' 'c9495a2f01e6267bd898ab70714c58bf6f44465b51695448efe25e64e9dbd456  go.mod' '9cb4e7a33a3f7294349fcb7d17ab6bd024c9ff03189c5d17ea003e01171a9283  go.sum' '8e263785e91b11b8fc0c1c6fb17308b6826ad26cb3a639cdc32a1b34ae6619d6  go.work' '78c1963edc90c86f181a7b2cbdf78c5b566fa7cec05a28b5e35dd1cae3ac9c88  go.work.sum' | sha256sum --quiet -c -
        go mod edit -require=golang.org/x/net@v0.60.0 -require=golang.org/x/text@v0.42.0 -require=golang.org/x/sys@v0.48.0 -require=golang.org/x/term@v0.46.0 -require=go.opentelemetry.io/otel@v1.42.0 -require=go.opentelemetry.io/otel/metric@v1.42.0 -require=go.opentelemetry.io/otel/trace@v1.42.0
        timeout --kill-after=10s 1080s go mod download all
        printf '%s\n' '6b781ad7b5a79b0f98c5cfc8a2059c413abb91cdceea10f556a39f1af89b75ba  go.mod' '9cb4e7a33a3f7294349fcb7d17ab6bd024c9ff03189c5d17ea003e01171a9283  go.sum' '8e263785e91b11b8fc0c1c6fb17308b6826ad26cb3a639cdc32a1b34ae6619d6  go.work' '061e0319d1894f3d4cc18b62cc1eff3b00893f67d32880d277c037ad9bea866f  go.work.sum' | sha256sum --quiet -c -
        GOPROXY=off timeout --kill-after=10s 60s go mod verify
        GOPROXY=off timeout --kill-after=10s 240s go work vendor
        printf '%s\n' '6b781ad7b5a79b0f98c5cfc8a2059c413abb91cdceea10f556a39f1af89b75ba  go.mod' '9cb4e7a33a3f7294349fcb7d17ab6bd024c9ff03189c5d17ea003e01171a9283  go.sum' '8e263785e91b11b8fc0c1c6fb17308b6826ad26cb3a639cdc32a1b34ae6619d6  go.work' '061e0319d1894f3d4cc18b62cc1eff3b00893f67d32880d277c037ad9bea866f  go.work.sum' | sha256sum --quiet -c -

imports:
- path: "../../shared/kubernetes-tools.yaml"
  sha256: 25083a650d117f2cadbb29fdd8052016253558ce62574b590e43457955d2a9bc
