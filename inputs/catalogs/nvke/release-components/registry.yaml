apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-m2-release-components
  description: Source-built CAPNICo, NKTP chart and NICO reference-profile fixtures, plus digest-pinned acquired CAPI, cert-manager and NKTP runtime images. Deployment topology and site configuration remain consumer-owned.
components:
  capi-controller-image:
    source: capi
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: registry.k8s.io/cluster-api/cluster-api-controller:v1.13.6
      evidence: {none: true}
  capi-kubeadm-bootstrap-image:
    source: capi
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: registry.k8s.io/cluster-api/kubeadm-bootstrap-controller:v1.13.6
      evidence: {none: true}
  capi-kubeadm-control-plane-image:
    source: capi
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: registry.k8s.io/cluster-api/kubeadm-control-plane-controller:v1.13.6
      evidence: {none: true}
  cert-manager-cainjector-image:
    source: cert-manager
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: quay.io/jetstack/cert-manager-cainjector:v1.21.1
      evidence: {none: true}
  cert-manager-controller-image:
    source: cert-manager
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: quay.io/jetstack/cert-manager-controller:v1.21.1
      evidence: {none: true}
  cert-manager-webhook-image:
    source: cert-manager
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: quay.io/jetstack/cert-manager-webhook:v1.21.1
      evidence: {none: true}
  nktp-collector-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: otel/opentelemetry-collector-k8s:0.164.0
      evidence: {none: true}
  nktp-kube-state-metrics-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
      evidence: {none: true}
  nktp-kubectl-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: registry.k8s.io/kubectl:v1.35.10
      evidence: {none: true}
  nktp-lgtm-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: grafana/otel-lgtm:0.38.0
      evidence: {none: true}
  nktp-metrics-server-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: registry.k8s.io/metrics-server/metrics-server:v0.8.1
      evidence: {none: true}
  nktp-node-exporter-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: quay.io/prometheus/node-exporter:v1.12.1
      evidence: {none: true}
  nktp-operator-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:0.161.0
      evidence: {none: true}
  nktp-target-allocator-image:
    source: nvke-nktp
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    prebuilt:
      image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:0.161.0
      evidence: {none: true}
  nktp-chart:
    fromSource: true
    source: nvke-nktp
    artifactPath: charts/nktp-0.1.0.tgz
    writeDir: charts
    platforms: [linux/amd64, linux/arm64]
    outputType: tarball
    buildCommand:
      - sh
      - -euc
      - .nvkr-tools/helm package nktp --destination=charts/
  capnico-controller:
    fromSource: true
    source: capnico
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    artifactPath: bin/capnico-controller-{{.Arch}}.oci.tar
    writeDir: bin
    platforms: [linux/amd64, linux/arm64]
    outputType: oci-image
    buildCommand:
      - sh
      - -ec
      - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src --opt platform=linux/{{.Arch}} --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --output type=oci,dest=/src/bin/capnico-controller-{{.Arch}}.oci.tar,oci-mediatypes=true,rewrite-timestamp=true
  nvke-nico-reference-profiles:
    fromSource: true
    source: nvke-content
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    artifactPath: bin/nico-reference-profiles-fixture-{{.Arch}}.oci.tar
    writeDir: bin
    platforms: [linux/amd64, linux/arm64]
    outputType: oci-image
    # Reference config profiles only, not fleet configuration or legacy OSProfiles.
    # Reuse the source-owned Dockerfile with a pinned multiarchitecture base index.
    buildCommand:
      - sh
      - -euc
      - |
        mkdir -p bin/profiles-context/profiles/configProfiles
        cp controller/test/fixtures/profiles/configProfiles/nico-vms-cp.yaml \
          controller/test/fixtures/profiles/configProfiles/nico-vms-worker.yaml bin/profiles-context/profiles/configProfiles/
        cp -R controller/test/fixtures/runbooks bin/profiles-context/
        buildctl-daemonless.sh build --frontend dockerfile.v0 \
          --local context=/src/bin/profiles-context \
          --local dockerfile=/src/controller/test/fixtures \
          --opt 'platform=linux/{{.Arch}}' \
          --opt context:alpine:3.24.1=docker-image://docker.io/library/alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
          --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
          --output 'type=oci,dest=/src/bin/nico-reference-profiles-fixture-{{.Arch}}.oci.tar,oci-mediatypes=true,rewrite-timestamp=true'
sources:
  capi:
    repo: https://github.com/kubernetes-sigs/cluster-api
    constraint: 1.13.6
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  cert-manager:
    repo: https://github.com/cert-manager/cert-manager
    # The selected NVKE release's make/tool-versions.mk owns this CAPI pair.
    constraint: 1.21.1
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  nvke-content:
    repo: https://github.com/dsx-ai-factory/nvke
    constraint: v0.23.0
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  # NKTP is released from its own repository. This must be the NKTP release
  # that the selected NVKE release's deploy/nico/nktp/values.yaml targets;
  # bump both together.
  nvke-nktp:
    repo: https://github.com/dsx-ai-factory/nvke-telemetry-pipeline
    tagPrefix: nktp/v
    constraint: 0.1.0
    # Empty entrypoint, curl and tar are supplied by this existing pinned image.
    # Helm v4.2.4 matches the NVKE controller chart's packaging. Its native executable
    # is acquired and verified in fetch, retained with the source, then used offline.
    toolchainImage: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
    vendorCommand:
      - sh
      - -euc
      - |
        case "$(uname -m)" in
          x86_64) arch=amd64; digest=c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 ;;
          aarch64) arch=arm64; digest=564de2191b881e9f71b5606b25345821ea1682f06ab90499d3ab22b530176da1 ;;
          *) echo 'Unsupported Helm execution architecture' >&2; exit 1 ;;
        esac
        curl --fail --location --max-time 120 --output /tmp/helm.tar.gz "https://get.helm.sh/helm-v4.2.4-linux-$arch.tar.gz"
        printf '%s  %s\n' "$digest" /tmp/helm.tar.gz | sha256sum -c -
        tar --no-same-owner -xzf /tmp/helm.tar.gz -C /tmp "linux-$arch/helm"
        mkdir -p .nvkr-tools
        cp "/tmp/linux-$arch/helm" .nvkr-tools/helm
        export HELM_REPOSITORY_CONFIG=/tmp/nktp-repositories.yaml
        export HELM_REPOSITORY_CACHE=/tmp/nktp-cache
        pins="$(sha256sum nktp/Chart.yaml nktp/Chart.lock)"
        timeout --kill-after=10s 120s .nvkr-tools/helm repo add nktp-otel https://open-telemetry.github.io/opentelemetry-helm-charts
        timeout --kill-after=10s 120s .nvkr-tools/helm repo add nktp-prometheus https://prometheus-community.github.io/helm-charts
        timeout --kill-after=10s 120s .nvkr-tools/helm repo add nktp-metrics https://kubernetes-sigs.github.io/metrics-server/
        timeout --kill-after=10s 120s .nvkr-tools/helm dependency build nktp --skip-refresh
        printf '%s\n' "$pins" | sha256sum -c -
        set -- nktp/charts/*.tgz
        test "$#" -eq 3
        printf '%s\n' \
          '084e6edb680cf4e2acc30bd496568c53fdf663cbacf6e17876b25785c35b7a13  nktp/charts/metrics-server-3.13.1.tgz' \
          'e3460a7572a2b9c98ff421a29501dc26cdd09d83859f0556f6c3f5443793afda  nktp/charts/opentelemetry-kube-stack-0.25.1.tgz' \
          '70fab291e00a34c58fd943bb075fecc2e2e73fa95db1bcbbe7cdfe008795354a  nktp/charts/prometheus-node-exporter-4.56.1.tgz' \
          | sha256sum -c -

imports:
- sources:
    capnico: capnico
  path: "../../shared/capnico.yaml"
  sha256: 55a1243a2a690110edefd3ae46e025ad869981bbd76be1a05e799c123292ec06
