apiVersion: nvkr.dev/catalog/v3
components:
  cwe:
    artifactPath: bin/cwe.oci.tar
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src --local
      dockerfile=/src/controller --opt platform=linux/amd64 --opt "build-arg:BUILD_VERSION=$BUILD_VERSION"
      --opt "build-arg:GIT_VERSION=$GIT_VERSION" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
      --output type=oci,dest=/src/bin/cwe.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    source: nvke-controller
    toolchainImage: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    versionStamp:
      BUILD_VERSION: '{{.ModuleTag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: bin
  nvke-helm:
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    artifactPath: bin/nvke-helm.tar
    buildCommand:
    - sh
    - -ec
    - tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner
      -C /src/controller/deploy/charts -cf /src/bin/nvke-helm.tar controller
    fromSource: true
    outputType: tarball
    platforms:
    - linux/amd64
    source: nvke-controller
    writeDir: bin
kind: SourceBuildRegistry
metadata:
  description: NVKE components from the release v0.23.0 at 2cfd00081b468d85a4894ec17e9deac13c9d8169. The CLI uses an offline Go build; CWE wraps the upstream Dockerfile in digest-pinned
    rootless BuildKit.
  name: nvke-v1
sources:
  cosign:
    constraint: 3.1.x
    repo: https://github.com/sigstore/cosign
    tool:
      executablePath: cosign-linux-amd64
      format: raw
      platform: linux/amd64
      url: https://github.com/sigstore/cosign/releases/download/{{.Tag}}/cosign-linux-amd64
  nvke-controller:
    constraint: v0.23.0
    repo: https://github.com/dsx-ai-factory/nvke
    toolchainImage: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
  syft:
    constraint: 1.51.x
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platform: linux/amd64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_linux_amd64.tar.gz

imports:
- sources:
    checkout: checkout
    download-artifact: download-artifact
    google-auth: google-auth
    setup-go: setup-go
    upload-artifact: upload-artifact
  path: "../../shared/build-actions.yaml"
  sha256: 9b03582303c0ee5f475c61f8e8fd2c755e1c1e70bba3434160bc412b832fbd51
- sources:
    nvke: nvke-cli
  components:
    nvkectl: nvkectl-release
  sourceNames:
    nvke-cli: nvke
  path: "../../shared/nvke.yaml"
  sha256: 90dbe40c5ce58b88c2722343db8a12f8f2ea4ad7f853fd20a8f69fb908994def
