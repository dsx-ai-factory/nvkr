apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-controller
  description: NVKE controller containers and helm chart.
components:
  nvkectl:
    fromSource: true
    source: nvke-cli
    cgo: false
    platforms: [linux/amd64, linux/arm64]
    outputType: host-package
    artifactPath: cli/bin/nvkectl
    writeDir: cli/bin
    versionStamp:
      NVKECTL_VERSION: '{{.ModuleTag}}'
      NVKECTL_COMMIT: '{{.Commit}}'
      NVKECTL_DATE: '{{.Date}}'
    buildCommand:
      - bash
      - -euc
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
        make -C cli build NVKECTL_TREE=clean
  nvke-controller-profiles-image:
    fromSource: true
    source: nvke
    patches:
      - name: patches/profiles-image.patch
        sha256: sha256:e324612924f15eadeeb02f4ac73eeb9c265ae571fe781e0c741811c291dd9849
    artifactPath: bin/nvke-controller-profiles-image-{{.Arch}}.oci.tar
    writeDir: bin
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    outputType: oci-image
    platforms: [linux/amd64, linux/arm64]
    buildCommand:
      - sh
      - -ec
      - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/nvkr-controller-profiles --opt platform=linux/{{.Arch}} --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --output type=oci,dest=/src/bin/nvke-controller-profiles-image-{{.Arch}}.oci.tar,oci-mediatypes=true
  nvke-controller-chart:
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    fromSource: true
    source: nvke-helm
    # Package the source chart with the selected NVKE release version.
    artifactPath: charts/nke-controller-0.22.0-beta.6.tgz
    writeDir: charts
    buildCommand: ['package', 'controller/deploy/charts/controller', '--version=0.22.0-beta.6', '--app-version=v0.22.0-beta.6', '--destination=charts/']
    outputType: tarball
    platforms:
    - linux/amd64
    - linux/arm64
  nvke-controller:
    fromSource: true
    source: nvke
    artifactPath: bin/nvke-controller-image-{{.Arch}}.oci.tar
    writeDir: bin
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/controller --opt platform=linux/{{.Arch}} --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --opt "build-arg:GIT_VERSION=$GIT_VERSION" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --output type=oci,dest=/src/bin/nvke-controller-image-{{.Arch}}.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    versionStamp:
      BUILD_VERSION: '{{.ModuleTag}}'
      GIT_VERSION: '{{.Commit}}'
  cluster-api-provider-provisioned:
    fromSource: true
    source: nvke
    artifactPath: bin/cluster-api-provider-provisioned-image-{{.Arch}}.oci.tar
    writeDir: bin
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/cluster-api-provider-provisioned --opt platform=linux/{{.Arch}} --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --output type=oci,dest=/src/bin/cluster-api-provider-provisioned-image-{{.Arch}}.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    versionStamp:
      BUILD_VERSION: '{{.ModuleTag}}'
  postgresql-chart:
    outputType: raw
    pinnedBy: nvke
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: postgresql
        repository: oci://registry-1.docker.io/bitnamicharts
      evidence:
        none: true
  spire-chart:
    outputType: raw
    pinnedBy: nvke
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: spire
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence:
        none: true
  spire-crds-chart:
    outputType: raw
    pinnedBy: nvke
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: spire-crds
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence:
        none: true
  temporal-chart:
    outputType: raw
    pinnedBy: nvke
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: temporal
        repository: https://go.temporal.io/helm-charts
      evidence:
        none: true
sources:
  nvke-cli:
    repo: https://github.com/dsx-ai-factory/nvke
    constraint: v0.22.0-beta.6
    toolchainImage: golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c
    vendorCommand:
      - bash
      - -euc
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
        test ! -e controller/deploy/charts/go.sum
        pins="$(sha256sum cli/go.mod cli/go.sum controller/api/go.mod controller/api/go.sum controller/deploy/charts/go.mod management-engine/go.mod management-engine/go.sum)"
        cd cli
        timeout --kill-after=10s 540s go mod download
        GOPROXY=off timeout --kill-after=10s 60s go mod verify
        GOPROXY=off timeout --kill-after=10s 180s go mod vendor
        cd ..
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        test ! -e controller/deploy/charts/go.sum
  nvke:
    pinSet:
      accounted:
        capnico:
          type: manifest
        controller:
          path: ../../controller/deploy/charts/controller
          type: helm
        nvke-base-config:
          type: template
        spire-oidc-provider-nodeport:
          type: manifest
        spire-server-nodeport:
          type: manifest
        spire-tpm-pubhashes:
          type: manifest
        nktp:
          path: ../../nktp/deploy/charts/nktp
          type: helm
      file: deploy/nico/nvke-deploy.yaml
      format: nvke-deploy-v1
      members:
        postgresql:
          artifact: postgresql-chart
        spire:
          artifact: spire-chart
        spire-crds:
          artifact: spire-crds-chart
        temporal:
          artifact: temporal-chart
    repo: https://github.com/dsx-ai-factory/nvke
    constraint: v0.22.0-beta.6
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  nvke-helm:
    repo: https://github.com/dsx-ai-factory/nvke
    constraint: v0.22.0-beta.6
    toolchainImage: alpine/helm@sha256:a6cf54599ccb99d90cf0712b30f03fdb3cab062e6b94e0418cc4db7e8a1464b2
    vendorCommand: ['dependency', 'build', 'controller/deploy/charts/controller']
  checkout:
    kind: github-action
    repo: https://github.com/actions/checkout
    constraint: 7.x
  download-artifact:
    kind: github-action
    repo: https://github.com/actions/download-artifact
    constraint: 8.x
  setup-go:
    kind: github-action
    repo: https://github.com/actions/setup-go
    constraint: 7.x
  upload-artifact:
    kind: github-action
    repo: https://github.com/actions/upload-artifact
    constraint: 7.x
  cosign:
    constraint: 3.1.3
    repo: https://github.com/sigstore/cosign
    tool:
      executablePath: cosign-linux-amd64
      format: raw
      platform: linux/amd64
      url: https://github.com/sigstore/cosign/releases/download/{{.Tag}}/cosign-linux-amd64
  syft:
    constraint: 1.51.1
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platform: linux/amd64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_linux_amd64.tar.gz
