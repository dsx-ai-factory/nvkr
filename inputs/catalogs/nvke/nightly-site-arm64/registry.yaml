apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-nightly-site-arm64
  description: Source-aligned CLI, controller and charts for the reviewed NVKE nightly suite. Profile-owned candidate producers; not runtime acceptance or a qualified release.
sources:
  nvke-cli:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0-beta.6
    # Go 1.27.2 on the existing Trixie base; the controller uses the same parent
    # through its source-owned GOLANG_IMAGE build argument below.
    toolchainImage: golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c
    vendorCommand:
      - bash
      - -euc
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
        # The source-owned charts module has no dependencies or go.sum.
        test ! -e controller/deploy/charts/go.sum
        pins="$(sha256sum cli/go.mod cli/go.sum controller/api/go.mod controller/api/go.sum controller/deploy/charts/go.mod management-engine/go.mod management-engine/go.sum)"
        cd cli
        timeout --kill-after=10s 540s go mod download
        GOPROXY=off timeout --kill-after=10s 60s go mod verify
        GOPROXY=off timeout --kill-after=10s 180s go mod vendor
        cd ..
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        test ! -e controller/deploy/charts/go.sum
  nvke-controller:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0-beta.6
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  nvke-controller-helm:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0-beta.6
    # Reuse the hosted Go image and operator-catalog's exact Helm acquisition.
    # The fetch owner seals the tool alongside its distinct source closure.
    toolchainImagesByArch:
      arm64: docker.io/library/golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c
    vendorCommand:
      - sh
      - -euc
      - |
        test ! -e nvkr-chart-tools
        mkdir -m 0755 nvkr-chart-tools
        archive=/tmp/nvkr-chart-helm-arm64.tar.gz
        timeout --kill-after=10s 240s curl --fail --silent --show-error --location \
          --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 \
          --retry 2 --retry-max-time 180 --max-filesize 268435456 \
          https://get.helm.sh/helm-v4.1.4-linux-arm64.tar.gz --output "$archive"
        printf '%s  %s\n' \
          13d03672be289045d2ff00e4e345d61de1c6f21c1257a45955a30e8ae036d8f1 "$archive" \
          | sha256sum --quiet -c -
        tar -xOzf "$archive" linux-arm64/helm > nvkr-chart-tools/helm
        tar -xOzf "$archive" linux-arm64/LICENSE > nvkr-chart-tools/LICENSE
        printf '%s\n' \
          '4d6e3a69e6203094d564d5d4e94325b1f7209421dc7e832a96d2510295e03f1d  nvkr-chart-tools/helm' \
          | sha256sum --quiet -c -
        chmod 0555 nvkr-chart-tools/helm
        pins="$(sha256sum controller/deploy/charts/controller/Chart.yaml)"
        timeout --kill-after=10s 120s ./nvkr-chart-tools/helm dependency build controller/deploy/charts/controller
        printf '%s\n' "$pins" | sha256sum --quiet -c -
  nvke-nktp-helm:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0-beta.6
    toolchainImagesByArch:
      arm64: docker.io/library/golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c
    # The source-owned Chart.lock selects the dependency versions. Fetch checks
    # their captured archive digests before offline packaging. These pins do not
    # authenticate upstream signatures or make the dependencies source builds.
    vendorCommand:
      - sh
      - -euc
      - |
        test ! -e nvkr-chart-tools
        mkdir -m 0755 nvkr-chart-tools
        archive=/tmp/nvkr-chart-helm-arm64.tar.gz
        timeout --kill-after=10s 240s curl --fail --silent --show-error --location \
          --proto '=https' --proto-redir '=https' --connect-timeout 15 --max-time 120 \
          --retry 2 --retry-max-time 180 --max-filesize 268435456 \
          https://get.helm.sh/helm-v4.1.4-linux-arm64.tar.gz --output "$archive"
        printf '%s  %s\n' \
          13d03672be289045d2ff00e4e345d61de1c6f21c1257a45955a30e8ae036d8f1 "$archive" \
          | sha256sum --quiet -c -
        tar -xOzf "$archive" linux-arm64/helm > nvkr-chart-tools/helm
        tar -xOzf "$archive" linux-arm64/LICENSE > nvkr-chart-tools/LICENSE
        printf '%s\n' \
          '4d6e3a69e6203094d564d5d4e94325b1f7209421dc7e832a96d2510295e03f1d  nvkr-chart-tools/helm' \
          | sha256sum --quiet -c -
        chmod 0555 nvkr-chart-tools/helm
        export HELM_REPOSITORY_CONFIG=/tmp/nktp-repositories.yaml
        export HELM_REPOSITORY_CACHE=/tmp/nktp-cache
        # These are the three exact URLs in the selected source's Chart.yaml.
        # Helm, not a custom parser, validates Chart.yaml against Chart.lock.
        pins="$(sha256sum nktp/deploy/charts/nktp/Chart.yaml nktp/deploy/charts/nktp/Chart.lock)"
        timeout --kill-after=10s 60s ./nvkr-chart-tools/helm repo add nktp-otel https://open-telemetry.github.io/opentelemetry-helm-charts
        timeout --kill-after=10s 60s ./nvkr-chart-tools/helm repo add nktp-prometheus https://prometheus-community.github.io/helm-charts
        timeout --kill-after=10s 60s ./nvkr-chart-tools/helm repo add nktp-metrics https://kubernetes-sigs.github.io/metrics-server/
        timeout --kill-after=10s 180s ./nvkr-chart-tools/helm dependency build nktp/deploy/charts/nktp --skip-refresh
        printf '%s\n' "$pins" | sha256sum -c -
        set -- nktp/deploy/charts/nktp/charts/*.tgz
        if [ "$#" -ne 3 ]; then
          echo 'Expected exactly three pinned NKTP dependency-chart archives.' >&2
          exit 1
        fi
        printf '%s\n' \
          '084e6edb680cf4e2acc30bd496568c53fdf663cbacf6e17876b25785c35b7a13  nktp/deploy/charts/nktp/charts/metrics-server-3.13.1.tgz' \
          'df7d63a331d9d164a276f5b4395c6383c00fe801abcc6b2ea969de182914dc32  nktp/deploy/charts/nktp/charts/opentelemetry-kube-stack-0.22.0.tgz' \
          '70fab291e00a34c58fd943bb075fecc2e2e73fa95db1bcbbe7cdfe008795354a  nktp/deploy/charts/nktp/charts/prometheus-node-exporter-4.56.1.tgz' \
          | sha256sum -c -
components:
  nvkectl:
    fromSource: true
    source: nvke-cli
    cgo: false
    platforms: [linux/arm64]
    outputType: host-package
    artifactPath: cli/bin/nvkectl
    writeDir: cli/bin
    versionStamp:
      NVKECTL_VERSION: '{{.Tag}}'
      NVKECTL_COMMIT: '{{.Commit}}'
      NVKECTL_DATE: '{{.Date}}'
    buildCommand:
      - bash
      - -euc
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
        # Make owns the linker symbols and proves the stamp by executing version.
        make -C cli build NVKECTL_TREE=clean
  nvke-controller:
    fromSource: true
    source: nvke-controller
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    artifactPath: bin/nvke-controller-image-{{.Arch}}.oci.tar
    writeDir: bin
    outputType: oci-image
    platforms: [linux/arm64]
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
    buildCommand:
      - sh
      - -ec
      - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/controller --opt platform=linux/{{.Arch}} --opt build-arg:GOLANG_IMAGE=docker.io/library/golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --opt "build-arg:GIT_VERSION=$GIT_VERSION" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --output type=oci,dest=/src/bin/nvke-controller-image-{{.Arch}}.oci.tar,oci-mediatypes=true
  nvke-controller-chart:
    fromSource: true
    source: nvke-controller-helm
    platforms: [linux/arm64]
    outputType: tarball
    artifactPath: charts/nke-controller-0.22.0-beta.6.tgz
    writeDir: charts
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    # The upstream Chart.yaml version is a placeholder; package the selected release.
    # The final package is bound to the produced controller digest.
    buildCommand:
      - sh
      - -euc
      - |
        printf '%s\n' \
          '4d6e3a69e6203094d564d5d4e94325b1f7209421dc7e832a96d2510295e03f1d  /src/nvkr-chart-tools/helm' \
          | sha256sum --quiet -c -
        exec timeout --kill-after=10s 60s /src/nvkr-chart-tools/helm package controller/deploy/charts/controller --version=0.22.0-beta.6 --app-version=v0.22.0-beta.6 --destination=charts/
  nktp-chart:
    fromSource: true
    source: nvke-nktp-helm
    platforms: [linux/arm64]
    outputType: tarball
    artifactPath: charts/nktp-0.22.0-beta.6.tgz
    writeDir: charts
    buildCommand:
      - sh
      - -euc
      - |
        printf '%s\n' \
          '4d6e3a69e6203094d564d5d4e94325b1f7209421dc7e832a96d2510295e03f1d  /src/nvkr-chart-tools/helm' \
          | sha256sum --quiet -c -
        exec timeout --kill-after=10s 60s /src/nvkr-chart-tools/helm package nktp/deploy/charts/nktp --version=0.22.0-beta.6 --app-version=v0.22.0-beta.6 --destination=charts/
