{
  "apiVersion": "nvkr.dev/catalog/v3",
  "kind": "SourceBuildRegistry",
  "metadata": {
    "name": "nvke-cli-arm64-local",
    "description": "Explicit new native ARM64 CLI producer using the maintained CLI source release and existing reviewed build command; not a target-changing catalog overlay."
  },
  "components": {
    "nvkectl-arm64": {
      "artifactPath": "cli/bin/nvkectl",
      "buildCommand": [
        "bash",
        "-euc",
        "export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor\nmake -C cli build NVKECTL_TREE=clean\n"
      ],
      "cgo": false,
      "fromSource": true,
      "outputType": "host-package",
      "platforms": [
        "linux/arm64"
      ],
      "source": "nvke",
      "versionStamp": {
        "NVKECTL_VERSION": "{{.Tag}}",
        "NVKECTL_COMMIT": "{{.Commit}}",
        "NVKECTL_DATE": "{{.Date}}"
      },
      "writeDir": "cli/bin"
    }
  },
  "sources": {},
  "imports": [
    {
      "path": "../../shared/nvke.yaml",
      "sha256": "90dbe40c5ce58b88c2722343db8a12f8f2ea4ad7f853fd20a8f69fb908994def",
      "sources": {
        "nvke": "nvke-cli"
      }
    }
  ]
}
