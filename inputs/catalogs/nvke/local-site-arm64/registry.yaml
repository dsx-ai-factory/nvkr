apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-local-site-arm64
  description: Source-aligned controller, CLI and charts for the staged NICo installer. Candidate source, not a complete demo or qualified release.
sources:
  nvke-controller-helm:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.23.0
    # Local Helm wrapper: the pinned parent bytes are unchanged. The launcher
    # builds/probes this diagnostic image and binds fresh bytes per attempt.
    toolchainImagesByArch:
      arm64: sha256:8fae65b2d2366fe8370d8e10f34ef5c11c43a8341bb727bb48b2fa2b1035dbf0
    vendorCommand: [helm, dependency, build, controller/deploy/charts/controller]
  # NKTP is released from its own repository. This must be the NKTP release
  # that the selected NVKE release's deploy/nico/nktp/values.yaml targets;
  # bump both together.
  nvke-nktp-helm:
    repo: https://github.com/dsx-ai-factory/nvke-telemetry-pipeline.git
    tagPrefix: nktp/v
    constraint: 0.1.0
    toolchainImagesByArch:
      arm64: sha256:8fae65b2d2366fe8370d8e10f34ef5c11c43a8341bb727bb48b2fa2b1035dbf0
    # The source-owned Chart.lock selects the dependency versions. Fetch checks
    # their captured archive digests before offline packaging. These pins do not
    # authenticate upstream signatures or make the dependencies source builds.
    vendorCommand:
      - sh
      - -euc
      - |
        export HELM_REPOSITORY_CONFIG=/tmp/nktp-repositories.yaml
        export HELM_REPOSITORY_CACHE=/tmp/nktp-cache
        # These are the three exact URLs in the selected source's Chart.yaml.
        # Helm, not a custom parser, validates Chart.yaml against Chart.lock.
        pins="$(sha256sum nktp/Chart.yaml nktp/Chart.lock)"
        helm repo add nktp-otel https://open-telemetry.github.io/opentelemetry-helm-charts
        helm repo add nktp-prometheus https://prometheus-community.github.io/helm-charts
        helm repo add nktp-metrics https://kubernetes-sigs.github.io/metrics-server/
        helm dependency build nktp --skip-refresh
        printf '%s\n' "$pins" | sha256sum -c -
        set -- nktp/charts/*.tgz
        if [ "$#" -ne 3 ]; then
          echo 'Expected exactly three pinned NKTP dependency-chart archives.' >&2
          exit 1
        fi
        printf '%s\n' \
          '084e6edb680cf4e2acc30bd496568c53fdf663cbacf6e17876b25785c35b7a13  nktp/charts/metrics-server-3.13.1.tgz' \
          'e3460a7572a2b9c98ff421a29501dc26cdd09d83859f0556f6c3f5443793afda  nktp/charts/opentelemetry-kube-stack-0.25.1.tgz' \
          '70fab291e00a34c58fd943bb075fecc2e2e73fa95db1bcbbe7cdfe008795354a  nktp/charts/prometheus-node-exporter-4.56.1.tgz' \
          | sha256sum -c -
components:
  nvke-controller-chart:
    fromSource: true
    source: nvke-controller-helm
    platforms: [linux/arm64]
    outputType: tarball
    artifactPath: charts/nvke-controller-0.23.0.tgz
    writeDir: charts
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    # The upstream Chart.yaml version is a placeholder; package the selected release.
    # The final package is bound to the produced controller digest.
    buildCommand: [sh, -euc, 'helm package controller/deploy/charts/controller --version=0.23.0 --app-version=v0.23.0 --destination=charts/']
  nktp-chart:
    fromSource: true
    source: nvke-nktp-helm
    platforms: [linux/arm64]
    outputType: tarball
    artifactPath: charts/nktp-0.1.0.tgz
    writeDir: charts
    buildCommand: [sh, -euc, 'helm package nktp --destination=charts/']

imports:
- sources:
    nvke-cli: nvke-cli-local-site-arm64
    nvke-controller: nvke-controller
  components:
    nvke-controller: nvke-controller
    nvkectl: nvkectl
  path: "../../shared/nvke.yaml"
  sha256: 90dbe40c5ce58b88c2722343db8a12f8f2ea4ad7f853fd20a8f69fb908994def
