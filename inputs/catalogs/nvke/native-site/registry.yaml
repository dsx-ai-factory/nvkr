apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-native-site
  description: Native Linux demo controller, CLI, provider and charts aligned to the renamed NVKE source contract. Local diagnostic inputs; no Release qualification claim.
sources:
  nvke-deploy:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.23.0
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    pinSet:
      file: deploy/nico/nvke-deploy.yaml
      format: nvke-deploy-v1
      accounted:
        nvke-base-config: {type: template}
        spire-tpm-pubhashes: {type: manifest}
        spire-server-nodeport: {type: manifest}
        spire-oidc-provider-nodeport: {type: manifest}
        capnico: {type: manifest}
        nktp: {type: helm, path: ../../nktp/deploy/charts/nktp}
        controller: {type: helm, path: ../../controller/deploy/charts/controller, chartName: nvke-controller}
      members:
        postgresql: {artifact: postgresql-chart}
        spire: {artifact: spire-chart}
        spire-crds: {artifact: spire-crds-chart}
        temporal: {artifact: temporal-chart}
  nvke-controller-helm:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.23.0
    toolchainImagesByArch:
      amd64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
      arm64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
    vendorCommand:
    - sh
    - -euc
    - |
      target_arch={{.Arch}}
      helm_digest() {
        case "$1" in
          amd64) printf '%s' c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 ;;
          arm64) printf '%s' 564de2191b881e9f71b5606b25345821ea1682f06ab90499d3ab22b530176da1 ;;
          *) echo 'Unsupported Helm architecture' >&2; exit 1 ;;
        esac
      }
      case "$(uname -m)" in
        x86_64) arch=amd64 ;;
        aarch64) arch=arm64 ;;
        *) echo 'Unsupported Helm execution architecture' >&2; exit 1 ;;
      esac
      digest=$(helm_digest "$arch")
      curl --fail --location --max-time 120 --output /tmp/helm.tar.gz "https://get.helm.sh/helm-v4.2.4-linux-$arch.tar.gz"
      printf '%s  %s\n' "$digest" /tmp/helm.tar.gz | sha256sum -c -
      tar --no-same-owner -xzf /tmp/helm.tar.gz -C /tmp "linux-$arch/helm"
      # The vendor sandbox's /tmp is noexec; only the held source volume executes.
      host_tools=$(mktemp -d .nvkr-helm-host.XXXXXX)
      trap 'rm -rf -- "$host_tools"' EXIT
      cp "/tmp/linux-$arch/helm" "$host_tools/helm"
      pins="$(sha256sum controller/deploy/charts/controller/Chart.yaml)"
      timeout --kill-after=10s 120s "$host_tools/helm" dependency build controller/deploy/charts/controller
      printf '%s\n' "$pins" | sha256sum -c -
      # The captured source bytes and vendor identity bind the build target,
      # independently of the utility host used to resolve chart dependencies.
      if [ "$target_arch" != "$arch" ]; then
        digest=$(helm_digest "$target_arch")
        curl --fail --location --max-time 120 --output /tmp/helm-target.tar.gz "https://get.helm.sh/helm-v4.2.4-linux-$target_arch.tar.gz"
        printf '%s  %s\n' "$digest" /tmp/helm-target.tar.gz | sha256sum -c -
        tar --no-same-owner -xzf /tmp/helm-target.tar.gz -C /tmp "linux-$target_arch/helm"
      fi
      mkdir -p .nvkr-tools
      cp "/tmp/linux-$target_arch/helm" .nvkr-tools/helm
  # NKTP is released from its own repository. This must be the NKTP release
  # that the selected NVKE release's deploy/nico/nktp/values.yaml targets;
  # bump both together.
  nvke-nktp-helm:
    repo: https://github.com/dsx-ai-factory/nvke-telemetry-pipeline.git
    tagPrefix: nktp/v
    constraint: 0.1.0
    toolchainImagesByArch:
      amd64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
      arm64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
    vendorCommand:
    - sh
    - -euc
    - |
      target_arch={{.Arch}}
      helm_digest() {
        case "$1" in
          amd64) printf '%s' c306b46f719b0a4da32d0f78ee21bf90ce8d602f15b22ab753f0674d1670a7f3 ;;
          arm64) printf '%s' 564de2191b881e9f71b5606b25345821ea1682f06ab90499d3ab22b530176da1 ;;
          *) echo 'Unsupported Helm architecture' >&2; exit 1 ;;
        esac
      }
      case "$(uname -m)" in
        x86_64) arch=amd64 ;;
        aarch64) arch=arm64 ;;
        *) echo 'Unsupported Helm execution architecture' >&2; exit 1 ;;
      esac
      digest=$(helm_digest "$arch")
      curl --fail --location --max-time 120 --output /tmp/helm.tar.gz "https://get.helm.sh/helm-v4.2.4-linux-$arch.tar.gz"
      printf '%s  %s\n' "$digest" /tmp/helm.tar.gz | sha256sum -c -
      tar --no-same-owner -xzf /tmp/helm.tar.gz -C /tmp "linux-$arch/helm"
      # The vendor sandbox's /tmp is noexec; only the held source volume executes.
      host_tools=$(mktemp -d .nvkr-helm-host.XXXXXX)
      trap 'rm -rf -- "$host_tools"' EXIT
      cp "/tmp/linux-$arch/helm" "$host_tools/helm"
      export HELM_REPOSITORY_CONFIG=/tmp/nktp-repositories.yaml
      export HELM_REPOSITORY_CACHE=/tmp/nktp-cache
      # These are the three exact URLs in the selected source's Chart.yaml.
      # Helm, not a custom parser, validates Chart.yaml against Chart.lock.
      pins="$(sha256sum nktp/Chart.yaml nktp/Chart.lock)"
      "$host_tools/helm" repo add nktp-otel https://open-telemetry.github.io/opentelemetry-helm-charts
      "$host_tools/helm" repo add nktp-prometheus https://prometheus-community.github.io/helm-charts
      "$host_tools/helm" repo add nktp-metrics https://kubernetes-sigs.github.io/metrics-server/
      "$host_tools/helm" dependency build nktp --skip-refresh
      printf '%s\n' "$pins" | sha256sum -c -
      # The captured source bytes and vendor identity bind the build target,
      # independently of the utility host used to resolve chart dependencies.
      if [ "$target_arch" != "$arch" ]; then
        digest=$(helm_digest "$target_arch")
        curl --fail --location --max-time 120 --output /tmp/helm-target.tar.gz "https://get.helm.sh/helm-v4.2.4-linux-$target_arch.tar.gz"
        printf '%s  %s\n' "$digest" /tmp/helm-target.tar.gz | sha256sum -c -
        tar --no-same-owner -xzf /tmp/helm-target.tar.gz -C /tmp "linux-$target_arch/helm"
      fi
      mkdir -p .nvkr-tools
      cp "/tmp/linux-$target_arch/helm" .nvkr-tools/helm
      set -- nktp/charts/*.tgz
      if [ "$#" -ne 3 ]; then
        echo 'Expected exactly three pinned NKTP dependency-chart archives.' >&2
        exit 1
      fi
      # The reviewed release and current main both select OTEL chart 0.25.1.
      # Helm validates Chart.lock; only these independently reviewed archives pass.
      set -- nktp/charts/opentelemetry-kube-stack-*.tgz
      if [ "$#" -ne 1 ]; then
        echo 'Expected exactly one reviewed NKTP OpenTelemetry archive.' >&2
        exit 1
      fi
      case "${1##*/}" in
        opentelemetry-kube-stack-0.25.1.tgz) otel_digest=e3460a7572a2b9c98ff421a29501dc26cdd09d83859f0556f6c3f5443793afda ;;
        *) echo 'Unreviewed NKTP OpenTelemetry dependency archive.' >&2; exit 1 ;;
      esac
      printf '%s\n' \
        '084e6edb680cf4e2acc30bd496568c53fdf663cbacf6e17876b25785c35b7a13  nktp/charts/metrics-server-3.13.1.tgz' \
        "$otel_digest  $1" \
        '70fab291e00a34c58fd943bb075fecc2e2e73fa95db1bcbbe7cdfe008795354a  nktp/charts/prometheus-node-exporter-4.56.1.tgz' \
        | sha256sum -c -
components:
  nvkectl:
    fromSource: true
    source: nvke-cli
    cgo: false
    platforms:
    - linux/amd64
    - linux/arm64
    outputType: host-package
    artifactPath: cli/bin/nvkectl
    writeDir: cli/bin
    versionStamp:
      NVKECTL_VERSION: git-{{.Commit}}
      NVKECTL_COMMIT: '{{.Commit}}'
      NVKECTL_DATE: '{{.Date}}'
    buildCommand:
    - bash
    - -euc
    - |
      export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
      make -C cli build NVKECTL_TREE=clean
  nvke-controller:
    fromSource: true
    source: nvke-controller
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    artifactPath: bin/nvke-controller-image-{{.Arch}}.oci.tar
    writeDir: bin
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    versionStamp:
      BUILD_VERSION: '{{.Commit}}'
      GIT_VERSION: '{{.Commit}}'
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/controller --opt platform=linux/{{.Arch}} --opt build-arg:GOLANG_IMAGE=docker.io/library/golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --opt "build-arg:GIT_VERSION=$GIT_VERSION" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --output type=oci,dest=/src/bin/nvke-controller-image-{{.Arch}}.oci.tar,oci-mediatypes=true
  nvke-controller-chart:
    fromSource: true
    source: nvke-controller-helm
    platforms:
    - linux/amd64
    - linux/arm64
    outputType: tarball
    artifactPath: charts/nvke-controller-0.0.0.tgz
    writeDir: charts
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    buildCommand:
    - .nvkr-tools/helm
    - package
    - controller/deploy/charts/controller
    - --destination=charts/
  nktp-chart:
    fromSource: true
    source: nvke-nktp-helm
    platforms:
    - linux/amd64
    - linux/arm64
    outputType: tarball
    # The chart's own version names the archive; move it with the nktp/v pin.
    artifactPath: charts/nktp-0.1.0.tgz
    writeDir: charts
    buildCommand:
    - .nvkr-tools/helm
    - package
    - nktp
    - --destination=charts/
  cluster-api-provider-provisioned:
    fromSource: true
    source: nvke-controller
    artifactPath: bin/cluster-api-provider-provisioned-image-{{.Arch}}.oci.tar
    writeDir: bin
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/cluster-api-provider-provisioned --opt platform=linux/{{.Arch}} --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --output type=oci,dest=/src/bin/cluster-api-provider-provisioned-image-{{.Arch}}.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    versionStamp:
      BUILD_VERSION: git-{{.Commit}}
  postgresql-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: postgresql
        repository: oci://registry-1.docker.io/bitnamicharts
      evidence:
        none: true
  spire-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: spire
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence:
        none: true
  spire-crds-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: spire-crds
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence:
        none: true
  temporal-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: temporal
        repository: https://go.temporal.io/helm-charts
      evidence:
        none: true

imports:
- sources:
    nvke-cli: nvke-cli-local-site-arm64
    nvke-controller: nvke-controller
  path: "../../shared/nvke.yaml"
  sha256: 90dbe40c5ce58b88c2722343db8a12f8f2ea4ad7f853fd20a8f69fb908994def
