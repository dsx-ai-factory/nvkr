apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-native-site-arm64
  description: Native Mac and Linux demo controller, CLI, provider and charts aligned to the renamed NVKE source contract. Local diagnostic inputs; no Release qualification claim.
sources:
  nvke-cli:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0
    toolchainImage: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
    vendorCommand:
    - bash
    - -euc
    - |
      export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
      # The source-owned charts module has no dependencies or go.sum.
      test ! -e controller/deploy/charts/go.sum
      pins="$(sha256sum cli/go.mod cli/go.sum controller/api/go.mod controller/api/go.sum controller/deploy/charts/go.mod)"
      cd cli
      timeout --kill-after=10s 540s go mod download
      GOPROXY=off timeout --kill-after=10s 60s go mod verify
      GOPROXY=off timeout --kill-after=10s 180s go mod vendor
      cd ..
      printf '%s\n' "$pins" | sha256sum --quiet -c -
      test ! -e controller/deploy/charts/go.sum
  nvke-deploy:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    pinSet:
      file: deploy/nico/nvke-deploy.yaml
      format: nvke-deploy-v1
      accounted:
        nvke-base-config: {type: template}
        spire-tpm-pubhashes: {type: manifest}
        spire-server-nodeport: {type: manifest}
        spire-oidc-provider-nodeport: {type: manifest}
        capnico: {type: manifest}
        nktp: {type: helm, path: ../../nktp/deploy/charts/nktp}
        controller: {type: helm, path: ../../controller/deploy/charts/controller, chartName: nvke-controller}
      members:
        postgresql: {artifact: postgresql-chart}
        spire: {artifact: spire-chart}
        spire-crds: {artifact: spire-crds-chart}
        temporal: {artifact: temporal-chart}
  nvke-controller:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  nvke-controller-helm:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0
    toolchainImagesByArch:
      arm64: sha256:8fae65b2d2366fe8370d8e10f34ef5c11c43a8341bb727bb48b2fa2b1035dbf0
    vendorCommand:
    - helm
    - dependency
    - build
    - controller/deploy/charts/controller
  nvke-nktp-helm:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: v0.22.0
    toolchainImagesByArch:
      arm64: sha256:8fae65b2d2366fe8370d8e10f34ef5c11c43a8341bb727bb48b2fa2b1035dbf0
    vendorCommand:
    - sh
    - -euc
    - |
      export HELM_REPOSITORY_CONFIG=/tmp/nktp-repositories.yaml
      export HELM_REPOSITORY_CACHE=/tmp/nktp-cache
      # These are the three exact URLs in the selected source's Chart.yaml.
      # Helm, not a custom parser, validates Chart.yaml against Chart.lock.
      pins="$(sha256sum nktp/deploy/charts/nktp/Chart.yaml nktp/deploy/charts/nktp/Chart.lock)"
      helm repo add nktp-otel https://open-telemetry.github.io/opentelemetry-helm-charts
      helm repo add nktp-prometheus https://prometheus-community.github.io/helm-charts
      helm repo add nktp-metrics https://kubernetes-sigs.github.io/metrics-server/
      helm dependency build nktp/deploy/charts/nktp --skip-refresh
      printf '%s\n' "$pins" | sha256sum -c -
      set -- nktp/deploy/charts/nktp/charts/*.tgz
      if [ "$#" -ne 3 ]; then
        echo 'Expected exactly three pinned NKTP dependency-chart archives.' >&2
        exit 1
      fi
      printf '%s\n' \
        '084e6edb680cf4e2acc30bd496568c53fdf663cbacf6e17876b25785c35b7a13  nktp/deploy/charts/nktp/charts/metrics-server-3.13.1.tgz' \
        'df7d63a331d9d164a276f5b4395c6383c00fe801abcc6b2ea969de182914dc32  nktp/deploy/charts/nktp/charts/opentelemetry-kube-stack-0.22.0.tgz' \
        '70fab291e00a34c58fd943bb075fecc2e2e73fa95db1bcbbe7cdfe008795354a  nktp/deploy/charts/nktp/charts/prometheus-node-exporter-4.56.1.tgz' \
        | sha256sum -c -
components:
  nvkectl:
    fromSource: true
    source: nvke-cli
    cgo: false
    platforms:
    - linux/arm64
    outputType: host-package
    artifactPath: cli/bin/nvkectl
    writeDir: cli/bin
    versionStamp:
      NVKECTL_VERSION: git-{{.Commit}}
      NVKECTL_COMMIT: '{{.Commit}}'
      NVKECTL_DATE: '{{.Date}}'
    buildCommand:
    - bash
    - -euc
    - |
      export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
      make -C cli build NVKECTL_TREE=clean
  nvke-controller:
    fromSource: true
    source: nvke-controller
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    artifactPath: bin/nvke-controller-image-{{.Arch}}.oci.tar
    writeDir: bin
    outputType: oci-image
    platforms:
    - linux/arm64
    versionStamp:
      BUILD_VERSION: '{{.Commit}}'
      GIT_VERSION: '{{.Commit}}'
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/controller --opt platform=linux/{{.Arch}} --opt build-arg:GOLANG_IMAGE=docker.io/library/golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --opt "build-arg:GIT_VERSION=$GIT_VERSION" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" --output type=oci,dest=/src/bin/nvke-controller-image-{{.Arch}}.oci.tar,oci-mediatypes=true
  nvke-controller-chart:
    fromSource: true
    source: nvke-controller-helm
    platforms:
    - linux/arm64
    outputType: tarball
    artifactPath: charts/nvke-controller-0.0.0.tgz
    writeDir: charts
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    buildCommand:
    - helm
    - package
    - controller/deploy/charts/controller
    - --destination=charts/
  nktp-chart:
    fromSource: true
    source: nvke-nktp-helm
    platforms:
    - linux/arm64
    outputType: tarball
    artifactPath: charts/nktp-0.0.0.tgz
    writeDir: charts
    buildCommand:
    - helm
    - package
    - nktp/deploy/charts/nktp
    - --destination=charts/
  cluster-api-provider-provisioned:
    fromSource: true
    source: nvke-controller
    artifactPath: bin/cluster-api-provider-provisioned-image-{{.Arch}}.oci.tar
    writeDir: bin
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src/cluster-api-provider-provisioned --opt platform=linux/{{.Arch}} --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --output type=oci,dest=/src/bin/cluster-api-provider-provisioned-image-{{.Arch}}.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    outputType: oci-image
    platforms:
    - linux/arm64
    versionStamp:
      BUILD_VERSION: git-{{.Commit}}
  postgresql-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: postgresql
        repository: oci://registry-1.docker.io/bitnamicharts
      evidence:
        none: true
  spire-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: spire
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence:
        none: true
  spire-crds-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: spire-crds
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence:
        none: true
  temporal-chart:
    outputType: raw
    pinnedBy: nvke-deploy
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      chart:
        name: temporal
        repository: https://go.temporal.io/helm-charts
      evidence:
        none: true
