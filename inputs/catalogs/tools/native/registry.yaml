apiVersion: nvkr.dev/catalog/v3
components:
    clusterctl:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: clusterctl
    clusterctl-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: clusterctl-linux
    helm:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: helm
    helm-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: helm-linux
    kind:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: kind
    kind-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: kind-linux
    kubectl:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: kubectl
    kubectl-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: kubectl-linux
    native-capi-exec-init-image:
        outputType: oci-image
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            image: docker.io/library/alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        source: nvke-deploy
    native-capi-exec-plugin-image:
        outputType: oci-image
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            image: ghcr.io/spiffe/k8s-spiffe-workload-jwt-exec-auth@sha256:e30e90774e5951f84eb6dfb36f972fead08b64c3bfdc0912c5b15f988e79de3a
        source: nvke-deploy
    native-workload-image:
        outputType: oci-image
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            image: docker.io/library/alpine@sha256:260479a1cfaf304c4c20da7f8405d3ce313513dcd534bb743257bdd2fe0f3e2d
        source: nvke-deploy
    nerdctl:
        artifactPath: _output/nerdctl
        buildCommand:
            - bash
            - -euc
            - |
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
              make binaries VERSION="${BUILD_VERSION:?}" REVISION="${GIT_VERSION:?}"
        cgo: false
        fromSource: true
        outputType: host-package
        platforms:
            - darwin/arm64
            - linux/arm64
        source: nerdctl-site
        versionStamp:
            BUILD_VERSION: '{{.Tag}}'
            GIT_VERSION: '{{.Commit}}'
        writeDir: _output
    nico-sim:
        artifactPath: controller/nico-sim/bin/nico-sim
        buildCommand:
            - bash
            - -euc
            - |
              cd controller/nico-sim
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
              make build-static
        buildCommandByPlatform:
            darwin/arm64:
                - go
                - -C
                - controller/nico-sim
                - build
                - -mod=vendor
                - -o
                - bin/nico-sim
                - ./cmd/nico-sim
        cgo: true
        fromSource: true
        outputType: host-package
        platforms:
            - darwin/arm64
            - linux/arm64
        source: nvke-nicosim
        writeDir: controller/nico-sim/bin
    nico-sim-runtime-assets:
        artifactPath: controller/nico-sim/bin/nicosim-runtime-assets.tar.gz
        buildCommand:
            - bash
            - -euc
            - |
              set -o pipefail
              cd controller/nico-sim
              tar --sort=name --format=ustar --mtime="@${SOURCE_DATE_EPOCH:?}" \
                --owner=0 --group=0 --numeric-owner --mode=u=rwX,go=rX \
                -cf - internal/seed/default-seed.yaml ui | \
                gzip -n > bin/nicosim-runtime-assets.tar.gz
        cgo: false
        fromSource: true
        outputType: tarball
        platforms:
            - darwin/arm64
            - linux/arm64
        source: nvke-nicosim
        writeDir: controller/nico-sim/bin
    nico-simctl:
        artifactPath: controller/nico-sim/bin/nico-simctl
        buildCommand:
            - bash
            - -euc
            - |
              cd controller/nico-sim
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
              go build -trimpath -o bin/nico-simctl ./cmd/nico-simctl
        cgo: false
        fromSource: true
        outputType: host-package
        platforms:
            - darwin/arm64
            - linux/arm64
        source: nvke-nicosim
        writeDir: controller/nico-sim/bin
    nvkr-site-identity-helper:
        artifactPath: bin/nvkr-site-identity-helper
        buildCommand:
            - bash
            - -euc
            - |
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=-mod=vendor
              test "$(go env GOVERSION)" = "go$(cat .go-version)"
              go build -trimpath -buildvcs=false -o bin/nvkr-site-identity-helper ./cmd/nvkr-site-identity-helper
        cgo: false
        fromSource: true
        outputType: host-package
        platforms:
            - linux/arm64
        source: nvkr-site-identity
        writeDir: bin
    nvke-installer-sources:
        artifactPath: bin/nvke-installer-sources.tar.gz
        buildCommand:
            - bash
            - -euc
            - |
              set -o pipefail
              printf '%s\n' "${NKECTL_COMMIT:?}" > bin/SOURCE_COMMIT
              unset CAPI_VERSION
              make --no-print-directory -s -f make/tool-versions.mk \
                --eval='nvkr-capi-version: ; @printf "%s\n" "$(CAPI_VERSION)"' \
                nvkr-capi-version > bin/CAPI_VERSION
              tar --sort=name --format=ustar --mtime="@${SOURCE_DATE_EPOCH:?}" \
                --owner=0 --group=0 --numeric-owner --mode=u=rwX,go=rX \
                -cf - make/tool-versions.mk deploy/nvke-deploy.sh deploy/lib deploy/nico \
                cli/internal/bootstrap/sitespec/template.yaml \
                controller/deploy/charts/controller nktp/deploy/charts/nktp \
                controller/hack/apply-capi-spiffe-exec-auth.sh \
                controller/deploy/k8s/capi-spiffe-exec-auth \
                controller/test/fixtures/releases \
                controller/nico-sim/internal/seed/default-seed.yaml controller/nico-sim/ui \
                -C bin SOURCE_COMMIT CAPI_VERSION | gzip -n > bin/nvke-installer-sources.tar.gz
        cgo: false
        fromSource: true
        outputType: tarball
        platforms:
            - darwin/arm64
            - linux/arm64
        source: nvke-deploy
        versionStamp:
            NKECTL_COMMIT: '{{.Commit}}'
        writeDir: bin
    nvkectl:
        artifactPath: cli/bin/nvkectl
        buildCommand:
            - bash
            - -euc
            - |
              export GOENV=off GOWORK=off GOTOOLCHAIN=local
              target_os="${GOOS:?}"
              target_arch="${GOARCH:?}"
              env -u GOOS -u GOARCH make -C cli build-cross DIST=bin NVKECTL_PLATFORMS="$target_os/$target_arch" \
                LEGACY_BINARY_NAME= NVKECTL_VERSION="git-${NKECTL_COMMIT}" NVKECTL_COMMIT="${NKECTL_COMMIT}" \
                NVKECTL_DATE="${NKECTL_DATE}" NVKECTL_TREE=clean
              cp "cli/bin/nvkectl-$target_os-$target_arch" cli/bin/nvkectl
        cgo: false
        fromSource: true
        outputType: host-package
        platforms:
            - darwin/arm64
            - linux/arm64
        source: nvke-cli
        versionStamp:
            NKECTL_COMMIT: '{{.Commit}}'
            NKECTL_DATE: '{{.Date}}'
        writeDir: cli/bin
    packer:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: packer
    packer-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: packer-linux
    packer-plugin-qemu:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: packer-plugin-qemu
    packer-plugin-qemu-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: packer-plugin-qemu-linux
    oras:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: oras
    oras-linux:
        outputType: host-package
        platforms:
            - linux/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: oras-linux
    vmnet-helper:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: vmnet-helper
    vmnet-client:
        outputType: host-package
        platforms:
            - darwin/arm64
        prebuilt:
            evidence:
                none: true
            releaseExecutable: true
        source: vmnet-client
kind: SourceBuildRegistry
metadata:
    name: nvke-native-tools
sources:
    nvkr-site-identity:
        constraint: '*'
        repo: https://github.com/dsx-ai-factory/nvkr.git
        toolchainImagesByArch:
            arm64: golang@sha256:288557fbc328e4ef9a78bae2eb44f24447029ff08667be883d79eeaa9029cf0c
        vendorCommand:
            - bash
            - -euc
            - |
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
              pins="$(sha256sum go.mod go.sum)"
              timeout --kill-after=10s 540s go mod download
              printf '%s\n' "$pins" | sha256sum --quiet -c -
              GOPROXY=off timeout --kill-after=10s 60s go mod verify
              GOPROXY=off timeout --kill-after=10s 180s go mod vendor
              printf '%s\n' "$pins" | sha256sum --quiet -c -
    packer:
        constraint: 1.15.4
        repo: https://github.com/hashicorp/packer
        tool:
            executablePath: packer
            format: zip
            platform: darwin/arm64
            url: https://releases.hashicorp.com/packer/{{.Version}}/packer_{{.Version}}_darwin_arm64.zip
    packer-linux:
        constraint: 1.15.4
        repo: https://github.com/hashicorp/packer
        tool:
            executablePath: packer
            format: zip
            platform: linux/arm64
            url: https://releases.hashicorp.com/packer/{{.Version}}/packer_{{.Version}}_linux_arm64.zip
    packer-plugin-qemu:
        constraint: 1.1.6
        repo: https://github.com/hashicorp/packer-plugin-qemu
        tool:
            executablePath: packer-plugin-qemu_v1.1.6_x5.0_darwin_arm64
            format: zip
            platform: darwin/arm64
            url: https://releases.hashicorp.com/packer-plugin-qemu/{{.Version}}/packer-plugin-qemu_{{.Version}}_darwin_arm64.zip
    packer-plugin-qemu-linux:
        constraint: 1.1.6
        repo: https://github.com/hashicorp/packer-plugin-qemu
        tool:
            executablePath: packer-plugin-qemu_v1.1.6_x5.0_linux_arm64
            format: zip
            platform: linux/arm64
            url: https://releases.hashicorp.com/packer-plugin-qemu/{{.Version}}/packer-plugin-qemu_{{.Version}}_linux_arm64.zip
    clusterctl:
        constraint: 1.13.6
        repo: https://github.com/kubernetes-sigs/cluster-api
        tool:
            executablePath: clusterctl
            format: raw
            platform: darwin/arm64
            url: https://github.com/kubernetes-sigs/cluster-api/releases/download/{{.Tag}}/clusterctl-darwin-arm64
    clusterctl-linux:
        constraint: 1.13.6
        repo: https://github.com/kubernetes-sigs/cluster-api
        tool:
            executablePath: clusterctl
            format: raw
            platform: linux/arm64
            url: https://github.com/kubernetes-sigs/cluster-api/releases/download/{{.Tag}}/clusterctl-linux-arm64
    helm:
        constraint: 4.2.4
        repo: https://github.com/helm/helm
        tool:
            executablePath: darwin-arm64/helm
            format: tar-gzip
            platform: darwin/arm64
            url: https://get.helm.sh/helm-{{.Tag}}-darwin-arm64.tar.gz
    helm-linux:
        constraint: 4.2.4
        repo: https://github.com/helm/helm
        tool:
            executablePath: linux-arm64/helm
            format: tar-gzip
            platform: linux/arm64
            url: https://get.helm.sh/helm-{{.Tag}}-linux-arm64.tar.gz
    kind:
        constraint: 0.32.0
        repo: https://github.com/kubernetes-sigs/kind
        tool:
            executablePath: kind
            format: raw
            platform: darwin/arm64
            url: https://github.com/kubernetes-sigs/kind/releases/download/{{.Tag}}/kind-darwin-arm64
    kind-linux:
        constraint: 0.32.0
        repo: https://github.com/kubernetes-sigs/kind
        tool:
            executablePath: kind
            format: raw
            platform: linux/arm64
            url: https://github.com/kubernetes-sigs/kind/releases/download/{{.Tag}}/kind-linux-arm64
    kubectl:
        constraint: 1.35.9
        repo: https://github.com/kubernetes/kubernetes
        tool:
            executablePath: kubectl
            format: raw
            platform: darwin/arm64
            url: https://dl.k8s.io/release/{{.Tag}}/bin/darwin/arm64/kubectl
    kubectl-linux:
        constraint: 1.35.9
        repo: https://github.com/kubernetes/kubernetes
        tool:
            executablePath: kubectl
            format: raw
            platform: linux/arm64
            url: https://dl.k8s.io/release/{{.Tag}}/bin/linux/arm64/kubectl
    nerdctl-site:
        constraint: 2.4.1
        repo: https://github.com/containerd/nerdctl
        toolchainImagesByArch:
            arm64: golang@sha256:5bc7f572bbaa98885a3a1fd9c0aa76b59e3e14e8628bfc316bbfd0c701e4818c
        vendorCommand:
            - bash
            - -euc
            - |
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
              pins="$(sha256sum go.mod go.sum)"
              timeout --kill-after=10s 540s go mod download
              printf '%s\n' "$pins" | sha256sum --quiet -c -
              GOPROXY=off timeout --kill-after=10s 60s go mod verify
              GOPROXY=off timeout --kill-after=10s 180s go mod vendor
              printf '%s\n' "$pins" | sha256sum --quiet -c -
    nvke-cli:
        constraint: v0.22.0
        repo: https://github.com/dsx-ai-factory/nvke.git
        toolchainImagesByArch:
            arm64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
        vendorCommand:
            - bash
            - -euc
            - |
              cd cli
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
              pins="$(sha256sum go.mod go.sum)"
              timeout --kill-after=10s 540s go mod download
              printf '%s\n' "$pins" | sha256sum --quiet -c -
              GOPROXY=off timeout --kill-after=10s 60s go mod verify
              GOPROXY=off timeout --kill-after=10s 180s go mod vendor
              printf '%s\n' "$pins" | sha256sum --quiet -c -
    nvke-deploy:
        constraint: v0.22.0
        repo: https://github.com/dsx-ai-factory/nvke.git
        toolchainImagesByArch:
            arm64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
    nvke-nicosim:
        constraint: v0.22.0
        repo: https://github.com/dsx-ai-factory/nvke.git
        toolchainImagesByArch:
            arm64: golang@sha256:957861185dbf29d93668ace41e011d091c6e779953d47f0316ef2cc58e28fe2b
        vendorCommand:
            - bash
            - -euc
            - |
              cd controller/nico-sim
              export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
              pins="$(sha256sum go.mod go.sum)"
              timeout --kill-after=10s 540s go mod download
              printf '%s\n' "$pins" | sha256sum --quiet -c -
              GOPROXY=off timeout --kill-after=10s 60s go mod verify
              GOPROXY=off timeout --kill-after=10s 180s go mod vendor
              printf '%s\n' "$pins" | sha256sum --quiet -c -
    oras:
        constraint: 1.3.3
        repo: https://github.com/oras-project/oras
        tool:
            executablePath: oras
            format: tar-gzip
            platform: darwin/arm64
            url: https://github.com/oras-project/oras/releases/download/{{.Tag}}/oras_{{.Version}}_darwin_arm64.tar.gz
    oras-linux:
        constraint: 1.3.3
        repo: https://github.com/oras-project/oras
        tool:
            executablePath: oras
            format: tar-gzip
            platform: linux/arm64
            url: https://github.com/oras-project/oras/releases/download/{{.Tag}}/oras_{{.Version}}_linux_arm64.tar.gz
    vmnet-helper:
        constraint: 0.10.0
        repo: https://github.com/nirs/vmnet-helper
        tool:
            executablePath: opt/vmnet-helper/bin/vmnet-helper
            format: tar-gzip
            platform: darwin/arm64
            url: https://github.com/nirs/vmnet-helper/releases/download/{{.Tag}}/vmnet-helper.tar.gz
    # The selected NICoSim uses vmnet-client's --unprivileged contract.
    # Upstream v0.11 renamed the command and removed that flag.
    vmnet-client:
        constraint: 0.10.0
        repo: https://github.com/nirs/vmnet-helper
        tool:
            executablePath: opt/vmnet-helper/bin/vmnet-client
            format: tar-gzip
            platform: darwin/arm64
            url: https://github.com/nirs/vmnet-helper/releases/download/{{.Tag}}/vmnet-helper.tar.gz
