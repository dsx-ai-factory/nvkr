apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvsentinel
  description: NVSentinel development catalog for native executables, OCI images, Debian packages and the independent unchanged upstream Helm chart. No release, publication or complete deployment acceptance.
sources:
  nvsentinel:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: docker.io/library/nvkr-nvsentinel-ubuntu-24.04-amd64@sha256:1899450dc69deea10ed06d07de70fd2bf6b4d3cb6952c679d359cdcd6b6376e7
      arm64: docker.io/library/nvkr-nvsentinel-ubuntu-24.04-arm64@sha256:3ebca79a900100ed1ef6ee9903b7d26a0ee45320a9dff49f91610142d8d11581
    vendorCommand:
      - sh
      - -ec
      - |
        test "$(go env GOVERSION)" = go1.27.0
        cd platform-connectors
        GOTOOLCHAIN=local GOWORK=off go mod vendor
        GOTOOLCHAIN=local GOWORK=off go mod verify
  nvsentinel-ubuntu2604:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: docker.io/library/nvkr-nvsentinel-ubuntu-26.04-amd64@sha256:fb19d5e7aa08d6d870eabff80fb012d6edf1c73cebad636f3d977bbbc7ad5eb8
      arm64: docker.io/library/nvkr-nvsentinel-ubuntu-26.04-arm64@sha256:257df633515584e9d56f9679042afb9f2ef2cd0c6c2d9d6f2691a6bbb31effcf
    vendorCommand:
      - sh
      - -ec
      - |
        test "$(go env GOVERSION)" = go1.27.0
        cd platform-connectors
        GOTOOLCHAIN=local GOWORK=off go mod vendor
        GOTOOLCHAIN=local GOWORK=off go mod verify
  nvsentinel-binaries:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:eef6a67266eeed3c86dd47fd01b32faa8bf0229eb83eb3d4d466e80391bd3820
      arm64: docker.io/library/golang@sha256:6c83d163c89d1dbe66f8fc466870d66fe6325d15bb5ad1730cdc0b482fab1eec
    vendorCommand:
    - sh
    - -ec
    - |
      test "$(go env GOVERSION)" = go1.27.0
      export GOENV=off GOTOOLCHAIN=local GOWORK=off
      for module in \
        event-exporter \
        fault-quarantine \
        fault-remediation \
        health-events-analyzer \
        health-monitors/csp-health-monitor \
        health-monitors/kubernetes-object-monitor \
        health-monitors/nic-health-monitor \
        health-monitors/nvcre-certification-monitor \
        health-monitors/slurm-drain-monitor \
        janitor \
        janitor-provider \
        labeler \
        lifecycle-manager \
        node-drainer \
        platform-connectors \
        plugins/slinky-drainer \
        preflight \
        preflight-checks/nccl-loopback; do
        (cd "$module" && go mod vendor && go mod verify)
      done
  nvsentinel-content:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:eef6a67266eeed3c86dd47fd01b32faa8bf0229eb83eb3d4d466e80391bd3820
      arm64: docker.io/library/golang@sha256:6c83d163c89d1dbe66f8fc466870d66fe6325d15bb5ad1730cdc0b482fab1eec
  syft-amd64:
    constraint: 1.51.1
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platform: linux/amd64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_linux_amd64.tar.gz
  syft-arm64:
    constraint: 1.51.1
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platform: linux/arm64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_linux_arm64.tar.gz
components:
  nvsentinel-platform-connectors-deb-ubuntu2404:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms: [linux/amd64, linux/arm64]
    outputType: host-package
    buildCommand:
      - sh
      - -ec
      - &debian-package-build |
        set -eu
        umask 022
        arch="$1"
        distribution="$2"
        case "$distribution" in
          ubuntu-24.04) ubuntu_version=24.04 ;;
          ubuntu-26.04) ubuntu_version=26.04 ;;
          *) printf 'Unsupported Ubuntu target: %s\n' "$distribution" >&2; exit 1 ;;
        esac
        . /etc/os-release
        test "$ID" = ubuntu
        test "$VERSION_ID" = "$ubuntu_version"
        : "${SOURCE_DATE_EPOCH:?compiled source date is required}"
        test "$(go env GOVERSION)" = go1.27.0
        test "$(go env GOARCH)" = "$arch"
        test "$(dpkg --print-architecture)" = "$arch"
        test -f /src/platform-connectors/vendor/modules.txt
        out=/src/nvkr-output
        root="$out/package"
        mkdir -p "$root/DEBIAN" "$root/usr/lib/nvsentinel/bin" \
          "$root/usr/share/doc/nvsentinel-platform-connectors" "$out/go-cache"
        cat >"$root/DEBIAN/control" <<EOF
        Package: nvsentinel-platform-connectors
        Version: 0~git20261013.c159347735
        Architecture: $arch
        Maintainer: Ilya Kislenko <ikislenko@nvidia.com>
        Section: admin
        Priority: optional
        Depends: ca-certificates
        Homepage: https://github.com/NVIDIA/NVSentinel
        Description: NVSentinel platform connector
         Source-built platform connector; runtime configuration is supplied separately.
        EOF
        cd /src/platform-connectors
        CGO_ENABLED=0 GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off \
          GOCACHE="$out/go-cache" go build -mod=vendor -trimpath -buildvcs=false \
          -o "$root/usr/lib/nvsentinel/bin/platform-connectors" .
        install -m 0644 /src/LICENSE "$root/usr/share/doc/nvsentinel-platform-connectors/copyright"
        find "$root" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
        exec dpkg-deb --root-owner-group --uniform-compression -Zgzip -z9 \
          --build "$root" "$out/nvsentinel-platform-connectors_$arch.deb"
      - --
      - "{{.Arch}}"
      - ubuntu-24.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_{{.Arch}}.deb
  nvsentinel-platform-connectors-deb-ubuntu2604:
    source: nvsentinel-ubuntu2604
    fromSource: true
    builderType: oci-hermetic
    platforms: [linux/amd64, linux/arm64]
    outputType: host-package
    buildCommand:
      - sh
      - -ec
      - *debian-package-build
      - --
      - "{{.Arch}}"
      - ubuntu-26.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_{{.Arch}}.deb
  nvsentinel-csp-health-monitor-image:
    <<: &nvsentinel-image-defaults
      source: nvsentinel-content
      fromSource: true
      builderType: buildkit-rootless
      platforms:
      - linux/amd64
      - linux/arm64
      outputType: oci-image
      toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
      writeDir: nvkr-output
    buildCommand:
      - sh
      - -ec
      - &nvsentinel-go-image |
        set -eu
        program="$1"
        module="$2"
        main="$3"
        title="$4"
        arch="$5"
        BUILD_DATE="$(date -u -d "@${SOURCE_DATE_EPOCH:?}" +%Y-%m-%dT%H:%M:%SZ)"
        case "$arch" in
          amd64)
            sdk=docker.io/library/golang@sha256:eef6a67266eeed3c86dd47fd01b32faa8bf0229eb83eb3d4d466e80391bd3820
            runtime=cgr.dev/chainguard/static@sha256:a40219f3b0c2719e4e4220310e80a2230a4b95881644292c130e3a8e8287fc6c
            ;;
          arm64)
            sdk=docker.io/library/golang@sha256:6c83d163c89d1dbe66f8fc466870d66fe6325d15bb5ad1730cdc0b482fab1eec
            runtime=cgr.dev/chainguard/static@sha256:daed076c904e5dc26f5ff87d77aa4cea8b7ca76e906b561915dafe5b086377dc
            ;;
          *) exit 2 ;;
        esac
        out=/src/nvkr-output
        context="$out/image-context"
        mkdir "$context"
        mkdir -p "$context/$(dirname "$module")"
        cp -R "/src/$module" "$context/$module"
        for support in commons data-models store-client api fault-quarantine; do
          if [ "$module" != "$support" ]; then cp -R "/src/$support" "$context/$support"; fi
        done
        ldflags="-s -w"
        if [ "$program" != plugins-slinky-drainer ]; then
          ldflags="$ldflags -X main.version=$BUILD_VERSION -X main.commit=$GIT_VERSION -X main.date=$BUILD_DATE"
        fi
        cat >"$context/Dockerfile" <<'EOF'
        ARG SDK_IMAGE
        ARG RUNTIME_IMAGE
        FROM ${SDK_IMAGE} AS build
        ARG TARGETARCH
        ARG MODULE
        ARG GO_MAIN
        ARG LD_FLAGS
        ARG SOURCE_DATE_EPOCH
        WORKDIR /work/${MODULE}
        COPY . /work/
        RUN test "$(go env GOVERSION)" = go1.27.0 && \
            test "$(go env GOARCH)" = "$TARGETARCH" && \
            pins="$(sha256sum go.mod go.sum)" && \
            GOTOOLCHAIN=local GOWORK=off timeout --kill-after=10s 600s go mod download && \
            GOTOOLCHAIN=local GOWORK=off go mod verify && \
            GOTOOLCHAIN=local GOWORK=off go mod vendor && \
            printf '%s\n' "$pins" | sha256sum --quiet -c -
        RUN --network=none CGO_ENABLED=0 GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off \
            go build -mod=vendor -trimpath -buildvcs=false \
            -ldflags "$LD_FLAGS" -o /out/program "$GO_MAIN"
        FROM ${RUNTIME_IMAGE}
        ARG BUILD_VERSION
        ARG GIT_VERSION
        ARG BUILD_DATE
        ARG IMAGE_TITLE
        COPY --from=build /out/program /ko-app/program
        USER 65532:65532
        ENTRYPOINT ["/ko-app/program"]
        LABEL org.opencontainers.image.source="https://github.com/NVIDIA/NVSentinel" \
              org.opencontainers.image.licenses="Apache-2.0" \
              org.opencontainers.image.title="$IMAGE_TITLE" \
              org.opencontainers.image.version="$BUILD_VERSION" \
              org.opencontainers.image.revision="$GIT_VERSION" \
              org.opencontainers.image.created="$BUILD_DATE"
        EOF
        exec buildctl-daemonless.sh build --frontend dockerfile.v0 \
          --local "context=$context" --local "dockerfile=$context" \
          --opt "platform=linux/$arch" \
          --opt "build-arg:TARGETARCH=$arch" \
          --opt "build-arg:MODULE=$module" --opt "build-arg:GO_MAIN=$main" \
          --opt "build-arg:LD_FLAGS=$ldflags" --opt "build-arg:IMAGE_TITLE=$title" \
          --opt "build-arg:SDK_IMAGE=$sdk" --opt "build-arg:RUNTIME_IMAGE=$runtime" \
          --opt "build-arg:BUILD_VERSION=$BUILD_VERSION" --opt "build-arg:GIT_VERSION=$GIT_VERSION" \
          --opt "build-arg:BUILD_DATE=$BUILD_DATE" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
          --output "type=oci,dest=$out/$program.oci.tar,oci-mediatypes=true,rewrite-timestamp=true"
      - "--"
      - "csp-health-monitor"
      - "health-monitors/csp-health-monitor"
      - "./cmd/csp-health-monitor"
      - "NVSentinel CSP Health Monitor"
      - "{{.Arch}}"
    artifactPath: nvkr-output/csp-health-monitor.oci.tar
    versionStamp: &nvsentinel-version-stamps
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
