kind: SourceBuildRegistry
metadata:
  description: Shared nvsentinel domain catalog; explicit producer variants preserve
    existing build and acquisition contracts.
  name: nvsentinel
sources:
  nvsentinel:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: localhost/nvkr-nvsentinel-ubuntu-24.04-amd64@sha256:1899450dc69deea10ed06d07de70fd2bf6b4d3cb6952c679d359cdcd6b6376e7
      arm64: localhost/nvkr-nvsentinel-ubuntu-24.04-arm64@sha256:3ebca79a900100ed1ef6ee9903b7d26a0ee45320a9dff49f91610142d8d11581
    vendorCommand:
    - sh
    - -ec
    - |
      test "$(go env GOVERSION)" = go1.27.0
      cd platform-connectors
      GOTOOLCHAIN=local GOWORK=off go mod vendor
      GOTOOLCHAIN=local GOWORK=off go mod verify
  nvsentinel-binaries:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:eef6a67266eeed3c86dd47fd01b32faa8bf0229eb83eb3d4d466e80391bd3820
      arm64: docker.io/library/golang@sha256:6c83d163c89d1dbe66f8fc466870d66fe6325d15bb5ad1730cdc0b482fab1eec
    vendorCommand:
    - sh
    - -ec
    - |
      test "$(go env GOVERSION)" = go1.27.0
      export GOENV=off GOTOOLCHAIN=local GOWORK=off
      for module in \
        event-exporter \
        fault-quarantine \
        fault-remediation \
        health-events-analyzer \
        health-monitors/csp-health-monitor \
        health-monitors/kubernetes-object-monitor \
        health-monitors/nic-health-monitor \
        health-monitors/nvcre-certification-monitor \
        health-monitors/slurm-drain-monitor \
        janitor \
        janitor-provider \
        labeler \
        lifecycle-manager \
        node-drainer \
        platform-connectors \
        plugins/slinky-drainer \
        preflight \
        preflight-checks/nccl-loopback; do
        (cd "$module" && go mod vendor && go mod verify)
      done
  nvsentinel-content:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:eef6a67266eeed3c86dd47fd01b32faa8bf0229eb83eb3d4d466e80391bd3820
      arm64: docker.io/library/golang@sha256:6c83d163c89d1dbe66f8fc466870d66fe6325d15bb5ad1730cdc0b482fab1eec
  nvsentinel-ubuntu2604:
    repo: https://github.com/NVIDIA/NVSentinel
    toolchainImagesByArch:
      amd64: localhost/nvkr-nvsentinel-ubuntu-26.04-amd64@sha256:fb19d5e7aa08d6d870eabff80fb012d6edf1c73cebad636f3d977bbbc7ad5eb8
      arm64: localhost/nvkr-nvsentinel-ubuntu-26.04-arm64@sha256:f6a0ffa4e29bf10f6d946742aabc868b00faaa5ff2c3c4b4fbdfdefdec71075b
    vendorCommand:
    - sh
    - -ec
    - |
      test "$(go env GOVERSION)" = go1.27.0
      cd platform-connectors
      GOTOOLCHAIN=local GOWORK=off go mod vendor
      GOTOOLCHAIN=local GOWORK=off go mod verify
  syft:
    constraint: 1.51.1
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platforms:
      - linux/amd64
      - linux/arm64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_{{.OS}}_{{.Arch}}.tar.gz
