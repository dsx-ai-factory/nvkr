apiVersion: nvkr.dev/catalog-overlay/v3
kind: CatalogOverlay
name: nvke-os-arm64-native-kvm
requiresCatalogDigest: sha256:26176b616a6815043b5ce6a0cc631ffc7efd1cbc4bc1724acd5309a7bc7a5926
components:
  nvke-node-image:
    component:
      platforms: [linux/arm64]
      fromSource: true
      builderType: vm-image
      buildNetwork: default
      repo: https://github.com/dsx-ai-factory/nvke.git
      tag: v0.22.0
      commit: 400c24fb6465b042be883d6b62472528520d6291
      treeHash: f3afc02f5c92f4aacda3a1655836a91bef093bfe
      toolchainImages:
        arm64: ghcr.io/dsx-ai-factory/nvkr/m2-candidate/toolchains/packer@sha256:1685a47997af96b802d050b31c212868e65626c614f5a69488141a9e979f2ad2
      vendorCommand:
        - bash
        - -ec
        - |
          # Retain the source-required compiler; the Packer image owns VM tools.
          case "$(uname -m)" in
            x86_64) go_arch=amd64; go_sha=65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40 ;;
            aarch64) go_arch=arm64; go_sha=a06e99309dbcbdca1a8ccd2282c3ee146e55930886e26b4f1193269587165f49 ;;
            *) echo 'Unsupported Go execution architecture' >&2; exit 1 ;;
          esac
          mkdir -p .nvkr-tools
          curl --fail --location --max-time 120 --output .nvkr-tools/go.tar.gz \
            "https://go.dev/dl/go1.27.3.linux-${go_arch}.tar.gz"
          printf '%s  .nvkr-tools/go.tar.gz\n' "$go_sha" | sha256sum --quiet -c -
          tar -xzf .nvkr-tools/go.tar.gz -C .nvkr-tools
          export PATH="${PWD}/.nvkr-tools/go/bin:$PATH"
          test "$(GOTOOLCHAIN=local go version)" = "go version go1.27.3 linux/${go_arch}"
          cd agent
          export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
          pins="$(sha256sum go.mod go.sum)"
          # Distinct equivalent URLs avoid Go's per-proxy cached metadata errors.
          # Go owns transport fallback; checksum failures never select another proxy.
          # Keep direct fallback limited to a missing proxy module (404/410).
          proxy=https://proxy.golang.org
          GOPROXY="${proxy}|${proxy}/|${proxy}//,direct" \
            timeout --kill-after=10s 540s go mod download || {
              status=$?; echo 'agent module download failed or exceeded 540s' >&2; exit "$status";
            }
          printf '%s\n' "$pins" | sha256sum --quiet -c - || {
            echo 'agent module pins changed during download' >&2; exit 1;
          }
          # Offline verification and vendoring run once, after acquisition succeeds.
          GOPROXY=off timeout --kill-after=10s 60s go mod verify || {
            status=$?; echo 'agent module cache verification failed or exceeded 60s' >&2; exit "$status";
          }
          GOPROXY=off timeout --kill-after=10s 180s go mod vendor || {
            status=$?; echo 'agent offline vendoring failed or exceeded 180s' >&2; exit "$status";
          }
          printf '%s\n' "$pins" | sha256sum --quiet -c - || {
            echo 'agent module pins changed during vendoring' >&2; exit 1;
          }
      sourceDateEpoch: 1792548398
      outputType: disk-image
      disk:
        format: qcow2
        encryption: none
      buildRequirements:
        resources:
          cpuMillis: 8000
          memoryMiB: 10240
          ephemeralStorageMiB: 65536
        allowedHostPlatforms: [linux/arm64]
        capabilities:
          - name: kvm
            policy: required
        timeoutSeconds: 21600
      packer:
        projectPath: os-image/packer
        packerVersion: 1.15.4
        buildName: nvke-node-non-fde.qemu.nvke-non-fde
        architectureVariable: architecture
        acceleratorVariable: accelerator
        materialManifestVariable: material_manifest
        materialManifest:
          schemaVersion: nvke.nvidia.com/os-image-materials/v1
          kinds:
            image-inputs: archive
            installer-iso: disk-image
        outputDirectoryVariable: output_directory
        sshPrivateKeyVariable: ssh_private_key_file
        sshPublicKeyVariable: ssh_public_key_file
        buildLogDirectoryVariable: build_log_directory
        variables:
          efi_firmware_code: /usr/share/AAVMF/AAVMF_CODE.no-secboot.fd
          efi_firmware_vars: /usr/share/AAVMF/AAVMF_VARS.fd
          ssh_timeout: 180m
      materials:
        image-inputs: nvke-image-inputs
        installer-iso: nvke-patched-installer-iso
      artifactPath: non-fde/nvke-node.qcow2
