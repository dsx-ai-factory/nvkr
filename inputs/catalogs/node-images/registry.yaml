    writeDir: nvkr-output
  ovn-kubernetes-chart:
    artifactPath: nvkr-output/ovn-kubernetes-chart.tar
    buildCommand:
    - bash
    - -ec
    - |
      readonly chart=/src/charts/ovn-kubernetes
      readonly out=/src/nvkr-output/ovn-kubernetes
      test -f "$chart/Chart.yaml"
      grep -qx 'version: 2.4.2' "$chart/Chart.yaml"
      mkdir -p "$out"
      cp -a "$chart/." "$out/"
      # The pinned chart aliases upstream's values filename onto values.yaml.
      test "$(readlink "$out/values-single-node-zone.yaml")" = values.yaml
      rm "$out/values-single-node-zone.yaml"
      test ! -e "$out/values-single-node-zone.yaml"
      tar --format=ustar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
        --numeric-owner -C /src/nvkr-output -cf /src/nvkr-output/ovn-kubernetes-chart.tar ovn-kubernetes
    builderType: oci-hermetic
    fromSource: true
    helm:
      chart: .
      images:
        control-plane:
          values:
            digest: ovnkube-control-plane.ovnkubeControlPlane.image.sha256
            digestFormat: sha256-hex
        nbdb:
          values:
            digest: ovnkube-single-node-zone.ovnkubeSingleNodeZoneNbdb.image.sha256
            digestFormat: sha256-hex
        node:
          values:
            digest: ovnkube-single-node-zone.ovnkubeSingleNodeZone.image.sha256
            digestFormat: sha256-hex
        northd:
          values:
            digest: ovnkube-single-node-zone.ovnkubeSingleNodeZoneNorthd.image.sha256
            digestFormat: sha256-hex
        ovn-host:
          values:
            digest: ovnkube-single-node-zone.ovnkubeSingleNodeZoneOvnHost.image.sha256
            digestFormat: sha256-hex
        sbdb:
          values:
            digest: ovnkube-single-node-zone.ovnkubeSingleNodeZoneSbdb.image.sha256
            digestFormat: sha256-hex
    outputType: tarball
    platforms:
    - linux/amd64
    - linux/arm64
    source: ovn-kubernetes
    writeDir: nvkr-output
  ovn-kubernetes-chart-diagnostic:
    artifactPath: nvkr-output/ovn-kubernetes-chart.tar
    buildCommand:
    - bash
    - -ec
    - |
      readonly chart=/src/helm/ovn-kubernetes
      readonly out=/src/nvkr-output/ovn-kubernetes
      test -f "${chart}/Chart.yaml"
      grep -qx 'version: 1.4.0' "${chart}/Chart.yaml"
      mkdir -p "${out}"
      cp -a "${chart}/." "${out}/"
      cat >"${out}/values-nke.yaml" <<'EOF'
      tags:
        ovs-node: false
      global:
        image:
          repository: ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu
          tag: release-1.4
      EOF
      find "${out}" -type d -exec chmod 0755 {} +
      find "${out}" -type f -exec chmod 0644 {} +
      find "${out}" -exec touch -d '2026-01-01 00:00:00Z' {} +
      tar --sort=name --mtime='2026-01-01 00:00:00Z' \
        --owner=0 --group=0 --numeric-owner -C /src/nvkr-output \
        -cf /src/nvkr-output/ovn-kubernetes-chart.tar ovn-kubernetes
    fromSource: true
    outputType: tarball
    platforms:
    - linux/amd64
    - linux/arm64
    source: ovn-kubernetes-diagnostic
    writeDir: nvkr-output
