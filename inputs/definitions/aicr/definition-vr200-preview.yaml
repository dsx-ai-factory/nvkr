apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: aicr-vr200-rke2-training-preview
  description: AICR rke2/vr200/ubuntu/training bundles in all six upstream deployer formats; build evidence only.
# Reuse maintained action and cosign pins; bundle producers use the catalog below.
catalog:
  base: ../../catalogs/nvke/module-tags
cosignTool: cosign
outputs:
  - name: aicr-vr200-rke2-training-preview-argocd
    platform: linux/arm64
    catalog:
      base: ../../catalogs/aicr
    format: bundle-oci
    components: [aicr-vr200-rke2-training-preview-argocd]
  - name: aicr-vr200-rke2-training-preview-argocd-helm
    platform: linux/arm64
    catalog:
      base: ../../catalogs/aicr
    format: bundle-oci
    components: [aicr-vr200-rke2-training-preview-argocd-helm]
  - name: aicr-vr200-rke2-training-preview-flux
    platform: linux/arm64
    catalog:
      base: ../../catalogs/aicr
    format: bundle-oci
    components: [aicr-vr200-rke2-training-preview-flux]
  - name: aicr-vr200-rke2-training-preview-helm
    platform: linux/arm64
    catalog:
      base: ../../catalogs/aicr
    format: bundle-oci
    components: [aicr-vr200-rke2-training-preview-helm]
  - name: aicr-vr200-rke2-training-preview-helmfile
    platform: linux/arm64
    catalog:
      base: ../../catalogs/aicr
    format: bundle-oci
    components: [aicr-vr200-rke2-training-preview-helmfile]
  - name: aicr-vr200-rke2-training-preview-terraform
    platform: linux/arm64
    catalog:
      base: ../../catalogs/aicr
    format: bundle-oci
    components: [aicr-vr200-rke2-training-preview-terraform]
