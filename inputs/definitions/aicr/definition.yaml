apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../../catalogs/nvke
cosignTool: cosign-module-tags
kind: Definition
metadata:
  description: AICR generic/gb300/ubuntu/training bundles in all six upstream deployer
    formats; build evidence only.
  name: aicr-gb300-generic-training
outputs:
- catalog:
    base: ../../catalogs/aicr
  components:
  - aicr-gb300-generic-training-argocd
  format: bundle-oci
  name: aicr-gb300-generic-training-argocd
  platform: linux/arm64
- catalog:
    base: ../../catalogs/aicr
  components:
  - aicr-gb300-generic-training-argocd-helm
  format: bundle-oci
  name: aicr-gb300-generic-training-argocd-helm
  platform: linux/arm64
- catalog:
    base: ../../catalogs/aicr
  components:
  - aicr-gb300-generic-training-flux
  format: bundle-oci
  name: aicr-gb300-generic-training-flux
  platform: linux/arm64
- catalog:
    base: ../../catalogs/aicr
  components:
  - aicr-gb300-generic-training-helm
  format: bundle-oci
  name: aicr-gb300-generic-training-helm
  platform: linux/arm64
- catalog:
    base: ../../catalogs/aicr
  components:
  - aicr-gb300-generic-training-helmfile
  format: bundle-oci
  name: aicr-gb300-generic-training-helmfile
  platform: linux/arm64
- catalog:
    base: ../../catalogs/aicr
  components:
  - aicr-gb300-generic-training-terraform
  format: bundle-oci
  name: aicr-gb300-generic-training-terraform
  platform: linux/arm64
