apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-fde
  description: Build one native AMD64 FDE image with its required materials and the public bootstrap placeholder for feature-branch iteration.
catalog:
  base: ../../catalogs/nvke/module-tags
outputs:
  - name: nvke-node-fde-amd64
    platform: linux/amd64
    catalog:
      base: ../../catalogs/node-images/release
      overlays: [../../catalogs/node-images/variants/native-toolchains.yaml]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
