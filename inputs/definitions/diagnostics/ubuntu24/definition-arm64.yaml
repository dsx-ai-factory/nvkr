apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-os-ubuntu24-arm64
  description: Ubuntu 24.04.5 plain disk on native Linux ARM64 with KVM.
catalog:
  base: ../../../catalogs/node-images/release
  overlays: [../../../catalogs/node-images/variants/native-toolchains.yaml, ../../../catalogs/node-images/variants/ubuntu24.json]
outputs:
  - name: nvke-node-image-ubuntu24-arm64
    platform: linux/arm64
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-image
      - nvke-patched-installer-iso
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso
