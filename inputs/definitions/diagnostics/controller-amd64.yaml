apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../../catalogs/nvke
kind: Definition
metadata:
  description: NVKE controller containers and helm chart.
  name: nvke-controller-amd64
outputs:
- components:
  - cluster-api-provider-provisioned
  format: oci
  name: cluster-api-provider-provisioned-amd64
  platform: linux/amd64
- components:
  - nvke-controller
  format: oci
  name: nvke-controller-amd64
  platform: linux/amd64
- components:
  - nvke-controller-chart
  format: helm-oci
  helm:
    images:
      controller: nvke-controller-amd64
  name: nvke-controller-chart-amd64
  platform: linux/amd64
