  - nvke-agent
  - nvke-cni-calico
  - nvke-cni-ovn
  - nvke-doca-ovs
  - nvke-image-inputs
  - nvke-kubeadm-distro
  - nvke-node-image-amd64
  - nvke-patched-installer-iso-amd64
  - nvke-spire-agent
  - ovn-kube-ubuntu
  - ovn-kubernetes-chart
  - ubuntu-installer-iso-amd64
