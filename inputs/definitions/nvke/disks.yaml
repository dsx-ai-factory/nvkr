  name: nvke-node-fde-amd64
  platform: linux/amd64
- catalog:
    base: ../../catalogs/node-images
    overlays:
    - ../../catalogs/node-images/variants/native-toolchains.yaml
  components:
  - nvke-agent
  - nvke-cni-calico
  - nvke-cni-ovn
  - nvke-doca-ovs
  - nvke-image-inputs
  - nvke-kubeadm-distro
  - nvke-node-fde-arm64
  - nvke-patched-installer-iso
  - nvke-spire-agent
  - ovn-kube-ubuntu
  - ovn-kubernetes-chart
  - ubuntu-installer-iso
