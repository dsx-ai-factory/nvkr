apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-m2
  description: Build the maintained CLI, controller, configurable deployment charts and native non-FDE and public-bootstrap FDE node images for AMD64 and ARM64, and acquire operator tooling plus AMD64 and ARM64 non-test runtime images selected for NVKE v0.22.0-beta.1 in one Run.
catalog:
  base: ../../catalogs/nvke/module-tags
sbomTool: syft
cosignTool: cosign
outputs:
  - name: capi-controller-image
    platform: linux/amd64
    catalog:
      base: ../../catalogs/nvke/release-components
    format: oci
    components: [capi-controller-image]
  - name: capi-controller-image-arm64
    platform: linux/arm64
    catalog:
      base: ../../catalogs/nvke/release-components
    format: oci
    components: [capi-controller-image]
  - name: capi-kubeadm-bootstrap-image
