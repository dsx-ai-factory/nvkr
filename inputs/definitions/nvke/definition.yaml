  - name: controller-chart
    platform: linux/amd64
    catalog:
      base: ../../catalogs/nvke/release
    format: helm-oci
    components:
      - nvke-controller-chart
    helm:
      images:
        controller: cwe
  - name: csi-node-driver-registrar-image
    platform: linux/amd64
