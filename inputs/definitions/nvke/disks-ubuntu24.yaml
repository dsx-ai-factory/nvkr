apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-disks-ubuntu24
  description: Build the maintained native AMD64 and ARM64 Ubuntu 24.04 plain and public-bootstrap FDE node disks, preserving each complete material closure.
catalog:
  base: ../../catalogs/nvke/module-tags
sbomTool: syft
cosignTool: cosign
outputs:
  - name: nvke-node-fde-ubuntu24-amd64
    platform: linux/amd64
    catalog:
      base: ../../catalogs/node-images/release
      overlays: [../../catalogs/node-images/variants/native-toolchains.yaml, ../../catalogs/node-images/variants/ubuntu24.json]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-doca-ovs
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
  - name: nvke-node-fde-ubuntu24-arm64
    platform: linux/arm64
    catalog:
      base: ../../catalogs/node-images/release
      overlays: [../../catalogs/node-images/variants/native-toolchains.yaml, ../../catalogs/node-images/variants/ubuntu24.json]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-doca-ovs
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-arm64
      - nvke-patched-installer-iso
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso
  - name: nvke-node-image-ubuntu24-amd64
    platform: linux/amd64
    catalog:
      base: ../../catalogs/node-images/release
      overlays: [../../catalogs/node-images/variants/native-toolchains.yaml, ../../catalogs/node-images/variants/ubuntu24.json]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-doca-ovs
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-image-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
  - name: nvke-node-image-ubuntu24-arm64
    platform: linux/arm64
    catalog:
      base: ../../catalogs/node-images/release
      overlays: [../../catalogs/node-images/variants/native-toolchains.yaml, ../../catalogs/node-images/variants/ubuntu24.json]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-doca-ovs
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-image
      - nvke-patched-installer-iso
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso
