apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvsentinel-os-ubuntu2604-amd64
  description: Existing non-FDE NVKE OS recipe with the source-built NVSentinel package
    staged in its local APT folder; unsigned local candidate.
catalog:
  base: ./catalog
  overlays:
  - ./variants/nvsentinel-os-ubuntu2604-amd64.json
outputs:
- name: nvsentinel-os-ubuntu2604-amd64
  platform: linux/amd64
  format: disk-image
  components:
  - nvke-agent
  - nvke-cni-calico
  - nvke-cni-ovn
  - nvke-image-inputs
  - nvke-kubeadm-distro
  - nvke-node-image-amd64
  - nvke-patched-installer-iso-amd64
  - nvke-spire-agent
  - nvsentinel-platform-connectors-deb-ubuntu2604
  - ovn-kube-ubuntu
  - ovn-kubernetes-chart
  - ubuntu-installer-iso-amd64
