  nvsentinel-platform-connectors-deb-ubuntu2404:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms: [linux/amd64, linux/arm64]
    outputType: host-package
    buildCommand:
      - sh
      - -ec
      - &debian-package-build |
        set -eu
        umask 022
        arch="$1"
        distribution="$2"
        case "$distribution" in
          ubuntu-24.04) ubuntu_version=24.04 ;;
          ubuntu-26.04) ubuntu_version=26.04 ;;
          *) printf 'Unsupported Ubuntu target: %s\n' "$distribution" >&2; exit 1 ;;
        esac
        . /etc/os-release
        test "$ID" = ubuntu
        test "$VERSION_ID" = "$ubuntu_version"
        : "${SOURCE_DATE_EPOCH:?compiled source date is required}"
        : "${GIT_VERSION:?compiled source commit is required}"
        pkg_date="$(date -u -d "@$SOURCE_DATE_EPOCH" +%Y%m%d)"
        pkg_version="0~git$pkg_date.$(printf '%.10s' "$GIT_VERSION")"
        test "$(go env GOVERSION)" = go1.27.0
        test "$(go env GOARCH)" = "$arch"
        test "$(dpkg --print-architecture)" = "$arch"
        test -f /src/platform-connectors/vendor/modules.txt
        out=/src/nvkr-output
        root="$out/package"
        mkdir -p "$root/DEBIAN" "$root/usr/lib/nvsentinel/bin" \
          "$root/usr/share/doc/nvsentinel-platform-connectors" "$out/go-cache"
        cat >"$root/DEBIAN/control" <<EOF
        Package: nvsentinel-platform-connectors
        Version: $pkg_version
        Architecture: $arch
        Maintainer: Ilya Kislenko <ikislenko@nvidia.com>
        Section: admin
        Priority: optional
        Depends: ca-certificates
        Homepage: https://github.com/NVIDIA/NVSentinel
        Description: NVSentinel platform connector
         Source-built platform connector; runtime configuration is supplied separately.
        EOF
        cd /src/platform-connectors
        CGO_ENABLED=0 GOTOOLCHAIN=local GOWORK=off GOPROXY=off GOSUMDB=off \
          GOCACHE="$out/go-cache" go build -mod=vendor -trimpath -buildvcs=false \
          -o "$root/usr/lib/nvsentinel/bin/platform-connectors" .
        install -m 0644 /src/LICENSE "$root/usr/share/doc/nvsentinel-platform-connectors/copyright"
        find "$root" -exec touch -h -d "@$SOURCE_DATE_EPOCH" {} +
        exec dpkg-deb --root-owner-group --uniform-compression -Zgzip -z9 \
          --build "$root" "$out/nvsentinel-platform-connectors_$arch.deb"
      - --
      - "{{.Arch}}"
      - ubuntu-24.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_{{.Arch}}.deb
    versionStamp:
      GIT_VERSION: '{{.Commit}}'
