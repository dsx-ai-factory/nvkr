apiVersion: nvkr.dev/validator/v1
kind: Validator
id: nvke/nvkectl/cli
description: Run upstream CLI source tests and supplied-executable process contracts
adapter: nvke-cli/v1
suite: cli
inputs:
  executable:
    component: nvkectl
    format: executable
suiteSource:
  mode: build-source
  fromInput: executable
platforms: [linux/amd64, linux/arm64]
requires: [docker, git]
timeout: 30m
coverage: mixed
limitations:
  - Package-level result checks do not establish exhaustive artifact-contract coverage
  - Supplied bytes are not authenticated as Run members and grant no qualification
  - The selected upstream revision must expose the supplied-executable interface; maintained adoption is pending
  - Docker capacity and upstream Go and Make availability are unverified until execution
