# The planners a validation plan is built from. Each entry pairs a built-in
# planner with the executor that runs its targets and the planner's own
# configuration, which resolves beside this file.
apiVersion: nvkr.dev/validation-planners/v1
kind: ValidationPlanners
planners:
  - name: nvke-qualify
    executor: nvke-e2e-gotest
    config: nvke-qualify/planner.json
