apiVersion: nvkr.dev/environment/v1
kind: Environment
metadata:
  name: nvke-os-ubuntu24-github-amd64
  description: Native Ubuntu 24 disk build validation; raw QCOW2 and static-unqualified Run without publication or signing.
githubARC: native-kvm-v1
toolchainAccess:
  privateRoots:
    - ghcr.io/dsx-ai-factory/nvkr/m2-candidate/toolchains
  publicRoots:
    - docker.io/alpine/helm
    - docker.io/library/busybox
    - docker.io/library/golang
    - docker.io/moby/buildkit
  reader:
    credentialRef: github:NVKR_REGISTRY_READ
    usernameRef: github:NVKR_REGISTRY_READ_USER
githubBundle: nvke-os-ubuntu24
githubRunners:
  linux/amd64: ubuntu-24.04
  linux/arm64: ubuntu-24.04-arm
executionClasses:
  - name: arc-amd64-kvm
    runsOn: arc-amd64-kvm
    hostPlatform: linux/amd64
    resources:
      cpuMillis: 8000
      memoryMiB: 10240
      ephemeralStorageMiB: 65536
    maxTimeoutSeconds: 21600
    capabilities: [kvm]
  - name: arc-arm64-kvm
    runsOn: arc-arm64-kvm
    hostPlatform: linux/arm64
    resources:
      cpuMillis: 8000
      memoryMiB: 10240
      ephemeralStorageMiB: 65536
    maxTimeoutSeconds: 21600
    capabilities: [kvm]
runtime:
  runtime: docker
  buildNetworkPolicy: producer-declared
utilityContainer: busybox@sha256:29989570aeecad61a019f684218ea74d4b8c1c74f9e0abeb34ca926b81174ee1
utilityPlatform: linux/amd64
