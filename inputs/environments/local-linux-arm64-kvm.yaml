apiVersion: nvkr.dev/environment/v1
kind: Environment
metadata:
  name: nvke-os-arm64-kvm-local-linux-arm64-docker
  description: Docker and KVM on a local Linux ARM64 development host; not a production runner profile.
utilityContainer: golang@sha256:6c2a5538f964f1c82f97ad14988bf05de100d922d159d0e398b54c7b0ca0c6c9
utilityPlatform: linux/arm64
executionClasses:
  - name: linux-arm64-kvm-local-docker
    runsOn: local-linux-arm64-docker-kvm
    hostPlatform: linux/arm64
    resources:
      cpuMillis: 8000
      memoryMiB: 10240
      ephemeralStorageMiB: 65536
    maxTimeoutSeconds: 21600
    capabilities: [kvm]
runtime:
  runtime: docker
  buildNetworkPolicy: producer-declared
