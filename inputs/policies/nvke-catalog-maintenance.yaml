apiVersion: nvkr.dev/catalog-maintenance/v1
name: nvke
# The NVKE release and its derived chart pins are the one supported update path.
# Registry constraints stay authored; this policy never widens them.
catalog: inputs/catalogs/nvke
sources: [nvke, nvke-helm]
producerOverlays: inputs/policies/ovn-producer-overlays.json
sameRelease:
  - [nvke, nvke-helm]
definition: inputs/definitions/nvke/gpu-site-release.composite.yaml
environment: inputs/environments/github-nvke-gpu-site.yaml
qualificationPolicy: inputs/policies/nvke-gpu-site-qualification.yaml
# Production and nightly own the derived inventory; development retains its payload-only composite.
additionalRuns:
  - definition: inputs/definitions/nvke/gpu-site.composite.yaml
    environment: inputs/environments/github-development.yaml
    qualificationPolicy: inputs/policies/nvke-gpu-site-development-qualification.yaml
  - definition: inputs/definitions/nvke/gpu-site-release.composite.yaml
    environment: inputs/environments/github-nvke-nightly-gpu-site.yaml
    qualificationPolicy: inputs/policies/nvke-nightly-gpu-site-qualification.yaml
validation: static

# Explicit release cohort for `catalog bump --all nvke` without --dir.
# Shared domain sources also advance their diagnostic, local-site, module CLI
# and NVIDIA profile consumers. Local-site Helm and NKTP remain separate.
family:
  name: nvke
  catalogs:
    - catalog: inputs/catalogs/node-images
      sources: [nvke-cni-calico-source, nvke-doca-ovs-source, nvke-kubeadm-distro-source, nvke-os, nvke-spire-agent-source]
    - catalog: inputs/catalogs/nvke
      sources: [nvke, nvke-cli, nvke-cli-local-site, nvke-content, nvke-controller, nvke-controller-helm-native-site, nvke-controller-helm-nightly-site, nvke-controller-module-tags, nvke-deploy, nvke-helm, nvke-profiles]
    - catalog: inputs/catalogs/runtime-dependencies
      sources: [nvke-deployment-selection]
    - catalog: inputs/catalogs/tools
      sources: [nvke-cli, nvke-deploy, nvke-nicosim, nvke-nicosim-nicosim]
