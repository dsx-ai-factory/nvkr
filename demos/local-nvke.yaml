# Edit the absolute paths for your dedicated Ubuntu ARM64 execution host.
# On macOS, these paths refer to files INSIDE the Colima Linux VM.
# This is a local diagnostic description, not an NVKR Definition or Release.
version: 1
build:
  repo: /workspace/nvkr
  # Default: fetch pinned remote Git sources. Authentication must work on Linux.
  # Optional: uncomment only for an accessible local Git object source.
  # nvkeClone: /workspace/nvke-source
  attempt: demo-e2e-01
  # Maximum concurrent ready build/package operations; dependencies still gate work.
  jobs: 2
run:
  # e2e prepares the pinned installer automatically; no separate clone needed.
  # Optional read-only override at the matching installer pin:
  # nvkeCheckout: /workspace/nvke-installer
  out: /workspace/nvkr/.nvkr/e2e-demo-01
  timeoutSeconds: 3600
# e2e obtains nvkr and one completed Run from this invocation's fresh build.
# Do not add run.nvkr or run.runs to an e2e configuration.
