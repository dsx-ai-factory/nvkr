# Edit the absolute paths for your dedicated Ubuntu ARM64 execution host.
# On macOS, these paths refer to files INSIDE the Colima Linux VM.
# This is a local diagnostic description, not an NKD Definition or Release.
version: 1
build:
  repo: /workspace/nke-recipes
  # Default: fetch pinned remote Git sources. Authentication must work on Linux.
  # Optional: uncomment only for an accessible local Git object source.
  # nkeClone: /workspace/nke-source
  attempt: demo-e2e-01
  # Maximum concurrent ready build/package operations; dependencies still gate work.
  jobs: 2
run:
  nkeCheckout: /workspace/nke-installer
  out: /workspace/nke-recipes/.nkd/e2e-demo-01
  timeoutSeconds: 3600
# e2e obtains nkdctl and one completed Run from this invocation's fresh build.
# Do not add run.nkdctl or run.runs to an e2e configuration.
