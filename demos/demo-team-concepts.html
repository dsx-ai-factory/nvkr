<script>
'use strict';
const concepts=JSON.parse(document.getElementById('concept-data').textContent), $=id=>document.getElementById(id);
const groups=[['author','01 / Author the intent'],['compose','02 / Compose and resolve'],['execute','03 / Inspect and execute'],['trust','04 / Publish and trust']];
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let active=null;
const requestedSlide=Number(new URLSearchParams(location.search).get('from'));
const from=Number.isInteger(requestedSlide)&&requestedSlide>=1&&requestedSlide<=14?requestedSlide:0;
if(Number.isInteger(from)&&from>=1&&from<=14){$('back-deck').href='nvkr-team-tour.html#'+from;$('back-deck').textContent='← Back to slide '+from;}
function topicHref(id){return '#'+id;}
function withOrigin(href){if(!href.startsWith('demo-team-explorer.html'))return href;const parts=href.split('#');return parts[0]+'?from='+(from||active?.slide||1)+(parts[1]?'#'+parts[1]:'');}
function nav(){const query=$('search').value.trim().toLowerCase();let count=0;$('topic-nav').innerHTML=groups.map(([group,label])=>{const list=concepts.filter(c=>c.group===group&&(!query||[c.title,c.oneSentence,c.id,...(c.keywords||[])].join(' ').toLowerCase().includes(query)));count+=list.length;return list.length?'<div class="group-name">'+escapeHTML(label)+'</div>'+list.map(c=>'<a class="topic-link" href="'+topicHref(c.id)+'"'+(active?.id===c.id?' aria-current="page"':'')+'><span>'+String(concepts.indexOf(c)+1).padStart(2,'0')+'</span>'+escapeHTML(c.title)+'</a>').join(''):'';}).join('');if(!count)$('topic-nav').innerHTML='<p class="empty-search">No matches. Try “pin”, “graph” or “sign”.</p>';if(query){$('topic-nav').classList.add('open');$('toggle-nav').setAttribute('aria-expanded','true');}$('overview-link').toggleAttribute('aria-current',!active);if(!active)$('overview-link').setAttribute('aria-current','page');}
function home(){active=null;$('main').innerHTML='<div class="eyebrow">NVKR / CONCEPT GUIDE</div><h1>How NVKR works.<br>One concept at a time.</h1><p class="lead">Choose a feature to see its inputs, the work NVKR performs, and the result you can inspect.</p><div class="intro-meta"><span class="pill">'+concepts.length+' focused examples</span><span class="pill green">Works offline</span><span class="pill">Definition → Run → Release</span></div><p class="term-intro">These three roles apply to executable bundles, container images, charts and OS disks. Components supply recipes, outputs declare deliverables, and artifacts are the produced results.</p><div class="term-strip"><a href="#producers"><strong>Component</strong><span>A named piece with a recipe.<br>Example: app-cli, an application tool.</span></a><a href="#definition"><strong>Output</strong><span>A deliverable the Definition promises.<br>Example: client-bundle selects app-cli.</span></a><a href="#artifacts"><strong>Artifact</strong><span>The actual file, image or package produced.<br>Example: the resulting executable bundle.</span></a></div><div class="journey" aria-label="NVKR concept journey">'+[['catalog','Catalog','Reusable recipes'],['definition','Definition','Named outputs'],['plan','Plan','Resolved work'],['pipeline','Pipeline','Generated CI'],['artifacts','Artifacts','Exact bytes'],['release','Release','Connected evidence']].map(([id,name,sub],i)=>'<a href="#'+id+'"><small>0'+(i+1)+' / '+sub+'</small>'+name+'</a>').join('')+'</div>'+groups.map(([group,label])=>'<section class="home-group"><div class="group-head"><h2>'+escapeHTML(label.slice(5))+'</h2><span>'+escapeHTML(label.slice(0,2))+' / Choose a concrete example</span></div><div class="cards">'+concepts.filter(c=>c.group===group).map(c=>'<a class="concept-card" href="#'+c.id+'"><div class="card-top"><span>'+String(concepts.indexOf(c)+1).padStart(2,'0')+'</span><span aria-hidden="true">↗</span></div><h3>'+escapeHTML(c.title)+'</h3><p>'+escapeHTML(c.cardDescription||c.oneSentence)+'</p></a>').join('')+'</div></section>').join('')+'<div class="home-banner"><div><div class="eyebrow">TRY IT YOURSELF</div><h2 style="margin:9px 0 0">Put the concepts into practice.</h2><p>Use the optional walkthrough to execute a small Definition and inspect a published product release.</p></div><a class="button" href="demo-team-walkthrough.html">Start the walkthrough →</a></div><p class="footer-note">Public lifecycle: Definition → Run → Release. Plans and graphs are generated records. Inputs describe the intended work; Run records and verification establish their stated claims.</p>';nav();}
function codeMarkup(raw,language){return raw.split('\n').map(line=>{if(/^\s*#/.test(line))return '<span class="comment">'+escapeHTML(line)+'</span>';let safe=escapeHTML(line);if(/yaml|yml/.test(language))safe=safe.replace(/^(\s*(?:- )?)([\w.-]+)(:)/,'$1<span class="key">$2</span>$3');return safe;}).join('\n');}
function exampleDetails(e){
  const body=e.code?'<pre><code>'+codeMarkup(e.code,e.language||'')+'</code></pre>':'<p class="steps-label">Before</p><pre><code>'+codeMarkup(e.before,e.language||'')+'</code></pre><p class="steps-label">After</p><pre><code>'+codeMarkup(e.after,e.language||'')+'</code></pre>';
  return '<details class="full-example"><summary>'+escapeHTML(e.label)+'</summary>'+body+(e.note?'<p class="detail-note">'+escapeHTML(e.note)+'</p>':'')+'</details>';
}
function exampleBlock(c){
  return '<section class="example" aria-label="Code example"><div class="example-top"><span>'+escapeHTML(c.exampleTitle||c.exampleLabel||c.exampleLanguage||'Example')+'</span><button type="button" class="copy" id="copy-example">Copy example</button></div><pre id="example-code"><code>'+codeMarkup(c.example||'',c.exampleLanguage||'')+'</code></pre><div class="example-foot">'+escapeHTML(c.exampleFoot||'Selected fields for this example. Use the linked walkthrough for complete runnable inputs.')+'</div></section>';
}
function compositionBlock(){
  return '<section class="composition" aria-labelledby="composition-heading"><div class="eyebrow">One example · three different edits</div><h2 id="composition-heading">Which recipe changes—and who uses it?</h2><p class="composition-intro"><code>app-cli</code> is the application tool; <code>config-cli</code> is the configuration tool. You ship two outputs: <code>client-bundle</code> contains <code>app-cli</code>, and <code>admin-bundle</code> contains <code>app-cli</code> + <code>config-cli</code>. Each option starts from this same baseline.</p><div class="composition-tabs" aria-label="Choose a catalog change">'+[
    ['shared','1 · Replace app-cli for both'],['scoped','2 · Replace app-cli only in admin-bundle'],['selected','3 · Select app-cli-alt']
  ].map(([id,label])=>'<button type="button" data-composition="'+id+'" aria-pressed="false">'+label+'</button>').join('')+'</div><p class="composition-intent" id="composition-intent"></p><div class="comparison-head"><span>Before · base catalog</span><span>After · your chosen edit</span></div><div id="composition-outputs" class="composition-outputs"></div><p class="composition-caption">“Changed” means a different Build Digest: the fingerprint of selected recipes and inputs. Each variant below is a separate edit of the baseline Definition.</p><div class="composition-edit"><div><p class="steps-label" id="composition-file"></p><pre><code id="composition-code"></code></pre><p class="composition-caption" id="composition-code-note"></p></div><div class="composition-result"><h3>Read it this way</h3><p id="composition-read"></p><h3>What changes?</h3><p id="composition-result"></p><p class="composition-stays">Output names stay <code>client-bundle</code> and <code>admin-bundle</code>. The <code>config-cli</code> recipe stays the same.</p></div></div><details class="composition-details"><summary>What is in supplier.json? What does “changed” mean?</summary><p><code>supplier.json</code> is the overlay. It replaces the whole <code>app-cli</code> recipe: instead of building from source, acquire a supplier’s exact pinned bytes. It keeps the component name <code>app-cli</code> and its supported platform/output contract. Use the catalog tooling to bind the overlay to the exact preceding catalog.</p><p>“Changed” means the output’s <strong>Build Digest</strong> changed: NVKR has a different fingerprint for the selected recipes and inputs. These comparisons explain planning identity. The optional authoring lab exercises the operations using its own fixture names.</p></details></section>';
}
const compositionCases={
  shared:{intent:'Goal: use the supplier’s app-cli wherever these outputs select app-cli.',file:'Edit the Definition’s default catalog',code:'catalog:\n  base: ./catalog\n  overlays: [supplier.json]',note:'Definition excerpt. Both outputs use this default stack; neither has its own catalog setting.',read:'The overlay changes the recipe behind the name app-cli. Put it on the default catalog so both outputs use that changed recipe.',result:'client-bundle and admin-bundle change. Both select app-cli from the overlaid catalog.',recipes:['app-cli · supplier bytes','app-cli · supplier bytes + config-cli'],changed:[true,true]},
  scoped:{intent:'Goal: try the supplier’s app-cli in admin-bundle while leaving client-bundle on the original recipe.',file:'Edit only the admin-bundle output in the Definition',code:'- name: admin-bundle\n  components: [app-cli, config-cli]\n  platform: linux/amd64\n  format: executable\n  catalog:\n    base: ./catalog\n    overlays: [supplier.json]',note:'Output excerpt under outputs:. The Definition’s default catalog stays unchanged.',read:'Use the same overlay, but attach its catalog stack to admin-bundle. The name app-cli now resolves differently in these two outputs.',result:'Only admin-bundle changes. client-bundle still uses the original app-cli from the base catalog.',recipes:['app-cli · original recipe','app-cli · supplier bytes + config-cli'],changed:[false,true]},
  selected:{intent:'Goal: make client-bundle use the existing app-cli-alt recipe. Leave the catalog alone.',file:'Edit client-bundle.components in the Definition',code:'- name: client-bundle\n  components: [app-cli-alt]\n  platform: linux/amd64\n  format: executable',note:'Output excerpt under outputs:. app-cli-alt is already defined in the base catalog; no overlay is involved.',read:'Keep the output name client-bundle and choose a different component. The recipe named app-cli remains available and unchanged.',result:'Only client-bundle changes. admin-bundle still selects the original app-cli plus config-cli.',recipes:['app-cli-alt · alternate recipe','app-cli · original recipe + config-cli'],changed:[true,false]}
};
function showComposition(name){
  const c=compositionCases[name];
  document.querySelectorAll('[data-composition]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.composition===name)));
  $('composition-intent').textContent=c.intent;$('composition-file').textContent=c.file;
  $('composition-code').innerHTML=codeMarkup(c.code,'yaml');$('composition-code-note').textContent=c.note;
  $('composition-read').textContent=c.read;$('composition-result').textContent=c.result;
  const outputs=['client-bundle','admin-bundle'],before=['app-cli · original recipe','app-cli · original recipe + config-cli'];
  $('composition-outputs').innerHTML=outputs.map((output,i)=>'<div class="output-comparison" data-output="'+output+'"><div class="output-before"><span class="mobile-state">Before</span><strong>'+output+'</strong><span>'+escapeHTML(before[i])+'</span></div><span class="comparison-arrow" aria-hidden="true">→</span><div class="output-after '+(c.changed[i]?'changed':'unchanged')+'"><span class="mobile-state">After</span><div class="output-title"><strong>'+output+'</strong><span class="change-label">'+(c.changed[i]?'Changed':'Unchanged')+'</span></div><span>'+escapeHTML(c.recipes[i])+'</span></div></div>').join('');
  $('status').textContent=c.result;
}
function renderTopic(c){
  active=c;
  const index=concepts.indexOf(c),isComposition=['overlays','substitutions'].includes(c.id);
  const scene=c.scenario?'<section class="scene"><div class="steps-label">In this example</div><p>'+escapeHTML(c.scenario)+'</p></section>':'';
  const takeaway=c.result?'<div class="takeaway"><strong>What you should notice</strong><p>'+escapeHTML(c.result)+'</p></div>':'';
  const explanation='<section class="explain"><h2>How to read it</h2>'+(c.readThisAs?'<p class="read-as">'+escapeHTML(c.readThisAs)+'</p>':'')+'<ol class="explanation-list">'+(c.explanation||[]).map(p=>'<li>'+escapeHTML(p)+'</li>').join('')+'</ol><p class="why"><strong>Why use it?</strong> '+escapeHTML(c.why)+'</p></section>';
  const code=exampleBlock(c);
  const more=[c.secondaryExample,c.advancedExample].filter(Boolean).map(exampleDetails).join('');
  $('main').innerHTML='<div class="breadcrumb"><a href="#overview">All concepts</a><span>/</span><span>'+escapeHTML(groups.find(g=>g[0]===c.group)?.[1].slice(5)||'')+'</span></div><div class="topic-head"><div class="eyebrow">Concept '+String(index+1).padStart(2,'0')+' / '+concepts.length+'</div><h1>'+escapeHTML(c.title)+'</h1><p class="lead">'+escapeHTML(c.oneSentence)+'</p></div>'+
    (isComposition?compositionBlock()+'<details class="full-example"><summary>More detail: '+escapeHTML(c.title.toLowerCase())+'</summary>'+scene+'<div class="example-layout">'+code+explanation+'</div></details>':scene+'<div class="example-layout">'+code+explanation+'</div>'+takeaway)+
    more+(!isComposition&&c.miniDemo?.length?'<section class="change-demo"><div class="steps-label">Compare a change</div><h3>What happens if you change this input?</h3><div class="change-options">'+c.miniDemo.map((d,i)=>'<button type="button" data-change="'+i+'" aria-pressed="'+(i===0)+'">'+escapeHTML(d.label)+'</button>').join('')+'</div><div class="change-pair"><div><small>Before</small><p id="change-before"></p></div><span aria-hidden="true">→</span><div><small>After</small><p id="change-after"></p></div></div><p class="change-effect" id="change-effect" aria-live="polite"></p></section>':'')+
    (!isComposition&&c.quiz?'<section class="quiz"><div class="steps-label">Explore a distinction</div><h3>'+escapeHTML(c.quiz.prompt)+'</h3><div class="choices">'+c.quiz.choices.map((a,i)=>'<button type="button" data-choice="'+i+'" aria-pressed="false">'+escapeHTML(a.label)+'</button>').join('')+'</div><p class="quiz-result" id="quiz-result" aria-live="polite">Choose an option to see the explanation.</p></section>':'')+
    (c.scope?'<div class="scope"><strong>'+escapeHTML(c.scopeTitle||'Example scope')+'</strong>'+escapeHTML(c.scope)+'</div>':'')+
    '<div class="related">'+(c.actions||[]).map(a=>'<a class="button'+(a.secondary?' secondary':'')+'" href="'+escapeHTML(withOrigin(a.href))+'">'+escapeHTML(a.label)+'</a>').join('')+'<a class="button secondary" href="nvkr-team-tour.html#'+(from||c.slide||1)+'">Back to slide '+(from||c.slide||1)+' →</a></div><details class="sources"><summary>Source files, exact details and verification scope</summary><p>'+escapeHTML(c.sourceNote||'Implementation sources are listed below; recorded release examples retain their stated scope.')+'</p><p>'+escapeHTML(c.displayBadge||c.badge||'')+'</p><ul>'+(c.sourcePaths||[]).map(p=>'<li>'+escapeHTML(p)+'</li>').join('')+'</ul></details><nav class="pager" aria-label="Neighboring concepts">'+(index?'<a href="#'+concepts[index-1].id+'"><small>← Previous concept</small>'+escapeHTML(concepts[index-1].title)+'</a>':'<a href="#overview"><small>← Back</small>All concepts</a>')+(index<concepts.length-1?'<a href="#'+concepts[index+1].id+'"><small>Next concept →</small>'+escapeHTML(concepts[index+1].title)+'</a>':'<a href="demo-team-walkthrough.html"><small>Next →</small>Try the guided demos</a>')+'</nav>';
  $('copy-example').addEventListener('click',copyExample);
  document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('quiz-result').textContent=c.quiz.choices[Number(b.dataset.choice)].result;}));
  if(isComposition){document.querySelectorAll('[data-composition]').forEach(b=>b.addEventListener('click',()=>showComposition(b.dataset.composition)));showComposition(c.id==='overlays'?'shared':'scoped');}
  else if(c.miniDemo?.length){document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=>showChange(Number(b.dataset.change))));showChange(0);}
  nav();
}
function showChange(n){const change=active.miniDemo[n];$('change-before').textContent=change.before;$('change-after').textContent=change.after;$('change-effect').textContent=change.effect;document.querySelectorAll('[data-change]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.change)===n)));}
async function copyExample(){try{if(!navigator.clipboard)throw Error('No clipboard');await navigator.clipboard.writeText(active.example);$('copy-example').textContent='Copied';$('status').textContent='Example copied.';}catch{const range=document.createRange();range.selectNodeContents($('example-code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('copy-example').textContent='Selected · copy now';$('status').textContent='Example selected. Use your system copy shortcut.';}}
function route(event){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{id='overview';}if(id==='main'){$('main').focus();return;}if(!id||id==='overview'){home();}else{const c=concepts.find(c=>c.id===id);if(c)renderTopic(c);else{$('main').innerHTML='<section class="not-found"><h1>Choose a concept.</h1><p>This topic is not in the guide.</p><a class="button" href="#overview">Open the gallery →</a></section>';active=null;nav();}}document.title=active?'NVKR · '+active.title:'NVKR · Concepts in action';window.scrollTo(0,0);$('topic-nav').classList.remove('open');$('toggle-nav').setAttribute('aria-expanded','false');if(event?.type==='hashchange')$('main').focus({preventScroll:true});}
$('search').addEventListener('input',nav);$('search').addEventListener('keydown',event=>{if(event.key==='Enter'){const first=$('topic-nav').querySelector('a');if(first)location.hash=first.hash;}});$('toggle-nav').addEventListener('click',()=>{const open=$('topic-nav').classList.toggle('open');$('toggle-nav').setAttribute('aria-expanded',String(open));});window.addEventListener('hashchange',route);route();
</script></body></html>
