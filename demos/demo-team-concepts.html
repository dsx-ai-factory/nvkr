function home(){active=null;$('main').innerHTML='<div class="eyebrow">A field guide for the team</div><h1>Every concept.<br>One connected system.</h1><p class="lead">Start with what should ship. Follow the exact inputs, the generated work, and the evidence that travels with the release.</p><div class="intro-meta"><span class="pill">'+concepts.length+' focused examples</span><span class="pill green">Works offline</span><span class="pill">Based on PR #108</span></div><p class="term-intro">Start with three distinct things. The catalog examples use small local fixtures; the execution and release examples follow the recorded NKE candidate.</p><div class="term-strip"><a href="#producers"><strong>Component</strong><span>A named piece with a recipe.<br>Example: doctor, a health-check command.</span></a><a href="#definition"><strong>Output</strong><span>A deliverable the Definition promises.<br>Example: diagnostics selects doctor.</span></a><a href="#artifacts"><strong>Artifact</strong><span>The actual file, image or package produced.<br>Example: the resulting executable bundle.</span></a></div><div class="journey" aria-label="NKD concept journey">'+[['catalog','Catalog','Reusable recipes'],['definition','Definition','Named outputs'],['plan','Plan','Resolved work'],['pipeline','Pipeline','Generated CI'],['artifacts','Artifacts','Exact bytes'],['release','Release','Connected evidence']].map(([id,name,sub],i)=>'<a href="#'+id+'"><small>0'+(i+1)+' / '+sub+'</small>'+name+'</a>').join('')+'</div>'+groups.map(([group,label])=>'<section class="home-group"><div class="group-head"><h2>'+escapeHTML(label.slice(5))+'</h2><span>'+escapeHTML(label.slice(0,2))+' / Choose a concrete example</span></div><div class="cards">'+concepts.filter(c=>c.group===group).map(c=>'<a class="concept-card" href="#'+c.id+'"><div class="card-top"><span>'+String(concepts.indexOf(c)+1).padStart(2,'0')+'</span><span aria-hidden="true">↗</span></div><h3>'+escapeHTML(c.title)+'</h3><p>'+escapeHTML(c.cardDescription||c.oneSentence)+'</p></a>').join('')+'</div></section>').join('')+'<div class="home-banner"><div><div class="eyebrow">Follow the real candidate</div><h2 style="margin:9px 0 0">34 outputs. Two OS images. One release.</h2><p>Use the saved graphs offline, then replay the native commands in the guided demos.</p></div><a class="button" href="demo-team-walkthrough.html">Start the walkthrough →</a></div><p class="footer-note">Public lifecycle: Definition → Run → Release. Plans and graphs are generated records. Examples explain current implementation; evidence and acceptance retain their own scope.</p>';nav();}
function codeMarkup(raw,language){return raw.split('\n').map(line=>{if(/^\s*#/.test(line))return '<span class="comment">'+escapeHTML(line)+'</span>';let safe=escapeHTML(line);if(/yaml|yml/.test(language))safe=safe.replace(/^(\s*(?:- )?)([\w.-]+)(:)/,'$1<span class="key">$2</span>$3');return safe;}).join('\n');}
function exampleDetails(e){
  const body=e.code?'<pre><code>'+codeMarkup(e.code,e.language||'')+'</code></pre>':'<p class="steps-label">Before</p><pre><code>'+codeMarkup(e.before,e.language||'')+'</code></pre><p class="steps-label">After</p><pre><code>'+codeMarkup(e.after,e.language||'')+'</code></pre>';
  return '<details class="full-example"><summary>'+escapeHTML(e.label)+'</summary>'+body+(e.note?'<p class="detail-note">'+escapeHTML(e.note)+'</p>':'')+'</details>';
}
function exampleBlock(c){
  return '<section class="example" aria-label="Code example"><div class="example-top"><span>'+escapeHTML(c.exampleTitle||c.exampleLabel||c.exampleLanguage||'Example')+'</span><button type="button" class="copy" id="copy-example">Copy example</button></div><pre id="example-code"><code>'+codeMarkup(c.example||'',c.exampleLanguage||'')+'</code></pre><div class="example-foot">'+escapeHTML(c.exampleFoot||'Selected fields for this example. Use the linked walkthrough for complete runnable inputs.')+'</div></section>';
}
function compositionBlock(){
  return '<section class="composition" aria-labelledby="composition-heading"><div class="eyebrow">One example · three different edits</div><h2 id="composition-heading">Which recipe changes—and who uses it?</h2><p class="composition-intro"><code>doctor</code> is a health-check command; <code>status</code> is a status command. You ship two outputs: <code>diagnostics</code> contains <code>doctor</code>, and <code>tools</code> contains <code>doctor</code> + <code>status</code>. Each option starts from this same baseline.</p><div class="composition-tabs" aria-label="Choose a catalog change">'+[
    ['shared','1 · Replace doctor for both'],['scoped','2 · Replace doctor only in tools'],['selected','3 · Select doctor-alt']
  ].map(([id,label])=>'<button type="button" data-composition="'+id+'" aria-pressed="false">'+label+'</button>').join('')+'</div><p class="composition-intent" id="composition-intent"></p><div class="comparison-head"><span>Before · base catalog</span><span>After · your chosen edit</span></div><div id="composition-outputs" class="composition-outputs"></div><p class="composition-caption">“Changed” means a different Build Digest: the fingerprint of selected recipes and inputs. The lab plans the work; it does not build the final artifacts.</p><div class="composition-edit"><div><p class="steps-label" id="composition-file"></p><pre><code id="composition-code"></code></pre><p class="composition-caption" id="composition-code-note"></p></div><div class="composition-result"><h3>Read it this way</h3><p id="composition-read"></p><h3>What changes?</h3><p id="composition-result"></p><p class="composition-stays">Output names stay <code>diagnostics</code> and <code>tools</code>. The <code>status</code> recipe stays the same.</p></div></div><details class="composition-details"><summary>What is in supplier.json? What does “changed” mean?</summary><p><code>supplier.json</code> is the overlay. It replaces the whole <code>doctor</code> recipe: instead of building from source, acquire a supplier’s exact pinned bytes. It keeps the component name <code>doctor</code> and its supported platform/output contract. The lab computes the required hashes.</p><p>“Changed” means the output’s <strong>Build Digest</strong> changed: NKD has a different fingerprint for the selected recipes and inputs. This lab plans the work; it does not build or compare the final artifact bytes. The other five lab outputs retain their Build Digests in these three cases.</p></details></section>';
}
const compositionCases={
  shared:{intent:'Goal: use the supplier’s doctor wherever these outputs select doctor.',file:'Edit the Definition’s default catalog',code:'catalog:\n  base: ./catalog\n  overlays: [supplier.json]',note:'Definition excerpt. Both outputs use this default stack; neither has its own catalog setting.',read:'The overlay changes the recipe behind the name doctor. Put it on the default catalog so both outputs use that changed recipe.',result:'diagnostics and tools change. Both select doctor from the overlaid catalog.',recipes:['doctor · supplier bytes','doctor · supplier bytes + status'],changed:[true,true]},
  scoped:{intent:'Goal: try the supplier’s doctor in tools while leaving diagnostics on the original recipe.',file:'Edit only the tools output in the Definition',code:'- name: tools\n  components: [doctor, status]\n  platform: linux/amd64\n  format: executable\n  catalog:\n    base: ./catalog\n    overlays: [supplier.json]',note:'Output excerpt under outputs:. The Definition’s default catalog stays unchanged.',read:'Use the same overlay, but attach its catalog stack to tools. The name doctor now resolves differently in these two outputs.',result:'Only tools changes. diagnostics still uses the original doctor from the base catalog.',recipes:['doctor · original recipe','doctor · supplier bytes + status'],changed:[false,true]},
  selected:{intent:'Goal: make diagnostics use the existing doctor-alt recipe. Leave the catalog alone.',file:'Edit diagnostics.components in the Definition',code:'- name: diagnostics\n  components: [doctor-alt]\n  platform: linux/amd64\n  format: executable',note:'Output excerpt under outputs:. doctor-alt is already defined in the base catalog; no overlay is involved.',read:'Keep the output name diagnostics and choose a different component. The recipe named doctor remains available and unchanged.',result:'Only diagnostics changes. tools still selects the original doctor plus status.',recipes:['doctor-alt · alternate recipe','doctor · original recipe + status'],changed:[true,false]}
};
function showComposition(name){
  const c=compositionCases[name];
  document.querySelectorAll('[data-composition]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.composition===name)));
  $('composition-intent').textContent=c.intent;$('composition-file').textContent=c.file;
  $('composition-code').innerHTML=codeMarkup(c.code,'yaml');$('composition-code-note').textContent=c.note;
  $('composition-read').textContent=c.read;$('composition-result').textContent=c.result;
  const outputs=['diagnostics','tools'],before=['doctor · original recipe','doctor · original recipe + status'];
  $('composition-outputs').innerHTML=outputs.map((output,i)=>'<div class="output-comparison" data-output="'+output+'"><div class="output-before"><span class="mobile-state">Before</span><strong>'+output+'</strong><span>'+escapeHTML(before[i])+'</span></div><span class="comparison-arrow" aria-hidden="true">→</span><div class="output-after '+(c.changed[i]?'changed':'unchanged')+'"><span class="mobile-state">After</span><div class="output-title"><strong>'+output+'</strong><span class="change-label">'+(c.changed[i]?'Changed':'Unchanged')+'</span></div><span>'+escapeHTML(c.recipes[i])+'</span></div></div>').join('');
  $('status').textContent=c.result;
}
function renderTopic(c){
  active=c;
  const index=concepts.indexOf(c),isComposition=['overlays','substitutions'].includes(c.id);
  const scene=c.scenario?'<section class="scene"><div class="steps-label">In this example</div><p>'+escapeHTML(c.scenario)+'</p></section>':'';
  const takeaway=c.result?'<div class="takeaway"><strong>What you should notice</strong><p>'+escapeHTML(c.result)+'</p></div>':'';
  const explanation='<section class="explain"><h2>How to read it</h2>'+(c.readThisAs?'<p class="read-as">'+escapeHTML(c.readThisAs)+'</p>':'')+'<ol class="explanation-list">'+(c.explanation||[]).map(p=>'<li>'+escapeHTML(p)+'</li>').join('')+'</ol><p class="why"><strong>Why use it?</strong> '+escapeHTML(c.why)+'</p></section>';
  const code=exampleBlock(c);
  const more=[c.secondaryExample,c.advancedExample].filter(Boolean).map(exampleDetails).join('');
  $('main').innerHTML='<div class="breadcrumb"><a href="#overview">All concepts</a><span>/</span><span>'+escapeHTML(groups.find(g=>g[0]===c.group)?.[1].slice(5)||'')+'</span></div><div class="topic-head"><div class="eyebrow">Concept '+String(index+1).padStart(2,'0')+' / '+concepts.length+'</div><h1>'+escapeHTML(c.title)+'</h1><p class="lead">'+escapeHTML(c.oneSentence)+'</p></div>'+
    (isComposition?compositionBlock()+'<details class="full-example"><summary>More detail: '+escapeHTML(c.title.toLowerCase())+'</summary>'+scene+'<div class="example-layout">'+code+explanation+'</div></details>':scene+'<div class="example-layout">'+code+explanation+'</div>'+takeaway)+
    more+(!isComposition&&c.miniDemo?.length?'<section class="change-demo"><div class="steps-label">Compare a change</div><h3>What happens if you change this input?</h3><div class="change-options">'+c.miniDemo.map((d,i)=>'<button type="button" data-change="'+i+'" aria-pressed="'+(i===0)+'">'+escapeHTML(d.label)+'</button>').join('')+'</div><div class="change-pair"><div><small>Before</small><p id="change-before"></p></div><span aria-hidden="true">→</span><div><small>After</small><p id="change-after"></p></div></div><p class="change-effect" id="change-effect" aria-live="polite"></p></section>':'')+
    (!isComposition&&c.quiz?'<section class="quiz"><div class="steps-label">Explore a distinction</div><h3>'+escapeHTML(c.quiz.prompt)+'</h3><div class="choices">'+c.quiz.choices.map((a,i)=>'<button type="button" data-choice="'+i+'" aria-pressed="false">'+escapeHTML(a.label)+'</button>').join('')+'</div><p class="quiz-result" id="quiz-result" aria-live="polite">Choose an option to see the explanation.</p></section>':'')+
    (c.scope?'<div class="scope"><strong>'+escapeHTML(c.scopeTitle||'What the example does—and does not—show')+'</strong>'+escapeHTML(c.scope)+'</div>':'')+
    '<div class="related">'+(c.actions||[]).map(a=>'<a class="button'+(a.secondary?' secondary':'')+'" href="'+escapeHTML(withOrigin(a.href))+'">'+escapeHTML(a.label)+'</a>').join('')+'<a class="button secondary" href="nkd-team-tour.html#'+(from||c.slide||1)+'">Back to slide '+(from||c.slide||1)+' →</a></div><details class="sources"><summary>Source files, exact details and verification scope</summary><p>'+escapeHTML(c.sourceNote||'Examples checked against the PR #108 implementation and the referenced recorded runs.')+'</p><p>'+escapeHTML(c.displayBadge||c.badge||'')+'</p><ul>'+(c.sourcePaths||[]).map(p=>'<li>'+escapeHTML(p)+'</li>').join('')+'</ul></details><nav class="pager" aria-label="Neighboring concepts">'+(index?'<a href="#'+concepts[index-1].id+'"><small>← Previous concept</small>'+escapeHTML(concepts[index-1].title)+'</a>':'<a href="#overview"><small>← Back</small>All concepts</a>')+(index<concepts.length-1?'<a href="#'+concepts[index+1].id+'"><small>Next concept →</small>'+escapeHTML(concepts[index+1].title)+'</a>':'<a href="demo-team-walkthrough.html"><small>Next →</small>Try the guided demos</a>')+'</nav>';
  $('copy-example').addEventListener('click',copyExample);
  document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('quiz-result').textContent=c.quiz.choices[Number(b.dataset.choice)].result;}));
  if(isComposition){document.querySelectorAll('[data-composition]').forEach(b=>b.addEventListener('click',()=>showComposition(b.dataset.composition)));showComposition(c.id==='overlays'?'shared':'scoped');}
  else if(c.miniDemo?.length){document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=>showChange(Number(b.dataset.change))));showChange(0);}
  nav();
}
function showChange(n){const change=active.miniDemo[n];$('change-before').textContent=change.before;$('change-after').textContent=change.after;$('change-effect').textContent=change.effect;document.querySelectorAll('[data-change]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.change)===n)));}
async function copyExample(){try{if(!navigator.clipboard)throw Error('No clipboard');await navigator.clipboard.writeText(active.example);$('copy-example').textContent='Copied';$('status').textContent='Example copied.';}catch{const range=document.createRange();range.selectNodeContents($('example-code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('copy-example').textContent='Selected · copy now';$('status').textContent='Example selected. Use your system copy shortcut.';}}
function route(event){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{id='overview';}if(id==='main'){$('main').focus();return;}if(!id||id==='overview'){home();}else{const c=concepts.find(c=>c.id===id);if(c)renderTopic(c);else{$('main').innerHTML='<section class="not-found"><h1>Choose a concept.</h1><p>This topic is not in the guide.</p><a class="button" href="#overview">Open the gallery →</a></section>';active=null;nav();}}document.title=active?'NKD · '+active.title:'NKD · Concepts in action';window.scrollTo(0,0);$('topic-nav').classList.remove('open');$('toggle-nav').setAttribute('aria-expanded','false');if(event?.type==='hashchange')$('main').focus({preventScroll:true});}
$('search').addEventListener('input',nav);$('search').addEventListener('keydown',event=>{if(event.key==='Enter'){const first=$('topic-nav').querySelector('a');if(first)location.hash=first.hash;}});$('toggle-nav').addEventListener('click',()=>{const open=$('topic-nav').classList.toggle('open');$('toggle-nav').setAttribute('aria-expanded',String(open));});window.addEventListener('hashchange',route);route();
</script></body></html>
