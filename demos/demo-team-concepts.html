<script id="concept-data" type="application/json">[{"id":"lifecycle","title":"The public lifecycle","oneSentence":"Choose what to deliver, run the work, then publish the results as a release.","why":"Each stage answers a different question: what do we want, what actually happened, and what can someone use?","badge":"Current public contract","sourcePaths":["docs/lifecycle.md","client/v1/lifecycle.go"],"exampleLanguage":"text","example":"Definition  “Deliver the client and admin bundles.”\nRun         “This attempt produced both required outputs.”\nRelease     “Here are their exact artifacts and evidence.”\n\nEnvironment          How this attempt runs\nArtifact             The delivered file, image or package\nVerification Policy  Which signer and claims a consumer accepts","explanation":["A Definition names the required deliverables. For example, client-bundle selects app-cli; admin-bundle selects app-cli and config-cli.","A Run records one attempt and its observed results. Each promised output must be accounted for.","A Release connects the published artifacts and their evidence through one immutable reference. The consumer decides which signatures and claims to accept."],"group":"author","slide":2,"displayBadge":"Current public contract","exampleLabel":"The same lifecycle for a small tool bundle or a full NVKE release.","exampleFoot":"The lifecycle applies to a single executable and to a product release containing several artifact types.","actions":[{"label":"Start with catalogs →","href":"#catalog"}],"keywords":["lifecycle","text",""],"scenario":"One product provides a client bundle and an admin bundle.","readThisAs":"Definition = requested outputs. Run = observed attempt. Release = published results.","result":"Definition: requested deliverables. Run: observed results. Release: published artifacts.","commonMisconception":"A generated Plan is an inspection record, not another independently authored lifecycle object.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"catalog","title":"Catalogs","oneSentence":"The catalog lists components you can choose and tells NVKR how to obtain each one.","why":"Define app-cli once, then reuse it in several outputs.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"text","example":"Catalog component     How to obtain it\napp-cli               Build the application CLI\nconfig-cli            Build the configuration CLI\napp-cli-alt           Build an alternative application CLI\n\nDefinition output     Components it selects\nclient-bundle         app-cli\nadmin-bundle          app-cli + config-cli","explanation":["Each component has an exact key and instructions to build or acquire its bytes.","registry.yaml holds declarations; pins.lock.yaml records the exact source and acquired-byte identities.","An output must explicitly select a component. The unused app-cli-alt entry is available without becoming part of either bundle."],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Selected fields illustrate the relationship. Complete inputs include the schema and platform-specific settings.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Sources","href":"#sources","secondary":true},{"label":"Immutable pins","href":"#pinning","secondary":true}],"keywords":["catalog","text",""],"scenario":"Ship a small bundle to application users and an additional configuration tool to administrators.","readThisAs":"The catalog says what is available. The Definition says what this product will deliver.","result":"Two deliverables reuse one app-cli recipe.","commonMisconception":"Adding a component to the catalog does not automatically add it to every output.","secondaryExample":{"label":"Technical example · Catalogs","language":"text","code":"catalog/\n  registry.yaml   # sources + producer instructions\n  pins.lock.yaml  # exact source and acquired-byte pins\n\nDefinition → catalog stack → selected producers","note":"File relationship; the maintained nvke-v1 catalog supplies the concrete example."},"sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"sources","title":"Sources","oneSentence":"A source names the upstream repository and release used by one or more components.","why":"Two tools can share one exact upstream source checkout.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"yaml","example":"sources:\n  app:\n    repo: https://example.invalid/app\n    tagPrefix: v\n\n# Both producers select the same source:\n# app-cli.source: app\n# config-cli.source: app","explanation":["A source gives a repository a catalog name. Multiple producers can refer to that same source.","The source declaration describes how versions are selected; the generated lock freezes the chosen commit, tree and timestamp.","Separate source keys can use the same repository when their release tags or build roles differ. Sharing a URL does not create a coordinated pin set."],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Source excerpt with an illustrative URL; build-tool fields are omitted.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true}],"keywords":["sources","yaml",""],"scenario":"The application and configuration tools live in the same repository.","readThisAs":"source: app selects the source key; the lock identifies its exact checkout.","result":"Both tools build from the same pinned checkout.","commonMisconception":"A repository URL alone does not choose a release. The source declaration and lock do.","sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"producers","title":"Component producers","oneSentence":"A producer is the instruction for turning a component’s inputs into its expected file or image.","why":"NVKR knows which command to run and which result to observe.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"yaml","example":"components:\n  app-cli:\n    source: app\n    fromSource: true\n    platforms: [linux/amd64, linux/arm64]\n    outputType: host-package\n    artifactPath: bin/app-cli\n    writeDir: bin\n    buildCommand: [sh, -ec, \"cp app-cli.sh bin/app-cli; chmod +x bin/app-cli\"]","explanation":["source names the pinned source checkout. buildCommand declares the work.","artifactPath identifies the expected result; NVKR observes those bytes after execution.","A component can instead acquire an existing artifact by exact digest. A producer overlay can replace the complete build method."],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Illustrative producer stanza. The source, toolchain and result path must agree with the complete catalog declaration.","actions":[{"label":"Builder types","href":"#builders","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"keywords":["producers","yaml",""],"scenario":"Build one application tool from its pinned source.","readThisAs":"Take the app source, run the command, and observe bin/app-cli.","result":"The producer recipe can be reused by multiple Definition outputs.","commonMisconception":"The component name app-cli is not the output name client-bundle. An output selects one or more components.","sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"definition","title":"Definitions & outputs","oneSentence":"A Definition lists the named outputs that must be delivered and the components each output selects.","why":"Everyone can see exactly what a successful run must produce.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"yaml","example":"catalog:\n  base: ./catalog\noutputs:\n  - name: client-bundle\n    components: [app-cli]\n    platform: linux/amd64\n    format: executable\n  - name: admin-bundle\n    components: [app-cli, config-cli]\n    platform: linux/amd64\n    format: executable","explanation":["An output names a deliverable and selects its component keys, platform and packaging format.","Both entries use the default catalog. An output can instead declare its own complete catalog stack.","Both outputs are independently required, even though they reuse app-cli. The Run must observe each named deliverable."],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Complete output entries; the Definition schema header is omitted.","actions":[{"label":"Catalogs","href":"#catalog","secondary":true},{"label":"Helm image bindings","href":"#helm-bindings","secondary":true}],"keywords":["definition","yaml",""],"scenario":"Application users need one tool; administrators need both.","readThisAs":"client-bundle contains app-cli. admin-bundle contains app-cli and config-cli.","result":"One catalog supplies two clearly defined deliverables.","commonMisconception":"A list under components chooses catalog entries; it does not redefine their producer instructions.","sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"materials","title":"Materials & dependencies","oneSentence":"A material maps a producer’s input label to another component’s exact key.","why":"Make the wiring explicit when an output combines programs, images, packages and installer media.","badge":"Implemented","displayBadge":"Implemented","sourcePaths":["docs/node-images.md","docs/catalogs-and-components.md","pkg/nvkr/buildgraph"],"exampleLanguage":"yaml","example":"# Exact NVKE producer excerpt\nmaterials:\n  ovn-chart: ovn-kubernetes-chart\n  ovn-image: ovn-kube-ubuntu\n\n# Read each entry as:\n# input label: component key","explanation":["The consuming producer names an input label on the left and the exact component producer on the right. Similar names and list order play no role.","The output’s components list declares selected membership. A disk output explicitly includes its root and every transitive material producer, with no unrelated extras. NVKR checks that membership against the material graph.","The source-owned build instructions assemble the supplied materials. Changing only the selection to a new key does not redirect an existing material reference; update the mapping or replace the producer under its existing key."],"group":"author","slide":9,"exampleLabel":"From the nvke-cni-ovn producer","exampleFoot":"The full disk Definition selects the root and transitive materials explicitly. This excerpt shows two input mappings.","scenario":"A disk-building producer consumes a chart and a container image from two different producers.","readThisAs":"ovn-chart is an input name. ovn-kubernetes-chart is the producer that supplies its bytes.","result":"components declares membership; materials wires the inputs; the build instructions assemble them.","actions":[{"label":"Trace OS-image materials ↗","href":"demo-team-walkthrough.html#os"},{"label":"Definitions & outputs","href":"#definition","secondary":true}],"keywords":["materials","components","dependencies","root","wiring"],"sourceNote":"Exact material keys from the maintained NVKE catalog; current membership rules are described in docs/node-images.md."},{"id":"environment","title":"Environments","oneSentence":"An Environment supplies the settings for running, publishing and signing a Definition.","why":"Keep “what should ship” separate from “where and how this attempt runs.”","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"text","example":"Definition                  Environment\nclient-bundle = app-cli      Runtime and execution route\nadmin-bundle = both tools    Registry destination, if publishing\n                            Credential references\n                            Signing settings, if signing","explanation":["The Definition selects components. The Environment supplies operational settings for this attempt.","A local Environment can select Docker execution. A hosted Environment adds publication destinations, credential references and signing settings.","Changing the registry destination changes the Plan while unchanged selected build instructions retain their Build Digests. Credentials are referenced, not embedded."],"miniDemo":[{"label":"Destination change","before":"ghcr.io/team-a/product","after":"registry.example/product","effect":"Publication routes and Plan change; unchanged producer graphs retain their Build Digests."}],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Selected fields illustrate the relationship. Complete inputs include the schema and platform-specific settings.","actions":[{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true},{"label":"Generator adapters","href":"#generators","secondary":true}],"keywords":["environment","yaml",""],"scenario":"Run a product locally, then generate its hosted pipeline.","readThisAs":"Definition = what to make. Environment = how this run will operate.","result":"Keep product composition separate from execution settings.","commonMisconception":"An Environment declaration does not prove a runner actually supplied the requested resources.","secondaryExample":{"label":"Technical example · Environments","language":"yaml","code":"apiVersion: nvkr.dev/environment/v1\nkind: Environment\nmetadata:\n  name: nvke-github\nruntime:\n  runtime: docker\npublication:\n  credentialRef: github:GITHUB_TOKEN\n  repositoryPrefix: ghcr.io/dsx-ai-factory/nvkr\nsourceAccess:\n  https://github.com/dsx-ai-factory/nvke:\n    credentialRef: github:NKE_SOURCE_TOKEN\n    mirror: https://github.com/dsx-ai-factory/nvke","note":"Environment excerpt; use the complete maintained file for commands."},"sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"pinning","title":"Immutable pins","oneSentence":"Pinning records the exact upstream version and content that the next build will use.","why":"Repeated planning starts from recorded inputs instead of following a moving release label.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"text","example":"Selected release:       app/v1.0.0\nLock records:           exact commit + tree + timestamp\nAcquired artifacts:     exact content digests\n\nPreview a source update:\n  nvkr catalog bump --check --dir path/to/catalog","explanation":["A tag selects a version. The machine-managed lock freezes the exact source checkout or acquired bytes.","Changing a source pin changes the Build Digests of outputs that select it. Unrelated producers keep their identities.","Use catalog pin or catalog bump to update source pins. Use pin-artifacts for direct acquired inputs. The --check preview writes no lock changes."],"group":"compose","slide":4,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Command excerpt: supply a real catalog. The separate local authoring lab exercises pin updates offline.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true},{"label":"Catalog maintenance","href":"#maintenance","secondary":true}],"keywords":["pinning","yaml",""],"scenario":"Review an upstream change before using it in a build.","readThisAs":"Human-readable version choice → exact machine-managed identity.","result":"The next Run uses reviewed inputs instead of following a moving tag.","commonMisconception":"A changed catalog fingerprint does not mean every output’s Build Digest changes.","secondaryExample":{"label":"Technical example · Immutable pins","language":"yaml","code":"# Exact maintained lock excerpt — machine-managed\npins:\n  nvke:\n    tag: cli/v0.1.0-rc.2\n    commit: ed9fb09b04fd40bf331d25df2222206ffaca593e\n    treeHash: 309887e8cdb8ee24a39785b864390eda3afce5ec\n    sourceDateEpoch: 1787066575","note":"Exact lock fields from the maintained NVKE catalog. Complete pins remain in the source file."},"sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"pin-sets","title":"Coordinated pin sets","oneSentence":"A pin set lets one upstream release choose a coordinated list of input versions.","why":"Keep upstream compatibility choices together when updating inputs.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"yaml","example":"# Pinned upstream release file\ndependencies:\n  - {name: app, version: 1.0.0}\n  - {name: tools, version: 2.0.0}\n\n# Explicit catalog mapping:\n# platform release → app and tools member pins","explanation":["A pinned upstream file lists compatible dependency versions. The catalog maps its entries to exact member source or artifact keys.","Pinning the owning release updates its derived members together. Derived members are updated through that owner.","This coordination is explicit. Two components sharing a repository URL do not automatically become a pin set."],"group":"compose","slide":4,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"Selected fields illustrate the relationship. Complete inputs include the schema and platform-specific settings.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Catalog maintenance","href":"#maintenance","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"keywords":["pin-sets","yaml",""],"scenario":"A platform release specifies compatible application and tools versions.","readThisAs":"Update the owner; NVKR derives the mapped member pins.","result":"One upstream release controls the explicitly mapped members.","commonMisconception":"A pin set does not discover dependencies. Its catalog member mappings are explicit.","secondaryExample":{"label":"Catalog field mapping — under sources.platform","language":"yaml","code":"pinSet:\n  file: versions.yaml\n  members:\n    app: {source: app, path: 'dependencies[name=app].version'}\n    tools: {source: tools, path: 'dependencies[name=tools].version'}","note":"Each member source also declares pinnedBy: platform."},"sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"overlays","title":"Catalog overlays","oneSentence":"A catalog overlay changes how a component is obtained while keeping its component name.","why":"Use a supplier’s app-cli without editing every output that selects it.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"text","example":"Before: app-cli from the base catalog\n  build app-cli from its pinned source\n\nAfter: app-cli from supplier.json\n  acquire the supplier’s pinned executable\n\nSame component key; complete replacement recipe.","explanation":["The overlay replaces the complete producer under app-cli. It preserves its platform and output-type contract.","Put the overlay in the default catalog stack to affect both bundles, or in an output-specific stack to affect only that output.","Each overlay checks the exact catalog it follows. Review and reissue it after changing that base."],"group":"compose","slide":5,"displayBadge":"Implemented","exampleLabel":"Same component key, different recipe.","exampleFoot":"The comparison explains the fields; the optional authoring lab exercises these operations with separate fixture names.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Scoped substitutions","href":"#substitutions","secondary":true},{"label":"Toolchain substitutions","href":"#toolchain-substitutions","secondary":true}],"keywords":["overlays","yaml",""],"scenario":"Compare the supplier executable with your source build.","readThisAs":"Overlay = replace the instructions behind the name app-cli.","result":"Replacement preserves the key; catalog placement determines its scope.","commonMisconception":"An overlay is not automatically global. Its scope depends on which catalog reference includes it.","advancedExample":{"label":"Inside supplier.json — display as YAML for readability","language":"yaml","code":"apiVersion: nvkr.dev/catalog-overlay/v3\nkind: CatalogOverlay\nname: supplier-app-cli\nrequiresCatalogDigest: <exact base catalog digest>\ncomponents:\n  app-cli:\n    version: 1.0.0\n    sourceDateEpoch: 1735689600\n    prebuilt:\n      url: https://authoring.example.invalid/supplier/app-cli.sh\n      digests:\n        amd64: <exact supplier file digest>\n        arm64: <exact supplier file digest>\n      evidence: {none: true}","note":"Schema illustration with explicit digest placeholders. The optional authoring lab calculates complete overlays for its separate fixture names."},"sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"substitutions","title":"Replacement scope","oneSentence":"Choose whether a replacement affects both outputs, only one output, or just one component selection.","why":"The YAML location makes the scope of your change visible.","badge":"implemented","sourcePaths":["docs/catalogs-and-components.md","docs/user-concepts.md"],"exampleLanguage":"yaml","example":"Default-catalog overlay → both bundles change\nAdmin-only catalog      → admin-bundle changes\nSelect app-cli-alt      → client-bundle changes","explanation":["A default-stack overlay replaces app-cli for both outputs that use that stack.","A complete catalog stack on admin-bundle scopes that replacement to the admin output. It does not inherit the default stack.","Changing client-bundle.components to app-cli-alt selects another existing producer. It leaves the original app-cli recipe unchanged."],"group":"compose","slide":5,"displayBadge":"Implemented","exampleLabel":"Illustrative catalog example · selected fields","exampleFoot":"All three comparisons start from the original Definition.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Catalog overlays","href":"#overlays","secondary":true},{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true}],"keywords":["substitutions","yaml",""],"scenario":"Choose which deliverables receive a changed producer.","readThisAs":"Replace a recipe, or select a different key. The edit location determines affected outputs.","result":"Compare each edit with the same baseline.","commonMisconception":"Selecting app-cli-alt is not an overlay. It chooses a different existing catalog entry.","sourceNote":"Teaching examples use the names in the catalog user guide. The optional authoring lab uses separate fixture names."},{"id":"toolchain-substitutions","title":"Toolchain substitutions","oneSentence":"A toolchain substitution changes the container used to build selected components.","why":"Move a reviewed build tool image without rewriting those components’ source-build instructions.","badge":"implemented","sourcePaths":["definitions/nvke-m2/native-toolchains.yaml","pkg/nvkr/catalog/stack.go","pkg/nvkr/catalog/stack_test.go"],"exampleLanguage":"text","example":"Producer overlay\n  app-cli: source build → supplier executable\n\nToolchain substitution\n  same source + same build command\n  old build-container digest → new digest\n\nSelect the architecture and component keys explicitly.","explanation":["A whole-producer overlay replaces the complete recipe. A toolchain substitution changes the pinned build container for listed source producers.","The substitution specifies the architecture, expected old image, new image, and exact component keys. Each selected producer must match the old image.","Changing the toolchain changes selected build inputs and their Build Digests. The maintained NVKE OS overlay supplies a concrete example."],"group":"compose","slide":5,"displayBadge":"Implemented","exampleLabel":"Contrast with the app-cli overlay; toolchain substitution is a separate, narrower operation.","exampleFoot":"The toolchain comparison is illustrative; definitions/nvke-m2/native-toolchains.yaml is a maintained example.","actions":[{"label":"OS images","href":"#os-images","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"keywords":["toolchain-substitutions","yaml",""],"scenario":"Upgrade the build tool without rewriting the source command.","readThisAs":"“For these components on this architecture, replace this exact build image.”","result":"Only the declared image pins are substituted; matching old pins are checked first.","commonMisconception":"This field does not perform general YAML merging or accept a wildcard component list.","secondaryExample":{"label":"Technical example · Toolchain substitutions","language":"yaml","code":"# Exact ARM64 entry from the maintained M2 overlay\ntoolchainSubstitutions:\n  - arch: arm64\n    from: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51\n    to: ghcr.io/dsx-ai-factory/nvkr/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db\n    components:\n      - nvke-agent\n      - nvke-cni-calico\n      - nvke-cni-ovn\n      - nvke-image-inputs\n      - nvke-kubeadm-distro\n      - nvke-node-image\n      - nvke-patched-installer-iso\n      - nvke-spire-agent\n      - ovn-kubernetes-chart","note":"Exact ARM64 entry; containing overlay header and its AMD64 entry are omitted."},"sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"version-stamps","title":"Version stamps","oneSentence":"Version stamps put information from the pinned source into a program’s build inputs.","why":"A program can report the release and source commit it was built from.","badge":"implemented","sourcePaths":["definitions/nvke-v1/catalog/registry.yaml","definitions/nvke-v1/catalog/pins.lock.yaml","pkg/nvkr/catalog/nvkev1_stamp_test.go","docs/adr/0022-catalog-pinning-and-the-lock-contract.md"],"exampleLanguage":"yaml","example":"# NVKE CLI producer: real template fields\nversionStamp:\n  NVKECTL_COMMIT: '{{slice .Commit 0 8}}'\n  NVKECTL_VERSION: '{{.ModuleTag}}'\n\n# Rendered from the maintained source pin:\n# NVKECTL_COMMIT  = ed9fb09b\n# NVKECTL_VERSION = v0.1.0-rc.2","explanation":[".Commit and .ModuleTag come from the source pin. slice .Commit 0 8 produces the short commit. .ModuleTag removes the cli/ prefix from cli/v0.1.0-rc.2, keeping v0.1.0-rc.2.","The nvkectl build command passes these values into Go linker flags, so the executable embeds its build version.","This substitutes values in producer inputs. It does not change the selected component or apply a catalog overlay."],"group":"compose","slide":4,"displayBadge":"Implemented","exampleLabel":"A small real NVKE example: template on top, resulting values below.","exampleFoot":"Exact maintained producer excerpt plus values derived from its current lock.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Component producers","href":"#producers","secondary":true}],"keywords":["version-stamps","yaml",""],"scenario":"The shipped CLI should identify the source release used to build it.","readThisAs":"“Fill these build variables from the source we already pinned.”","result":"Version fields are traceable to recorded source inputs.","commonMisconception":"A version stamp differs from a producer replacement or selecting app-cli-alt.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"helm-bindings","title":"Helm image bindings","oneSentence":"A Helm binding puts the built image’s exact digest into the chart that uses it.","why":"Keep the chart and image connected without requiring the installer to guess which image belongs to the release.","badge":"implemented","sourcePaths":["definitions/nvke-v1/definition.yaml","definitions/nvke-v1/catalog/registry.yaml","docs/declarative-helm-bindings.md","pkg/nvkr/definition/helm_test.go"],"exampleLanguage":"yaml","example":"# Definition output — choose which image output fills the slot\nhelm:\n  images:\n    controller: cwe\n\n# Catalog’s chart producer — choose where that digest is written\nhelm:\n  images:\n    controller:\n      values:\n        digest: image.digest","explanation":["In the Definition, controller: cwe means “the chart’s controller slot uses the image from the cwe output.”","In the catalog, digest: image.digest means “write that image digest into the chart value at image.digest.” NVKR packages the image before binding the chart.","The image’s content identity is fixed in the chart. A downstream installer can supply the registry repository where that image is available. Normal Helm overrides still apply."],"group":"compose","slide":9,"displayBadge":"Implemented","exampleLabel":"Excerpts from two different files. controller identifies the same image slot in both.","exampleFoot":"Two excerpts from the maintained Definition and catalog; they belong in different files.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Producer & artifact graphs","href":"#graphs","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"keywords":["helm-bindings","yaml",""],"scenario":"Our product ships both a controller image and its Helm chart.","readThisAs":"Definition chooses WHICH image. Catalog chooses WHERE its digest goes.","result":"The packaged chart refers to the exact image selected for it.","commonMisconception":"The slot name controller, output name cwe and values path image.digest serve different purposes; they need not have the same text.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"maintenance","title":"Catalog maintenance","oneSentence":"Catalog maintenance previews input updates and can regenerate the matching pipeline for review.","why":"A pin change and its generated CI changes should be reviewed together.","badge":"implemented","sourcePaths":["docs/catalog-maintenance.md","docs/examples/catalog-maintenance/nvke-deploy.yaml","pkg/nvkr/catalogmaintenance/refresh_test.go"],"exampleLanguage":"text","example":"1. Preview\n   Find allowed upstream changes. Write no lock or bundle.\n\n2. Apply in a scratch checkout\n   Update the lock. Regenerate and check the pipeline.\n\n3. Review\n   Inspect the pin changes and matching generated files.","explanation":["Maintenance follows the source version policy already in the catalog. It does not silently broaden a fixed version constraint.","The preview reports possible pin changes. Apply updates the lock, then regenerates and checks the Run bundle. These are separate file transactions, so a failure remains an error to investigate.","The optional GitHub maintenance workflow produces a candidate patch for review. It does not automatically publish a pull request."],"group":"compose","slide":5,"displayBadge":"Implemented","exampleLabel":"Preview, apply and review; expand the technical example below for commands.","exampleFoot":"Maintenance produces proposed input and generated-file changes for review.","actions":[{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true},{"label":"The generated CI bundle","href":"#pipeline","secondary":true}],"keywords":["maintenance","shell",""],"scenario":"A newer allowed upstream release is available.","readThisAs":"“Show the update, produce matching CI, then let us review the candidate.”","result":"Reviewable pin and generated-file changes, with a successful check required before use.","commonMisconception":"A preview is not a completed build or a newly published release.","secondaryExample":{"label":"Technical example · Catalog maintenance","language":"shell","code":"bin/nvkr catalog refresh \\\n  --config docs/examples/catalog-maintenance/nvke-deploy.yaml \\\n  --check --json\n\n# Render a maintenance workflow for review:\nbin/nvkr catalog update-ci \\\n  --config docs/examples/catalog-maintenance/nvke-deploy.yaml \\\n  > /tmp/nvke-catalog-maintenance.yml","note":"Preview and workflow rendering require source access and matching generator identity. Rendering does not install or schedule a workflow."},"sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"plan","title":"The generated Plan","oneSentence":"A Plan is NVKR’ generated list of what to produce, which inputs to use and which steps must follow.","why":"Review the work before spending time on a build.","badge":"CLI exercised","sourcePaths":["docs/plan-and-graph-inspection.md","demos/team-guide.md"],"exampleLanguage":"sh","example":"bin/nvkr run plan \\\n  --definition definitions/nvke-v1/definition.yaml \\\n  --environment definitions/nvke-v1/environment-github.yaml \\\n  --json > /tmp/nvkr-team-plan.json\n\nbin/nvkr run plan --plan /tmp/nvkr-team-plan.json --pretty","explanation":["The Definition says what must ship. The Environment supplies execution and publication settings. NVKR combines them with the pinned catalog inputs to create the Plan.","For each output, the Plan records the producer instructions and the later inspection, packaging, signing and publication steps that apply.","The Plan is the saved record; a graph is a picture drawn from it. Creating either does not run a build."],"group":"execute","slide":6,"displayBadge":"Cli exercised","exampleLabel":"Create a Plan for the small NVKE example, then display it","exampleFoot":"Command excerpt. Supply the exact input paths and references required by your environment.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Producer & artifact graphs","href":"#graphs","secondary":true},{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true}],"keywords":["plan","sh",""],"scenario":"You want the NVKE command-line tool, container image and Helm chart. Before running anything, check how NVKR will produce them.","readThisAs":"Use this Definition and Environment to calculate the work. Save that exact Plan, then show a readable version.","result":"You can inspect the chosen source versions, build commands, dependencies and required outputs before execution.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"graphs","title":"Producer & artifact graphs","oneSentence":"A graph turns the Plan into connected steps so you can see what depends on what.","why":"Find why a build must wait for another result, or trace the inputs to an OS image.","badge":"CLI exercised","sourcePaths":["docs/plan-and-graph-inspection.md"],"exampleLanguage":"sh","example":"bin/nvkr run graph --plan /tmp/nvkr-team-plan.json \\\n  --view producers --format mermaid\n\nbin/nvkr run graph --plan /tmp/nvkr-team-plan.json \\\n  --view artifacts --format dot\n\nbin/nvkr run graph --plan /tmp/nvkr-team-plan.json \\\n  --view complete --format json","explanation":["Start with the producer view for source downloads, build commands and materials. For an OS image, these include packages and other inputs consumed by Packer.","Use the artifact view for results moving between operations: a built image feeds chart packaging; an observed binary feeds a dependency scan.","The complete view links both. Mermaid and DOT are diagram formats; JSON is structured data. They display the same planned work, not proof that it finished."],"group":"execute","slide":6,"displayBadge":"Cli exercised","exampleLabel":"Draw the producer, artifact or complete view of the same saved Plan","exampleFoot":"Command excerpt. Supply the exact input paths and references required by your environment.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"The generated Plan","href":"#plan","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"quiz":{"prompt":"Which question are you asking?","choices":[{"label":"How is it built?","result":"Choose the producer view for source, instructions and material dependencies."},{"label":"How do bytes move?","result":"Choose the artifact view for operation inputs/outputs, output slots and publication routes."},{"label":"How does it connect?","result":"Choose the complete view to join producer instructions with operation and artifact relationships."}]},"keywords":["graphs","sh",""],"scenario":"The controller chart needs the final container-image digest before NVKR can package the chart. Where does that dependency appear?","readThisAs":"Producer view: how is it made? Artifact view: which results feed later steps? Complete view: how do both connect?","result":"Following the chart’s dependency reveals that its package must wait for the image result.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"plan-diff","title":"Semantic Plan diffs","oneSentence":"Plan comparison tells you which outputs and settings changed between two versions.","why":"Understand the effect of a source update or registry move without reading a huge file diff.","badge":"Contract-tested","sourcePaths":["docs/plan-and-graph-inspection.md","pkg/nvkr/planview"],"exampleLanguage":"sh","example":"bin/nvkr run diff \\\n  --before before-plan.json --after after-plan.json\n\n# Show every changed field; useful after reviewing the summary.\nbin/nvkr run diff \\\n  --before before-plan.json --after after-plan.json --details","explanation":["A new source commit, compiler image or build command changes the affected Build Digest: the fingerprint of its build inputs and instructions.","Moving publication to another registry can change the Plan while leaving that Build Digest unchanged, because the build inputs stayed the same.","Use run diff to explain two Plans. Use run generate --check to confirm that all generated files still match the authored inputs."],"group":"execute","slide":6,"displayBadge":"Contract-tested","exampleLabel":"Compare saved Plans before and after a reviewed input change","exampleFoot":"Command excerpt. Supply the exact input paths and references required by your environment.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"quiz":{"prompt":"What did you change?","choices":[{"label":"Source commit","result":"The affected logical Build Digests change; the complete Plan also changes."},{"label":"Registry destination","result":"Transport and Plan settings change. With the same selected producer graph, Build Digests can remain unchanged."}]},"keywords":["plan-diff","sh",""],"scenario":"You changed one source pin. You want to know which deliverables now have different build inputs.","readThisAs":"Compare the old Plan with the new one, group changes by named output, then use --details when you need every changed field.","result":"You can separate a change to what gets built from a change to where or how the build runs.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"generators","title":"Generator adapters","oneSentence":"A generator adapter writes the workflow files for a supported automation system.","why":"Describe the product once, then generate the pipeline that builds it.","badge":"implemented","sourcePaths":["pkg/nvkr/factory/generate.go","docs/adr/0018-pipeline-ir-and-ci-adapter-emission.md","docs/adr/0021-generated-pipeline-maintenance-and-lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"shell","example":"bin/nvkr run generate \\\n  --definition definitions/nvke-v1/definition.yaml \\\n  --environment definitions/nvke-v1/environment-github.yaml \\\n  --engine github --root \"$SCRATCH\"\n\n# Repeat exactly to check generated bytes:\nbin/nvkr run generate \\\n  --definition definitions/nvke-v1/definition.yaml \\\n  --environment definitions/nvke-v1/environment-github.yaml \\\n  --engine github --root \"$SCRATCH\" --check","explanation":["The generator translates NVKR’ planned work into GitHub Actions jobs and dependencies.","A builder is different: it is the mechanism that makes component bytes, such as BuildKit for a container image or Packer for an OS image.","GitHub is the maintained hosted adapter. Unsupported provider requests are rejected before generation."],"miniDemo":[{"label":"Generated-file drift","before":"Workflow matches the reviewed inputs","after":"A generated workflow byte is edited","effect":"The matching --check command fails instead of silently accepting the change."}],"group":"execute","slide":7,"displayBadge":"Implemented","exampleLabel":"Generate a GitHub Actions workflow; repeat with --check to detect edits","exampleFoot":"Use a new scratch workspace to inspect the generated bundle before adopting its files.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"The generated CI bundle","href":"#pipeline","secondary":true},{"label":"Builder types","href":"#builders","secondary":true}],"scope":"The maintained hosted adapter is GitHub. GitLab, Tekton and Argo are unavailable; AICR accelerated-runtime rendering was removed and remains deferred.","scopeTitle":"Current adapter support","keywords":["generators","shell",""],"scenario":"Your team uses GitHub Actions. Instead of maintaining a separate build workflow by hand, you want it generated from the same inputs you just inspected.","readThisAs":"Generate the workflow into a scratch directory. Repeat with --check to confirm the generated bytes still match.","result":"The output is a GitHub Actions workflow and its supporting Plan and manifest; generation itself starts no jobs.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"pipeline","title":"The generated CI bundle","oneSentence":"The generated pipeline bundle contains the workflow, its Plan and a file list with exact fingerprints.","why":"Keep automation in sync with the product definition, and catch hand-edited generated files.","badge":"Generated and hosted-exercised","sourcePaths":["docs/adr/0018-pipeline-ir-and-ci-adapter-emission.md","docs/adr/0021-generated-pipeline-maintenance-and-lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"text","example":"Authored\n  definition.yaml\n  environment-github.yaml\n  catalog/registry.yaml + pins.lock.yaml\n\nGenerated\n  .github/workflows/nvkr-run.yml\n  .github/nvkr-run/plan.json\n  .github/nvkr-run/manifest.json\n\nCheck\n  Repeat run generate with the same inputs + --check","explanation":["The workflow file tells GitHub Actions which jobs to run. The Plan records the exact work those jobs execute.","The manifest lists generated paths and their hashes, which are fingerprints of file contents. It also records the Plan and workflow digests.","Generating again with the same inputs and generator must reproduce the same bytes. Make intended changes in the authored inputs, then regenerate."],"group":"execute","slide":7,"displayBadge":"Generated and hosted-exercised","exampleLabel":"The three generated files and the authored inputs that produce them","exampleFoot":"The manifest owns exact generated paths. Regenerate the bundle from authored inputs instead of editing those paths by hand.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Generator adapters","href":"#generators","secondary":true},{"label":"Runs & completeness","href":"#execution","secondary":true}],"keywords":["pipeline","text",""],"scenario":"Someone changes the generated workflow directly. You want the normal check to catch that before the altered workflow runs.","readThisAs":"Edit the Definition, Environment or catalog inputs; regenerate the workflow and Plan; use the manifest and --check to detect drift.","result":"The matching --check command fails if required generated files are missing, changed or unexpectedly added.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"builders","title":"Builder types","oneSentence":"A builder is the tool or execution method used to make a selected component.","why":"Use the right build process for a program, container image or virtual-machine disk.","badge":"Current implementation boundary","sourcePaths":["pkg/nvkr/catalog/types.go","docs/adr/0010-pluggable-builder-types.md","docs/adr/reconciliation.md","pkg/nvkr/pipeline/local_build.go","pkg/nvkr/pipeline/execution_identity.go","pkg/nvkr/buildgraph/nix_test.go"],"exampleLanguage":"text","example":"oci-hermetic       Run a command in a pinned toolchain container\nbuildkit-rootless  Build a container image with BuildKit\nvm-image           Build a virtual-machine disk with Packer\nnix                Run a locked Nix build in a pinned container","explanation":["oci-hermetic runs a declared command in a pinned toolchain container. buildkit-rootless runs the container-image builder BuildKit. vm-image uses a source-owned Packer project to produce a disk.","nix uses a locked flake in a pinned container. Qualified realized-input observation remains unavailable.","The builder answers how to make a component. The output format answers what deliverable to package. Current disk execution produces unencrypted QCOW2, a virtual-machine disk format."],"group":"execute","slide":7,"displayBadge":"Current implementation boundary","exampleLabel":"Builder names describe how bytes are made; the output chooses how they are packaged","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"OS images","href":"#os-images","secondary":true},{"label":"Component producers","href":"#producers","secondary":true}],"keywords":["builders","text",""],"scenario":"NVKE needs several deliverable types: a command-line program, container images, charts and operating-system disks. Their build tools differ.","readThisAs":"Use BuildKit to build a container image, or Packer to build a virtual-machine disk. The generator arranges the workflow that invokes those builders.","result":"Different kinds of components can participate in one Plan while retaining their own explicit inputs and requirements.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"execution","title":"Runs & completeness","oneSentence":"A Run records one attempt to produce every output promised by the Definition.","why":"Know whether the whole requested result was produced, not just whether a few jobs turned green.","badge":"Local execution exercised","sourcePaths":["docs/lifecycle.md","pkg/nvkr/factory","demos/quickstart/README.md"],"exampleLanguage":"text","example":"Definition requires:  client-bundle + admin-bundle\nRun observes:         client-bundle + admin-bundle\nResult:               both named outputs accounted for\n\nIf admin-bundle is missing, the Run is incomplete.\nA matching Build Digest does not replace that observation.","explanation":["Before execution, NVKR fixes the expected output names and their build inputs. During execution it records the actual produced contents and required evidence.","Completion requires those observations to match the expected outputs. One successful output cannot stand in for a missing output, even when their Build Digests match.","A dry-run only describes work: it remains pending with zero observed outputs. If no final Run record exists, check the workflow status rather than assuming success."],"group":"execute","slide":8,"displayBadge":"Local execution exercised","exampleLabel":"Completeness is checked for each named output","exampleFoot":"Illustrative comparison of required and observed outputs; actual Run records also bind content identities and required evidence.","actions":[{"label":"Try a local execution ↗","href":"demo-team-walkthrough.html#execute"},{"label":"Evidence lanes","href":"#evidence-lanes","secondary":true}],"keywords":["execution","text",""],"scenario":"One attempt must deliver every output selected by the Definition.","readThisAs":"Compare the fixed required outputs with what this attempt actually observed.","result":"Completion means every exact named output satisfies the Run’s requirements.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"artifacts","title":"Artifacts & identities","oneSentence":"An artifact is an actual deliverable; a Build Digest identifies the inputs and instructions used to produce it.","why":"Tell a change in build intent from a change in the delivered bytes.","badge":"Recorded candidate","sourcePaths":["docs/lifecycle.md"],"exampleLanguage":"json","example":"{\n  \"name\": \"nvkectl\",\n  \"buildDigest\": \"sha256:7063593683d83bff157ae87d93f9c66a115361ed8b888c5ca973d87d5cf1b6b2\",\n  \"manifestDigest\": \"sha256:d169456744fbef687739caa4f317079d44995c6c2a7083b68dc48f17be1d0778\",\n  \"buildSubjectDigest\": \"sha256:eeb21f04fb79f9276f571c51f8e8155c5f3e5bdd698493e4262b0c8eef75a28d\"\n}","explanation":["A catalog component declares how to build or acquire something. An output is a named deliverable the Definition requires. The artifact is the concrete result that is produced; it may later be published.","A digest is a content fingerprint. The Build Digest is calculated from build inputs and instructions before execution; it does not tell you the eventual file checksum.","The artifact manifest is a registry document listing the package’s contents. Its digest differs from the disk payload digest, which identifies the exact QCOW2 file. The release root has another digest because it lists the release’s artifacts and evidence."],"group":"execute","slide":10,"displayBadge":"Recorded candidate","exampleLabel":"An executable, its package and its build inputs","exampleFoot":"Exact values from Run 37736529644’s v4 CLI publication browse view. manifestDigest and buildSubjectDigest are explanatory display labels.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Release navigation","href":"#browse","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"keywords":["artifacts","json",""],"scenario":"Compare the selected build instructions, published package, and executable inside that package.","readThisAs":"Build Digest identifies the production inputs; manifest digest identifies the OCI package; build-subject digest identifies the executable bytes.","result":"These identities answer different questions and should not be substituted for one another.","sourceNote":"Read from current v4 CLI publication metadata, not inferred from names or tags."},{"id":"os-images","title":"OS images","oneSentence":"An OS-image output produces a disk from an explicit set of installer, package and component inputs.","why":"Trace what went into the disk and see the hardware needed to build it.","badge":"Run 37736529644 · native ARM64 and AMD64 builds","sourcePaths":["docs/adr/reconciliation.md","definitions/nvke-m2/environment-github.yaml"],"exampleLanguage":"yaml","example":"githubARC: native-kvm-v1\ndiskEvidence: build-provenance-v1\nexecutionClasses:\n  - name: arc-arm64-kvm\n    runsOn: arc-arm64-kvm\n    hostPlatform: linux/arm64\n    resources:\n      cpuMillis: 8000\n      memoryMiB: 36864\n      ephemeralStorageMiB: 229376\n    maxTimeoutSeconds: 21600\n    capabilities: [kvm]","explanation":["The output selects one disk-producing component and all of its required material components. Follow those material links in the Plan to see what Packer consumes.","ARM64 and AMD64 are distinct processor architectures. The named runner must match the selected route and supply the required resources and Kernel-based Virtual Machine (KVM) capability.","build-provenance-v1 describes disk production and materials. It does not establish a complete native disk inventory, full-disk encryption or qualified reproduction."],"group":"execute","slide":9,"displayBadge":"Run 37736529644 · native ARM64 and AMD64 builds","exampleLabel":"Excerpt of the Environment for a native ARM64 disk build","exampleFoot":"Command excerpt. Supply the exact input paths and references required by your environment.","actions":[{"label":"Follow the OS material graph ↗","href":"demo-team-explorer.html#plan/nke-node-image-arm64"},{"label":"Toolchain substitutions","href":"#toolchain-substitutions","secondary":true},{"label":"Release navigation","href":"#browse","secondary":true}],"scope":"Both disk outputs use build-provenance-v1. Deep disk inspection, a full disk SBOM, FDE and qualified reproduction are outside this candidate’s claim.","scopeTitle":"This candidate’s disk evidence","keywords":["os-images","yaml",""],"scenario":"The team wants to inspect the ARM64 NVKE disk and compare it with the AMD64 disk from the same recorded release.","readThisAs":"Use the named ARM64 runner with its declared resources and KVM hardware virtualization. Publish build provenance while deeper disk inspection remains deferred.","result":"Run 37736529644 completed both native QCOW2 builds. The final publication metadata records the disk checksums, sizes and material evidence.","sourceNote":"Native builds: Run 37736529644 at commit 105bb738521c9dbd7f1326ab15e78a699200f4f1. Publication and browsing status are recorded in the walkthrough; a completed build alone does not establish release acceptance."},{"id":"evidence-lanes","title":"Evidence lanes","oneSentence":"An evidence lane says which kind of claim a Run is allowed to make.","why":"Avoid mistaking a preview, a signed build and proof of exact reproduction for the same result.","badge":"Current supported scope","sourcePaths":["docs/lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"text","example":"static-unqualified   Preview or diagnostic description\npipeline-attested    Recorded hosted production evidence\nqualified            Requires stronger proof, including exact-byte reproduction","explanation":["static-unqualified is used for dry-run and diagnostic descriptions. A preview does not contain observed output results.","pipeline-attested binds signed production evidence to a hosted workflow and its exact published contents.","qualified requires stronger reproduction and authentication checks. Current full-release and qualified consumer acceptance remain unavailable; the supported consumer scope is pipeline-attested / artifact-publication."],"group":"trust","slide":13,"displayBadge":"Current supported scope","exampleLabel":"Three labels, with the different claims they describe","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Verification policy","href":"#verification","secondary":true},{"label":"Current capabilities","href":"#capabilities","secondary":true}],"keywords":["evidence-lanes","text",""],"scenario":"You first preview a Plan, then inspect a successful signed workflow. What stronger statement can you make after each step?","readThisAs":"A dry-run describes work. pipeline-attested records hosted production evidence. qualified requires additional proof, including exact-byte reproduction.","result":"The lane identifies the claim being made and the evidence needed to support it.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"sbom","title":"Dependency SBOMs","oneSentence":"A software bill of materials (SBOM) lists the software found in a particular artifact.","why":"Answer “What packages and dependencies are in this deliverable?” with a record tied to its exact contents.","badge":"Recorded signed evidence","sourcePaths":["docs/dependency-sboms.md","docs/publication-architecture.md"],"exampleLanguage":"text","example":"CLI binary          Compiled Go modules and recognized packages\nContainer image     Installed OS and application dependencies\nHelm source         Chart declarations and references\nFinal bound chart   Delivered archive after image-digest binding","explanation":["Supported binary and image routes use the pinned Syft scanner. Charts use a reader for their dependency declarations; local structural records carry a narrower claim.","Hosted workflows can publish CycloneDX inventories in signed attestations bound to exact subjects.","A chart’s declarations do not scan its referenced images. Disk build provenance does not establish a complete disk inventory."],"group":"trust","slide":12,"displayBadge":"Recorded signed evidence","exampleLabel":"Different deliverables need different inventory inputs","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Production provenance","href":"#provenance","secondary":true},{"label":"Signing & attestations","href":"#signing","secondary":true}],"keywords":["sbom","text",""],"scenario":"You want to compare the dependencies in the NVKE program, its container image and its packaged chart.","readThisAs":"Inspect the binary for embedded dependencies, the image for installed packages, and the chart for its declared chart dependencies and references.","result":"Each inventory identifies the artifact and stage it describes, so you can tell which delivered bytes it covers.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"provenance","title":"Production provenance","oneSentence":"Production provenance records how an artifact was made and which workflow produced it.","why":"Check whether a deliverable came from the expected build process.","badge":"Recorded v4 CLI publication","sourcePaths":["docs/publication-architecture.md"],"exampleLanguage":"json","example":"{\n  \"predicateType\": \"https://slsa.dev/provenance/v1\",\n  \"cosignVersion\": \"v3.1.3\",\n  \"observedIssuer\": \"https://token.actions.githubusercontent.com\",\n  \"observedIdentity\": \"https://github.com/dsx-ai-factory/nvkr/.github/workflows/nvkr-run.yml@refs/heads/main\"\n}","explanation":["Provenance describes how the artifact was produced. An SBOM describes its software contents. A signature authenticates the statement’s signer.","Generated GitHub workflows emit SLSA provenance v1. GitHub supplies the signing workflow’s identity through OIDC.","The maintained policy selects the main-branch workflow. A different branch identity needs its own explicit consumer policy; inspection does not make it acceptable."],"group":"trust","slide":12,"displayBadge":"Recorded v4 CLI publication","exampleLabel":"Signer identity and provenance statement type","exampleFoot":"Verification-record excerpt; this is not the complete SLSA provenance predicate.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Signing & attestations","href":"#signing","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["provenance","json",""],"scenario":"A published artifact must be traceable to the build process your consumer accepts.","readThisAs":"This record identifies a SLSA provenance statement and the main-branch workflow identity that signed it.","result":"The workflow identity and production statement give the consumer something specific to check against its own trust policy.","sourceNote":"Excerpt from Run 37736529644’s hosted output-nvkectl verification record. It records signatureVerified:true, attestationVerified:true and dryRun:false; independent consumer verification is separate."},{"id":"signing","title":"Signing & attestations","oneSentence":"A signature lets a consumer check who signed an exact artifact or statement.","why":"Reject a look-alike artifact or a build from an identity your team does not trust.","badge":"Workflow verification recorded","sourcePaths":["pkg/nvkr/sign/oci.go","docs/publication-architecture.md"],"exampleLanguage":"sh","example":"# Commands run by the generated workflow, shown for explanation:\ncosign sign --yes --new-bundle-format \"$ARTIFACT_REF\"\ncosign attest --yes --new-bundle-format \\\n  --type slsaprovenance1 --predicate \"$PREDICATE\" \"$ARTIFACT_REF\"","explanation":["NVKR invokes its pinned cosign tool from the admitted GitHub workflow. Its keyless identity names that workflow and its OIDC issuer.","An attestation is a signed statement about an exact subject. Provenance describes production; an SBOM describes software contents.","A signature authenticates the signer’s statement. It does not claim ownership of the software. The consumer still chooses which identities and evidence to accept."],"group":"trust","slide":12,"displayBadge":"Workflow verification recorded","exampleLabel":"Commands used by the generated signing step, shown for explanation","exampleFoot":"The generated workflow supplies the pinned cosign tool, identity, credentials and exact artifact references.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Verification policy","href":"#verification","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"quiz":{"prompt":"What does this evidence establish?","choices":[{"label":"Signature","result":"An authenticated signer bound to an exact subject, when the signature and policy checks pass."},{"label":"Provenance","result":"A signed production statement about the subject, workflow and inputs; the consumer must authenticate and evaluate it."},{"label":"SBOM","result":"An inventory for an exact subject and stage. Its signature does not turn it into a deployment or security-clearance verdict."}]},"keywords":["signing","sh",""],"scenario":"A container registry has an artifact at the expected name. You also need to establish which workflow signed its exact content.","readThisAs":"The first command signs the artifact reference. The second signs a production-provenance statement about that same artifact.","result":"A verifiable statement about exact bytes from an identified workflow.","sourceNote":"Use the recorded Run for actual signer and verification results. Browsing alone does not verify signatures."},{"id":"release","title":"Release publication","oneSentence":"A Release provides one immutable starting point for a named collection of artifacts and their evidence.","why":"Find the matching program, image, chart and OS disks without guessing tags or searching unrelated registry entries.","badge":"Publication model","sourcePaths":["docs/publication-architecture.md"],"exampleLanguage":"text","example":"…/releases@sha256:…\n  ├─ controller-chart@sha256:… → chart + final-package evidence\n  ├─ cwe@sha256:…              → native image + evidence\n  ├─ nvkectl@sha256:…           → executable bundle + evidence\n  └─ nvke-node-image-arm64@sha256:… → QCOW2 + material evidence","explanation":["NVKR publishes through the Open Container Initiative (OCI) registry format, which can store images and other artifact types. The release root is an index pointing to metadata that lists exact outputs and evidence.","The actual image, executable, chart or disk lives in its own output repository. The release entry points to it; it does not contain another copy of every large file.","In per-output publication mode, outputs are published and checked individually before combined release metadata is assembled."],"group":"trust","slide":10,"displayBadge":"Publication model","exampleLabel":"A multi-output release connects independently addressable artifacts","exampleFoot":"Schematic relationship; consult the captured release view for exact outputs, counts and identities.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Release navigation","href":"#browse","secondary":true},{"label":"Signing & attestations","href":"#signing","secondary":true}],"keywords":["release","text",""],"scenario":"You have a release reference and want the ARM64 disk plus the evidence attached to it.","readThisAs":"Start at the release entry, choose the named output, then follow its exact artifact reference and evidence links.","result":"One release reference identifies a consistent published set while each deliverable remains independently addressable.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"browse","title":"Release navigation","oneSentence":"Release browsing shows what was published and how its outputs and evidence are connected.","why":"Explore an OS-image release without downloading its multi-gigabyte disk files.","badge":"Current v4 CLI metadata inspected","sourcePaths":["docs/release-navigation.md"],"exampleLanguage":"sh","example":"nvkr release browse --reference \"$RELEASE_REF\"\n\nnvkr release browse --reference \"$RELEASE_REF\" \\\n  --output \"$OUTPUT_NAME\" --format mermaid","explanation":["The command reads metadata and evidence documents, checks their integrity and relationships, then applies your output filter.","It can display text, structured JSON data or a Mermaid diagram. The HTML explorer presents the saved JSON as a clickable graph.","Browsing does not check the actual payload bytes, signatures or consumer policy. Use verification when you need to accept a supported trust claim."],"group":"trust","slide":11,"displayBadge":"Current v4 CLI metadata inspected","exampleLabel":"Inspect a publication, then focus one output","exampleFoot":"Use the exact digest-pinned publication reference emitted by the Run and an output name present in that publication. Current readers require publication-root v4; historical v3 releases need their matching historical CLI.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Browse a real publication ↗","href":"demo-team-walkthrough.html#release"},{"label":"Verification policy","href":"#verification","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"scope":"Native inspection label: metadata inspection; payloads, signatures and policy not verified. The HTML graph explorer displays the saved result and does not repeat native validation.","scopeTitle":"What browsing tells you","quiz":{"prompt":"Do you need inspection or acceptance?","choices":[{"label":"Inspect membership","result":"Browse the bounded metadata and evidence graph. No artifact payload layers are needed."},{"label":"Accept an artifact claim","result":"Use verification with an explicit identity, issuer, lane and scope. It performs additional authentication and content checks."}]},"keywords":["browse","sh",""],"scenario":"Find one artifact and its supporting evidence without downloading the artifact’s payload layers.","readThisAs":"Read and validate the publication metadata, then display the requested output.","result":"Inspect output references, metadata and evidence without downloading artifact payloads.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"verification","title":"Verification policy","oneSentence":"Verification checks published contents and signed evidence against the consumer’s explicit trust rules.","why":"Decide whether the release satisfies the claim your team needs before relying on it.","badge":"Supported consumer scope","sourcePaths":["scripts/demo-release-consumer.sh","docs/release-quickstart.md","docs/lifecycle.md"],"exampleLanguage":"sh","example":"nvkr release verify --reference \"$RELEASE_REF\" \\\n  --lane pipeline-attested --scope artifact-publication \\\n  --identity \"$ACCEPTED_BUILD_IDENTITY_REGEXP\" \\\n  --issuer \"$ACCEPTED_OIDC_ISSUER\" \\\n  --cosign \"$COSIGN_PATH\" --cosign-digest \"$COSIGN_DIGEST\"","explanation":["The consumer chooses the accepted workflow identity and OIDC issuer. These are policy inputs, not values to relax until a release passes.","The supported pipeline-attested / artifact-publication scope checks exact published contents with required signatures and production evidence.","Verification requires Linux execution and a digest-pinned static cosign executable. The provided macOS helper supplies that execution environment through a pinned Linux Docker image."],"group":"trust","slide":13,"displayBadge":"Supported artifact-publication scope","exampleLabel":"Verify an exact reference under an accepted workflow identity and evidence scope","exampleFoot":"Public CLI syntax for native Linux verification. The walkthrough also provides the macOS Docker helper.","actions":[{"label":"Signing & attestations","href":"#signing","secondary":true},{"label":"The Go SDK","href":"#sdk","secondary":true}],"scope":"Hosted verification records describe checks made by that workflow. An independent consumer invocation applies its own accepted identity, issuer and scope to the exact publication.","scopeTitle":"Recorded scope","keywords":["verification","sh",""],"scenario":"Your team accepts builds from its protected main-branch workflow. A release signed by another branch must not pass just because its signature is valid.","readThisAs":"For this reference, require pipeline-attested build evidence, verify the artifact-publication scope, and accept only the configured identity and issuer.","result":"Verification either establishes that supported claim under your policy or returns an error.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"sdk","title":"The Go SDK","oneSentence":"The Go software development kit (SDK) lets an application use NVKR’ lifecycle operations directly.","why":"Build NVKR checks into another tool without scripting command output or duplicating verification logic.","badge":"Contract-tested public API","sourcePaths":["client/v1/lifecycle.go","docs/lifecycle.md"],"exampleLanguage":"go","example":"policy := client.VerificationPolicy{\n    Lane: \"pipeline-attested\",\n    Scope: \"artifact-publication\",\n    IdentityRegexp: identity,\n    Issuer: issuer,\n}\nverified, err := c.VerifyRelease(ctx, reference, policy)\nif err != nil { return err }\ndefer verified.Close()\nrelease, err := verified.Description()","explanation":["Configure the client with its tool and registry settings, then pass the reference and Verification Policy to VerifyRelease.","The returned value represents this verification operation. Close it when finished to release the resources it owns.","You can save the description for display, but loading that saved JSON does not repeat verification. The SDK also supports input loading, local runs and pipeline generation."],"group":"trust","slide":14,"displayBadge":"Contract-tested public api","exampleLabel":"Go excerpt: verify with an explicit policy, then read the accepted release description","exampleFoot":"Use client/v1 with configured consumer options; this excerpt is not a standalone program.","actions":[{"label":"The public lifecycle","href":"#lifecycle","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["sdk","go",""],"scenario":"An internal Go tool needs to accept a release only if it matches the team’s build policy.","readThisAs":"Ask the configured client to verify the reference. Handle a failure, keep the successful result open while using it, then close it.","result":"Your application gets a description of the accepted release only after the requested verification succeeds.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"fail-closed","title":"Coded errors","oneSentence":"NVKR returns a named error when required input, evidence or execution support is missing.","why":"Know what needs fixing instead of getting a partial result presented as success.","badge":"Contract-tested and browse negative exercised","sourcePaths":["docs/adr/reconciliation.md","docs/examples/authoring-lab/README.md"],"exampleLanguage":"text","example":"Unknown release output     NVKR-E-USAGE, exit 2, empty stdout\nChanged compared Plan      NVKR-E-DIFF with --exit-code\nGenerated bundle drift     NVKR-E-PIPELINE-DRIFT\nStale overlay predecessor  NVKR-E-UNVERIFIED-REF\nUnsupported capability     NVKR-E-ENGINE-CAPABILITY","explanation":["An unknown release output returns NVKR-E-USAGE with exit status 2 and no result on standard output.","Generated-file drift and stale catalog overlays have their own codes. Fix the matching input or regenerate from reviewed inputs.","Unsupported capability means the requested execution or verification path is unavailable. NVKR does not silently substitute a weaker path."],"group":"trust","slide":8,"displayBadge":"Contract-tested and browse negative exercised","exampleLabel":"Common errors and the condition each one reports","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Catalog overlays","href":"#overlays","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["fail-closed","text",""],"scenario":"You mistype an output name while browsing the release. NVKR should reject the selection rather than show an unrelated output.","readThisAs":"Unknown release output means the selected name was absent; pipeline drift means generated files no longer match their inputs.","result":"The error identifies the failed condition so a person or script can handle it consistently.","sourceNote":"Implementation references are listed below. Recorded examples establish only the scope stated in their source notes."},{"id":"capabilities","title":"Current capabilities","oneSentence":"Use the feature’s recorded scope to tell what you can inspect, execute or trust today.","why":"Choose an operation whose runtime and evidence requirements match your needs.","badge":"Current reconciliation","sourcePaths":["docs/adr/reconciliation.md","docs/adr/0012-criteria-model-and-aicr-activation.md"],"exampleLanguage":"text","example":"Explore now\n  Catalogs, exact pins, replacements and Plan graphs\n  Release metadata, output details and evidence links\n\nExecute with the required environment\n  Local builds and GitHub Actions pipelines\n  G
