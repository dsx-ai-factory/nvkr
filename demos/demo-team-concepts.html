<script id="concept-data" type="application/json">[{"id":"lifecycle","title":"The public lifecycle","oneSentence":"Choose what to deliver, run the work, then publish the results as a release.","why":"Each stage answers a different question: what do we want, what actually happened, and what can someone use?","badge":"Current public contract","sourcePaths":["docs/lifecycle.md","client/v1/lifecycle.go"],"exampleLanguage":"text","example":"Definition  “Deliver diagnostics and tools.”\nRun         “This attempt produced both required outputs.”\nRelease     “Here are the exact outputs and their evidence.”\n\nEnvironment          Where and how the work runs\nArtifact             The delivered file, image or package\nVerification Policy  Which evidence a consumer requires","explanation":["The Definition is the request. In our example, diagnostics contains doctor; tools contains doctor and status.","A Run records one attempt to produce those outputs and what it actually observed. A plan by itself does not show that a build ran.","A Release gives consumers one immutable reference to the selected artifacts and their evidence. The consumer’s Verification Policy decides what evidence is sufficient."],"group":"author","slide":2,"displayBadge":"Current public contract","exampleLabel":"Conceptual lifecycle using two catalog-lab outputs; the execution and release examples use the real NKE candidate.","exampleFoot":"The authoring lab only plans these outputs. This conceptual sequence does not claim it executed a Run or published a Release.","actions":[{"label":"Start with catalogs →","href":"#catalog"}],"keywords":["lifecycle","text",""],"scenario":"We want two deliverables for a support team.","readThisAs":"Definition = requested outputs. Run = observed attempt. Release = published results.","result":"The six objects keep intent, execution and consumer trust distinct.","commonMisconception":"A generated Plan is an inspection record, not another independently authored lifecycle object."},{"id":"catalog","title":"Catalogs","oneSentence":"The catalog lists components you can choose and tells NKD how to obtain each one.","why":"Define doctor once, then reuse it in several outputs.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/catalog/registry.yaml","docs/examples/authoring-lab/definition.yaml","docs/adr/0022-catalog-pinning-and-the-lock-contract.md"],"exampleLanguage":"text","example":"Catalog component     How the base catalog obtains it\n doctor                Build from doctor.sh\n doctor-alt            Build from doctor-alt.sh\n status                Build from status.sh\n\nDefinition output     Components it chooses\n diagnostics           doctor\n tools                 doctor + status","explanation":["A component is a named piece, such as doctor. Its producer is the catalog instruction that builds or downloads that piece.","registry.yaml contains those instructions. pins.lock.yaml records the exact upstream versions and bytes they use. Together they form the catalog.","The Definition chooses components from the catalog. doctor-alt is available here but is unused until an output explicitly selects it."],"group":"author","slide":2,"displayBadge":"Implemented","exampleLabel":"One running example from the maintained local authoring lab.","exampleFoot":"doctor and status are teaching names. The lab uses small shell scripts that print fixture messages; they perform no real health checks.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Sources","href":"#sources","secondary":true},{"label":"Immutable pins","href":"#pinning","secondary":true}],"keywords":["catalog","text",""],"scenario":"Support needs a small diagnostics deliverable and a larger tools deliverable.","readThisAs":"The catalog says what is available. The Definition says what this product will deliver.","result":"Two outputs reuse doctor without duplicating its producer instructions.","commonMisconception":"Adding a component to the catalog does not automatically add it to every output.","secondaryExample":{"label":"Technical example · Catalogs","language":"text","code":"catalog/\n  registry.yaml   # sources + producer instructions\n  pins.lock.yaml  # exact source and acquired-byte pins\n\nDefinition → catalog stack → selected producers","note":"File relationship; the maintained nke-v1 catalog supplies the concrete example."}},{"id":"sources","title":"Sources","oneSentence":"A source names the upstream repository and release used by one or more components.","why":"doctor and status can share the same upstream tools release.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/catalog/registry.yaml","docs/examples/authoring-lab/upstream/versions.yaml"],"exampleLanguage":"yaml","example":"# catalog/registry.yaml — source excerpt\nsources:\n  tools:\n    repo: https://authoring.example.invalid/platform\n    tagPrefix: tools/v\n    pinnedBy: platform\n\n# The doctor and status producers both refer to this source:\n# source: tools","explanation":["The catalog’s tools source points to the repository containing doctor.sh and status.sh. Both producers refer to it by name.","tagPrefix limits this source to tools/v tags. The tools source and the tools output happen to share a name; one identifies upstream code, the other identifies a deliverable.","pinnedBy: platform means the platform release chooses this source’s version through its declared pin set. The lab maps the illustrative URL to a local Git repository."],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Authoring-lab source excerpt; its pinned toolchain field is omitted here.","exampleFoot":"Excerpt from docs/examples/authoring-lab/catalog/registry.yaml. The lab maps the illustrative URL to a local Git repository.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true}],"keywords":["sources","yaml",""],"scenario":"Two programs come from one upstream tools release.","readThisAs":"source: tools = obtain my source files from the catalog’s tools source.","result":"Both producers receive the exact tools source recorded in the lock.","commonMisconception":"A repository URL alone does not choose a release. The source declaration and lock do."},{"id":"producers","title":"Component producers","oneSentence":"A producer is the instruction for turning a component’s inputs into its expected file or image.","why":"NKD can see what must run and which result to check.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/catalog/registry.yaml","docs/examples/authoring-lab/README.md"],"exampleLanguage":"yaml","example":"# catalog/registry.yaml — complete doctor producer\ncomponents:\n  doctor:\n    source: tools\n    fromSource: true\n    platforms: [linux/amd64, linux/arm64]\n    outputType: host-package\n    artifactPath: bin/doctor\n    writeDir: bin\n    buildCommand:\n      - sh\n      - -ec\n      - cp doctor.sh bin/doctor; chmod +x bin/doctor","explanation":["source: tools chooses the already pinned upstream files. fromSource: true says this producer creates the component from those files.","buildCommand is the instruction. artifactPath names the result NKD expects: bin/doctor. The fixture command is deliberately small.","A producer can instead download already built bytes. The overlay example changes doctor from this source producer to a supplier download."],"group":"author","slide":3,"displayBadge":"Implemented","exampleLabel":"Exact producer values from the authoring lab, reformatted for reading.","exampleFoot":"Complete doctor producer values from the authoring lab, formatted for reading. The fixture copies a script; it does not compile a full application.","actions":[{"label":"Builder types","href":"#builders","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"keywords":["producers","yaml",""],"scenario":"The base catalog builds doctor from a script in the tools source.","readThisAs":"“From the tools source, run this command and expect bin/doctor.”","result":"The planned doctor work is a source build.","commonMisconception":"The component name doctor is not the output name diagnostics. An output selects one or more components."},{"id":"definition","title":"Definitions & outputs","oneSentence":"A Definition lists the named outputs that must be delivered and the components each output selects.","why":"Everyone can see exactly what a successful run must produce.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/definition.yaml","docs/adr/0011-composition-and-resolution-semantics.md"],"exampleLanguage":"yaml","example":"# definition.yaml — these two outputs use the same base catalog\ncatalog:\n  base: ./catalog\noutputs:\n  - name: diagnostics\n    components: [doctor]\n    platform: linux/amd64\n    format: executable\n  - name: tools\n    components: [doctor, status]\n    platform: linux/amd64\n    format: executable","explanation":["diagnostics selects only doctor. tools selects doctor and status. These are two separately named deliverables.","Both outputs use the Definition’s top-level catalog because neither declares its own catalog. This default matters when we apply an overlay.","platform and format say which target and package form each output requires. Selecting the same doctor component twice does not make one output’s result automatically satisfy the other."],"group":"author","slide":2,"displayBadge":"Implemented","exampleLabel":"Two complete output entries from the authoring lab; Definition header and other outputs are omitted.","exampleFoot":"Two of the authoring lab’s seven outputs. The Definition header and the other five outputs are omitted.","actions":[{"label":"Catalogs","href":"#catalog","secondary":true},{"label":"Helm image bindings","href":"#helm-bindings","secondary":true}],"keywords":["definition","yaml",""],"scenario":"Build a minimal diagnostic deliverable and a broader tool set.","readThisAs":"diagnostics = doctor; tools = doctor + status.","result":"The Run must account for both named outputs.","commonMisconception":"A list under components chooses catalog entries; it does not redefine their producer instructions."},{"id":"environment","title":"Environments","oneSentence":"An Environment supplies the settings for running, publishing and signing a Definition.","why":"Keep “what should ship” separate from “where and how this attempt runs.”","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/environment.yaml","definitions/nke-v1/environment-github.yaml","docs/lifecycle.md"],"exampleLanguage":"text","example":"Definition                 Environment\n diagnostics = doctor       Runtime and execution settings\n tools = doctor + status    Registry destination, when enabled\n                            Credential references, when needed\n                            Signing identity, when enabled\n\nSame selected producers + different registry destination:\n  Build instructions stay the same; publication settings change.","explanation":["The Definition still chooses doctor and status. The Environment supplies operational settings such as runtime, execution route and publication destination.","The local authoring lab only plans the work. Its small Environment supplies utility execution settings and declares no publication or signing.","A different registry destination changes the complete Plan, but unchanged selected build instructions retain their Build Digests. Credentials are referenced by name, not embedded as secret values."],"miniDemo":[{"label":"Destination change","before":"ghcr.io/team-a/product","after":"registry.example/product","effect":"Publication routes and Plan change; unchanged producer graphs retain their Build Digests."}],"group":"author","slide":2,"displayBadge":"Implemented","exampleLabel":"Field ownership illustrated with our two-output example.","exampleFoot":"Field ownership sketch, not configuration syntax. The technical example below shows real NKE Environment fields.","actions":[{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true},{"label":"Generator adapters","href":"#generators","secondary":true}],"keywords":["environment","yaml",""],"scenario":"Review the same product intent for a local run or a GitHub run.","readThisAs":"Definition = what to make. Environment = how this run will operate.","result":"Operational settings can vary without rewriting component producers.","commonMisconception":"An Environment declaration does not prove a runner actually supplied the requested resources.","secondaryExample":{"label":"Technical example · Environments","language":"yaml","code":"apiVersion: nkd.dev/environment/v1\nkind: Environment\nmetadata:\n  name: nke-github\nruntime:\n  runtime: docker\npublication:\n  credentialRef: github:GITHUB_TOKEN\n  repositoryPrefix: ghcr.io/dsx-ai-factory/nke-recipes\nsourceAccess:\n  https://github.com/dsx-ai-factory/nke:\n    credentialRef: github:NKE_SOURCE_TOKEN\n    mirror: https://github.com/dsx-ai-factory/nke","note":"Environment excerpt; use the complete maintained file for commands."}},{"id":"pinning","title":"Immutable pins","oneSentence":"Pinning records the exact upstream version and content that the next build will use.","why":"Repeated planning starts from recorded inputs instead of following a moving release label.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/run.sh","docs/examples/authoring-lab/README.md","docs/adr/0022-catalog-pinning-and-the-lock-contract.md"],"exampleLanguage":"text","example":"Upstream release label:   tools/v1.0.0\nMachine-managed lock:     exact commit + source tree + timestamp\nComponents using source:      doctor, doctor-alt, status\n\nWhen the app source advances but tools stays at 1.0.0:\n diagnostics = doctor     unchanged Build Digest\n tools = doctor + status  unchanged Build Digest","explanation":["A source release label helps choose a version. The generated lock records its exact commit, tree and source timestamp. Acquired files and images also carry exact content digests.","The lab advances app from 1.0.0 to 1.0.1 while tools remains at 1.0.0. Its CLI and controller outputs change; diagnostics and tools keep the same build inputs.","NKD owns writes to pins.lock.yaml. Use catalog pin or catalog bump to update it. catalog bump --check previews eligible updates without writing the lock or building anything."],"group":"compose","slide":3,"displayBadge":"Implemented","exampleLabel":"The authoring lab’s source-update scenario; identity values are described rather than abbreviated into fake pins.","exampleFoot":"Build Digest means the fingerprint of the selected build inputs and instructions. It is calculated before any artifact is built.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true},{"label":"Catalog maintenance","href":"#maintenance","secondary":true}],"keywords":["pinning","yaml",""],"scenario":"An upstream platform release changes the app but keeps the tools version.","readThisAs":"A pin freezes the chosen input; only outputs whose selected build inputs change get new Build Digests.","result":"diagnostics and tools remain unchanged in this particular source-update scenario.","commonMisconception":"A changed catalog fingerprint does not mean every output’s Build Digest changes.","secondaryExample":{"label":"Technical example · Immutable pins","language":"yaml","code":"# Exact maintained lock excerpt — machine-managed\npins:\n  nke:\n    tag: cli/v0.1.0-rc.2\n    commit: ed9fb09b04fd40bf331d25df2222206ffaca593e\n    treeHash: 309887e8cdb8ee24a39785b864390eda3afce5ec\n    sourceDateEpoch: 1787066575","note":"Exact lock fields from the maintained NKE catalog. Complete pins remain in the source file."}},{"id":"pin-sets","title":"Coordinated pin sets","oneSentence":"A pin set lets one upstream release choose a coordinated list of input versions.","why":"Update the group together and keep the choice traceable to the upstream release.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/upstream/versions.yaml","docs/examples/authoring-lab/catalog/registry.yaml","docs/examples/authoring-lab/run.sh"],"exampleLanguage":"yaml","example":"# Upstream versions.yaml at platform/v1.0.0\ndependencies:\n  - {name: app, version: 1.0.0}\n  - {name: tools, version: 1.0.0}\n\n# Next upstream platform release changes only app:\n# app: 1.0.1\n# tools: 1.0.0","explanation":["The platform release publishes versions.yaml. The catalog explicitly maps its app and tools entries to the corresponding sources.","Pinning platform reads that file from the selected release and updates the platform, app and tools lock records together.","doctor and status use the tools member. Since the demonstrated next release leaves tools at 1.0.0, their selected build inputs do not change. A derived member cannot be bumped independently."],"group":"compose","slide":3,"displayBadge":"Implemented","exampleLabel":"Actual upstream version-file shape from the local authoring lab.","exampleFoot":"Maintained local fixture excerpt; example.invalid is intentionally mapped to a local Git repository by the lab.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Catalog maintenance","href":"#maintenance","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"keywords":["pin-sets","yaml",""],"scenario":"The upstream platform team publishes the versions it selected for a release.","readThisAs":"“Use the app and tools versions declared by this exact platform release.”","result":"One platform pin operation updates the whole declared set or leaves it unchanged on failure.","commonMisconception":"A pin set does not discover dependencies. Its catalog member mappings are explicit.","secondaryExample":{"label":"Catalog field mapping — under sources.platform","language":"yaml","code":"pinSet:\n  file: versions.yaml\n  members:\n    app: {source: app, path: 'dependencies[name=app].version'}\n    tools: {source: tools, path: 'dependencies[name=tools].version'}","note":"Each member source also declares pinnedBy: platform."}},{"id":"overlays","title":"Catalog overlays","oneSentence":"A catalog overlay changes how a component is obtained while keeping its component name.","why":"Use a supplier’s doctor without changing every output’s components list.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/run.sh","docs/examples/authoring-lab/README.md","pkg/nkd/catalog/stack.go"],"exampleLanguage":"text","example":"Before: base catalog’s doctor\n  source: tools → copy doctor.sh → bin/doctor\n\nAfter: supplier overlay’s doctor\n  download the exact supplier file → doctor\n\nThe name stays doctor.\nThe producer changes from source build to download.","explanation":["Our base catalog builds doctor from source. supplier.json replaces that entire doctor producer with a download of exact supplier bytes. The component is still called doctor.","The overlay defines WHAT changes. The Definition decides WHERE that changed catalog is used. Attaching it to the default catalog affects both diagnostics and tools in our baseline.","The replacement must preserve doctor’s supported platforms and output type. The overlay also records the exact catalog state it was reviewed against, so applying it to a changed base is rejected."],"group":"compose","slide":5,"displayBadge":"Implemented","exampleLabel":"Same component name, different producer instructions.","exampleFoot":"The authoring lab plans this replacement. It does not download the supplier file or execute a producer.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Scoped substitutions","href":"#substitutions","secondary":true},{"label":"Toolchain substitutions","href":"#toolchain-substitutions","secondary":true}],"keywords":["overlays","yaml",""],"scenario":"A supplier provides a ready-made doctor that should replace the source-built doctor.","readThisAs":"Overlay = replace the instructions behind the name doctor.","result":"The selected doctor step becomes a download. The output names and components lists can stay the same.","commonMisconception":"An overlay is not automatically global. Its scope depends on which catalog reference includes it.","advancedExample":{"label":"Inside supplier.json — display as YAML for readability","language":"yaml","code":"apiVersion: nkd.dev/catalog-overlay/v3\nkind: CatalogOverlay\nname: supplier-doctor\nrequiresCatalogDigest: <exact base catalog digest>\ncomponents:\n  doctor:\n    version: 1.0.0\n    sourceDateEpoch: 1735689600\n    prebuilt:\n      url: https://authoring.example.invalid/supplier/doctor.sh\n      digests:\n        amd64: <exact supplier file digest>\n        arm64: <exact supplier file digest>\n      evidence: {none: true}","note":"Schema-shaped teaching excerpt with explicit placeholders; the lab writes complete JSON using measured digests. Its supplier URL is not downloaded and it declares no external verification evidence."}},{"id":"substitutions","title":"Scoped substitutions","oneSentence":"Choose whether a replacement affects both outputs, only one output, or just one component selection.","why":"The YAML location makes the scope of your change visible.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/definition.yaml","docs/examples/authoring-lab/run.sh","docs/catalogs-and-components.md"],"exampleLanguage":"yaml","example":"# Start from the base catalog. Change only the tools output.\noutputs:\n  - name: tools\n    components: [doctor, status]\n    platform: linux/amd64\n    format: executable\n    catalog:\n      base: ./catalog\n      overlays: [supplier.json]","explanation":["Default-catalog overlay: diagnostics and tools both use supplier doctor because both use the default catalog. Their output names and component lists stay unchanged.","Per-output catalog overlay: only tools gets supplier doctor. diagnostics continues to build the original doctor from the base catalog. This variant starts from the baseline, not from the global-overlay variant.","Existing-component selection: diagnostics can instead select doctor-alt, which is already in the base catalog. That changes its selected component name; it does not create or apply an overlay."],"group":"compose","slide":5,"displayBadge":"Implemented","exampleLabel":"Per-output catalog variant: this catalog field belongs inside the tools output.","exampleFoot":"Only the tools output is shown. diagnostics and the Definition’s default catalog remain unchanged.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Catalog overlays","href":"#overlays","secondary":true},{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true}],"keywords":["substitutions","yaml",""],"scenario":"The tools deliverable should try the supplier doctor, while diagnostics should retain the source-built doctor.","readThisAs":"“For this output only, look up doctor and status in the base catalog plus supplier.json.”","result":"Only tools changes its Build Digest in this per-output variant.","commonMisconception":"Selecting doctor-alt is not an overlay. It chooses a different existing catalog entry."},{"id":"toolchain-substitutions","title":"Toolchain substitutions","oneSentence":"A toolchain substitution changes the container used to build selected components.","why":"Move a reviewed build tool image without rewriting those components’ source-build instructions.","badge":"implemented","sourcePaths":["definitions/nke-m2/native-toolchains.yaml","pkg/nkd/catalog/stack.go","pkg/nkd/catalog/stack_test.go"],"exampleLanguage":"text","example":"Whole-producer overlay\n  doctor: build from source → download supplier bytes\n\nToolchain substitution\n  doctor: same source + same command\n          old build-tool container → new build-tool container\n\nChoose the architecture and every affected component explicitly.","explanation":["A whole-producer overlay can replace the entire build method. A toolchain substitution changes only the pinned execution image for listed source producers.","The overlay lists one host architecture, an exact old image, an exact new image and sorted component names. Every named component must still use that old image.","The real M2 example applies this operation to an explicit group of OS-image producers. A changed build tool is part of their selected build inputs and therefore changes their Build identities."],"group":"compose","slide":8,"displayBadge":"Implemented","exampleLabel":"Contrast with the doctor overlay; toolchain substitution is a separate, narrower operation.","exampleFoot":"The doctor comparison illustrates the distinction. The maintained M2 overlay below shows the actual toolchain substitution; the authoring lab does not exercise this operation.","actions":[{"label":"OS images","href":"#os-images","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"keywords":["toolchain-substitutions","yaml",""],"scenario":"The build container needs to move to a reviewed image while producer commands stay the same.","readThisAs":"“For these components on this architecture, replace this exact build image.”","result":"Only the declared image pins are substituted; matching old pins are checked first.","commonMisconception":"This field does not perform general YAML merging or accept a wildcard component list.","secondaryExample":{"label":"Technical example · Toolchain substitutions","language":"yaml","code":"# Exact ARM64 entry from the maintained M2 overlay\ntoolchainSubstitutions:\n  - arch: arm64\n    from: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51\n    to: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db\n    components:\n      - nke-agent\n      - nke-cni-calico\n      - nke-cni-ovn\n      - nke-image-inputs\n      - nke-kubeadm-distro\n      - nke-node-image\n      - nke-patched-installer-iso\n      - nke-spire-agent\n      - ovn-kubernetes-chart","note":"Exact ARM64 entry; containing overlay header and its AMD64 entry are omitted."}},{"id":"version-stamps","title":"Version stamps","oneSentence":"Version stamps put information from the pinned source into a program’s build inputs.","why":"A program can report the release and source commit it was built from.","badge":"implemented","sourcePaths":["definitions/nke-v1/catalog/registry.yaml","definitions/nke-v1/catalog/pins.lock.yaml","pkg/nkd/catalog/nkev1_stamp_test.go","docs/adr/0022-catalog-pinning-and-the-lock-contract.md"],"exampleLanguage":"yaml","example":"# NKE CLI producer: real template fields\nversionStamp:\n  NKECTL_COMMIT: '{{slice .Commit 0 8}}'\n  NKECTL_VERSION: '{{.ModuleTag}}'\n\n# Rendered from the maintained source pin:\n# NKECTL_COMMIT  = ed9fb09b\n# NKECTL_VERSION = v0.1.0-rc.2","explanation":[".Commit and .ModuleTag come from the source pin. slice .Commit 0 8 produces the short commit. .ModuleTag removes the cli/ prefix from cli/v0.1.0-rc.2, keeping v0.1.0-rc.2.","The nkectl build command passes these values into Go linker flags, so the executable embeds its build version.","This substitutes values in producer inputs. It does not change the selected component or apply a catalog overlay."],"group":"compose","slide":3,"displayBadge":"Implemented","exampleLabel":"A small real NKE example: template on top, resulting values below.","exampleFoot":"Exact maintained producer excerpt plus values derived from its current lock.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Component producers","href":"#producers","secondary":true}],"keywords":["version-stamps","yaml",""],"scenario":"The shipped CLI should identify the source release used to build it.","readThisAs":"“Fill these build variables from the source we already pinned.”","result":"Version fields are traceable to recorded source inputs.","commonMisconception":"A version stamp is not the same operation as replacing a producer or selecting doctor-alt."},{"id":"helm-bindings","title":"Helm image bindings","oneSentence":"A Helm binding puts the built image’s exact digest into the chart that uses it.","why":"Keep the chart and image connected without requiring the installer to guess which image belongs to the release.","badge":"implemented","sourcePaths":["definitions/nke-v1/definition.yaml","definitions/nke-v1/catalog/registry.yaml","docs/declarative-helm-bindings.md","pkg/nkd/definition/helm_test.go"],"exampleLanguage":"yaml","example":"# Definition output — choose which image output fills the slot\nhelm:\n  images:\n    controller: cwe\n\n# Catalog’s chart producer — choose where that digest is written\nhelm:\n  images:\n    controller:\n      values:\n        digest: image.digest","explanation":["In the Definition, controller: cwe means “the chart’s controller slot uses the image from the cwe output.”","In the catalog, digest: image.digest means “write that image digest into the chart value at image.digest.” NKD packages the image before binding the chart.","The image’s content identity is fixed in the chart. A downstream installer can supply the registry repository where that image is available. Normal Helm overrides still apply."],"group":"compose","slide":3,"displayBadge":"Implemented","exampleLabel":"Excerpts from two different files. controller identifies the same image slot in both.","exampleFoot":"Two excerpts from the maintained Definition and catalog; they belong in different files.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Producer & artifact graphs","href":"#graphs","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"keywords":["helm-bindings","yaml",""],"scenario":"Our product ships both a controller image and its Helm chart.","readThisAs":"Definition chooses WHICH image. Catalog chooses WHERE its digest goes.","result":"The packaged chart refers to the exact image selected for it.","commonMisconception":"The slot name controller, output name cwe and values path image.digest serve different purposes; they need not have the same text."},{"id":"maintenance","title":"Catalog maintenance","oneSentence":"Catalog maintenance previews input updates and can regenerate the matching pipeline for review.","why":"A pin change and its generated CI changes should be reviewed together.","badge":"implemented","sourcePaths":["docs/catalog-maintenance.md","docs/examples/catalog-maintenance/nke-deploy.yaml","pkg/nkd/catalogmaintenance/refresh_test.go"],"exampleLanguage":"text","example":"1. Preview\n   Find allowed upstream changes. Write no lock or bundle.\n\n2. Apply in a scratch checkout\n   Update the lock. Regenerate and check the pipeline.\n\n3. Review\n   Inspect the pin changes and matching generated files.","explanation":["Maintenance follows the source version policy already in the catalog. It does not silently broaden a fixed version constraint.","The preview reports possible pin changes. Apply updates the lock, then regenerates and checks the Run bundle. These are separate file transactions, so a failure remains an error to investigate.","The optional GitHub maintenance workflow produces a candidate patch for review. It does not automatically publish a pull request."],"group":"compose","slide":12,"displayBadge":"Implemented","exampleLabel":"Preview, apply and review; expand the technical example below for commands.","exampleFoot":"This sequence explains the workflow. Expand the technical example for command excerpts, or use the walkthrough for setup.","actions":[{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true},{"label":"The generated CI bundle","href":"#pipeline","secondary":true}],"keywords":["maintenance","shell",""],"scenario":"A newer allowed upstream release is available.","readThisAs":"“Show the update, produce matching CI, then let us review the candidate.”","result":"Reviewable pin and generated-file changes, with a successful check required before use.","commonMisconception":"A preview is not a completed build or a newly published release.","secondaryExample":{"label":"Technical example · Catalog maintenance","language":"shell","code":"bin/nkdctl catalog refresh \\\n  --config docs/examples/catalog-maintenance/nke-deploy.yaml \\\n  --check --json\n\n# Render a maintenance workflow for review:\nbin/nkdctl catalog update-ci \\\n  --config docs/examples/catalog-maintenance/nke-deploy.yaml \\\n  > /tmp/nke-catalog-maintenance.yml","note":"Preview and workflow rendering require source access and matching generator identity. Rendering does not install or schedule a workflow."}},{"id":"plan","title":"The generated Plan","oneSentence":"A Plan is NKD’s generated list of what to produce, which inputs to use and which steps must follow.","why":"Review the work before spending time on a build.","badge":"CLI exercised","sourcePaths":["docs/plan-and-graph-inspection.md","demos/team-guide.md"],"exampleLanguage":"sh","example":"bin/nkdctl run plan \\\n  --definition definitions/nke-v1/definition.yaml \\\n  --environment definitions/nke-v1/environment-github.yaml \\\n  --json > /tmp/nkd-team-plan.json\n\nbin/nkdctl run plan --plan /tmp/nkd-team-plan.json --pretty","explanation":["The Definition says what must ship. The Environment supplies execution and publication settings. NKD combines them with the pinned catalog inputs to create the Plan.","For each output, the Plan records the producer instructions and the later inspection, packaging, signing and publication steps that apply.","The Plan is the saved record; a graph is a picture drawn from it. Creating either does not run a build."],"group":"execute","slide":4,"displayBadge":"Cli exercised","exampleLabel":"Create a Plan for the small NKE example, then display it","exampleFoot":"Illustrative excerpt. The walkthrough supplies complete commands and prerequisites.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Producer & artifact graphs","href":"#graphs","secondary":true},{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true}],"keywords":["plan","sh",""],"scenario":"You want the NKE command-line tool, container image and Helm chart. Before running anything, check how NKD will produce them.","readThisAs":"Use this Definition and Environment to calculate the work. Save that exact Plan, then show a readable version.","result":"You can inspect the chosen source versions, build commands, dependencies and required outputs before execution."},{"id":"graphs","title":"Producer & artifact graphs","oneSentence":"A graph turns the Plan into connected steps so you can see what depends on what.","why":"Find why a build must wait for another result, or trace the inputs to an OS image.","badge":"CLI exercised","sourcePaths":["docs/plan-and-graph-inspection.md","docs/evidence/2026-10-06-team-demo-pipeline/plan.json"],"exampleLanguage":"sh","example":"bin/nkdctl run graph --plan /tmp/nkd-team-plan.json \\\n  --view producers --format mermaid\n\nbin/nkdctl run graph --plan /tmp/nkd-team-plan.json \\\n  --view artifacts --format dot\n\nbin/nkdctl run graph --plan /tmp/nkd-team-plan.json \\\n  --view complete --format json","explanation":["Start with the producer view for source downloads, build commands and materials. For an OS image, these include packages and other inputs consumed by Packer.","Use the artifact view for results moving between operations: a built image feeds chart packaging; an observed binary feeds a dependency scan.","The complete view links both. Mermaid and DOT are diagram formats; JSON is structured data. They display the same planned work, not proof that it finished."],"group":"execute","slide":4,"displayBadge":"Cli exercised","exampleLabel":"Draw the producer, artifact or complete view of the same saved Plan","exampleFoot":"Illustrative excerpt. The walkthrough supplies complete commands and prerequisites.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"The generated Plan","href":"#plan","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"quiz":{"prompt":"Which question are you asking?","choices":[{"label":"How is it built?","result":"Choose the producer view for source, instructions and material dependencies."},{"label":"How do bytes move?","result":"Choose the artifact view for operation inputs/outputs, output slots and publication routes."},{"label":"How does it connect?","result":"Choose the complete view to join producer instructions with operation and artifact relationships."}]},"keywords":["graphs","sh",""],"scenario":"The controller chart needs the final container-image digest before NKD can package the chart. Where does that dependency appear?","readThisAs":"Producer view: how is it made? Artifact view: which results feed later steps? Complete view: how do both connect?","result":"Following the chart’s dependency reveals that its package must wait for the image result."},{"id":"plan-diff","title":"Semantic Plan diffs","oneSentence":"Plan comparison tells you which outputs and settings changed between two versions.","why":"Understand the effect of a source update or registry move without reading a huge file diff.","badge":"Contract-tested","sourcePaths":["docs/plan-and-graph-inspection.md","pkg/nkd/planview"],"exampleLanguage":"sh","example":"bin/nkdctl run diff \\\n  --before before-plan.json --after after-plan.json\n\n# Show every changed field; useful after reviewing the summary.\nbin/nkdctl run diff \\\n  --before before-plan.json --after after-plan.json --details","explanation":["A new source commit, compiler image or build command changes the affected Build Digest: the fingerprint of its build inputs and instructions.","Moving publication to another registry can change the Plan while leaving that Build Digest unchanged, because the build inputs stayed the same.","Use run diff to explain two Plans. Use run generate --check to confirm that all generated files still match the authored inputs."],"group":"execute","slide":5,"displayBadge":"Contract-tested","exampleLabel":"Compare saved Plans before and after a reviewed input change","exampleFoot":"Illustrative excerpt. The walkthrough supplies complete commands and prerequisites.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"quiz":{"prompt":"What did you change?","choices":[{"label":"Source commit","result":"The affected logical Build Digests change; the complete Plan also changes."},{"label":"Registry destination","result":"Transport and Plan settings change. With the same selected producer graph, Build Digests can remain unchanged."}]},"keywords":["plan-diff","sh",""],"scenario":"You changed one source pin. You want to know which deliverables now have different build inputs.","readThisAs":"Compare the old Plan with the new one, group changes by named output, then use --details when you need every changed field.","result":"You can separate a change to what gets built from a change to where or how the build runs."},{"id":"generators","title":"Generator adapters","oneSentence":"A generator adapter writes the workflow files for a supported automation system.","why":"Describe the product once, then generate the pipeline that builds it.","badge":"implemented","sourcePaths":["pkg/nkd/factory/generate.go","docs/adr/0018-pipeline-ir-and-ci-adapter-emission.md","docs/adr/0021-generated-pipeline-maintenance-and-lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"shell","example":"bin/nkdctl run generate \\\n  --definition definitions/nke-v1/definition.yaml \\\n  --environment definitions/nke-v1/environment-github.yaml \\\n  --engine github --root \"$SCRATCH\"\n\n# Repeat exactly to check generated bytes:\nbin/nkdctl run generate \\\n  --definition definitions/nke-v1/definition.yaml \\\n  --environment definitions/nke-v1/environment-github.yaml \\\n  --engine github --root \"$SCRATCH\" --check","explanation":["The generator translates NKD’s planned work into GitHub Actions jobs and dependencies.","A builder is different: it is the mechanism that makes component bytes, such as BuildKit for a container image or Packer for an OS image.","GitHub is the current hosted adapter. Use the guided catalog demo to prepare the scratch output directory and generate its files safely."],"miniDemo":[{"label":"Generated-file drift","before":"Workflow matches the reviewed inputs","after":"A generated workflow byte is edited","effect":"The matching --check command fails instead of silently accepting the change."}],"group":"execute","slide":6,"displayBadge":"Implemented","exampleLabel":"Generate a GitHub Actions workflow; repeat with --check to detect edits","exampleFoot":"Current CLI syntax; demos/demo-team-catalog.sh provides the prepared scratch workspace.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"The generated CI bundle","href":"#pipeline","secondary":true},{"label":"Builder types","href":"#builders","secondary":true}],"scope":"The maintained hosted adapter is GitHub. GitLab, Tekton and Argo are unavailable; AICR accelerated-runtime rendering was removed and remains deferred.","scopeTitle":"Current adapter support","keywords":["generators","shell",""],"scenario":"Your team uses GitHub Actions. Instead of maintaining a separate build workflow by hand, you want it generated from the same inputs you just inspected.","readThisAs":"Use the GitHub adapter to write the workflow into the demo directory. Repeat the command with --check to see whether those generated bytes still match.","result":"The output is a GitHub Actions workflow and its supporting Plan and manifest; generation itself starts no jobs."},{"id":"pipeline","title":"The generated CI bundle","oneSentence":"The generated pipeline bundle contains the workflow, its Plan and a file list with exact fingerprints.","why":"Keep automation in sync with the product definition, and catch hand-edited generated files.","badge":"Generated and hosted-exercised","sourcePaths":["docs/adr/0018-pipeline-ir-and-ci-adapter-emission.md","docs/adr/0021-generated-pipeline-maintenance-and-lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"text","example":"Authored\n  definition.yaml\n  environment-github.yaml\n  catalog/registry.yaml + pins.lock.yaml\n\nGenerated\n  .github/workflows/nkd-run.yml\n  .github/nkd-run/plan.json\n  .github/nkd-run/manifest.json\n\nCheck\n  Repeat run generate with the same inputs + --check","explanation":["The workflow file tells GitHub Actions which jobs to run. The Plan records the exact work those jobs execute.","The manifest lists generated paths and their hashes, which are fingerprints of file contents. It also records the Plan and workflow digests.","Generating again with the same inputs and generator must reproduce the same bytes. Make intended changes in the authored inputs, then regenerate."],"group":"execute","slide":6,"displayBadge":"Generated and hosted-exercised","exampleLabel":"The three generated files and the authored inputs that produce them","exampleFoot":"The manifest owns exact generated paths. Use the guided demo to generate safely in a scratch checkout.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Generator adapters","href":"#generators","secondary":true},{"label":"Runs & completeness","href":"#execution","secondary":true}],"keywords":["pipeline","text",""],"scenario":"Someone changes the generated workflow directly. You want the normal check to catch that before the altered workflow runs.","readThisAs":"Edit the Definition, Environment or catalog inputs; regenerate the workflow and Plan; use the manifest and --check to detect drift.","result":"The matching --check command fails if required generated files are missing, changed or unexpectedly added."},{"id":"builders","title":"Builder types","oneSentence":"A builder is the tool or execution method used to make a selected component.","why":"Use the right build process for a program, container image or virtual-machine disk.","badge":"Current implementation boundary","sourcePaths":["pkg/nkd/catalog/types.go","docs/adr/0010-pluggable-builder-types.md","docs/adr/reconciliation.md","pkg/nkd/pipeline/local_build.go","pkg/nkd/pipeline/execution_identity.go","pkg/nkd/buildgraph/nix_test.go"],"exampleLanguage":"text","example":"oci-hermetic       Run a command in a pinned toolchain container\nbuildkit-rootless  Build a container image with BuildKit\nvm-image           Build a virtual-machine disk with Packer\nnix                Run a locked Nix build in a pinned container","explanation":["oci-hermetic runs a declared command in a pinned toolchain container. buildkit-rootless runs the container-image builder BuildKit. vm-image uses a source-owned Packer project to produce a disk.","nix uses a locked Nix build description in a pinned container. Its offline dispatch exists; this tour does not demonstrate a real Nix build or qualified reproduction.","The builder answers how to make a component. The output format answers what deliverable to package. Current disk execution produces unencrypted QCOW2, a virtual-machine disk format."],"group":"execute","slide":6,"displayBadge":"Current implementation boundary","exampleLabel":"Builder names describe how bytes are made; the output chooses how they are packaged","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"OS images","href":"#os-images","secondary":true},{"label":"Component producers","href":"#producers","secondary":true}],"keywords":["builders","text",""],"scenario":"NKE needs several deliverable types: a command-line program, container images, charts and operating-system disks. Their build tools differ.","readThisAs":"Use BuildKit to build a container image, or Packer to build a virtual-machine disk. The generator arranges the workflow that invokes those builders.","result":"Different kinds of components can participate in one Plan while retaining their own explicit inputs and requirements."},{"id":"execution","title":"Runs & completeness","oneSentence":"A Run records one attempt to produce every output promised by the Definition.","why":"Know whether the whole requested result was produced, not just whether a few jobs turned green.","badge":"Recorded: 34 of 34 complete","sourcePaths":["docs/lifecycle.md","docs/evidence/2026-10-06-team-demo-pipeline/run.json","docs/evidence/2026-10-06-team-demo-pipeline/run-summary.json"],"exampleLanguage":"text","example":"Run 37533806963-1\nLane      pipeline-attested\nStatus    complete\nExpected  34 named outputs\nObserved  34 named outputs\nJobs      289 completed successfully","explanation":["Before execution, NKD fixes the expected output names and their build inputs. During execution it records the actual produced contents and required evidence.","Completion requires those observations to match the expected outputs. One successful output cannot stand in for a missing output, even when their Build Digests match.","A dry-run only describes work: it remains pending with zero observed outputs. If no final Run record exists, check the workflow status rather than assuming success."],"group":"execute","slide":7,"displayBadge":"Recorded: 34 of 34 complete","exampleLabel":"Summary of the recorded NKE pipeline and its final Run","exampleFoot":"Counts are derived from the expected and observed arrays; this is not a Run JSON schema.","actions":[{"label":"Evidence lanes","href":"#evidence-lanes","secondary":true},{"label":"Release publication","href":"#release","secondary":true}],"keywords":["execution","text",""],"scenario":"The Definition asks for 34 outputs. Thirty-three successful outputs would still leave the Run incomplete.","readThisAs":"This attempt expected 34 named outputs, observed all 34 and completed successfully. The workflow also reports that all 289 jobs succeeded.","result":"The final record shows that every required output was accounted for in this attempt."},{"id":"artifacts","title":"Artifacts & identities","oneSentence":"An artifact is an actual deliverable; a Build Digest identifies the inputs and instructions used to produce it.","why":"Tell a change in build intent from a change in the delivered bytes.","badge":"Recorded candidate","sourcePaths":["docs/lifecycle.md","docs/evidence/2026-10-06-team-demo-pipeline/pr108-browse.json"],"exampleLanguage":"json","example":"{\n  \"name\": \"nke-node-image-arm64\",\n  \"buildDigest\": \"sha256:d9ba1cec0862e2a1bea7ea3a6e5b0f6ddd0d96a67b05614b47f4825c1b896ae7\",\n  \"digest\": \"sha256:6a7efe0c2c01685e21fa3723b1b151363c719c0baf68b95df327d3278ea1d254\"\n}","explanation":["A catalog component declares how to build or acquire something. An output is a named deliverable the Definition requires. The artifact is the concrete result that is produced; it may later be published.","A digest is a content fingerprint. The Build Digest is calculated from build inputs and instructions before execution; it does not tell you the eventual file checksum.","The artifact manifest is a registry document listing the package’s contents. Its digest differs from the disk payload digest, which identifies the exact QCOW2 file. The release root has another digest because it lists the release’s artifacts and evidence."],"group":"execute","slide":9,"displayBadge":"Recorded candidate","exampleLabel":"Exact fields from the recorded ARM64 disk output; each fingerprint has a different job","exampleFoot":"digest is the OCI wrapper manifest; payload digest and release root are separate identities.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Release navigation","href":"#browse","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"keywords":["artifacts","json",""],"scenario":"You are inspecting an OS image and see several sha256 values. Which identifies the build, the disk file and its registry package?","readThisAs":"name identifies the required output. buildDigest identifies its chosen build inputs. digest identifies the published artifact’s manifest, which points to its files.","result":"You can choose the right identity for the question instead of treating every digest as the disk’s checksum."},{"id":"os-images","title":"OS images","oneSentence":"An OS-image output produces a disk from an explicit set of installer, package and component inputs.","why":"Trace what went into the disk and see the hardware needed to build it.","badge":"Both native candidate outputs completed","sourcePaths":["docs/adr/reconciliation.md","docs/evidence/2026-10-06-team-demo-pipeline/pr108-browse.json","definitions/nke-m2/environment-github.yaml"],"exampleLanguage":"yaml","example":"githubARC: native-kvm-v1\ndiskEvidence: build-provenance-v1\nexecutionClasses:\n  - name: arc-arm64-kvm\n    runsOn: arc-arm64-kvm\n    hostPlatform: linux/arm64\n    resources:\n      cpuMillis: 8000\n      memoryMiB: 36864\n      ephemeralStorageMiB: 229376\n    maxTimeoutSeconds: 21600\n    capabilities: [kvm]","explanation":["The output selects one disk-producing component and all of its required material components. Follow those material links in the Plan to see what Packer consumes.","ARM64 and AMD64 are distinct processor architectures. The named runner must match the selected route and supply the required resources and Kernel-based Virtual Machine (KVM) capability.","The featured disks use build-provenance-v1: evidence about their production and materials. This does not claim a complete software inventory of the disk, full-disk encryption or qualified reproduction."],"group":"execute","slide":8,"displayBadge":"Both native candidate outputs completed","exampleLabel":"Excerpt of the Environment for a native ARM64 disk build","exampleFoot":"Illustrative excerpt. The walkthrough supplies complete commands and prerequisites.","actions":[{"label":"Follow the OS material graph ↗","href":"demo-team-explorer.html#plan/nke-node-image-arm64"},{"label":"Toolchain substitutions","href":"#toolchain-substitutions","secondary":true},{"label":"Release navigation","href":"#browse","secondary":true}],"scope":"Both disk outputs use build-provenance-v1. Deep disk inspection, a full disk SBOM, FDE and qualified reproduction are outside this candidate’s claim.","scopeTitle":"This candidate’s disk evidence","keywords":["os-images","yaml",""],"scenario":"The team wants to inspect the ARM64 NKE disk and compare it with the AMD64 disk from the same recorded release.","readThisAs":"Use the named ARM64 runner with its declared resources and KVM hardware virtualization. Publish build provenance while deeper disk inspection remains deferred.","result":"The recorded workflow produced both unencrypted QCOW2 disks, with exact disk checksums, sizes and linked material evidence."},{"id":"evidence-lanes","title":"Evidence lanes","oneSentence":"An evidence lane says which kind of claim a Run is allowed to make.","why":"Avoid mistaking a preview, a signed build and proof of exact reproduction for the same result.","badge":"Current supported scope","sourcePaths":["docs/lifecycle.md","docs/adr/reconciliation.md","docs/evidence/2026-10-06-team-demo-pipeline.md"],"exampleLanguage":"text","example":"static-unqualified   Preview or diagnostic description\npipeline-attested    Recorded hosted production evidence\nqualified            Requires stronger proof, including exact-byte reproduction","explanation":["static-unqualified is used for dry-run and diagnostic descriptions. A preview does not contain observed output results.","pipeline-attested is the featured workflow’s lane. Its signed evidence supports checks about the producing workflow and exact published contents.","qualified requires stronger reproduction and authentication checks. Current full-release and qualified consumer acceptance remain unavailable; the supported consumer scope is pipeline-attested / artifact-publication."],"group":"trust","slide":11,"displayBadge":"Current supported scope","exampleLabel":"Three labels, with the different claims they describe","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Verification policy","href":"#verification","secondary":true},{"label":"Current capabilities","href":"#capabilities","secondary":true}],"keywords":["evidence-lanes","text",""],"scenario":"You first preview a Plan, then inspect a successful signed workflow. What stronger statement can you make after each step?","readThisAs":"A dry-run describes work. pipeline-attested records hosted production evidence. qualified requires additional proof, including exact-byte reproduction.","result":"You can describe the featured result accurately as pipeline-attested without claiming qualified reproduction."},{"id":"sbom","title":"Dependency SBOMs","oneSentence":"A software bill of materials (SBOM) lists the software found in a particular artifact.","why":"Answer “What packages and dependencies are in this deliverable?” with a record tied to its exact contents.","badge":"Recorded signed evidence","sourcePaths":["docs/dependency-sboms.md","docs/publication-architecture.md","docs/evidence/2026-10-06-team-demo-pipeline/pr108-browse.json"],"exampleLanguage":"text","example":"CLI binary          Compiled Go modules and recognized packages\nContainer image     Installed OS and application dependencies\nHelm source         Chart declarations and references\nFinal bound chart   Delivered archive after image-digest binding","explanation":["For supported binaries and images, NKD runs the pinned Syft scanner after checking the artifact bytes. Charts use a reader for their dependency declarations.","NKD stores the inventory in CycloneDX, a standard SBOM format, and publishes it inside a signed attestation: a signed statement about an exact subject.","A chart’s dependency list does not scan the container images it references. The featured disk build-provenance records also do not provide a complete disk inventory."],"group":"trust","slide":12,"displayBadge":"Recorded signed evidence","exampleLabel":"Different deliverables need different inventory inputs","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Production provenance","href":"#provenance","secondary":true},{"label":"Signing & attestations","href":"#signing","secondary":true}],"keywords":["sbom","text",""],"scenario":"You want to compare the dependencies in the NKE program, its container image and its packaged chart.","readThisAs":"Inspect the binary for embedded dependencies, the image for installed packages, and the chart for its declared chart dependencies and references.","result":"Each inventory identifies the artifact and stage it describes, so you can tell which delivered bytes it covers."},{"id":"provenance","title":"Production provenance","oneSentence":"Production provenance records how an artifact was made and which workflow produced it.","why":"Check whether a deliverable came from the expected build process.","badge":"Recorded candidate","sourcePaths":["docs/publication-architecture.md","docs/evidence/2026-10-06-team-demo-pipeline/release-predicate.json","docs/evidence/2026-10-06-team-demo-pipeline/release-verification.json"],"exampleLanguage":"json","example":"{\n  \"predicateType\": \"https://slsa.dev/provenance/v1\",\n  \"cosignVersion\": \"v3.1.3\",\n  \"observedIssuer\": \"https://token.actions.githubusercontent.com\",\n  \"observedIdentity\": \"https://github.com/dsx-ai-factory/nke-recipes/.github/workflows/nkd-run.yml@refs/heads/codex/m2-arc-validation\"\n}","explanation":["Provenance answers how the artifact was produced; an SBOM answers what software it contains. A signature authenticates who signed the statement or artifact.","The featured workflow uses Supply-chain Levels for Software Artifacts (SLSA) provenance v1. GitHub supplies its workload identity through OpenID Connect (OIDC).","The recorded signer is the validation-branch workflow. The maintained policy accepts main. Reading this excerpt does not authenticate it or make the branch acceptable to your policy."],"group":"trust","slide":7,"displayBadge":"Recorded candidate","exampleLabel":"Recorded verification details for the featured workflow’s provenance","exampleFoot":"Verification-record excerpt; this is not the complete SLSA provenance predicate.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Signing & attestations","href":"#signing","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["provenance","json",""],"scenario":"You found the right artifact checksum. Now you want to know whether it came from your approved NKE workflow.","readThisAs":"This record says the workflow used SLSA production provenance and observed the signing identity of the validation branch shown here.","result":"The workflow identity and production statement give the consumer something specific to check against its own trust policy."},{"id":"signing","title":"Signing & attestations","oneSentence":"A signature lets a consumer check who signed an exact artifact or statement.","why":"Reject a look-alike artifact or a build from an identity your team does not trust.","badge":"Workflow verification recorded","sourcePaths":["pkg/nkd/sign/oci.go","docs/publication-architecture.md","docs/evidence/2026-10-06-team-demo-pipeline/release-signature.json","docs/evidence/2026-10-06-team-demo-pipeline/release-verification.json"],"exampleLanguage":"sh","example":"# Commands run by the generated workflow, shown for explanation:\ncosign sign --yes --new-bundle-format \"$ARTIFACT_REF\"\ncosign attest --yes --new-bundle-format \\\n  --type slsaprovenance1 --predicate \"$PREDICATE\" \"$ARTIFACT_REF\"","explanation":["cosign is the signing and verification tool used here. NKD selects its exact pinned version and invokes it from the generated workflow.","An attestation is a signed statement about an exact subject. Provenance attestations describe production; SBOM attestations describe software contents.","The recorded release and both disk outputs passed workflow signature and provenance checks. The separate walkthrough browse replay checks metadata only."],"group":"trust","slide":11,"displayBadge":"Workflow verification recorded","exampleLabel":"Commands used by the generated signing step, shown for explanation","exampleFoot":"The generated workflow supplies the pinned cosign tool, identity, credentials and exact artifact references.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Verification policy","href":"#verification","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"quiz":{"prompt":"What does this evidence establish?","choices":[{"label":"Signature","result":"An authenticated signer bound to an exact subject, when the signature and policy checks pass."},{"label":"Provenance","result":"A signed production statement about the subject, workflow and inputs; the consumer must authenticate and evaluate it."},{"label":"SBOM","result":"An inventory for an exact subject and stage. Its signature does not turn it into a deployment or security-clearance verdict."}]},"keywords":["signing","sh",""],"scenario":"A container registry has an artifact at the expected name. You also need to establish which workflow signed its exact content.","readThisAs":"The first command signs the artifact reference. The second signs a production-provenance statement about that same artifact.","result":"A consumer can verify both the artifact signature and its production statement against an accepted workflow identity."},{"id":"release","title":"Release publication","oneSentence":"A Release provides one immutable starting point for a named collection of artifacts and their evidence.","why":"Find the matching program, image, chart and OS disks without guessing tags or searching unrelated registry entries.","badge":"Recorded 34-output publication","sourcePaths":["docs/publication-architecture.md","docs/evidence/2026-10-06-team-demo-pipeline/release-control.json"],"exampleLanguage":"text","example":"…/releases@sha256:…\n  ├─ controller-chart@sha256:… → chart + final-package evidence\n  ├─ cwe@sha256:…              → native image + evidence\n  ├─ nkectl@sha256:…           → executable bundle + evidence\n  └─ nke-node-image-arm64@sha256:… → QCOW2 + material evidence","explanation":["NKD publishes through the Open Container Initiative (OCI) registry format, which can store images and other artifact types. The release root is an index pointing to metadata that lists exact outputs and evidence.","The actual image, executable, chart or disk lives in its own output repository. The release entry points to it; it does not contain another copy of every large file.","In the featured per-output publication mode, outputs are published and checked individually before the combined release metadata is assembled."],"group":"trust","slide":9,"displayBadge":"Recorded 34-output publication","exampleLabel":"Four outputs reached from the featured release’s single reference","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Release navigation","href":"#browse","secondary":true},{"label":"Signing & attestations","href":"#signing","secondary":true}],"keywords":["release","text",""],"scenario":"You have a release reference and want the ARM64 disk plus the evidence attached to it.","readThisAs":"Start at the release entry, choose the named output, then follow its exact artifact reference and evidence links.","result":"One release reference identifies a consistent published set while each deliverable remains independently addressable."},{"id":"browse","title":"Release navigation","oneSentence":"Release browsing shows what was published and how its outputs and evidence are connected.","why":"Explore an OS-image release without downloading its multi-gigabyte disk files.","badge":"Live GHCR replay passed","sourcePaths":["docs/evidence/2026-10-06-team-demo-pipeline.md","docs/evidence/2026-10-06-team-demo-pipeline/pr108-browse.json"],"exampleLanguage":"sh","example":"bin/nkdctl release browse --reference \"$RELEASE_REF\" \\\n  --output nke-node-image-arm64 --format text\n\n# Export the same selection as a diagram:\nbin/nkdctl release browse --reference \"$RELEASE_REF\" \\\n  --output nke-node-image-arm64 --format mermaid","explanation":["The command reads metadata and evidence documents, checks their integrity and relationships, then applies your output filter.","It can display text, structured JSON data or a Mermaid diagram. The HTML explorer presents the saved JSON as a clickable graph.","Browsing does not check the actual payload bytes, signatures or consumer policy. Use verification when you need to accept a supported trust claim."],"group":"trust","slide":10,"displayBadge":"Live ghcr replay passed","exampleLabel":"Choose the ARM64 disk in text or Mermaid diagram output","exampleFoot":"Illustrative excerpt. The walkthrough supplies complete commands and prerequisites.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Run the native browse demo","href":"demo-team-walkthrough.html#release"},{"label":"Verification policy","href":"#verification","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"scope":"Native inspection label: metadata inspection; payloads, signatures and policy not verified. The HTML graph explorer displays the saved result and does not repeat native validation.","scopeTitle":"What browsing tells you","quiz":{"prompt":"Do you need inspection or acceptance?","choices":[{"label":"Inspect membership","result":"Browse the bounded metadata and evidence graph. No artifact payload layers are needed."},{"label":"Accept an artifact claim","result":"Use verification with an explicit identity, issuer, lane and scope. It performs additional authentication and content checks."}]},"keywords":["browse","sh",""],"scenario":"During the demo, find the ARM64 disk, read its declared platform and checksum, and follow its 11 evidence links.","readThisAs":"Open this exact release, check its metadata, then display the output named nke-node-image-arm64.","result":"You can inspect the release’s 34 outputs and 60 evidence entries while leaving artifact payloads unread."},{"id":"verification","title":"Verification policy","oneSentence":"Verification checks published contents and signed evidence against the consumer’s explicit trust rules.","why":"Decide whether the release satisfies the claim your team needs before relying on it.","badge":"Supported; this candidate not independently replayed","sourcePaths":["cmd/nkdctl/release.go","docs/lifecycle.md","docs/evidence/2026-10-06-team-demo-pipeline.md"],"exampleLanguage":"sh","example":"bin/nkdctl release verify --reference \"$RELEASE_REF\" \\\n  --lane pipeline-attested --scope artifact-publication \\\n  --identity \"$BUILD_IDENTITY_REGEXP\" --issuer \"$OIDC_ISSUER\" \\\n  --cosign \"$COSIGN_PATH\" --cosign-digest \"$COSIGN_DIGEST\"","explanation":["The identity selects the accepted signer, such as a particular repository workflow and branch. The issuer identifies the service that issued that workload identity.","The lane and scope state what claim is being checked. The supported pair is pipeline-attested / artifact-publication: exact published contents with required signatures and production evidence.","Use Linux with an existing digest-pinned static cosign binary. The featured pipeline performed its own checks; this walkthrough did not independently verify its full payload set."],"group":"trust","slide":11,"displayBadge":"Supported consumer scope","exampleLabel":"Verify an exact reference under an accepted workflow identity and evidence scope","exampleFoot":"Illustrative excerpt. The walkthrough supplies complete commands and prerequisites.","actions":[{"label":"Signing & attestations","href":"#signing","secondary":true},{"label":"The Go SDK","href":"#sdk","secondary":true}],"scope":"The featured pipeline recorded successful verification. The independent PR #108 replay checked metadata only; it did not verify the full payload closure under consumer policy.","scopeTitle":"Recorded scope","keywords":["verification","sh",""],"scenario":"Your team accepts builds from its protected main-branch workflow. A release signed by another branch must not pass just because its signature is valid.","readThisAs":"For this reference, require pipeline-attested build evidence, verify the artifact-publication scope, and accept only the configured identity and issuer.","result":"Verification either establishes that supported claim under your policy or returns an error."},{"id":"sdk","title":"The Go SDK","oneSentence":"The Go software development kit (SDK) lets an application use NKD’s lifecycle operations directly.","why":"Build NKD checks into another tool without scripting command output or duplicating verification logic.","badge":"Contract-tested public API","sourcePaths":["client/v1/lifecycle.go","docs/lifecycle.md"],"exampleLanguage":"go","example":"policy := client.VerificationPolicy{\n    Lane: \"pipeline-attested\",\n    Scope: \"artifact-publication\",\n    IdentityRegexp: identity,\n    Issuer: issuer,\n}\nverified, err := c.VerifyRelease(ctx, reference, policy)\nif err != nil { return err }\ndefer verified.Close()\nrelease, err := verified.Description()","explanation":["Configure the client with its tool and registry settings, then pass the reference and Verification Policy to VerifyRelease.","The returned value represents this verification operation. Close it when finished to release the resources it owns.","You can save the description for display, but loading that saved JSON does not repeat verification. The SDK also supports input loading, local runs and pipeline generation."],"group":"trust","slide":12,"displayBadge":"Contract-tested public api","exampleLabel":"Go excerpt: verify with an explicit policy, then read the accepted release description","exampleFoot":"Use client/v1 with configured consumer options; this excerpt is not a standalone program.","actions":[{"label":"The public lifecycle","href":"#lifecycle","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["sdk","go",""],"scenario":"An internal Go tool needs to accept a release only if it matches the team’s build policy.","readThisAs":"Ask the configured client to verify the reference. Handle a failure, keep the successful result open while using it, then close it.","result":"Your application gets a description of the accepted release only after the requested verification succeeds."},{"id":"fail-closed","title":"Coded errors","oneSentence":"NKD returns a named error when required input, evidence or execution support is missing.","why":"Know what needs fixing instead of getting a partial result presented as success.","badge":"Contract-tested and browse negative exercised","sourcePaths":["docs/adr/reconciliation.md","docs/evidence/2026-10-06-team-demo-pipeline.md","docs/examples/authoring-lab/README.md"],"exampleLanguage":"text","example":"Unknown release output     NKD-E-USAGE, exit 2, empty stdout\nChanged compared Plan      NKD-E-DIFF with --exit-code\nGenerated bundle drift     NKD-E-PIPELINE-DRIFT\nStale overlay predecessor  NKD-E-UNVERIFIED-REF\nUnsupported capability     NKD-E-ENGINE-CAPABILITY","explanation":["For the recorded unknown-output check, browsing returned NKD-E-USAGE with exit status 2 and no result on standard output.","Generated-file drift and stale catalog overlays have their own codes. Fix the matching input or regenerate from reviewed inputs.","Unsupported capability means the requested execution or verification path is unavailable. NKD does not silently substitute a weaker path."],"group":"trust","slide":12,"displayBadge":"Contract-tested and browse negative exercised","exampleLabel":"Common errors and the condition each one reports","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"Catalog overlays","href":"#overlays","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["fail-closed","text",""],"scenario":"You mistype an output name while browsing the release. NKD should reject the selection rather than show an unrelated output.","readThisAs":"Unknown release output means the selected name was absent; pipeline drift means generated files no longer match their inputs.","result":"The error identifies the failed condition so a person or script can handle it consistently."},{"id":"capabilities","title":"Current capabilities","oneSentence":"Use the feature’s recorded scope to tell what you can inspect, execute or trust today.","why":"Choose the next exercise with an accurate expectation of what it will demonstrate.","badge":"Current reconciliation","sourcePaths":["docs/adr/reconciliation.md","docs/adr/0012-criteria-model-and-aicr-activation.md","docs/evidence/2026-10-06-team-demo-pipeline.md"],"exampleLanguage":"text","example":"Explore now\n  Catalogs, exact pins, replacements and Plan graphs\n  Release metadata, output details and evidence links\n\nExecute with the required environment\n  Local builds and GitHub Actions pipelines\n  GitHub publication and signing\n  Native OS disks with build-provenance evidence\n\nUse a separate verification exercise\n  Exact published contents + accepted signer + production evidence\n\nStill deferred\n  Qualified/full-release acceptance and full-disk encryption\n  Additional hosted pipeline adapters and air-gap lifecycle","explanation":["Catalog authoring, exact pins, overlays, substitutions, Plan views and metadata browsing are available for exploration. Local and GitHub execution support the admitted producer types.","The featured candidate demonstrates GitHub production, publication and signing for its exact recorded inputs, including two native OS disks with build provenance.","Qualified/full-release acceptance, full-disk encryption, other hosted pipeline adapters and offline air-gap lifecycle are outside the supported end-to-end tour. Deployment and runtime placement belong to downstream systems."],"group":"trust","slide":12,"displayBadge":"Current reconciliation","exampleLabel":"Supported exercises and the important current limits","exampleFoot":"Concept summary. Exact support and recorded evidence are listed in the source notes.","actions":[{"label":"The public lifecycle","href":"#lifecycle","secondary":true},{"label":"Evidence lanes","href":"#evidence-lanes","secondary":true}],"keywords":["capabilities","text",""],"scenario":"After the introduction, one teammate wants to explore Plans; another wants to run a signed build; a third wants to verify a release independently.","readThisAs":"Pick the workflow for your goal, then check whether its result is a description, a recorded execution or verification under your own policy.","result":"The team can start with working features while keeping deferred acceptance claims separate."}]</script>
<script>
'use strict';
const concepts=JSON.parse(document.getElementById('concept-data').textContent), $=id=>document.getElementById(id);
const groups=[['author','01 / Author the intent'],['compose','02 / Compose and resolve'],['execute','03 / Inspect and execute'],['trust','04 / Publish and trust']];
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let active=null;
const requestedSlide=Number(new URLSearchParams(location.search).get('from'));
const from=Number.isInteger(requestedSlide)&&requestedSlide>=1&&requestedSlide<=13?requestedSlide:0;
if(Number.isInteger(from)&&from>=1&&from<=13){$('back-deck').href='nkd-team-tour.html#'+from;$('back-deck').textContent='← Back to slide '+from;}
function topicHref(id){return '#'+id;}
function withOrigin(href){if(!href.startsWith('demo-team-explorer.html'))return href;const parts=href.split('#');return parts[0]+'?from='+(from||active?.slide||1)+(parts[1]?'#'+parts[1]:'');}
function nav(){const query=$('search').value.trim().toLowerCase();let count=0;$('topic-nav').innerHTML=groups.map(([group,label])=>{const list=concepts.filter(c=>c.group===group&&(!query||[c.title,c.oneSentence,c.id,...(c.keywords||[])].join(' ').toLowerCase().includes(query)));count+=list.length;return list.length?'<div class="group-name">'+escapeHTML(label)+'</div>'+list.map(c=>'<a class="topic-link" href="'+topicHref(c.id)+'"'+(active?.id===c.id?' aria-current="page"':'')+'><span>'+String(concepts.indexOf(c)+1).padStart(2,'0')+'</span>'+escapeHTML(c.title)+'</a>').join(''):'';}).join('');if(!count)$('topic-nav').innerHTML='<p class="empty-search">No matches. Try “pin”, “graph” or “sign”.</p>';if(query){$('topic-nav').classList.add('open');$('toggle-nav').setAttribute('aria-expanded','true');}$('overview-link').toggleAttribute('aria-current',!active);if(!active)$('overview-link').setAttribute('aria-current','page');}
