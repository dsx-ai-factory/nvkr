# Dependabot owns workflow-script npm and isolated toolchain modules.
# Renovate owns the root Go module and handwritten GitHub Actions workflows.
version: 2
updates:
  - package-ecosystem: npm
    directory: /.github/scripts
    schedule:
      interval: weekly
    groups:
      workflow-scripts:
        patterns: ["*"]

  # Keep the scanner out of NVKR's production module graph while making its
  # go.mod pin and go.sum visible to Dependabot. Go marks tool requirements as
  # indirect, so opt in to updates for both the tool and its dependencies.
  - package-ecosystem: gomod
    directory: /toolchains/govulncheck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      govulncheck-tool:
        patterns: ["*"]

  # The workflow linter, kept out of the production module graph the same way.
  - package-ecosystem: gomod
    directory: /toolchains/actionlint
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    # actionlint v1.7.12 requires go.yaml.in/yaml/v4 v4.0.0-rc.3 and fails to
    # compile against rc.7, whose error types changed. Let the yaml version
    # follow actionlint's own requirement; an actionlint bump raises it.
    ignore:
      - dependency-name: go.yaml.in/yaml/v4
    groups:
      actionlint-tool:
        patterns: ["*"]
