# Keep Go module deps and GitHub Actions current with minimal churn.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  # Keep the scanner out of NKD's production module graph while making its
  # go.mod pin and go.sum visible to Dependabot. Go marks tool requirements as
  # indirect, so opt in to updates for both the tool and its dependencies.
  - package-ecosystem: gomod
    directory: /toolchains/govulncheck
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      govulncheck-tool:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    # Generated workflow pins must change through NKD inputs and regeneration.
    # Keep Dependabot updates for the handwritten merge-gate.yaml workflow.
    exclude-paths:
      - .github/workflows/nkd-run.yml
    schedule:
      interval: weekly
    # One PR per round: github/codeql-action init and analyze must move together,
    # or analyze rejects the configuration the newer init wrote (#14, #15).
    groups:
      github-actions:
        patterns: ["*"]
