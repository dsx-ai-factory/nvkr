# Keep Go module deps and GitHub Actions current with minimal churn.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    # Generated workflow pins must change through NKD inputs and regeneration.
    # Keep Dependabot updates for the handwritten ci.yml workflow.
    exclude-paths:
      - .github/workflows/nkd-factory.yml
    schedule:
      interval: weekly
