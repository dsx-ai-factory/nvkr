name: Quick machinery E2E

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-quick-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  quick:
    name: Hello build, registry round-trip and unsigned qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run the same quick E2E as local development
        run: make e2e-quick
      - name: Retain logs and unsigned qualification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-e2e-diagnostics
          path: |
            .nvkr/e2e-quick-*/logs/*.log
            .nvkr/e2e-quick-*/qualification.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
