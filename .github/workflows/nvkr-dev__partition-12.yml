name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  nvkr-package-publication-spire-tpm-server-image:
    name: 'Package publication bundle: publication-spire-tpm-server-image'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-spire-tpm-server-image-sbom'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-package-publication-temporal:
    name: 'Package publication bundle: publication-temporal'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-temporal-sbom'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-package-publication-temporal-admin-tools-image:
    name: 'Package publication bundle: publication-temporal-admin-tools-image'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-temporal-admin-tools-image-sbom'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-package-publication-temporal-server-image:
    name: 'Package publication bundle: publication-temporal-server-image'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-temporal-server-image-sbom'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-package-publication-temporal-ui-image:
    name: 'Package publication bundle: publication-temporal-ui-image'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-temporal-ui-image-sbom'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [nvkr-package-publication-spire-tpm-server-image, nvkr-package-publication-temporal, nvkr-package-publication-temporal-admin-tools-image, nvkr-package-publication-temporal-server-image, nvkr-package-publication-temporal-ui-image]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
