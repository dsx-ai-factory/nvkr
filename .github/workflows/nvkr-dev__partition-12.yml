name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-18:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-18 }}
      nvkr-results-02:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-02 }}
      nvkr-results-02-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-02-statuses }}
      nvkr-results-0e:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e }}
      nvkr-results-0e-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_DEV_REGISTRY_READ:
        required: true
permissions:
  contents: read
jobs:
  nvkr-verify-publication-output-nvke-node-fde-amd64:
    name: 'Verify release and deliverable signatures: output-nvke-node-fde-amd64'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-nvke-node-fde-amd64'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-nvke-node-fde-arm64:
    name: 'Verify release and deliverable signatures: output-nvke-node-fde-arm64'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-nvke-node-fde-arm64'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-nvke-node-image-amd64:
    name: 'Verify release and deliverable signatures: output-nvke-node-image-amd64'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-nvke-node-image-amd64'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-nvke-node-image-arm64:
    name: 'Verify release and deliverable signatures: output-nvke-node-image-arm64'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-nvke-node-image-arm64'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [nvkr-verify-publication-output-nvke-node-fde-amd64, nvkr-verify-publication-output-nvke-node-fde-arm64, nvkr-verify-publication-output-nvke-node-image-amd64, nvkr-verify-publication-output-nvke-node-image-arm64]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
      nvkr-partition-18: ${{ format('"nvkr-verify-publication-output-nvke-node-fde-amd64":{0},"nvkr-verify-publication-output-nvke-node-fde-arm64":{1},"nvkr-verify-publication-output-nvke-node-image-amd64":{2},"nvkr-verify-publication-output-nvke-node-image-arm64":{3}', toJSON(needs['nvkr-verify-publication-output-nvke-node-fde-amd64']), toJSON(needs['nvkr-verify-publication-output-nvke-node-fde-arm64']), toJSON(needs['nvkr-verify-publication-output-nvke-node-image-amd64']), toJSON(needs['nvkr-verify-publication-output-nvke-node-image-arm64'])) }}
      nvkr-results-02: ${{ format('"nvkr-verify-publication-output-nvke-node-fde-amd64":{0},"nvkr-verify-publication-output-nvke-node-image-amd64":{1}', toJSON(needs['nvkr-verify-publication-output-nvke-node-fde-amd64']), toJSON(needs['nvkr-verify-publication-output-nvke-node-image-amd64'])) }}
      nvkr-results-02-statuses: ${{ format('{0} {1}', needs['nvkr-verify-publication-output-nvke-node-fde-amd64'].result, needs['nvkr-verify-publication-output-nvke-node-image-amd64'].result) }}
      nvkr-results-0e: ${{ format('"nvkr-verify-publication-output-nvke-node-fde-arm64":{0},"nvkr-verify-publication-output-nvke-node-image-arm64":{1}', toJSON(needs['nvkr-verify-publication-output-nvke-node-fde-arm64']), toJSON(needs['nvkr-verify-publication-output-nvke-node-image-arm64'])) }}
      nvkr-results-0e-statuses: ${{ format('{0} {1}', needs['nvkr-verify-publication-output-nvke-node-fde-arm64'].result, needs['nvkr-verify-publication-output-nvke-node-image-arm64'].result) }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
