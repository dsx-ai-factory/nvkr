name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-28:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-28 }}
      nvkr-results-05:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05 }}
      nvkr-results-05-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_DEV_REGISTRY_READ:
        required: true
permissions:
  contents: read
