      nvkr-results-0b-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0b-statuses }}
      nvkr-results-0d:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0d }}
      nvkr-results-0d-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0d-statuses }}
      nvkr-results-0e:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e }}
      nvkr-results-0e-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e-statuses }}
