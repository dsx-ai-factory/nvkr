        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-11 }}
      nvkr-results-11-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-11-statuses }}
      nvkr-results-15:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-15 }}
      nvkr-results-15-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-15-statuses }}
      nvkr-results-1b:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1b }}
      nvkr-results-1b-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1b-statuses }}
      nvkr-results-1c:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1c }}
      nvkr-results-1c-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1c-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  nvkr-nico-flow-sbom:
    name: 'Generate SBOMs: nico-flow'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-process-nico-flow-build-nico-flow-ch-79ebc43da684'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-tool-syft'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev-nvke-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev-nvke-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
