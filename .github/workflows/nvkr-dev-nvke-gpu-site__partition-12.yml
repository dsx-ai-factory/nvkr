name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-16:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-16 }}
      nvkr-results-02:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-02 }}
