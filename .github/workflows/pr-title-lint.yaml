# Separate from Merge Gate so title/body edits do not rerun builds and tests.
# This reports a check; it is not part of the required aggregate gate and
# does not change repository rulesets.
name: PR Title Lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Check PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate Conventional Commit format
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // CONTRIBUTING.md owns the supported types. There is no NVKR
            // title-length limit or requirement for a lowercase scope.
            const types = [
              'feat', 'fix', 'refactor', 'docs', 'test', 'perf', 'build', 'ci', 'chore',
            ];
            const pattern = new RegExp(
              `^(${types.join('|')})(\\([a-zA-Z0-9][a-zA-Z0-9._/-]*\\))?!?: +\\S[^\\r\\n]*$`
            );
            // A rerun must validate the current title, not the event snapshot.
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (/[\r\n]/.test(pr.title) || !pattern.test(pr.title)) {
              core.setFailed(
                'Use type(optional-scope)!: description; scope and ! are optional. ' +
                `Types: ${types.join(', ')}. See CONTRIBUTING.md. ` +
                'Editing the title reruns this check.'
              );
              return;
            }
            core.info('PR title follows the NVKR Conventional Commit format.');
