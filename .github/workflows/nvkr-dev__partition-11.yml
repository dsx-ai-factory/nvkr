    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-attest-sboms-output-capi-controller-image-arm64'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CI_REPOSITORY_TOKEN: '${{ github.token }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_WRITE }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_WRITE_USER }}'
