    name: 'Build and package producer evidence for nvke-node-image-arm64'
    runs-on: 'arc-arm64-kvm'
    timeout-minutes: 1045
    needs: [build-runner-arc-arm64-kvm, nvkr-nvke-node-image-arm64-fetch-nvke-age-aee9fbaecda2, nvkr-nvke-node-image-arm64-fetch-nvke-cni-calico, nvkr-nvke-node-image-arm64-fetch-nvke-kubeadm-distro, nvkr-nvke-node-image-arm64-fetch-nvke-spire-agent, nvkr-nvke-node-image-arm64-fetch-ovn-kube-ubuntu, nvkr-nvke-node-image-arm64-fetch-ovn-kubernetes-chart]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: 'nkd-arc'
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - *check-native-linux-arm64
      - name: Check KVM access before transfer
        timeout-minutes: 1
        run: |-
          set -eu
          if [ ! -c /dev/kvm ]; then
            printf 'NVKR-E-ENGINE-CAPABILITY: native disk runner lacks /dev/kvm\n' >&2
            exit 29
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-); then
            printf 'NVKR-E-ENGINE-CAPABILITY: runner requires read/write access to /dev/kvm; configure the ARC device group\n' >&2
            id >&2 || true
            stat -c 'uid=%u gid=%g mode=%a' /dev/kvm >&2 || true
            exit 29
          fi
      - *checkout-workflow-source
      - *prepare-stage-nvkr-exec-arc-arm64-kvm
      - *operation-prepare-inputs-part-1
      - *operation-prepare-images-part-2
      - name: 'Build and package producer evidence for nvke-node-image-arm64'
        id: run-disk
        run: ./nvkr-exec factory github run-disk --plan .github/nvkr-run/plan.json --output nvke-node-image-arm64
      - name: Upload failed Packer diagnostics
        uses: ./.github/nvkr-run/actions/shared/upload-carrier
        with:
          with-path: '${{ steps.run-disk.outputs.packer_diagnostics }}'
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['transfer-1'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
        if: '${{ failure() && steps.run-disk.outputs.packer_diagnostics != '''' }}'
        timeout-minutes: 5
