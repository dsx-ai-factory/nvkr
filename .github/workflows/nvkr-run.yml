name: Partition result diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: success
        options: [success, failure, cancel]
permissions: {}
concurrency:
  group: partition-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  worker:
    uses: ./.github/workflows/partition-diagnostic-worker.yml
    permissions: {}
    with:
      mode: ${{ inputs.mode }}
  dependent:
    needs: worker
    if: ${{ !cancelled() && fromJSON(needs.worker.outputs.results || '{}').producer.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: ':'
  finalizer:
    needs: [worker, dependent]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          REPORT: ${{ needs.worker.outputs.results }}
          DEPENDENT: ${{ needs.dependent.result }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -eu
          printf 'Run %s attempt %s\n' "$RUN_ID" "$RUN_ATTEMPT"
          printf '%s\n' "$REPORT"
          case "$MODE" in
            success) expected=success; dependent=success ;;
            failure) expected=failure; dependent=skipped ;;
            cancel) expected=cancelled; dependent=skipped ;;
            *) exit 2 ;;
          esac
          printf '%s' "$REPORT" | jq -e --arg expected "$expected" '
            keys == ["independent", "producer"] and
            .producer.result == $expected and
            .independent.result == "success"'
          test "$DEPENDENT" = "$dependent"
  flat-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          MODE: ${{ inputs.mode }}
        run: test "$MODE" = success
  flat-recovery:
    needs: flat-source
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: ':'
  flat-dependent:
    needs: flat-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: ':'
  ancestry-observation:
    needs: [flat-source, flat-recovery, flat-dependent]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS"
