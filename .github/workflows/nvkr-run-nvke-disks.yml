  nvkr-disk-nvke-node-image-amd64:
    name: 'Build and package producer evidence for nvke-node-image-amd64'
    runs-on: 'arc-amd64-kvm'
    timeout-minutes: 1045
    needs: [build-runner-arc-amd64-kvm, nvkr-nvke-node-image-amd64-fetch-nvke-age-0c826a20a7b4, nvkr-nvke-node-image-amd64-fetch-nvke-cni-calico, nvkr-nvke-node-image-amd64-fetch-nvke-kubeadm-distro, nvkr-nvke-node-image-amd64-fetch-nvke-spire-agent, nvkr-nvke-node-image-amd64-fetch-ovn-kube-ubuntu, nvkr-nvke-node-image-amd64-fetch-ovn-kubernetes-chart]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: 'nvkr-arc'
    permissions:
      actions: read
      contents: read
    steps:
      - *check-native-linux-amd64
      - name: Prepare KVM access before transfer
        timeout-minutes: 1
        run: |-
          set -eu
          if [ -L /dev/kvm ] || [ ! -c /dev/kvm ]; then
            printf 'NVKR-E-ENGINE-CAPABILITY: native disk runner lacks /dev/kvm\n' >&2
            exit 29
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-) 2>/dev/null; then
            printf 'Preparing /dev/kvm access on the operator-trusted ARC runner\n'
            if ! /usr/bin/timeout --kill-after=5s 15s /usr/bin/sudo -n -- /usr/bin/chmod 0666 /dev/kvm; then
              printf 'NVKR-E-ENGINE-CAPABILITY: unable to prepare /dev/kvm access\n' >&2
              exit 29
            fi
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-); then
            printf 'NVKR-E-ENGINE-CAPABILITY: runner still cannot open /dev/kvm read/write\n' >&2
            id >&2 || true
            stat -c 'uid=%u gid=%g mode=%a' /dev/kvm >&2 || true
            exit 29
          fi
          stat -c 'KVM ready: uid=%u gid=%g mode=%a' /dev/kvm || true
      - *checkout-workflow-source
      - *prepare-stage-nvkr-exec-arc-amd64-kvm
      - *operation-prepare-inputs-part-1
      - *operation-prepare-images-part-2
