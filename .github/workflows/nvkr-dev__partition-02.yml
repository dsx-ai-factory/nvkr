name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-04:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-04 }}
      nvkr-partition-06:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-06 }}
      nvkr-partition-07:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-07 }}
      nvkr-partition-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-09 }}
      nvkr-partition-10:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-10 }}
      nvkr-partition-11:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-11 }}
      nvkr-partition-13:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-13 }}
      nvkr-partition-14:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-14 }}
      nvkr-results-03:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-03 }}
      nvkr-results-03-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-03-statuses }}
      nvkr-results-0e:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e }}
      nvkr-results-0e-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  nvkr-tool-cosign:
    name: 'Acquire pinned cosign'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['build-runner-ubuntu-24-04'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-tool-syft:
    name: 'Acquire pinned syft'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['build-runner-ubuntu-24-04'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [nvkr-tool-cosign, nvkr-tool-syft]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
      nvkr-partition-04: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-06: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-07: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-09: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-10: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-11: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-13: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-partition-14: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-results-03: ${{ format('"nvkr-tool-cosign":{0}', toJSON(needs['nvkr-tool-cosign'])) }}
      nvkr-results-03-statuses: ${{ format('{0}', needs['nvkr-tool-cosign'].result) }}
      nvkr-results-0e: ${{ format('"nvkr-tool-syft":{0}', toJSON(needs['nvkr-tool-syft'])) }}
      nvkr-results-0e-statuses: ${{ format('{0}', needs['nvkr-tool-syft'].result) }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
