# Decisions live in .github/scripts/triage.cjs, tested by `make test-workflow-scripts`.
# Both jobs check out only the base branch's scripts; no PR code is checked
# out or executed with the write token.
name: Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issues:
    if: github.event_name == 'issues'
    name: Mark Issues for Triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Add intake labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const triage = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.cjs`);
            await triage.issueIntake({ github, context, core });

  pull-requests:
    if: github.event_name == 'pull_request_target'
    name: Label Pull Requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The default pull_request_target ref is the base branch. Deliberately
      # omit issues:write, which labeler needs to create repository labels.
      - name: Check out base configuration and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/labeler.yml
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Label changed paths
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Label size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const triage = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.cjs`);
            await triage.prSize({ github, context, core });
