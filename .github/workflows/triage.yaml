name: Triage

on:
  issues:
    types: [opened]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  issues:
    if: github.event_name == 'issues'
    name: Mark Issues for Triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Add intake labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo,
              issue_number: context.issue.number,
            });
            const existing = new Set(issue.labels.map(label => label.name));
            const wanted = new Set(['needs-triage']);
            // Use the form's exact component, not keywords in logs or examples.
            // Free text before or after the dropdown can repeat the heading;
            // infer nothing unless exactly one Component section exists.
            const sections = [...(issue.body || '').matchAll(
              /^### Component(?:\r?\n)+([^\r\n]+)/gm
            )];
            const component = sections.length === 1 ? sections[0][1].trim() : undefined;
            if (component === 'Docs / examples') wanted.add('documentation');
            // NVKR has no area/* taxonomy. Only infer existing labels from
            // an explicit title scope.
            const scope = issue.title.match(/^[a-z]+\(([^)]+)\)!?: /)?.[1];
            const scopes = new Map([
              ['ci', 'github_actions'], ['docs', 'documentation'],
              ['docker', 'docker'], ['go', 'go'],
            ]);
            if (scopes.has(scope)) wanted.add(scopes.get(scope));
            const labels = [...wanted].filter(label => !existing.has(label)).sort();
            if (!labels.length) return;

            // A maintainer must provision missing labels. Check the entire
            // set before writing; this workflow never creates repository labels.
            const available = new Set((await github.paginate(
              github.rest.issues.listLabelsForRepo,
              { ...context.repo, per_page: 100 }
            )).map(label => label.name));
            const missing = labels.filter(label => !available.has(label));
            if (missing.length) {
              core.setFailed(`Missing repository labels: ${missing.join(', ')}`);
              return;
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels,
            });
            // Maintainers remove needs-triage after review. Type labels from
            // issue forms and inferred labels do not establish completed triage.

  pull-requests:
    if: github.event_name == 'pull_request_target'
    name: Label Pull Requests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: labeler reads the configuration from the base repository
      # via the API. No PR code executes with the write token. Deliberately
      # omit issues:write, which labeler needs to create repository labels.
      - name: Label changed paths
        uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false
