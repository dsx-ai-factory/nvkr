name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-12:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-12 }}
      nvkr-partition-13:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-13 }}
      nvkr-partition-15:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-15 }}
      nvkr-results-00:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-00 }}
      nvkr-results-00-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-00-statuses }}
      nvkr-results-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09 }}
      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
      nvkr-results-0c:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0c }}
      nvkr-results-0c-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0c-statuses }}
      nvkr-results-13:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-13 }}
      nvkr-results-13-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-13-statuses }}
      nvkr-results-14:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-14 }}
      nvkr-results-14-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-14-statuses }}
      nvkr-results-1b:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1b }}
      nvkr-results-1b-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1b-statuses }}
      nvkr-results-1c:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1c }}
      nvkr-results-1c-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1c-statuses }}
      nvkr-results-1d:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1d }}
      nvkr-results-1d-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-1d-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  nvkr-capi-controller-image-sbom:
    name: 'Generate SBOMs: capi-controller-image'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-process-capi-controller-image-pull-c-d7d51b217a77'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-tool-syft'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
