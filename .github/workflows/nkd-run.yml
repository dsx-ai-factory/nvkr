        run: chmod +x ./nkd-exec
      - name: Prepare private native toolchains
        env:
          NKD_TOOLCHAIN_READ_TOKEN: '${{ github.token }}'
          NKD_TOOLCHAIN_READ_USER: '${{ github.actor }}'
        run: ./nkd-exec factory github prepare-images --plan .github/nkd-run/plan.json --stage nkd-nke-node-image-amd64-fetch-source-3f-1d671fc59ece
