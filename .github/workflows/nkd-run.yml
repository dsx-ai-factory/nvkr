  nkd-lifecycle-run:
    name: Finalize Run and check completeness
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    needs: [build-runner-ubuntu-latest, nkd-attest-sboms-release, nkd-controller-chart-build-nke-controller-chart, nkd-controller-chart-fetch-source-533797-2bcfe957eb36, nkd-controller-chart-terminal-observe, nkd-cwe-build-nke-controller, nkd-cwe-fetch-source-ef487f76cf9f0ef93e2-c9b45c9e168a, nkd-postgresql-pull-postgresql-chart, nkd-process-controller-chart-sbom-cwe-sb-a563ecdffba4, nkd-process-cwe-terminal-observe-package-e18762b8b021, nkd-process-postgresql-terminal-observe-555d0da8f385, nkd-process-spire-crds-terminal-observe-82be9f86e106, nkd-process-spire-terminal-observe-package-spire, nkd-process-temporal-terminal-observe-pa-d14ae446c67c, nkd-publish-release, nkd-sign-release, nkd-spire-crds-pull-spire-crds-chart, nkd-spire-pull-spire-chart, nkd-temporal-pull-temporal-chart, nkd-tool-cosign, nkd-tool-syft, nkd-verify-publication-release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: 'Download NKD runner'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: 'nkd-exec-ubuntu-latest'
          path: '.'
      - name: Prepare helper
        run: chmod +x ./nkd-exec
      - name: Download artifacts and evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: '{nkd-artifact-controller-chart-nke-controller-chart,nkd-artifact-cwe-nke-controller,nkd-artifact-postgresql-postgresql-chart,nkd-artifact-spire-crds-spire-crds-chart,nkd-artifact-spire-spire-chart,nkd-artifact-temporal-temporal-chart,nkd-observation-controller-chart,nkd-observation-cwe,nkd-observation-postgresql,nkd-observation-spire,nkd-observation-spire-crds,nkd-observation-temporal,nkd-package-controller-chart,nkd-package-cwe,nkd-package-postgresql,nkd-package-release,nkd-package-spire,nkd-package-spire-crds,nkd-package-temporal,nkd-predicate-release,nkd-prepared-release,nkd-publication-release,nkd-result-controller-chart-nke-controller-chart,nkd-result-cwe-nke-controller,nkd-result-postgresql-postgresql-chart,nkd-result-spire-crds-spire-crds-chart,nkd-result-spire-spire-chart,nkd-result-temporal-temporal-chart,nkd-sbom-controller-chart,nkd-sbom-cwe,nkd-sbom-postgresql,nkd-sbom-spire,nkd-sbom-spire-crds,nkd-sbom-temporal,nkd-signature-release,nkd-source-controller-chart-fetch-source-790511a214f5,nkd-source-cwe-fetch-source-ef487f76cf9f-f736290b13b9,nkd-source-receipt-controller-chart-fetc-683f851a4802,nkd-source-receipt-cwe-fetch-source-ef48-5b738fb9d582,nkd-tool-cosign,nkd-tool-syft,nkd-verification-release}'
          path: .nkd/carriers
          merge-multiple: 'true'
      - name: Recover planned carriers
        id: recover-artifacts
        env:
          NKD_JOB_RESULTS: ${{ toJSON(needs) }}
        run: ./nkd-exec factory github recover --plan .github/nkd-run/plan.json
      - name: Finalize Run and check completeness
        id: finalize-catalog
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_GLOBAL: '/dev/null'
          GIT_CONFIG_KEY_0: 'credential.helper'
          GIT_CONFIG_KEY_1: 'credential.useHttpPath'
          GIT_CONFIG_KEY_2: 'url.https://github.com/dsx-ai-factory/nke.insteadOf'
          GIT_CONFIG_KEY_3: 'credential.https://github.com/dsx-ai-factory/nke.helper'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_VALUE_1: 'true'
          GIT_CONFIG_VALUE_2: 'https://github.com/dsx-ai-factory/nke'
          GIT_CONFIG_VALUE_3: '!f() { if [ "$1" = get ]; then printf ''%s\n'' ''username=x-access-token'' "password=$NKD_PIN_SOURCE_TOKEN_0"; fi; }; f'
          GIT_TERMINAL_PROMPT: '0'
          NKD_PIN_SOURCE_TOKEN_0: '${{ secrets.NKE_SOURCE_TOKEN }}'
        run: |
          set -eu
          [ -n "${NKD_PIN_SOURCE_TOKEN_0:-}" ] || { printf '%s\n' 'nkdctl: [NKD-E-FETCH-FAILED] source credential is empty' >&2; exit 20; }
          ./nkd-exec run finalize --definition definitions/nke-deploy/definition.yaml --environment definitions/nke-deploy/environment-github.yaml --plan .github/nkd-run/plan.json --attempt "${{ github.run_id }}-${{ github.run_attempt }}" --workspace .nkd/factory --out .nkd/run.json
      - name: Upload final Run record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: nkd-lifecycle-run
          path: .nkd/run.json
          if-no-files-found: error
