# Repository checks: the same formatting, analysis, test and build gates used locally.
# Product execution and publication belong to the generated Run workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: fmt-check
        run: make fmt-check

      - name: vet
        run: make vet

      # golangci-lint-action v9 supports the golangci-lint v2 config schema
      # (.golangci.yml `version: "2"`). SHA-pinned for supply-chain safety.
      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

      - name: shellcheck
        run: make shellcheck

      - name: test (race + coverage)
        run: make test

      - name: build
        run: make build
