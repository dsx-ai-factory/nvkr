# Repository checks: the same formatting, analysis, test and build gates used locally.
# Product execution and publication belong to the generated Run workflow.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: .go-version
          cache: true

      - name: fmt-check
        run: make fmt-check

      - name: vet
        run: make vet

      # golangci-lint-action v9 supports the golangci-lint v2 config schema
      # (.golangci.yml `version: "2"`). SHA-pinned for supply-chain safety.
      - name: lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.13.1

      - name: shellcheck
        run: make shellcheck

      - name: test (race + coverage)
        run: make test

      - name: build
        run: make build
