      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
      nvkr-results-0a:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0a }}
      nvkr-results-0a-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0a-statuses }}
