---
name: Native runtime consumer proof

# Deliberate proof revisions trigger this job. Other implementation pushes do
# not spend a native attempt. This workflow has no upstream or PR trigger.
'on':
  push:
    branches: ['fm/toolchain-retire-3-mkosi']
    paths: ['.github/workflows/runtime-namespace-proof.yml']

permissions:
  contents: read

concurrency:
  group: runtime-namespace-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assembly:
    if: github.repository == 'njhensley/nvkr'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # First corrected archive run: outer and inner adapter paths, epoch zero.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check namespace devices, resolver ownership and session isolation
        env:
          NAMESPACE_EVIDENCE: ${{ runner.temp }}/runtime-namespace-evidence
        run: bash scripts/test-runtime-namespace.sh "$NAMESPACE_EVIDENCE"
      - name: Prove original runtime receipts and bounded guest disk build
        env:
          CONSUMER_EVIDENCE: ${{ runner.temp }}/runtime-consumer-evidence
        run: bash scripts/test-runtime-consumer.sh "$CONSUMER_EVIDENCE"
      - name: Retain text diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: runtime-consumer-evidence
          path: |
            ${{ runner.temp }}/runtime-namespace-evidence/inputs.txt
            ${{ runner.temp }}/runtime-namespace-evidence/namespaces.log
            ${{ runner.temp }}/runtime-consumer-evidence/inputs.txt
            ${{ runner.temp }}/runtime-consumer-evidence/prepare.log
            ${{ runner.temp }}/runtime-consumer-evidence/consumer.log
            ${{ runner.temp }}/runtime-consumer-evidence/export.log
            ${{ runner.temp }}/runtime-consumer-evidence/disk-result.json
            ${{ runner.temp }}/runtime-consumer-evidence/disk-observation.json
            ${{ runner.temp }}/runtime-consumer-evidence/runtime-sbom/
            ${{ runner.temp }}/runtime-consumer-evidence/runtime-observation.json
            ${{ runner.temp }}/runtime-consumer-evidence/runtime-tar-entries.json
          if-no-files-found: error
          retention-days: 7
