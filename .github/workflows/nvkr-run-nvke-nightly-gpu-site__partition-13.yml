          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-process-capnico-controller-linux-amd-5f43e949be81'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-tool-syft'].result == 'success' }}
