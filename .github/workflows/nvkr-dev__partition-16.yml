name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-18:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-18 }}
      nvkr-results-02:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-02 }}
      nvkr-results-02-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-02-statuses }}
      nvkr-results-05:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05 }}
      nvkr-results-05-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05-statuses }}
      nvkr-results-07:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-07 }}
      nvkr-results-07-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-07-statuses }}
      nvkr-results-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09 }}
      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
      nvkr-results-0b:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0b }}
      nvkr-results-0b-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0b-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_DEV_REGISTRY_READ:
        required: true
permissions:
  contents: read
jobs:
  nvkr-verify-publication-output-capnico-controller:
    name: 'Verify release and deliverable signatures: output-capnico-controller'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-capnico-controller'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-cluster-ap-5fb4884131f8:
    name: 'Verify release and deliverable signatures: output-cluster-api-provider-provisioned'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-cluster-api-provider-provisioned'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-cwe:
    name: 'Verify release and deliverable signatures: output-cwe'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-cwe'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-nico-refer-768f0a1fbfbe:
    name: 'Verify release and deliverable signatures: output-nico-reference-profiles-fixture'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-nico-reference-profiles-fixture'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-verify-publication-output-nvkectl-linux-arm64:
    name: 'Verify release and deliverable signatures: output-nvkectl-linux-arm64'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-sign-output-nvkectl-linux-arm64'].result == 'success' }}
    environment: 'nvkr-dev-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CREDENTIAL: '${{ secrets.NVKR_DEV_REGISTRY_READ }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_DEV_REGISTRY_READ_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [nvkr-verify-publication-output-capnico-controller, nvkr-verify-publication-output-cluster-ap-5fb4884131f8, nvkr-verify-publication-output-cwe, nvkr-verify-publication-output-nico-refer-768f0a1fbfbe, nvkr-verify-publication-output-nvkectl-linux-arm64]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
      nvkr-partition-18: ${{ format('"nvkr-verify-publication-output-capnico-controller":{0},"nvkr-verify-publication-output-cluster-ap-5fb4884131f8":{1},"nvkr-verify-publication-output-cwe":{2},"nvkr-verify-publication-output-nico-refer-768f0a1fbfbe":{3},"nvkr-verify-publication-output-nvkectl-linux-arm64":{4}', toJSON(needs['nvkr-verify-publication-output-capnico-controller']), toJSON(needs['nvkr-verify-publication-output-cluster-ap-5fb4884131f8']), toJSON(needs['nvkr-verify-publication-output-cwe']), toJSON(needs['nvkr-verify-publication-output-nico-refer-768f0a1fbfbe']), toJSON(needs['nvkr-verify-publication-output-nvkectl-linux-arm64'])) }}
      nvkr-results-02: ${{ format('"nvkr-verify-publication-output-capnico-controller":{0}', toJSON(needs['nvkr-verify-publication-output-capnico-controller'])) }}
      nvkr-results-02-statuses: ${{ format('{0}', needs['nvkr-verify-publication-output-capnico-controller'].result) }}
      nvkr-results-05: ${{ format('"nvkr-verify-publication-output-cwe":{0}', toJSON(needs['nvkr-verify-publication-output-cwe'])) }}
      nvkr-results-05-statuses: ${{ format('{0}', needs['nvkr-verify-publication-output-cwe'].result) }}
      nvkr-results-07: ${{ format('"nvkr-verify-publication-output-nvkectl-linux-arm64":{0}', toJSON(needs['nvkr-verify-publication-output-nvkectl-linux-arm64'])) }}
      nvkr-results-07-statuses: ${{ format('{0}', needs['nvkr-verify-publication-output-nvkectl-linux-arm64'].result) }}
      nvkr-results-09: ${{ format('"nvkr-verify-publication-output-nico-refer-768f0a1fbfbe":{0}', toJSON(needs['nvkr-verify-publication-output-nico-refer-768f0a1fbfbe'])) }}
      nvkr-results-09-statuses: ${{ format('{0}', needs['nvkr-verify-publication-output-nico-refer-768f0a1fbfbe'].result) }}
      nvkr-results-0b: ${{ format('"nvkr-verify-publication-output-cluster-ap-5fb4884131f8":{0}', toJSON(needs['nvkr-verify-publication-output-cluster-ap-5fb4884131f8'])) }}
      nvkr-results-0b-statuses: ${{ format('{0}', needs['nvkr-verify-publication-output-cluster-ap-5fb4884131f8'].result) }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
