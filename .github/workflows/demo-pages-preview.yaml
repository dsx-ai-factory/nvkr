name: Demo Pages preview

'on':
  push:
    branches:
      - codex/nvke-recipes-pages
    paths:
      - 'demos/*.html'
      - scripts/build-demo-site.sh
      - .github/workflows/demo-pages-preview.yaml

permissions:
  contents: read

# Pages has one deployment destination for this repository.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the feature branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assemble the static demo site
        run: bash scripts/build-demo-site.sh dist/demo-site
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist/demo-site

  deploy:
    needs: build
    if: >-
      github.repository == 'dsx-ai-factory/nke-recipes' &&
      github.ref == 'refs/heads/codex/nvke-recipes-pages' &&
      vars.DEMO_PAGES_PREVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require private Pages before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" > "$RUNNER_TEMP/demo-pages-settings.json"
          if ! jq -e '.public == false and .build_type == "workflow" and .https_enforced == true' \
              "$RUNNER_TEMP/demo-pages-settings.json" > /dev/null; then
            echo '::error::Pages must use private visibility, GitHub Actions, and enforced HTTPS.'
            exit 1
          fi
      - name: Deploy the preview artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
