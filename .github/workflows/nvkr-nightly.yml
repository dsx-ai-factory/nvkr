---
name: NVKR nightly NVKE end-to-end tests

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvkr-nightly-${{ github.ref }}
  cancel-in-progress: false

# Build and test together. Product bytes stay on this disposable runner.
jobs:
  e2e:
    name: Build latest NVKE and run NVKR Go E2E (AMD64)
    if: github.event_name != 'schedule' || github.repository == 'dsx-ai-factory/nvkr'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Admit a public GitHub-hosted AMD64 runner
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          test -c /dev/kvm
          printf 'NVKR_JOB_DEADLINE=%s\n' "$(( $(date +%s) + 350 * 60 ))" >> "$GITHUB_ENV"
          nproc
          free -m
          df -Pm "$RUNNER_TEMP"
      - name: Reclaim unused SDK space on the disposable hosted runner
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Fixed preinstalled SDKs are unused by this Go/KVM job. Reclaim them
          # before checkout/build; preserve Docker, Go, sources and all outputs.
          df -Pm "$RUNNER_TEMP"
          sudo -n timeout --kill-after=10s 300s rm -rf -- \
            /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -Pm "$RUNNER_TEMP"
      - name: Check out the dispatched NVKR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve NVKE main once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: main
          path: nvke-source
          # The local clone also supplies the catalogs' retained baseline pins.
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze this cycle's product source
        run: |
          set -euo pipefail
          commit=$(git -C nvke-source rev-parse HEAD)
          printf 'NVKR_NVKE_E2E_SOURCE_COMMIT=%s\n' "$commit" >> "$GITHUB_ENV"
          printf 'NVKE_LOCAL_CLONE=%s/nvke-source\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf 'NVKR commit: %s\n\nNVKE commit: %s\n' "$GITHUB_SHA" "$commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up the repository's Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Set up container-backed Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          cache-binary: false
      - name: Install native VM prerequisites on the disposable runner
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo -n timeout --kill-after=10s 180s apt-get update
          sudo -n timeout --kill-after=10s 600s apt-get install -y --no-install-recommends \
            acl git make gcc libc6-dev jq coreutils python3 openssh-client bash curl openssl \
            libvirt-daemon-system libvirt-clients qemu-utils qemu-system-x86 ovmf \
            cloud-image-utils swtpm swtpm-tools gnutls-bin ipxe-qemu \
            dnsmasq-base iptables iproute2 libcap2-bin e2fsprogs kmod time
          # Persist this disposable runner's grant when udev reapplies device policy.
          id
          stat -c 'KVM before: uid=%u gid=%g mode=%a inode=%i device=%t:%T' /dev/kvm
          getfacl -cp /dev/kvm
          printf 'KERNEL=="kvm", OWNER="%s", GROUP="kvm", MODE="0660", OPTIONS+="static_node=kvm"\n' "$(id -u)" | \
            sudo -n timeout --kill-after=5s 15s tee /etc/udev/rules.d/99-nvkr-kvm.rules
          sudo -n timeout --kill-after=5s 15s udevadm verify /etc/udev/rules.d/99-nvkr-kvm.rules
          sudo -n timeout --kill-after=5s 15s udevadm control --reload-rules
          sudo -n timeout --kill-after=5s 30s udevadm trigger --name-match=kvm
          sudo -n timeout --kill-after=5s 30s udevadm settle --timeout=25
          stat -c 'KVM ready: uid=%u gid=%g mode=%a inode=%i device=%t:%T' /dev/kvm
          getfacl -cp /dev/kvm
          (exec 3<>/dev/kvm)
          sudo -n -k timeout --signal=TERM --kill-after=5s 25s true
          docker info --format '{{.OSType}}/{{.Architecture}}'
      - name: Build the existing Linux bootstrap backend from pinned public source
        timeout-minutes: 20
        env:
          GOENV: 'off'
          GOWORK: 'off'
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/nightly-lima-source"
          prefix="$RUNNER_TEMP/nightly-lima"
          test ! -e "$source" && test ! -e "$prefix"
          git init "$source"
          git -C "$source" remote add origin https://github.com/lima-vm/lima.git
          timeout --kill-after=10s 180s git -C "$source" fetch --depth=1 origin f47461ed7d03f300297e01fd659e9aefc6c228b9
          git -C "$source" checkout --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse 'HEAD^{tree}')" = 525cd5017b050291ab824892d624bbbacf7f8e7e
          timeout --kill-after=30s 900s make -C "$source" native documentation install PREFIX="$prefix"
          install -m 0644 "$source/NOTICE" "$prefix/share/doc/lima/NOTICE"
          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - name: Build the existing NVKR executables
        timeout-minutes: 20
        run: timeout --kill-after=10s 1100s make build demo
      - name: Configure the hosted VM test
        run: |
          set -euo pipefail
          umask 077
          # Initial hosted profile; acceptance requires a real E2E run.
          cat > "$RUNNER_TEMP/nightly-e2e.yaml" <<EOF
          version: 1
          build:
            repo: "$GITHUB_WORKSPACE"
            attempt: "nightly-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            jobs: 1
            nvkeClone: "$NVKE_LOCAL_CLONE"
          run:
            out: "$RUNNER_TEMP/nightly-site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            timeoutSeconds: 3600
            tenantWorkers: 1
            resources:
              siteMemoryGiB: 4
              tenantMemoryGiB: 4
              headroomMiB: 1024
              vcpus: 2
          EOF
          printf 'NVKR_NVKE_E2E_CONFIG=%s/nightly-e2e.yaml\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build NVKE and run the existing Go site and tenant E2E with cleanup
        env:
          NVKR_NVKE_E2E: '1'
          NVKR_NVKE_E2E_TENANT: '1'
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s go test ./internal/nvkedemo -list '^TestEndToEnd$' | grep -Fx TestEndToEnd
          remaining=$(( NVKR_JOB_DEADLINE - $(date +%s) ))
          # TestEndToEnd reserves two hours inside this deadline for owned cleanup.
          (( remaining > 125 * 60 ))
          bash scripts/ci-measure-workload.sh \
            go test ./internal/nvkedemo -run '^TestEndToEnd$' -count=1 -v -timeout "${remaining}s"
      - name: Record final hosted allocation
        if: always()
        run: |
          free -m
          df -Pm "$RUNNER_TEMP"
          timeout --kill-after=2s 10s id || true
          timeout --kill-after=2s 10s stat -c 'KVM final: uid=%u gid=%g mode=%a inode=%i device=%t:%T' /dev/kvm || true
          timeout --kill-after=2s 10s getfacl -cp /dev/kvm || true
