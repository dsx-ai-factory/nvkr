---
name: NVKR nightly NVKE qualification

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Maintained nightly project to build and qualify
        type: choice
        required: true
        default: all
        options:
          - all
          - nvke-nightly-arm64
          - nvke-nightly-upstream-ovn-arm64

permissions:
  contents: read

concurrency:
  group: nvkr-nightly-main
  cancel-in-progress: false

jobs:
  select:
    if: github.repository == 'dsx-ai-factory/nvkr' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profiles.outputs.matrix }}
    steps:
      - name: Check out the exact coordinator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select maintained nightly projects
        id: profiles
        env:
          PROFILE: ${{ inputs.profile || 'all' }}
        run: |
          set -euo pipefail
          jq --arg profile "$PROFILE" '
            [.[] | select($profile == "all" or .name == $profile) |
              {name, harness_commit, runtime_target, network}]
          ' definitions/nightly-profiles.json > "$RUNNER_TEMP/nightly-selection.json"
          matrix=$(jq -ce --arg profile "$PROFILE" '
            [.[] | select($profile == "all" or .name == $profile)] |
            if length > 0 and all(.[];
              (.name == "nvke-nightly-arm64" or
                .name == "nvke-nightly-upstream-ovn-arm64") and
              (.harness_commit | test("^[0-9a-f]{40}$")) and
              .runtime_target == "native-arm64-vm" and
              (.network == "ovn" or .network == "upstream-ovn")) and
              (map(.name) | length == (unique | length)) then
              {include: map({name, harness_commit})}
            else error("invalid maintained nightly profile") end
          ' definitions/nightly-profiles.json)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
      - name: Preserve public nightly selection report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-selection.json
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Build and publish ${{ matrix.name }}
    needs: [select]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Check out the exact coordinator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Dispatch and join this project's exact producer Run
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bash scripts/nightly-build.sh definitions/nightly-profiles.json "$PROFILE" \
            "$RUNNER_TEMP/nightly-build-$PROFILE"
      - name: Preserve exact producing Run facts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-build-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-build-${{ matrix.name }}/build.json
          if-no-files-found: warn
          retention-days: 7

  qualify:
    name: Qualify published ${{ matrix.name }}
    needs: [select, build]
    if: always() && needs.select.result == 'success' && !cancelled()
    runs-on: arc-arm64-kvm
    environment: nkd-arc
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      packages: read
    concurrency:
      group: nvkr-nightly-native-arm64-runtime
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Check out the exact coordinator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the repository's Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build the existing network privilege probe
        env:
          GOTOOLCHAIN: local
        run: make demo
      - name: Admit the configured native runtime host
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          test "$(go env GOOS)/$(go env GOARCH)" = linux/arm64
          for tool in bash git gh jq curl timeout sha256sum docker sudo qemu-img \
            qemu-system-aarch64 cloud-localds virsh ip iptables dnsmasq setcap getcap ps sysctl \
            swtpm flock setsid openssl ss make awk df sort seq; do
            command -v "$tool" >/dev/null || { echo "::error::Missing native host prerequisite: $tool"; exit 1; }
          done
          test -c /dev/kvm && test -r /dev/kvm && test -w /dev/kvm
          exec 3<>/dev/kvm
          exec 3>&-
          docker_platform=$(timeout --kill-after=5s 30s docker info --format '{{.OSType}}/{{.Architecture}}')
          case "$docker_platform" in
            linux/aarch64|linux/arm64) ;;
            *) echo '::error::Docker must use the same native Linux ARM64 host'; exit 1 ;;
          esac
          test ! -e .nightly-private && test ! -L .nightly-private
          install -d -m 0700 .nightly-private
      - name: Download this cycle's exact producing Run locator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: nightly-build-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nightly-private/build
      - name: Check out the reviewed NVKE qualification suite
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: ${{ matrix.harness_commit }}
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          path: .nightly-private/nvke
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch and check the independent native verifier
        env:
          COSIGN_DIGEST: c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/nightly-cosign-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$destination" && test ! -L "$destination"
          install -d -m 0700 "$destination"
          curl --fail --location --proto '=https' --proto-redir '=https' --connect-timeout 20 \
            --max-time 180 --max-filesize 134217728 \
            --output "$destination/cosign" \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-arm64
          printf '%s  %s\n' "$COSIGN_DIGEST" "$destination/cosign" | sha256sum -c -
          chmod 0500 "$destination/cosign"
          printf 'NVKR_NIGHTLY_COSIGN=%s\n' "$destination/cosign" >> "$GITHUB_ENV"
      - name: Authenticate the publication and run the existing NVKE Go suite
        env:
          GOTOOLCHAIN: local
          GH_TOKEN: ${{ github.token }}
          NVKR_NIGHTLY_ENABLE: '1'
          NVKR_NIGHTLY_PROFILE: ${{ matrix.name }}
          NVKR_NIGHTLY_PROFILES: ${{ github.workspace }}/definitions/nightly-profiles.json
          NVKR_NIGHTLY_BUILD: ${{ github.workspace }}/.nightly-private/build/build.json
          NVKR_NIGHTLY_SOURCE: ${{ github.workspace }}/.nightly-private/nvke
          NVKR_NIGHTLY_NETWORK_HELPER: ${{ github.workspace }}/bin/nvke-demo
          NVKR_NIGHTLY_WORKSPACE: ${{ runner.temp }}/nightly-candidate-${{ matrix.name }}
          NVKR_NIGHTLY_REPORTS: ${{ runner.temp }}/nightly-reports-${{ matrix.name }}
          NVKR_NIGHTLY_COSIGN_DIGEST: sha256:c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
        run: |
          set -euo pipefail
          go test ./internal/nvkedemo -list '^TestNightlyPublishedCandidate$' \
            | grep -Fx TestNightlyPublishedCandidate
          go test ./internal/nvkedemo -run '^TestNightlyPublishedCandidate$' -timeout 330m -count=1 -v
      - name: Preserve public qualification and cleanup reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: nightly-qualification-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-reports-${{ matrix.name }}/*
          if-no-files-found: warn
          retention-days: 7
