    runs-on: 'arc-arm64-kvm'
    timeout-minutes: 1045
    needs: [nvkr-process-nvke-node-image-arm64-fetch-d7223cad4f91, nvkr-process-nvke-node-image-arm64-fetch-e9a5fa8aae76]
