          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-2'] }}
      - name: 'Build and package producer evidence for nvke-node-image-arm64'
        id: run-disk
        run: ./nvkr-exec factory github run-disk --plan .github/nvkr-run-nvke-nightly-arm64/plan.json --output nvke-node-image-arm64
      - name: Upload failed Packer diagnostics
        uses: ./.github/nvkr-run-nvke-nightly-arm64/actions/shared/upload-carrier
