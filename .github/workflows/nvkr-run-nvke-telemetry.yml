    needs: [build-runner-ubuntu-24-04, build-runner-ubuntu-24-04-arm, nvkr-nktp-collector-image-arm64-pull-nktp-85cb8e91f658, nvkr-nktp-kube-state-metrics-image-arm64-5e368a6dbdf1, nvkr-nktp-kubectl-image-arm64-pull-nktp-kubectl-image, nvkr-nktp-lgtm-image-arm64-pull-nktp-lgtm-image, nvkr-nktp-metrics-server-image-arm64-pull-3fed0eeaa550, nvkr-nktp-node-exporter-image-arm64-pull-1c64e723ec3e, nvkr-nktp-operator-image-arm64-pull-nktp-37961a5b06a1, nvkr-nktp-target-allocator-image-arm64-pu-0868c06386fa, nvkr-process-attest-sboms-output-nktp-col-98aa450d2a81, nvkr-process-attest-sboms-output-nktp-col-c9e8019a40a7, nvkr-process-attest-sboms-output-nktp-kub-38a63daab836, nvkr-process-attest-sboms-output-nktp-kub-5638c7305c6a, nvkr-process-attest-sboms-output-nktp-kub-c8449a367a99, nvkr-process-attest-sboms-output-nktp-kub-c9a4d1b91ba8, nvkr-process-attest-sboms-output-nktp-lgt-86258a13b688, nvkr-process-attest-sboms-output-nktp-lgt-c01c9ef82851, nvkr-process-attest-sboms-output-nktp-met-5bfa54ed25c3, nvkr-process-attest-sboms-output-nktp-met-adbadf7d0d71, nvkr-process-attest-sboms-output-nktp-nod-588720f4bd6f, nvkr-process-attest-sboms-output-nktp-nod-a5920c5bad6d, nvkr-process-attest-sboms-output-nktp-ope-395e84d470b2, nvkr-process-attest-sboms-output-nktp-ope-47be94f632c0, nvkr-process-attest-sboms-output-nktp-pub-10938e2cfef1, nvkr-process-attest-sboms-output-nktp-tar-e33c954ac0c3, nvkr-process-attest-sboms-output-nktp-tar-e5f55427ab4d, nvkr-process-nktp-collector-image-arm64-t-e4a0801b2bf4, nvkr-process-nktp-collector-image-pull-nk-1b2717680e5c, nvkr-process-nktp-fetch-nktp-chart-releas-2adc273b242a, nvkr-process-nktp-kube-state-metrics-imag-4e4b7bd3832b, nvkr-process-nktp-kube-state-metrics-imag-9237b3d3c42d, nvkr-process-nktp-kubectl-image-arm64-ter-267e6d3bc2c7, nvkr-process-nktp-kubectl-image-pull-nktp-7a5465c5ace2, nvkr-process-nktp-lgtm-image-arm64-termin-982447db1bb3, nvkr-process-nktp-lgtm-image-pull-nktp-lg-0ce720331605, nvkr-process-nktp-metrics-server-image-ar-5910963baf4b, nvkr-process-nktp-metrics-server-image-pu-4d0ea0695597, nvkr-process-nktp-node-exporter-image-arm-6e6069e81027, nvkr-process-nktp-node-exporter-image-pul-68a771ea8298, nvkr-process-nktp-operator-image-arm64-te-86709c8a589e, nvkr-process-nktp-operator-image-pull-nkt-61fc7278e4c5, nvkr-process-nktp-target-allocator-image-112efff693b7, nvkr-process-nktp-target-allocator-image-2159442f665d, nvkr-process-package-release-publish-rele-e70edb401cae, nvkr-tool-cosign-module-tags, nvkr-tool-syft-module-tags, preflight-images-ubuntu-24-04]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: 'nvkr-release'
    env:
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_READ_USER }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_READ }}'
    permissions:
      actions: read
      contents: read
    steps:
      - *check-native-linux-amd64
      - *checkout-workflow-source
      - *prepare-stage-nvkr-exec-ubuntu-24-04
      - name: Download artifacts and evidence
        uses: ./.github/nvkr-run-nvke-telemetry/actions/shared/download-carriers
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['transfer-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
        continue-on-error: true
      - name: recover inputs part-1
        uses: ./.github/nvkr-run-nvke-telemetry/actions/shared/recover-inputs
        with:
          nvkr-job-results: ${{ toJSON(needs) }}
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
      - name: Finalize Run and check completeness
        id: finalize-catalog
        run: ./nvkr-exec run finalize --definition inputs/definitions/nvke/telemetry.yaml --environment inputs/environments/github-nvke-telemetry.yaml --plan .github/nvkr-run-nvke-telemetry/plan.json --attempt "${{ github.run_id }}-${{ github.run_attempt }}" --workspace .nvkr/factory --out .nvkr/run.json --handoff .nvkr/qualification/handoff.json
      - name: Upload final Run record
        id: upload-run-record
        uses: ./.github/nvkr-run-nvke-telemetry/actions/ci-upload
        if: ${{ always() }}
        with:
          name: nvkr-lifecycle-run
          path: .nvkr/run.json
          if-no-files-found: error
          retention-days: 7
          nvkr-ci-always: "true"
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: Upload complete qualification handoff
        uses: ./.github/nvkr-run-nvke-telemetry/actions/shared/upload-carrier
        with:
          with-path: ""
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['transfer-2'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
        if: ${{ success() }}
        timeout-minutes: 5
      - name: Summarize Run result
        id: summarize-run-end
        if: ${{ always() }}
        continue-on-error: true
        env:
          NVKR_FINALIZE_OUTCOME: '${{ steps.finalize-catalog.outcome }}'
          NVKR_JOB_RESULTS: '${{ join(needs.*.result, '' '') }}'
          NVKR_JOB_STATUS: '${{ job.status }}'
          NVKR_RUN_ARTIFACT_URL: '${{ steps.upload-run-record.outputs.artifact-url }}'
          NVKR_RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          NVKR_UPLOAD_OUTCOME: '${{ steps.upload-run-record.outcome }}'
        run: |
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          [ ! -L "$GITHUB_STEP_SUMMARY" ] || exit 0
          [ ! -e "$GITHUB_STEP_SUMMARY" ] || [ -f "$GITHUB_STEP_SUMMARY" ] || exit 0
          set -f
          IFS=' '
          success=0 failure=0 cancelled=0 skipped=0 unknown=0 total=0
          for result in ${NVKR_JOB_RESULTS:-}; do
            total=$((total + 1))
            case "$result" in
              success) success=$((success + 1)) ;;
              failure) failure=$((failure + 1)) ;;
              cancelled) cancelled=$((cancelled + 1)) ;;
              skipped) skipped=$((skipped + 1)) ;;
              *) unknown=$((unknown + 1)) ;;
            esac
          done
          case "${NVKR_FINALIZE_OUTCOME:-}" in
            success) finalization=completed ;;
            failure) finalization=failed ;;
            cancelled) finalization=cancelled ;;
            skipped|'') finalization='not run' ;;
            *) finalization=unknown ;;
          esac
          status='Incomplete (unknown status)'
          if [ "$cancelled" -gt 0 ] || [ "${NVKR_JOB_STATUS:-}" = cancelled ] || [ "${NVKR_FINALIZE_OUTCOME:-}" = cancelled ]; then
            status=Cancelled
          elif [ "$failure" -gt 0 ] || [ "${NVKR_JOB_STATUS:-}" = failure ] || [ "${NVKR_FINALIZE_OUTCOME:-}" = failure ]; then
            status=Failed
          elif [ "$skipped" -gt 0 ] || [ "${NVKR_FINALIZE_OUTCOME:-}" = skipped ]; then
            status='Incomplete (skipped)'
          elif [ "$total" -eq 48 ] && [ "$success" -eq "$total" ] && [ "$unknown" -eq 0 ] && [ "${NVKR_FINALIZE_OUTCOME:-}" = success ] && [ "${NVKR_JOB_STATUS:-}" = success ] && [ "${NVKR_UPLOAD_OUTCOME:-}" = success ]; then
            status=Completed
          fi
          {
            printf '## NVKR Run result: %s\n\n' "$status"
            printf 'Upstream jobs: %s succeeded · %s failed · %s cancelled · %s skipped · %s unknown.\n\n' "$success" "$failure" "$cancelled" "$skipped" "$unknown"
            printf 'Finalization: %s.\n\n' "$finalization"
            case "${NVKR_RUN_URL:-}" in
              *[!a-zA-Z0-9:/._-]*|'') ;;
              https://*) printf '[Job logs](%s)\n\n' "$NVKR_RUN_URL" ;;
            esac
            if [ "${NVKR_UPLOAD_OUTCOME:-}" = success ]; then
              case "${NVKR_RUN_ARTIFACT_URL:-}" in
                *[!a-zA-Z0-9:/._-]*|'') ;;
                https://*) printf '[Run record artifact](%s)\n\n' "$NVKR_RUN_ARTIFACT_URL" ;;
              esac
            fi
            printf 'This summary is diagnostic; the Run record carries the completeness result.\n'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
