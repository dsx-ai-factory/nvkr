jobs:
  nvkr-nvke-node-fde-ubuntu24-amd64-fetch-nvke-doca-ovs:
    name: 'Fetch pinned source for nvke-doca-ovs (nvke-node-fde-ubuntu24-amd64)'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['build-runner-ubuntu-24-04'].result == 'success' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev-nvke-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute source part-1
        uses: ./.github/nvkr-dev-nvke-gpu-site/actions/shared/execute-source
        with:
          nvkr-toolchain-read-token: ${{ secrets.NVKR_REGISTRY_READ }}
          nvkr-toolchain-read-user: ${{ vars.NVKR_REGISTRY_READ_USER }}
          nvkr-source-token: '${{ secrets.NKE_SOURCE_TOKEN }}'
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
