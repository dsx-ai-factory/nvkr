  nvkr-lifecycle-run:
    name: Finalize Run and check completeness
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 120
    needs: [nvkr-results-00, nvkr-results-01, nvkr-results-02, nvkr-results-03, nvkr-results-04, nvkr-results-05, nvkr-results-06, nvkr-results-07, nvkr-results-08, nvkr-results-09, nvkr-results-0a, nvkr-results-0b, nvkr-results-0c, nvkr-results-0d, nvkr-results-0e, nvkr-results-0f]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    environment: 'nvkr-release'
    env:
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_READ_USER }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_READ }}'
    permissions:
      actions: read
      contents: read
    steps:
      - *check-native-linux-amd64
      - *checkout-workflow-source
      - *prepare-stage-nvkr-exec-ubuntu-24-04
      - name: Download artifacts and evidence
        uses: ./.github/nvkr-run-nvke-core/actions/shared/download-carriers
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['transfer-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
        continue-on-error: true
      - name: recover inputs part-1
        uses: ./.github/nvkr-run-nvke-core/actions/shared/recover-inputs
        with:
          nvkr-job-results: ${{ toJSON(needs) }}
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
      - name: Finalize Run and check completeness
        id: finalize-catalog
        env:
          GIT_CONFIG_COUNT: '4'
          GIT_CONFIG_GLOBAL: '/dev/null'
          GIT_CONFIG_KEY_0: 'credential.helper'
          GIT_CONFIG_KEY_1: 'credential.useHttpPath'
          GIT_CONFIG_KEY_2: 'url.https://github.com/dsx-ai-factory/nvke.insteadOf'
          GIT_CONFIG_KEY_3: 'credential.https://github.com/dsx-ai-factory/nvke.helper'
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_VALUE_1: 'true'
          GIT_CONFIG_VALUE_2: 'https://github.com/dsx-ai-factory/nvke'
          GIT_CONFIG_VALUE_3: '!f() { if [ "$1" = get ]; then printf ''%s\n'' ''username=x-access-token'' "password=$NVKR_PIN_SOURCE_TOKEN_0"; fi; }; f'
          GIT_TERMINAL_PROMPT: '0'
          NVKR_PIN_SOURCE_TOKEN_0: '${{ secrets.NKE_SOURCE_TOKEN }}'
        run: |
          set -eu
          [ -n "${NVKR_PIN_SOURCE_TOKEN_0:-}" ] || { printf '%s\n' 'nvkr: [NVKR-E-FETCH-FAILED] source credential is empty' >&2; exit 20; }
          ./nvkr-exec run finalize --definition inputs/definitions/nvke/core.yaml --environment inputs/environments/github-nvke-core.yaml --plan .github/nvkr-run-nvke-core/plan.json --attempt "${{ github.run_id }}-${{ github.run_attempt }}" --workspace .nvkr/factory --out .nvkr/run.json --handoff .nvkr/qualification/handoff.json
      - name: Upload final Run record
        id: upload-run-record
        uses: ./.github/nvkr-run-nvke-core/actions/ci-upload
        if: ${{ always() }}
        with:
          name: nvkr-lifecycle-run
          path: .nvkr/run.json
          if-no-files-found: error
          retention-days: 7
          nvkr-ci-always: "true"
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: Upload complete qualification handoff
        uses: ./.github/nvkr-run-nvke-core/actions/shared/upload-carrier
        with:
          with-path: ""
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['transfer-2'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
        if: ${{ success() }}
        timeout-minutes: 5
      - name: Summarize Run result
        id: summarize-run-end
        if: ${{ always() }}
        continue-on-error: true
        env:
          NVKR_FINALIZE_OUTCOME: '${{ steps.finalize-catalog.outcome }}'
          NVKR_JOB_RESULTS: '${{ join(needs.*.outputs.statuses, '' '') }}'
          NVKR_JOB_STATUS: '${{ job.status }}'
          NVKR_RUN_ARTIFACT_URL: '${{ steps.upload-run-record.outputs.artifact-url }}'
          NVKR_RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          NVKR_UPLOAD_OUTCOME: '${{ steps.upload-run-record.outcome }}'
        run: |
          [ -n "${GITHUB_STEP_SUMMARY:-}" ] || exit 0
          [ ! -L "$GITHUB_STEP_SUMMARY" ] || exit 0
          [ ! -e "$GITHUB_STEP_SUMMARY" ] || [ -f "$GITHUB_STEP_SUMMARY" ] || exit 0
          set -f
          IFS=' '
          success=0 failure=0 cancelled=0 skipped=0 unknown=0 total=0
          for result in ${NVKR_JOB_RESULTS:-}; do
            total=$((total + 1))
            case "$result" in
              success) success=$((success + 1)) ;;
              failure) failure=$((failure + 1)) ;;
              cancelled) cancelled=$((cancelled + 1)) ;;
              skipped) skipped=$((skipped + 1)) ;;
              *) unknown=$((unknown + 1)) ;;
            esac
          done
          case "${NVKR_FINALIZE_OUTCOME:-}" in
            success) finalization=completed ;;
            failure) finalization=failed ;;
            cancelled) finalization=cancelled ;;
            skipped|'') finalization='not run' ;;
            *) finalization=unknown ;;
          esac
          status='Incomplete (unknown status)'
          if [ "$cancelled" -gt 0 ] || [ "${NVKR_JOB_STATUS:-}" = cancelled ] || [ "${NVKR_FINALIZE_OUTCOME:-}" = cancelled ]; then
            status=Cancelled
          elif [ "$failure" -gt 0 ] || [ "${NVKR_JOB_STATUS:-}" = failure ] || [ "${NVKR_FINALIZE_OUTCOME:-}" = failure ]; then
            status=Failed
          elif [ "$skipped" -gt 0 ] || [ "${NVKR_FINALIZE_OUTCOME:-}" = skipped ]; then
            status='Incomplete (skipped)'
          elif [ "$total" -eq 181 ] && [ "$success" -eq "$total" ] && [ "$unknown" -eq 0 ] && [ "${NVKR_FINALIZE_OUTCOME:-}" = success ] && [ "${NVKR_JOB_STATUS:-}" = success ] && [ "${NVKR_UPLOAD_OUTCOME:-}" = success ]; then
            status=Completed
          fi
          {
            printf '## NVKR Run result: %s\n\n' "$status"
            printf 'Upstream jobs: %s succeeded · %s failed · %s cancelled · %s skipped · %s unknown.\n\n' "$success" "$failure" "$cancelled" "$skipped" "$unknown"
            printf 'Finalization: %s.\n\n' "$finalization"
            case "${NVKR_RUN_URL:-}" in
              *[!a-zA-Z0-9:/._-]*|'') ;;
              https://*) printf '[Job logs](%s)\n\n' "$NVKR_RUN_URL" ;;
            esac
            if [ "${NVKR_UPLOAD_OUTCOME:-}" = success ]; then
              case "${NVKR_RUN_ARTIFACT_URL:-}" in
                *[!a-zA-Z0-9:/._-]*|'') ;;
                https://*) printf '[Run record artifact](%s)\n\n' "$NVKR_RUN_ARTIFACT_URL" ;;
              esac
            fi
            printf 'This summary is diagnostic; the Run record carries the completeness result.\n'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
