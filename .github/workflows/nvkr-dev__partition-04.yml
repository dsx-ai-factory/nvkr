name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-05:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-05 }}
      nvkr-results-05:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05 }}
      nvkr-results-05-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05-statuses }}
      nvkr-results-07:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-07 }}
      nvkr-results-07-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-07-statuses }}
      nvkr-results-08:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-08 }}
      nvkr-results-08-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-08-statuses }}
      nvkr-results-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09 }}
      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
      nvkr-results-0c:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0c }}
      nvkr-results-0c-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0c-statuses }}
      nvkr-results-0e:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e }}
      nvkr-results-0e-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0e-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  nvkr-spire-crds-sbom:
    name: 'Generate SBOMs: spire-crds'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-process-spire-crds-pull-spire-crds-c-11103d63a93b'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-tool-syft'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
