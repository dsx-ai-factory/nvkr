# Only default-branch code runs with write access. Artifact content is data.
name: Apply PR Labels

on:
  workflow_run:
    workflows: [PR Labels]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Validated PR Labels
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Check out default-branch configuration and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/labeler.yml
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install locked script dependencies
        run: npm ci --prefix .github/scripts --ignore-scripts --no-audit --no-fund

      # Keep untrusted artifact members outside the trusted code/config tree.
      - name: Download label request from the triggering run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-labels
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/pr-labels

      - name: Validate request and apply labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const triage = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.cjs`);
            await triage.applyPRLabels({ github, context, core });
