# Generated by nvkr catalog update-ci --source-checkout dsx-ai-factory/nvke:NKE_SOURCE_TOKEN — do not edit; regenerate.
# Review the rendered bytes before installing them in .github/workflows/.
# Refreshes the pins of the one maintenance policy
# (inputs/policies/*-catalog-maintenance.yaml) and opens, updates or closes its pull request.
# Candidate validation is diagnostic; production signing/release acceptance is separate.
name: Catalog maintenance
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * *'
permissions:
  contents: read
# A newer run for the same ref cancels this one. The next run moves the review branch to the current
# candidate and opens or edits its pull request, so an interruption between the two converges.
concurrency:
  group: catalog-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      definitions: ${{ steps.discover.outputs.definitions }}
    steps:
      # Check out the default branch so its policy files can be listed.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Name the maintenance policy by its file prefix. The run fails if there is not exactly one.
      - name: List the maintenance policy
        id: discover
        run: |
          set -euo pipefail
          names=$(find inputs/policies -mindepth 1 -maxdepth 1 -name '*-catalog-maintenance.yaml' | sed 's|^inputs/policies/||; s|-catalog-maintenance.yaml$||' | sort)
          if [ -z "$names" ] || [ "$(grep -c '' <<< "$names")" -ne 1 ] || grep -qvx '[abcdefghijklmnopqrstuvwxyz0123456789][abcdefghijklmnopqrstuvwxyz0123456789-]*' <<< "$names"; then
            echo "expected exactly one maintenance policy with a supported name; the generated bundle root is shared" >&2
            exit 1
          fi
          echo "definitions=$(jq -cRn '[inputs]' <<< "$names")" >> "$GITHUB_OUTPUT"

  refresh:
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        definition: ${{ fromJSON(needs.discover.outputs.definitions) }}
    env:
      DEFINITION: ${{ matrix.definition }}
      GOTOOLCHAIN: local
    steps:
      # Check out the default branch as the base for the refresh.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Fetch the private source. This is the only step that receives the source token.
      - name: Fetch the private source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          fetch-depth: 0
          path: .nvkr-inputs/source
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          persist-credentials: false
      # Install the Go version this repository pins.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      # Build the nvkr CLI that performs the refresh.
      - name: Build the nvkr CLI
        run: go build -trimpath -ldflags '-X main.version=dev -X main.commit=unknown' -o "$RUNNER_TEMP/nvkr" ./cmd/nvkr
      # Update the Definition's pins within its registry constraints, regenerate the Run, and record whether anything changed.
      - name: Refresh pins and regenerate the Run
        id: refresh
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.${{ github.workspace }}/.nvkr-inputs/source/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/dsx-ai-factory/nvke
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate"
          "$RUNNER_TEMP/nvkr" catalog refresh --config "inputs/policies/${DEFINITION}-catalog-maintenance.yaml" --source-repository dsx-ai-factory/nvke --json > "$RUNNER_TEMP/refresh.json"
          changed=$(jq -er '.changed | tostring' "$RUNNER_TEMP/refresh.json")
          echo "$changed" > "$RUNNER_TEMP/candidate/changed"
          echo "$DEFINITION" > "$RUNNER_TEMP/candidate/definition"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # Read the paths and validation mode from the policy that the refresh just accepted.
      - name: Read the maintenance policy
        id: policy
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          policy="inputs/policies/${DEFINITION}-catalog-maintenance.yaml"
          catalog=$(yq -e '.catalog' "$policy")
          definition=$(yq -e '.definition' "$policy")
          environment=$(yq -e '.environment' "$policy")
          validation=$(yq -e '.validation' "$policy")
          # The refresh admitted this policy; refuse anything that could still reach the step outputs.
          for value in "$catalog" "$definition" "$environment"; do
            case "$value" in
              '' | *[!ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._/-]*) echo "unsupported maintenance policy path: $value" >&2; exit 1 ;;
            esac
          done
          case "$validation" in
            static | local-run) ;;
            *) echo "unsupported maintenance validation: $validation" >&2; exit 1 ;;
          esac
          {
            echo "catalog=$catalog"
            echo "definition=$definition"
            echo "environment=$environment"
            echo "validation=$validation"
          } >> "$GITHUB_OUTPUT"
      # Write the pull request description listing every changed pin.
      - name: Describe the changed pins
        if: steps.refresh.outputs.changed == 'true'
        env:
          POLICY_DEFINITION: ${{ steps.policy.outputs.definition }}
        run: |
          set -euo pipefail
          jq -er --arg definition "$POLICY_DEFINITION" '
            def code:
              if . == null or . == "" then "—"
              elif explode | any(. < 32 or . > 126 or . == 96 or . == 124) then error("value cannot be rendered in a pull request body")
              else "`" + . + "`" end;
            def change(f): "\(.Before | f | code) → \(.After | f | code)";
            def digests: [(.imageParentDigest // "" | select(. != "") | "parent " + .), (.digests // {} | to_entries | sort_by(.key)[] | .key + " " + .value)] | join("; ");
            def transport: [(.chart // null | select(. != null) | "chart " + .repository + "/" + .name), (.url // "" | select(. != "") | "url " + .)] | join("; ");
            def fields: . as $c | ["tag", "digests", "imageParentDigest", "derivedFrom", "chart", "url"] | map(select($c.Before[.] != $c.After[.])) | join(", ");
            def sourcefields: . as $c | [($c.Before // {}), ($c.After // {})] | map(keys) | add | unique | map(select(($c.Before // {})[.] != ($c.After // {})[.])) | join(", ");
            def table($title; $header; $rule; $rows):
              if ($rows | length) == 0 then empty
              else "## \($title)", "", $header, $rule, ($rows[]), "" end;
            if (.changed | not) or ((.update.Changed // 0) == 0) or ((.planDigest // "") == "") then error("refresh result has no pin changes or Run plan digest") else . end
            | "Automated pin refresh for \($definition | code). The registry constraints are unchanged; this moves only exact pins within them.", "",
              "Generated Run plan: \(.planDigest | code)", "",
              table("Source pins"; "| Pin | Tag | Commit | Tree hash | Derived from | Changed fields |"; "|---|---|---|---|---|---|";
                [(.update.Pins // []) | sort_by(.Name)[] | select(.Changed) | "| \(.Name | code) | \(change(.tag)) | \(change(.commit)) | \(change(.treeHash)) | \(change(.derivedFrom)) | \(sourcefields | code) |"]),
              table("Artifact pins"; "| Pin | Tag | Digest | Derived from | Transport | Changed fields |"; "|---|---|---|---|---|---|";
                [(.update.Artifacts // []) | sort_by(.Name)[] | select(.Changed) | "| \(.Name | code) | \(change(.tag)) | \(change(digests)) | \(change(.derivedFrom)) | \(change(transport)) | \(fields | code) |"]),
              "Merging this pull request changes which pins are released; it does not by itself claim that any producer ran or that any artifact is qualified. Review the lock and generated-file diff, and wait for the checks on this pull request."
          ' "$RUNNER_TEMP/refresh.json" > "$RUNNER_TEMP/candidate/pull-request.md"
      # Save the changed files as a patch for the pull request job.
      - name: Save the candidate patch
        if: steps.refresh.outputs.changed == 'true'
        env:
          POLICY_CATALOG: ${{ steps.policy.outputs.catalog }}
        run: |
          set -euo pipefail
          git add -- "$POLICY_CATALOG/pins.lock.yaml" '.github/nvkr-dev' '.github/nvkr-dev-qualification' '.github/nvkr-qualification' '.github/nvkr-run' '.github/nvkr-run-nvke-core' '.github/nvkr-run-nvke-disks' '.github/nvkr-run-nvke-nightly-arm64' '.github/nvkr-run-nvke-nightly-upstream-ovn-arm64' '.github/nvkr-run-nvke-services' '.github/nvkr-run-nvke-telemetry' '.github/workflows/nvkr-dev-qualify.yml' '.github/workflows/nvkr-dev-smoke.yml' '.github/workflows/nvkr-dev.yml' '.github/workflows/nvkr-qualify.yml' '.github/workflows/nvkr-run-nvke-core.yml' '.github/workflows/nvkr-run-nvke-disks.yml' '.github/workflows/nvkr-run-nvke-nightly-arm64.yml' '.github/workflows/nvkr-run-nvke-nightly-upstream-ovn-arm64.yml' '.github/workflows/nvkr-run-nvke-services.yml' '.github/workflows/nvkr-run-nvke-telemetry.yml' '.github/workflows/nvkr-run.yml' '.github/workflows/nvkr-smoke.yml'
          git diff --cached --binary > "$RUNNER_TEMP/candidate/candidate.patch"
          test -s "$RUNNER_TEMP/candidate/candidate.patch"
      # Build and independently observe every output of the candidate when the policy asks for it. The patch and
      # description are already saved, so nothing this step does to the workspace reaches the pull request.
      - name: Build and independently observe every candidate output
        if: steps.refresh.outputs.changed == 'true' && steps.policy.outputs.validation == 'local-run'
        env:
          ATTEMPT: catalog-${{ github.run_id }}-${{ github.run_attempt }}
          POLICY_DEFINITION: ${{ steps.policy.outputs.definition }}
          POLICY_ENVIRONMENT: ${{ steps.policy.outputs.environment }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.${{ github.workspace }}/.nvkr-inputs/source/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/dsx-ai-factory/nvke
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nvkr" run local --definition "$POLICY_DEFINITION" --environment "$POLICY_ENVIRONMENT" --attempt "$ATTEMPT"
      # Upload the result so later jobs can use it.
      - name: Upload the refresh result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: catalog-candidate-${{ matrix.definition }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7

  select:
    needs: refresh
    if: ${{ !cancelled() && needs.refresh.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      legs: ${{ steps.select.outputs.legs }}
    steps:
      # Download the result of every Definition that refreshed successfully.
      - name: Download the refresh results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: catalog-candidate-*
          path: ${{ runner.temp }}/results
      # List every refreshed Definition and whether its pins changed. A Definition whose refresh failed has no
      # result, so its pull request is left as it is.
      - name: List the refreshed Definitions
        id: select
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/results" && cd "$RUNNER_TEMP/results"
          # One downloaded artifact is extracted directly into this directory and several into
          # one directory each, so find the markers anywhere and read each Definition from its own file.
          # A result without a Definition marker, or with a name that could reach a path or a ref, is refused here;
          # the pull-request job checks the name again before it writes.
          legs=$( { find . -name changed -type f || true; } | sort | while IFS= read -r marker; do
            source="$(dirname "$marker")/definition"
            if [ ! -f "$source" ]; then
              echo "refresh result $marker has no Definition marker" >&2
              exit 1
            fi
            definition=$(cat "$source")
            # The optional opening parenthesis keeps Bash 3.2 from misparsing a case inside $(...).
            case "$definition" in
              ('' | -* | *[!abcdefghijklmnopqrstuvwxyz0123456789-]*) echo "unsupported Definition marker in $source" >&2; exit 1 ;;
            esac
            jq -cn --arg definition "$definition" --arg changed "$(cat "$marker")" \
              '{definition: $definition, changed: (if $changed == "true" then true elif $changed == "false" then false else error("unexpected changed marker") end)}'
          done | jq -cs 'sort_by(.definition)')
          echo "legs=$legs" >> "$GITHUB_OUTPUT"

  pull-request:
    needs: select
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.select.outputs.legs != '[]' }}
    runs-on: ubuntu-24.04
    # The only job that can write. The workflow token stays read-only; writes use a short-lived GitHub App
    # installation token minted in this job for this repository only, with contents, pull requests and workflows.
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.select.outputs.legs) }}
    steps:
      # Refuse a Definition name that could reach a path or a ref.
      - name: Check the Definition name
        env:
          DEFINITION: ${{ matrix.leg.definition }}
        run: |
          set -euo pipefail
          case "$DEFINITION" in
            '' | -* | *[!abcdefghijklmnopqrstuvwxyz0123456789-]*) echo "unsupported Definition name" >&2; exit 1 ;;
          esac
      # Check out the same base commit the refresh used.
      - name: Check out the base commit
        if: ${{ matrix.leg.changed }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Download the patch and description produced by the refresh.
      - name: Download the candidate
        if: ${{ matrix.leg.changed }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: catalog-candidate-${{ matrix.leg.definition }}
          path: ${{ runner.temp }}/candidate
      # Apply the patch and admit only the generated files, as regular files or deletions.
      - name: Apply and check the candidate patch
        if: ${{ matrix.leg.changed }}
        env:
          DEFINITION: ${{ matrix.leg.definition }}
        run: |
          set -euo pipefail
          catalog=$(yq -e '.catalog' "inputs/policies/${DEFINITION}-catalog-maintenance.yaml")
          git apply --index "$RUNNER_TEMP/candidate/candidate.patch"
          while IFS= read -r line; do
            meta=${line%%$'\t'*}
            file=${line#*$'\t'}
            read -r _ mode _ <<< "${meta#:}"
            case "$mode" in
              100644 | 000000) ;;
              *)
                echo "candidate patch gives $file unsupported mode $mode" >&2
                exit 1
                ;;
            esac
            case "$file" in
              "$catalog/pins.lock.yaml" | '.github/nvkr-dev'/* | '.github/nvkr-dev-qualification'/* | '.github/nvkr-qualification'/* | '.github/nvkr-run'/* | '.github/nvkr-run-nvke-core'/* | '.github/nvkr-run-nvke-disks'/* | '.github/nvkr-run-nvke-nightly-arm64'/* | '.github/nvkr-run-nvke-nightly-upstream-ovn-arm64'/* | '.github/nvkr-run-nvke-services'/* | '.github/nvkr-run-nvke-telemetry'/* | '.github/workflows/nvkr-dev-qualify.yml' | '.github/workflows/nvkr-dev-smoke.yml' | '.github/workflows/nvkr-dev.yml' | '.github/workflows/nvkr-qualify.yml' | '.github/workflows/nvkr-run-nvke-core.yml' | '.github/workflows/nvkr-run-nvke-disks.yml' | '.github/workflows/nvkr-run-nvke-nightly-arm64.yml' | '.github/workflows/nvkr-run-nvke-nightly-upstream-ovn-arm64.yml' | '.github/workflows/nvkr-run-nvke-services.yml' | '.github/workflows/nvkr-run-nvke-telemetry.yml' | '.github/workflows/nvkr-run.yml' | '.github/workflows/nvkr-smoke.yml') ;;
              *)
                echo "candidate patch touches unexpected file: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --raw --no-renames)
      # Mint the App installation token that publishes or cleans up, limited to this repository and to contents,
      # pull requests and workflows. The action revokes it when the job ends, whatever its outcome.
      - name: Create the App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT }}
          private-key: ${{ secrets.RELEASE_BOT_SECRET }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      # GitHub attributes the API commit to the App's bot user, so its DCO sign-off names that user.
      - name: Resolve the App bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          case "$APP_SLUG" in
            '' | -* | *[!abcdefghijklmnopqrstuvwxyz0123456789-]*) echo "unsupported App slug" >&2; exit 1 ;;
          esac
          id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          case "$id" in
            '' | *[!0123456789]*) echo "unsupported App bot user id" >&2; exit 1 ;;
          esac
          {
            echo "name=${APP_SLUG}[bot]"
            echo "email=${id}+${APP_SLUG}[bot]@users.noreply.github.com"
          } >> "$GITHUB_OUTPUT"
      # Create the review commit through the GitHub API, so GitHub signs it, and move the Definition's branch to it. Then
      # open its pull request, or update the one that is open. A branch that already holds this candidate on this base
      # commit is left alone, so the head commit, its checks and its approvals survive a nightly run that changes nothing.
      - name: Open or update the pull request
        if: ${{ matrix.leg.changed }}
        env:
          DEFINITION: ${{ matrix.leg.definition }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="catalog-maintenance/${DEFINITION}"
          title="chore(catalog): refresh ${DEFINITION} pins"
          message=$(printf '%s\n\nSigned-off-by: %s <%s>' "$title" "$BOT_NAME" "$BOT_EMAIL")
          # Look the branch up explicitly: a failed lookup fails the step instead of creating or moving it.
          head=$(gh api "repos/${GH_REPO}/git/matching-refs/heads/${branch}" --jq '[.[] | select(.ref == "refs/heads/'"${branch}"'")] | .[0].object.sha // empty')
          # The branch is current when its commit holds exactly this candidate tree on top of this base commit.
          tree=$(git write-tree)
          current=false
          if [ -n "$head" ]; then
            held=$(gh api "repos/${GH_REPO}/git/commits/${head}" --jq '.tree.sha + " " + (.parents[0].sha // "")')
            if [ "$held" = "${tree} ${BASE_SHA}" ]; then current=true; fi
          fi
          # Every lookup keeps only pull requests whose head branch is in this repository: a fork can use the same
          # branch name, and its pull request must never be edited, closed or counted. The filter runs on a bounded
          # page, so a page that could be truncated fails the step instead of hiding the bot's own pull request.
          open=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --limit 1000 --json number,isCrossRepository --jq 'if length >= 1000 then error("pull request lookup may be incomplete") else [.[] | select(.isCrossRepository == false)] | .[0].number // empty end')
          if [ -z "$open" ]; then
            # A pull request that was closed without merging for this very candidate stays closed until the
            # candidate changes, even if its branch was deleted: GitHub keeps a closed pull request's head commit.
            # Only a closed pull request whose head commit holds this tree on this base commit counts; one closed
            # for an older candidate does not stop this candidate's pull request. Nothing is written before this.
            closed=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state closed --limit 1000 --json number,isCrossRepository,mergedAt,headRefOid --jq 'if length >= 1000 then error("pull request lookup may be incomplete") else .[] | select(.isCrossRepository == false and .mergedAt == null) | .headRefOid end')
            while IFS= read -r sha; do
              [ -n "$sha" ] || continue
              carried=$(gh api "repos/${GH_REPO}/git/commits/${sha}" --jq '.tree.sha + " " + (.parents[0].sha // "")')
              if [ "$carried" = "${tree} ${BASE_SHA}" ]; then
                echo "the pull request for this candidate was closed; it stays closed until the candidate changes"
                exit 0
              fi
            done <<< "$closed"
          fi
          if [ "$current" = false ]; then
            # One blob per added or modified file and a null entry per deletion, on top of the base commit's tree.
            entries='[]'
            while IFS= read -r line; do
              meta=${line%%$'\t'*}
              file=${line#*$'\t'}
              read -r _ _ _ _ status <<< "${meta#:}"
              case "$status" in
                D) entries=$(jq -c --arg path "$file" '. + [{path: $path, mode: "100644", type: "blob", sha: null}]' <<< "$entries") ;;
                A | M)
                  blob=$(base64 < "$file" | tr -d '\n' | jq -Rs '{content: ., encoding: "base64"}' | gh api --method POST "repos/${GH_REPO}/git/blobs" --input - --jq .sha)
                  entries=$(jq -c --arg path "$file" --arg sha "$blob" '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' <<< "$entries")
                  ;;
                *) echo "unsupported change $status for $file" >&2; exit 1 ;;
              esac
            done < <(git diff --cached --raw --no-renames)
            test "$entries" != '[]'
            created=$(jq -n --arg base "$(git rev-parse 'HEAD^{tree}')" --argjson tree "$entries" '{base_tree: $base, tree: $tree}' | gh api --method POST "repos/${GH_REPO}/git/trees" --input - --jq .sha)
            # No author or committer is sent, so GitHub attributes and signs the commit.
            commit=$(jq -n --arg message "$message" --arg tree "$created" --arg parent "$BASE_SHA" '{message: $message, tree: $tree, parents: [$parent]}' | gh api --method POST "repos/${GH_REPO}/git/commits" --input - --jq .sha)
            if [ -z "$head" ]; then
              jq -n --arg ref "refs/heads/${branch}" --arg sha "$commit" '{ref: $ref, sha: $sha}' | gh api --method POST "repos/${GH_REPO}/git/refs" --input - > /dev/null
            else
              jq -n --arg sha "$commit" '{sha: $sha, force: true}' | gh api --method PATCH "repos/${GH_REPO}/git/refs/heads/${branch}" --input - > /dev/null
            fi
          fi
          if [ -z "$open" ]; then
            gh pr create --head "$branch" --base "$BASE_BRANCH" --title "$title" --body-file "$RUNNER_TEMP/candidate/pull-request.md"
          elif [ "$current" = true ]; then
            echo "pull request #${open} already carries this candidate"
          else
            gh pr edit "$open" --title "$title" --body-file "$RUNNER_TEMP/candidate/pull-request.md"
          fi
      # Nothing changed, so a pull request and branch left by an earlier candidate are stale: close the one that is
      # open, then delete the branch. If the branch deletion fails, the next run finds no open pull request and
      # deletes it then.
      - name: Close the stale pull request
        if: ${{ !matrix.leg.changed }}
        env:
          DEFINITION: ${{ matrix.leg.definition }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch="catalog-maintenance/${DEFINITION}"
          open=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --limit 1000 --json number,isCrossRepository --jq 'if length >= 1000 then error("pull request lookup may be incomplete") else [.[] | select(.isCrossRepository == false)] | .[0].number // empty end')
          if [ -n "$open" ]; then
            gh pr close "$open" --comment "The pin refresh found nothing to change on ${BASE_SHA}, so this candidate is stale."
          fi
          held=$(gh api "repos/${GH_REPO}/git/matching-refs/heads/${branch}" --jq '[.[] | select(.ref == "refs/heads/'"${branch}"'")] | length')
          if [ "$held" != 0 ]; then
            gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
          fi
