name: Publish capnico-controller +3
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-results-03:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-03 }}
      nvkr-results-03-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-03-statuses }}
      nvkr-results-04:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-04 }}
      nvkr-results-04-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-04-statuses }}
      nvkr-results-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09 }}
      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
      nvkr-results-0c:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0c }}
      nvkr-results-0c-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0c-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_REGISTRY_WRITE:
        required: true
permissions:
  contents: read
jobs:
  nvkr-publish-output-capnico-controller:
    name: 'Publish output-capnico-controller'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    environment: 'nvkr-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CI_REPOSITORY_TOKEN: '${{ github.token }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_WRITE }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_WRITE_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-attest-sboms-output-capnico-controller'].result == 'success' }}
  nvkr-publish-output-cluster-api-provider-provisioned:
    name: 'Publish output-cluster-api-provider-provisioned'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    environment: 'nvkr-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CI_REPOSITORY_TOKEN: '${{ github.token }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_WRITE }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_WRITE_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-attest-sboms-output-cluster-api-prov-270146b5b019'].result == 'success' }}
  nvkr-publish-output-controller-profiles:
    name: 'Publish output-controller-profiles'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    environment: 'nvkr-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CI_REPOSITORY_TOKEN: '${{ github.token }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_WRITE }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_WRITE_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-attest-sboms-output-controller-profiles'].result == 'success' }}
  nvkr-publish-output-cwe:
    name: 'Publish output-cwe'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    environment: 'nvkr-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CI_REPOSITORY_TOKEN: '${{ github.token }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_WRITE }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_WRITE_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-attest-sboms-output-cwe'].result == 'success' }}
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [nvkr-publish-output-capnico-controller, nvkr-publish-output-cluster-api-provider-provisioned, nvkr-publish-output-controller-profiles, nvkr-publish-output-cwe]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
      nvkr-results-03: ${{ format('"nvkr-publish-output-cluster-api-provider-provisioned":{0}', toJSON(needs['nvkr-publish-output-cluster-api-provider-provisioned'])) }}
      nvkr-results-03-statuses: ${{ format('{0}', needs['nvkr-publish-output-cluster-api-provider-provisioned'].result) }}
      nvkr-results-04: ${{ format('"nvkr-publish-output-cwe":{0}', toJSON(needs['nvkr-publish-output-cwe'])) }}
      nvkr-results-04-statuses: ${{ format('{0}', needs['nvkr-publish-output-cwe'].result) }}
      nvkr-results-09: ${{ format('"nvkr-publish-output-capnico-controller":{0}', toJSON(needs['nvkr-publish-output-capnico-controller'])) }}
      nvkr-results-09-statuses: ${{ format('{0}', needs['nvkr-publish-output-capnico-controller'].result) }}
      nvkr-results-0c: ${{ format('"nvkr-publish-output-controller-profiles":{0}', toJSON(needs['nvkr-publish-output-controller-profiles'])) }}
      nvkr-results-0c-statuses: ${{ format('{0}', needs['nvkr-publish-output-controller-profiles'].result) }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
