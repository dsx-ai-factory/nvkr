---
name: NKE direct OS source builds

on:
  pull_request:
    paths:
      - .github/workflows/nke-os-source-build.yaml
      - definitions/nke-os-source/**
      - pkg/nkd/buildgraph/**
      - pkg/nkd/pipeline/**
      - go.mod
      - go.sum
      - .go-version
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Diagnostic source builds only. This is not the generated Release pipeline,
# does not use private NKE sources, and cannot publish or sign artifacts.
jobs:
  source-build:
    name: Native ${{ matrix.arch }} public-source builds
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOTOOLCHAIN: local
      NKD_OS_SOURCE_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check native runner and Docker
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          docker info --format '{{.OSType}}/{{.Architecture}}'
          sudo --non-interactive true
      - name: Resolve both architecture graphs and negative contracts
        run: |
          set -euo pipefail
          go test ./pkg/nkd/buildgraph \
            -run '^TestNKEOSPublicSource(Graphs|MissingToolchainFailsClosed)$' \
            -count=1
      - name: Build pinned public sources offline and rehash outputs
        run: |
          set -euo pipefail
          go test -c -o "$RUNNER_TEMP/nke-os-source.test" ./pkg/nkd/buildgraph
          cd pkg/nkd/buildgraph
          # This credential-free hosted diagnostic uses the rootful Docker
          # daemon. Keep the test's disposable checkout/output owner aligned
          # with that daemon, without weakening Git or source integrity checks.
          sudo --non-interactive --preserve-env=NKD_OS_SOURCE_RUNTIME \
            "$RUNNER_TEMP/nke-os-source.test" \
            -test.run '^TestNKEOSPublicSourcesLive$' -test.v -test.timeout 75m \
            2>&1 | tee "$RUNNER_TEMP/direct-source-build.log"
      - name: Retain diagnostic build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: direct-source-build-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/direct-source-build.log
          if-no-files-found: warn
          retention-days: 7
