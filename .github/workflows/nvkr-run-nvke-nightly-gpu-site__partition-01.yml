name: p01 Prepare NVKR runner (arc-arm64-kvm) +2
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-partition-02:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-partition-02 }}
      nvkr-results-00:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-00 }}
      nvkr-results-00-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-00-statuses }}
      nvkr-results-07:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-07 }}
      nvkr-results-07-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-07-statuses }}
      nvkr-results-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09 }}
      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
permissions:
  contents: read
jobs:
  build-runner-arc-arm64-kvm:
    name: 'Prepare NVKR runner (arc-arm64-kvm)'
    runs-on: 'ubuntu-24.04-arm'
    timeout-minutes: 15
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/aarch64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/arm64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: '.go-version'
          cache: 'false'
      - name: 'Install NVKR runner'
        run: |
          set -eu
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOBIN="$RUNNER_TEMP/nvkr-runner"
          go install -trimpath -ldflags '-X main.version=dev -X main.commit=unknown' ./cmd/nvkr
          mv "$GOBIN/nvkr" nvkr-exec
      - name: 'Download NVKR runtime inputs'
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/ci-download
        with:
          name: 'nvkr-runtime-inputs'
          path: '.nvkr/runtime-inputs'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: 'Install NVKR runtime inputs'
        run: |
          ./nvkr-exec factory github install-runtime-inputs --plan .github/nvkr-run-nvke-nightly-gpu-site/plan.json
      - name: Verify committed Run generation is current
        id: validate-catalog
        run: ./nvkr-exec factory github check-runtime-inputs --plan .github/nvkr-run-nvke-nightly-gpu-site/plan.json
      - name: 'Upload NVKR runner'
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/ci-upload
        with:
          name: 'nvkr-exec-arc-arm64-kvm'
          path: |
            nvkr-exec
            .github/nvkr-run-nvke-nightly-gpu-site/plan.json
            .github/nvkr-run-nvke-nightly-gpu-site/action-data.json
            .github/nvkr-run-nvke-nightly-gpu-site/manifest.json
          include-hidden-files: 'true'
          if-no-files-found: error
          retention-days: 14
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['build-runner-arc-amd64-kvm'].result == 'success' }}
  build-runner-ubuntu-24-04:
    name: 'Prepare NVKR runner (ubuntu-24.04)'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 15
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: '.go-version'
          cache: 'false'
      - name: 'Install NVKR runner'
        run: |
          set -eu
          export CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOBIN="$RUNNER_TEMP/nvkr-runner"
          go install -trimpath -ldflags '-X main.version=dev -X main.commit=unknown' ./cmd/nvkr
          mv "$GOBIN/nvkr" nvkr-exec
      - name: 'Download NVKR runtime inputs'
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/ci-download
        with:
          name: 'nvkr-runtime-inputs'
          path: '.nvkr/runtime-inputs'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: 'Install NVKR runtime inputs'
        run: |
          ./nvkr-exec factory github install-runtime-inputs --plan .github/nvkr-run-nvke-nightly-gpu-site/plan.json
      - name: Verify committed Run generation is current
        id: validate-catalog
        run: ./nvkr-exec factory github check-runtime-inputs --plan .github/nvkr-run-nvke-nightly-gpu-site/plan.json
      - name: 'Upload NVKR runner'
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/ci-upload
        with:
          name: 'nvkr-exec-ubuntu-24-04'
          path: |
            nvkr-exec
            .github/nvkr-run-nvke-nightly-gpu-site/plan.json
            .github/nvkr-run-nvke-nightly-gpu-site/action-data.json
            .github/nvkr-run-nvke-nightly-gpu-site/manifest.json
          include-hidden-files: 'true'
          if-no-files-found: error
          retention-days: 14
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['build-runner-arc-amd64-kvm'].result == 'success' }}
  build-runner-ubuntu-24-04-arm:
    name: 'Prepare NVKR runner (ubuntu-24.04-arm)'
    runs-on: 'ubuntu-24.04-arm'
    timeout-minutes: 15
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/aarch64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/arm64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: '.go-version'
          cache: 'false'
      - name: 'Install NVKR runner'
        run: |
          set -eu
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOBIN="$RUNNER_TEMP/nvkr-runner"
          go install -trimpath -ldflags '-X main.version=dev -X main.commit=unknown' ./cmd/nvkr
          mv "$GOBIN/nvkr" nvkr-exec
      - name: 'Download NVKR runtime inputs'
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/ci-download
        with:
          name: 'nvkr-runtime-inputs'
          path: '.nvkr/runtime-inputs'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: 'Install NVKR runtime inputs'
        run: |
          ./nvkr-exec factory github install-runtime-inputs --plan .github/nvkr-run-nvke-nightly-gpu-site/plan.json
      - name: Verify committed Run generation is current
        id: validate-catalog
        run: ./nvkr-exec factory github check-runtime-inputs --plan .github/nvkr-run-nvke-nightly-gpu-site/plan.json
      - name: 'Upload NVKR runner'
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/ci-upload
        with:
          name: 'nvkr-exec-ubuntu-24-04-arm'
          path: |
            nvkr-exec
            .github/nvkr-run-nvke-nightly-gpu-site/plan.json
            .github/nvkr-run-nvke-nightly-gpu-site/action-data.json
            .github/nvkr-run-nvke-nightly-gpu-site/manifest.json
          include-hidden-files: 'true'
          if-no-files-found: error
          retention-days: 14
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['build-runner-arc-amd64-kvm'].result == 'success' }}
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build-runner-arc-arm64-kvm, build-runner-ubuntu-24-04, build-runner-ubuntu-24-04-arm]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
      nvkr-partition-02: ${{ format('"build-runner-arc-arm64-kvm":{0},"build-runner-ubuntu-24-04":{1},"build-runner-ubuntu-24-04-arm":{2}', toJSON(needs['build-runner-arc-arm64-kvm']), toJSON(needs['build-runner-ubuntu-24-04']), toJSON(needs['build-runner-ubuntu-24-04-arm'])) }}
      nvkr-results-00: ${{ format('"build-runner-ubuntu-24-04":{0}', toJSON(needs['build-runner-ubuntu-24-04'])) }}
      nvkr-results-00-statuses: ${{ format('{0}', needs['build-runner-ubuntu-24-04'].result) }}
      nvkr-results-07: ${{ format('"build-runner-ubuntu-24-04-arm":{0}', toJSON(needs['build-runner-ubuntu-24-04-arm'])) }}
      nvkr-results-07-statuses: ${{ format('{0}', needs['build-runner-ubuntu-24-04-arm'].result) }}
      nvkr-results-09: ${{ format('"build-runner-arc-arm64-kvm":{0}', toJSON(needs['build-runner-arc-arm64-kvm'])) }}
      nvkr-results-09-statuses: ${{ format('{0}', needs['build-runner-arc-arm64-kvm'].result) }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
