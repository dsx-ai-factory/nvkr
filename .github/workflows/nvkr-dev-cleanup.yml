name: NVKR development registry cleanup

'on':
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Delete eligible development packages (otherwise preview only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nvkr-development-registry-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nvkr-dev-cleanup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build cleanup owner from the default branch
        env:
          GOTOOLCHAIN: local
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/nvkr" ./cmd/nvkr
      - name: Inspect or remove expired development attempts
        id: cleanup
        env:
          NVKR_DEV_REGISTRY_CLEANUP: ${{ secrets.NVKR_DEV_REGISTRY_CLEANUP }}
          NVKR_REPOSITORY: ${{ github.repository }}
          NVKR_APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          args=(factory github cleanup-development --repository "$NVKR_REPOSITORY")
          if [[ "$NVKR_APPLY" == "true" ]]; then
            args+=(--apply)
          fi
          "$RUNNER_TEMP/nvkr" "${args[@]}" | tee "$RUNNER_TEMP/nvkr-dev-cleanup.json"
      - name: Retain cleanup report
        if: always() && (steps.cleanup.outcome == 'success' || steps.cleanup.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nvkr-dev-cleanup-report
          path: ${{ runner.temp }}/nvkr-dev-cleanup.json
          if-no-files-found: error
          retention-days: 7
