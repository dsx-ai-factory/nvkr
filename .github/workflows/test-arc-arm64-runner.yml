name: Test ARC arm64 runner (throwaway)

on:
  workflow_dispatch:
  push:
    branches:
      - sujanrao/test-arc-arm64-runner

jobs:
  smoke-test:
    runs-on: arc-arm64-cpu16-stg
    steps:
      - name: Runner info
        run: |
          uname -a
          nproc
          free -h
      - name: Docker info
        run: docker info
