name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_DEV_REGISTRY_WRITE:
        required: true
permissions:
  contents: read
jobs:
  nvkr-package-controller-chart:
    name: 'Bind image digest and package Helm: controller-chart'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-package-cwe'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-process-controller-chart-build-nvke-9024d4709c1b'].result == 'success' }}
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-dev/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
  nvkr-package-publication-capnico-controller:
    name: 'Package publication bundle: publication-capnico-controller'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
