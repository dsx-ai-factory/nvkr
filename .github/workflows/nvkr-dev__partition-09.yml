name: NVKR execution partition
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-results-01:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-01 }}
      nvkr-results-01-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-01-statuses }}
      nvkr-results-05:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05 }}
      nvkr-results-05-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-05-statuses }}
      nvkr-results-09:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09 }}
      nvkr-results-09-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-09-statuses }}
      nvkr-results-0d:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0d }}
      nvkr-results-0d-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0d-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_REGISTRY_READ:
        required: true
permissions:
  contents: read
jobs:
  nvkr-disk-nvke-node-fde-amd64:
    name: 'Build and package producer evidence for nvke-node-fde-amd64'
    runs-on: 'arc-amd64-kvm'
    timeout-minutes: 1045
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && fromJSON(inputs.dependencies)['nvkr-nvke-node-fde-amd64-fetch-nvke-agent-dc6f3464c691'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-nvke-node-fde-amd64-fetch-nvke-cni-calico'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-nvke-node-fde-amd64-fetch-nvke-kubeadm-distro'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-nvke-node-fde-amd64-fetch-nvke-spire-agent'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-nvke-node-fde-amd64-fetch-ovn-kube-ubuntu'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-nvke-node-fde-amd64-fetch-ovn-kubernetes-chart'].result == 'success' }}
    environment: 'nvkr-dev-arc'
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Prepare KVM access before transfer
        timeout-minutes: 1
        run: |-
          set -eu
          if [ -L /dev/kvm ] || [ ! -c /dev/kvm ]; then
            printf 'NVKR-E-ENGINE-CAPABILITY: native disk runner lacks /dev/kvm\n' >&2
            exit 29
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-) 2>/dev/null; then
            printf 'Preparing /dev/kvm access on the operator-trusted ARC runner\n'
            if ! /usr/bin/timeout --kill-after=5s 15s /usr/bin/sudo -n -- /usr/bin/chmod 0666 /dev/kvm; then
              printf 'NVKR-E-ENGINE-CAPABILITY: unable to prepare /dev/kvm access\n' >&2
              exit 29
            fi
          fi
          if ! (exec 3<>/dev/kvm && exec 3>&-); then
            printf 'NVKR-E-ENGINE-CAPABILITY: runner still cannot open /dev/kvm read/write\n' >&2
            id >&2 || true
            stat -c 'uid=%u gid=%g mode=%a' /dev/kvm >&2 || true
            exit 29
          fi
          stat -c 'KVM ready: uid=%u gid=%g mode=%a' /dev/kvm || true
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-dev/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-arc-amd64-kvm'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: prepare inputs part-1
        uses: ./.github/nvkr-dev/actions/shared/prepare-inputs
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: prepare images part-2
        uses: ./.github/nvkr-dev/actions/shared/prepare-images
        with:
          nvkr-toolchain-read-token: ${{ secrets.NVKR_REGISTRY_READ }}
          nvkr-toolchain-read-user: ${{ vars.NVKR_REGISTRY_READ_USER }}
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-2'] }}
      - name: 'Build and package producer evidence for nvke-node-fde-amd64'
        id: run-disk
        run: ./nvkr-exec factory github run-disk --plan .github/nvkr-dev/plan.json --output nvke-node-fde-amd64
      - name: Upload failed Packer diagnostics
        uses: ./.github/nvkr-dev/actions/shared/upload-carrier
        with:
          with-path: '${{ steps.run-disk.outputs.packer_diagnostics }}'
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['transfer-1'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
        if: '${{ failure() && steps.run-disk.outputs.packer_diagnostics != '''' }}'
        timeout-minutes: 5
      - name: collect node outputs part-3
        uses: ./.github/nvkr-dev/actions/shared/collect-node-outputs
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-3'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: collect node outputs part-4
        uses: ./.github/nvkr-dev/actions/shared/collect-node-outputs
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-4'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: collect node outputs part-5
        uses: ./.github/nvkr-dev/actions/shared/collect-node-outputs
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-5'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: collect node outputs part-6
        uses: ./.github/nvkr-dev/actions/shared/collect-node-outputs
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-6'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: collect node outputs part-7
        uses: ./.github/nvkr-dev/actions/shared/collect-node-outputs
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-7'] }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
      - name: collect node outputs part-8
