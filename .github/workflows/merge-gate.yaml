# Aggregate merge gate — the ONLY required status check in the main branch
# ruleset. Every PR-gating check is either run or explicitly skipped here, and
# the final "gate" job aggregates all results into a single pass/fail.
#
# WHY AN AGGREGATE GATE
#   A required status check must be named in the branch ruleset. If each check
#   is required individually, every new check needs a ruleset edit by someone
#   with admin access, and a check that is skipped on a given PR reports
#   "expected" forever and blocks the merge. Aggregating solves both: "gate" is
#   the single required name, and skipped checks are represented by a companion
#   job that always runs.
#
# TO ADD A NEW GATING CHECK
#   1. Add a real job + companion -skip job with inverse `if:` conditions.
#   2. Add both job names to the gate job's `needs:` list.
#   3. Add a make target for it, so `make check` stays equal to CI
#      (CONTRIBUTING.md, "Local development equals CI").
#   No ruleset change is needed — "gate" is the only required check.
#
# A GATE MUST WATCH ITS OWN INPUTS
#   Each path filter below watches not only the files a check examines but also
#   the files that *define* the check — the Makefile recipe, the pinned tool
#   version, and this workflow. Otherwise a change to a gate can skip the gate
#   it changes.
#
# PLANNED CHECKS (not yet implemented; see the note at each stub)
#   verify-licenses · lock-freshness · malware-scan (ClamAV)

name: Merge Gate

# The push trigger is not redundant with the pull_request one. Path filtering
# keeps PR feedback cheap by only running checks whose inputs the PR touched,
# which means a merge that is individually clean can still break a derived
# artifact elsewhere in the tree — nothing re-checks the paths the PR did not
# touch. The push run is that watchdog, and it forces every check-paths output
# true because a merged commit has no base to diff against.
#
# This workflow does not establish who can bypass live repository rules; verify
# bypass grants in repository settings when evaluating merge policy.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

# Push runs key on the SHA, not the ref, and never cancel. Superseding a PR's
# older run is the point of cancel-in-progress; superseding a merged commit's
# run is how a broken commit goes unverified.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  check-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # `pull-requests: read` is required by dorny/paths-filter: on a
    # pull_request event it lists changed files via
    # GET /repos/{owner}/{repo}/pulls/{n}/files. On a public repository that
    # endpoint is readable without the scope, so a workflow copied from one
    # fails here with "Resource not accessible by integration" while working
    # fine there. Scoped to this job — no other job reads PR metadata.
    permissions:
      contents: read
      pull-requests: read
    # Every output is forced true on anything that is not a pull request.
    # Path filtering exists to keep PR feedback cheap by diffing against the
    # base; a push to main has no such base, and a watchdog that only re-checks
    # the paths a merge happened to touch would miss exactly the case it is
    # here for. A workflow_dispatch likewise has no base — filtering there
    # would diff against an empty range, skip every check, and let the gate go
    # green having verified nothing.
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.changes.outputs.code }}
      actions: ${{ github.event_name != 'pull_request' && 'true' || steps.changes.outputs.actions }}
      pipeline: ${{ github.event_name != 'pull_request' && 'true' || steps.changes.outputs.pipeline }}
      notices: ${{ github.event_name != 'pull_request' && 'true' || steps.changes.outputs.notices }}
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.changes.outputs.docs }}
      test-matrix: ${{ steps.test-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive complete test matrix
        id: test-matrix
        run: |
          matrix=$(python3 -B scripts/ci-test-shard.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # Pull requests only: the outputs above already force every category
      # true elsewhere, and on a push event this action diffs against
      # github.event.before,
      # which is all-zeros for a new branch and after history rewrites. The
      # step then errors, failing check-paths and taking the whole gate down.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              # Everything the repository jobs compile, lint, or test, plus the
              # files that define the check itself: the Makefile recipes, the
              # pinned Go toolchain, the lint configuration, and this workflow.
              - 'client/**'
              - 'cmd/**'
              - 'internal/**'
              - 'pkg/**'
              - 'inputs/**'
              # Watched so definitions-location-check runs on any re-addition.
              - 'definitions/**'
              - 'docs/examples/**'
              - 'scripts/**'
              - 'demos/**'
              - 'testdata/**'
              - 'toolchains/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.go-version'
              - '.golangci.yml'
              # Tests read the committed generated bundle:
              # pkg/nvkr/factory/{sbom_dependencies,github_labels}_test.go load
              # .github/nvkr-run/plan.json. A PR touching only that bundle must
              # therefore still run `check`, or the tests guarding bundle
              # integrity silently do not run.
              - '.github/nvkr-run/**'
              - '.github/workflows/nvkr-run.yml'
              - '.github/workflows/merge-gate.yaml'
              # `make license-header-check` also covers the stamped files here
              # (dependabot, issue templates, the other workflows).
              - '.github/**'
            actions:
              - '.github/actionlint.yaml'
              - '.github/workflows/**'
              - '.github/actions/**'
            pipeline:
              # Everything `run generate` consumes or emits, plus the files that
              # define the check itself, so a change to the gate cannot skip the
              # gate it changes.
              - 'inputs/**'
              - '.github/workflows/nvkr-run.yml'
              - '.github/nvkr-run/**'
              - '.github/workflows/nvkr-run-*.yml'
              - '.github/nvkr-run-*/**'
              - '.github/workflows/nvkr-qualify.yml'
              - '.github/workflows/nvkr-smoke.yml'
              - '.github/nvkr-qualification/**'
              - '.github/workflows/nvkr-dev.yml'
              - '.github/nvkr-dev/**'
              - '.github/workflows/nvkr-dev-qualify.yml'
              - '.github/workflows/nvkr-dev-smoke.yml'
              - '.github/nvkr-dev-qualification/**'
              - '.github/workflows/catalog-refresh.yaml'
              - 'cmd/**'
              - 'client/**'
              - 'internal/**'
              - 'pkg/**'
              - 'go.mod'
              - 'go.sum'
              - '.go-version'
              - 'toolchains/**'
              - 'Makefile'
              - '.github/workflows/merge-gate.yaml'
            notices:
              # The linked-module set derives from the full import graph of
              # ./cmd/nvkr, plus the generator itself and the committed
              # notices file. Watching the dependency surface catches a new
              # dependency added without rerunning `make notices`.
              - 'THIRD_PARTY_NOTICES.md'
              - 'scripts/gen-notices.sh'
              - 'scripts/gen_notices.py'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'pkg/**'
              - 'internal/**'
              - 'client/**'
              - 'Makefile'
              - '.github/workflows/merge-gate.yaml'
            docs:
              # The published pages, their navigation and the Fern site
              # configuration, plus the files that define the check itself: the
              # MDX checker, the Makefile recipe, and this workflow. A page can
              # break the site through any page it links to, so the whole docs
              # tree is watched rather than only the pages listed in the nav.
              - 'docs/**'
              - 'fern/**'
              - 'tools/check-docs-mdx'
              - 'Makefile'
              - '.github/workflows/merge-gate.yaml'

  # Repository checks — the same gates `make check` runs locally, plus build

  check:
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: fmt-check
        run: make fmt-check

      - name: definitions-location-check
        run: make definitions-location-check

      - name: license-header-check
        run: make license-header-check

      - name: vet
        run: make vet

      - name: shellcheck
        run: make shellcheck

      - name: CI sharding, report and adapter tests
        run: make test-ci-tools

      - name: build
        run: make build

  # Lint installation/analysis, vulnerability scanning and tests are independent
  # checks. Serializing them added minutes before the first test could start.
  lint:
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      # Verify the public tool archive before extraction. Keep the binary in
      # runner-local temporary storage instead of rebuilding it on every PR.
      - name: Install checksum-pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          lint_version=2.14.0
          lint_archive="golangci-lint-${lint_version}-linux-amd64.tar.gz"
          lint_install_root=$(mktemp -d "$RUNNER_TEMP/golangci-lint.XXXXXX")
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 60 --retry 2 --retry-max-time 90 \
            "https://github.com/golangci/golangci-lint/releases/download/v${lint_version}/${lint_archive}" \
            --output "$lint_install_root/$lint_archive"
          if ! printf '%s  %s\n' \
            'ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab' \
            "$lint_install_root/$lint_archive" | sha256sum --check --status; then
            echo '::error::golangci-lint checksum verification failed'
            exit 1
          fi
          tar -xzf "$lint_install_root/$lint_archive" -C "$lint_install_root" \
            "golangci-lint-${lint_version}-linux-amd64/golangci-lint"
          echo "$lint_install_root/golangci-lint-${lint_version}-linux-amd64" >> "$GITHUB_PATH"

      - name: lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-mode: none
          skip-cache: true

  vulnerabilities:
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Go vulnerability check
        run: make vulncheck

  tests:
    needs: [check-paths]
    if: needs.check-paths.outputs.code == 'true'
    # Tests need disk-backed /tmp and GNU tools, unlike Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      # Keep every shard's diagnostics when another fails. The aggregate gate
      # requires the entire matrix to succeed.
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-paths.outputs.test-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: test (ordinary suite shard)
        id: tests
        shell: bash
        env:
          # Rendered workflow-step tests fail instead of skipping when bash, git, jq or yq is missing.
          NVKR_REQUIRE_SHELL_TOOLS: '1'
          # Disk transport tests require writable disk-backed scratch.
          # The runner's /tmp may be tmpfs.
          TMPDIR: ${{ runner.temp }}
          TEST_SHARD_GROUP: ${{ matrix.group }}
          TEST_SHARD_INDEX: ${{ matrix.index }}
        run: make test-shard | tee "$RUNNER_TEMP/go-test.jsonl"

      - name: Summarize test timings
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        run: python3 scripts/ci-test-summary.py "$RUNNER_TEMP/go-test.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain test results
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merge-gate-tests-${{ matrix.group }}-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/go-test.jsonl
          retention-days: 7
          if-no-files-found: error

  check-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No code changes — repository checks not required"

  # Workflow linting
  #
  # Highest value on this repository specifically: workflows here are generated
  # rather than hand-written, so a malformed emission should fail the gate
  # rather than land.

  actionlint:
    needs: [check-paths]
    if: needs.check-paths.outputs.actions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        # Pinned by version, with the downloaded binary verified against the
        # upstream-published checksum file. The upstream one-liner installer
        # pipes a script from the default branch into bash and downloads the
        # binary with no checksum verification.
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          set -euo pipefail
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          TAR="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          TMP="$(mktemp -d)"
          curl -fsSL -o "${TMP}/${TAR}" "${BASE}/${TAR}"
          curl -fsSL -o "${TMP}/checksums.txt" "${BASE}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          EXPECTED=$(awk -v t="${TAR}" '$2 == t {print $1}' "${TMP}/checksums.txt")
          if [[ -z "${EXPECTED}" ]]; then
            echo "::error::no checksum entry for ${TAR} in upstream checksums.txt"
            exit 1
          fi
          ACTUAL=$(sha256sum "${TMP}/${TAR}" | awk '{print $1}')
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "::error::actionlint checksum mismatch: expected ${EXPECTED}, got ${ACTUAL}"
            exit 1
          fi
          tar -xzf "${TMP}/${TAR}" -C "${TMP}" actionlint
          mv "${TMP}/actionlint" "${PWD}/actionlint"
          rm -rf "${TMP}"
          echo "${PWD}" >> "$GITHUB_PATH"

      - name: Run actionlint
        run: actionlint -color

  actionlint-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.actions != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No workflow/action changes — actionlint not required"

  # PLANNED: verify-licenses
  #
  # CONTRIBUTING.md names "Apache-clean" a load-bearing invariant — no
  # copyleft/BUSL dependency linked into the binary — and nothing currently
  # enforces it. Needs a `make license-check` target first so the local gate
  # and CI stay equal. Add a `deps` path filter watching go.mod, go.sum,
  # Makefile, .go-version, and this workflow.

  # Generated-pipeline drift (ADR-21 §2)
  #
  # The committed Run workflow and its plan must equal what `run generate`
  # emits from the current Definition, Environment and catalog pins. ADR-21 §3
  # requires matching regeneration when a lock changes.
  #
  # PR drift checks live here; the generated nvkr-run workflow is manual-only.
  # Fork PRs temporarily skip this check because NVKE inputs are private.
  # Same-repository PRs and main retain the generation drift gate.
  #
  # Per ADR-21 §2 this job lives OUTSIDE the emitted pipeline and does not
  # self-check recursively.

  workflows-regen:
    needs: [check-paths]
    if: >-
      needs.check-paths.outputs.pipeline == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      # Catalog validation re-reads the pinned NVKE tree. Acquire it with a
      # fixed action before running checkout code; never pass this token to
      # the generator or persist credentials. Forks skip this job; do not use
      # pull_request_target to bypass that boundary.
      - name: Fetch private NVKE validation inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nvke
          ref: 6991e36bef8f15b42b6f6519ccff089c587a6e49 # v0.22.0-beta.1
          fetch-depth: 0
          path: .nvkr-inputs/nvke
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Verify committed producer, qualification and catalog refresh generation is current
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.${{ github.workspace }}/.nvkr-inputs/nvke/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/dsx-ai-factory/nvke
        run: make workflows-check

  workflows-regen-skip:
    needs: [check-paths]
    if: >-
      needs.check-paths.outputs.pipeline != 'true' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain fork exemption
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: >-
          echo "Regeneration check skipped for fork PR —
          private NVKE inputs are unavailable"
      - name: Explain unchanged inputs
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: echo "No pipeline inputs changed — regeneration check not required"

  # Third-party notices drift — THIRD_PARTY_NOTICES.md must regenerate
  # byte-for-byte from the linked module set, the same "local equals CI" and
  # "generated files regenerate byte-for-byte" contract workflows-check
  # enforces. Adding a dependency without rerunning `make notices` fails here.

  notices-regen:
    needs: [check-paths]
    if: needs.check-paths.outputs.notices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Verify THIRD_PARTY_NOTICES.md is current
        run: make notices-check

  notices-regen-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.notices != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No dependency or notices inputs changed — notices check not required"

  # Fern docs — the operator-facing site published from docs/index.yml.
  #
  # `make docs-check` runs the MDX safety checker, `fern check`, `fern docs md
  # check` and `fern docs broken-links`. No secrets are used, so it is safe on
  # fork PRs. The Fern CLI is intentionally installed unpinned (`@latest`), so
  # an upstream Fern release can fail this check without a change in this
  # repository; Node itself is pinned by setup-node.

  docs:
    needs: [check-paths]
    if: needs.check-paths.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install Fern CLI
        run: npm install -g fern-api@latest

      - name: Check Fern docs
        run: make docs-check

  docs-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No docs or Fern inputs changed — docs check not required"

  # Static analysis (CodeQL)
  #
  # Uploading results needs `security-events: write`. On a private or internal
  # repository that also requires GitHub Advanced Security; on a public one it
  # is free, which is why a workflow copied from a public repository can pass
  # there and fail here. A fork PR never receives the scope, so this job must
  # be allowed to fail on fork runs or be reached via the copy-pr-bot mirror.

  analyze:
    needs: [check-paths]
    # A fork PR never receives `security-events: write`, so the CodeQL upload
    # cannot succeed there. Skipping keeps external contributions green; the
    # analysis still runs on the copy-pr-bot mirror branch and on every push to
    # main, so a fork PR cannot use this to land unanalysed code.
    if: >-
      needs.check-paths.outputs.code == 'true' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      # CodeQL automatically uploads complete/partial databases as Actions
      # artifacts in runner debug mode, even when debug and upload-database are
      # false. RUNNER_DEBUG is provider-owned and cannot be overridden by env.
      - name: Admit CodeQL without database artifact uploads
        run: |
          if [ "${RUNNER_DEBUG:-0}" = '1' ]; then
            echo '::error::[NVKR-E-ENGINE-CAPABILITY] CodeQL debug reruns upload compiled databases; rerun with debug logging disabled.'
            exit 1
          fi

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        env:
          CODEQL_OVERLAY_DATABASE_MODE: none
        with:
          languages: go
          debug: false
          trap-caching: false
          dependency-caching: false

      - run: go build ./...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload-database: false

  analyze-skip:
    needs: [check-paths]
    if: >-
      needs.check-paths.outputs.code != 'true' ||
      github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No code changes — CodeQL not required"

  # PLANNED: malware-scan (ClamAV)
  #
  # A port of AICR's 197-line composite action; kept separate because it
  # introduces a new local action rather than reusing an upstream one.

  gate:
    if: always()
    needs:
      - check-paths
      - check
      - lint
      - vulnerabilities
      - tests
      - check-skip
      - actionlint
      - actionlint-skip
      - analyze
      - analyze-skip
      - workflows-regen
      - workflows-regen-skip
      - notices-regen
      - notices-regen-skip
      - docs
      - docs-skip
    runs-on: ubuntu-latest
    # Allow runner finalization after the checks; a one-minute job budget can
    # expire even after this script reports success.
    timeout-minutes: 5
    steps:
      - name: Check gate
        run: |
          set -euo pipefail
          echo "Gate results:"
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'

          # check-paths must succeed — if it fails, all downstream jobs are
          # skipped (not failed), which would silently pass the gate.
          if [ "${{ needs.check-paths.result }}" != "success" ]; then
            echo "::error::check-paths did not succeed (result: ${{ needs.check-paths.result }})"
            exit 1
          fi

          # A successful matrix means every test shard passed. Never treat a
          # skipped code job as success when the classifier required it.
          if [ "${{ needs.check-paths.outputs.code }}" = 'true' ]; then
            echo '${{ toJSON(needs) }}' | jq -e \
              '[.check, .lint, .vulnerabilities, .tests] | all(.result == "success")' >/dev/null
          elif [ "${{ needs.check-paths.outputs.code }}" = 'false' ]; then
            echo '${{ toJSON(needs) }}' | jq -e \
              '.["check-skip"].result == "success" and ([.check, .lint, .vulnerabilities, .tests] | all(.result == "skipped"))' >/dev/null
          else
            echo '::error::Code classification must be true or false'
            exit 1
          fi

          # Fail if ANY other dependency failed or was cancelled.
          # Skipped is OK — it means the inverse job ran instead.
          # Split the parse from the predicate so a jq error aborts under
          # `set -e` rather than being read as "no failures" and passing.
          failed=$(echo '${{ toJSON(needs.*.result) }}' \
            | jq -r 'map(select(. == "failure" or . == "cancelled")) | length')
          if [ "$failed" -gt 0 ]; then
            echo "::error::One or more gating checks failed or were cancelled"
            exit 1
          fi

          echo "All gating checks passed."
