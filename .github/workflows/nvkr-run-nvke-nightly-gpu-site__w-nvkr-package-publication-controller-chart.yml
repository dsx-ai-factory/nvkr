name: Package controller-chart +1
'on':
  workflow_call:
    inputs:
      dependencies:
        type: string
        required: true
    outputs:
      results:
        value: ${{ jobs.nvkr-partition-results.outputs.results }}
      statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.statuses }}
      nvkr-results-04:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-04 }}
      nvkr-results-04-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-04-statuses }}
      nvkr-results-0f:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0f }}
      nvkr-results-0f-statuses:
        value: ${{ jobs.nvkr-partition-results.outputs.nvkr-results-0f-statuses }}
    secrets:
      NVKR_CI_STORAGE_READ_TOKEN:
        required: true
      NVKR_CI_STORAGE_WRITE_TOKEN:
        required: true
      NVKR_REGISTRY_WRITE:
        required: true
permissions:
  contents: read
jobs:
  nvkr-package-publication-controller-chart:
    name: 'Package publication bundle: publication-controller-chart'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    permissions:
      actions: read
      contents: read
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-controller-chart-sbom'].result == 'success' && fromJSON(inputs.dependencies)['nvkr-package-controller-chart'].result == 'success' }}
  nvkr-publish-output-local-path-provisioner:
    name: 'Publish output-local-path-provisioner'
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 60
    environment: 'nvkr-release'
    permissions:
      actions: read
      contents: read
    env:
      NVKR_CI_REPOSITORY_TOKEN: '${{ github.token }}'
      NVKR_CREDENTIAL: '${{ secrets.NVKR_REGISTRY_WRITE }}'
      NVKR_REGISTRY_USER: '${{ vars.NVKR_REGISTRY_WRITE_USER }}'
    steps:
      - name: Check native runner platform
        run: |
          set -eu
          if [ "$(uname -s)/$(uname -m)" != Linux/x86_64 ]; then printf 'NVKR-E-ENGINE-CAPABILITY: expected native linux/amd64 runner\n' >&2; exit 29; fi
      - name: Check out workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Prepare NVKR runner and job parameters
        id: nvkr-context
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/prepare-stage
        with:
          runner-artifact: 'nvkr-exec-ubuntu-24-04'
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
      - name: execute node part-1
        uses: ./.github/nvkr-run-nvke-nightly-gpu-site/actions/shared/execute-node
        with:
          parameters: ${{ fromJSON(steps.nvkr-context.outputs.data)['part-1'] }}
          nvkr-ci-storage-read-token: ${{ secrets.NVKR_CI_STORAGE_READ_TOKEN }}
          nvkr-ci-storage-write-token: ${{ secrets.NVKR_CI_STORAGE_WRITE_TOKEN }}
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && fromJSON(inputs.dependencies)['nvkr-attest-sboms-output-local-path-provisioner'].result == 'success' }}
  nvkr-partition-results:
    name: 'Collect provider results: nvkr-partition-results'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [nvkr-package-publication-controller-chart, nvkr-publish-output-local-path-provisioner]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions: {}
    outputs:
      results: ${{ toJSON(needs) }}
      statuses: ${{ join(needs.*.result, ' ') }}
      nvkr-results-04: ${{ format('"nvkr-package-publication-controller-chart":{0}', toJSON(needs['nvkr-package-publication-controller-chart'])) }}
      nvkr-results-04-statuses: ${{ format('{0}', needs['nvkr-package-publication-controller-chart'].result) }}
      nvkr-results-0f: ${{ format('"nvkr-publish-output-local-path-provisioner":{0}', toJSON(needs['nvkr-publish-output-local-path-provisioner'])) }}
      nvkr-results-0f-statuses: ${{ format('{0}', needs['nvkr-publish-output-local-path-provisioner'].result) }}
    steps:
      - name: Forward provider results
        run: ':'
env:
  NVKR_CI_STORAGE_READ_USER: ${{ vars.NVKR_CI_STORAGE_READ_USER }}
  NVKR_CI_STORAGE_WRITE_USER: ${{ vars.NVKR_CI_STORAGE_WRITE_USER }}
