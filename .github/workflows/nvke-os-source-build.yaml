---
name: PR 138 process scheduling verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    name: Native ${{ matrix.arch }} review regressions
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Verify native host
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p .nvkr/pr138-review-verification
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          { git rev-parse HEAD; uname -a; go version; } | tee .nvkr/pr138-review-verification/host.txt
      - name: Race and real-process review regressions
        run: |
          set -euo pipefail
          go test -race -p=2 ./internal/sourcegit ./internal/ownedcmd ./pkg/nvkr/pipeline ./pkg/nvkr/factory ./cmd/nvkr \
            -run 'Test(ImportLocal|ArtifactDiagnostic|Reaper|ExecCmdCancellation|CombinedOutputPreservesContextCancellation|OutputCleansDescendants)' \
            -count=3 -v 2>&1 | tee .nvkr/pr138-review-verification/race.log
      - name: Retain verification records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr138-review-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .nvkr/pr138-review-verification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
