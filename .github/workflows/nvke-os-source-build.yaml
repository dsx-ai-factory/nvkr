---
name: CLI candidate native verification

on:
  workflow_dispatch:

permissions:
  contents: read

# Run-specific diagnostic branch; never publication, qualification, or production pin refresh.
jobs:
  verify:
    name: Native ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        mode: [scalar, map, relocated]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        arch: [amd64, arm64]
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Build candidate runner and isolated mirror client
        run: |
          set -euo pipefail
          make build
          GOBIN="$PWD/bin" go install github.com/google/go-containerregistry/cmd/crane@v0.22.1
      - name: Fresh recipe build and real Docker acceptance
        env:
          NVKR_SOURCE_TOKEN: ${{ secrets.NKE_SOURCE_TOKEN }}
          CANDIDATE_ARCH: ${{ matrix.arch }}
          CANDIDATE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          test -n "$NVKR_SOURCE_TOKEN"
          askpass="$RUNNER_TEMP/nvke-askpass"
          cat > "$askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *github.com*Username*) printf '%s\n' x-access-token ;;
            *Username*github.com*) printf '%s\n' x-access-token ;;
            *Password*github.com*) printf '%s\n' "$NVKR_SOURCE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          # Credentials stay in host Git, never Docker env or mounts.
          sudo --non-interactive --preserve-env=NVKR_SOURCE_TOKEN,GIT_ASKPASS,GIT_TERMINAL_PROMPT,GOTOOLCHAIN,PATH \
            python3 scripts/verify-cli-candidate.py \
            --root "$PWD/.nvkr/cli-proof" --arch "$CANDIDATE_ARCH" --mode "$CANDIDATE_MODE"
      - name: Retain plans, imported trees, inventories and raw results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-candidate-${{ matrix.arch }}-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/.nvkr/cli-proof/*.json
            ${{ github.workspace }}/.nvkr/cli-proof/*.log
            ${{ github.workspace }}/.nvkr/cli-proof/*.jsonl
            ${{ github.workspace }}/.nvkr/cli-proof/*.tgz
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
