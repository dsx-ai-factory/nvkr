---
name: Go CLI artifact native verification
on:
  workflow_dispatch:
permissions:
  contents: read
# Disposable verification branch only; maintained workflows and pins are unchanged.
jobs:
  verify:
    name: Native ${{ matrix.arch }} Go adapter
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
          cache: false
      - name: Build Go adapter and verify native platform
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          make build
          test "$(go env GOOS)" = linux
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          docker_platform="$(docker info --format '{{.OSType}}/{{.Architecture}}')"
          case "$EXPECTED_ARCH/$docker_platform" in
            amd64/linux/x86_64|amd64/linux/amd64|arm64/linux/aarch64|arm64/linux/arm64) ;;
            *) exit 1 ;;
          esac
          mkdir -p .nvkr/cli-go-proof/inputs
          cp -R ".github/cli-proof-inputs/$EXPECTED_ARCH/inputs/." .nvkr/cli-go-proof/inputs/
          git rev-parse HEAD > .nvkr/cli-go-proof/nvkr-commit.txt
          uname -m > .nvkr/cli-go-proof/native-host.txt
          printf '%s\n' "$docker_platform" > .nvkr/cli-go-proof/docker-platform.txt
      - name: Native Go process-lifetime race checks
        run: |
          set -euo pipefail
          go test -race -p=2 ./internal/sourcegit ./internal/ownedcmd \
            ./pkg/nvkr/pipeline ./pkg/nvkr/factory ./cmd/nvkr \
            -run 'Test(ImportLocal|ArtifactDiagnostic|Reaper|ExecCmdCancellation|CombinedOutputPreservesContextCancellation|OutputCleansDescendants)' -count=1 \
            > .nvkr/cli-go-proof/race.log 2>&1
      - name: Uncached Go repository tests
        run: go test -p=2 ./... -count=1 > .nvkr/cli-go-proof/uncached-tests.log 2>&1
      - name: Fresh recipe build and both cold-cache Go adapter suites
        env:
          NVKR_SOURCE_TOKEN: ${{ secrets.NKE_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NVKR_SOURCE_TOKEN"
          helper="$RUNNER_TEMP/nvke-go-helper"
          cat > "$helper" <<'HELPER'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          credential_host= credential_path=
          while IFS='=' read -r credential_key credential_value; do
            [ -n "$credential_key" ] || break
            case "$credential_key" in
              host) credential_host=$credential_value ;;
              path) credential_path=$credential_value ;;
            esac
          done
          [ "$credential_host" = github.com ] || exit 1
          case "$credential_path" in dsx-ai-factory/nvke|dsx-ai-factory/nvke.git) ;; *) exit 1 ;; esac
          printf '%s\n' username=x-access-token
          printf 'password='
          cat "$0.token"
          printf '\n'
          HELPER
          sudo install -m 700 "$helper" "$helper.root"
          printf '%s' "$NVKR_SOURCE_TOKEN" | sudo sh -c 'umask 077; cat > "$1"' sh "$helper.root.token"
          sudo git config --global credential.https://github.com/dsx-ai-factory/nvke.helper "!$helper.root"
          sudo git config --global credential.https://github.com/dsx-ai-factory/nvke.useHttpPath true
          binary="$PWD/bin/nvkr"
          definition=.nvkr/cli-go-proof/inputs/definition.json
          environment=.nvkr/cli-go-proof/inputs/environment.json
          "$binary" run plan --definition "$definition" --environment "$environment" --json > .nvkr/cli-go-proof/plan.json
          # Logs belong to the runner; only the recipe process needs root.
          # shellcheck disable=SC2024
          sudo --non-interactive "$binary" run local --definition "$definition" --environment "$environment" \
            --attempt fresh --attempts-root .nvkr/cli-go-proof/attempts --ui plain > .nvkr/cli-go-proof/build.log 2>&1
          artifact="$PWD/.nvkr/cli-go-proof/attempts/fresh/nvkectl/out/nvkectl/nvkectl"
          plan="$PWD/.nvkr/cli-go-proof/plan.json"
          sha256sum "$artifact" > .nvkr/cli-go-proof/artifact-before.sha256
          "$binary" run artifact-test-inputs --plan "$plan" > .nvkr/cli-go-proof/selected.json
          mkdir -p '.nvkr/cli-go-proof/repo space:comma,quote"'
          proof="$PWD/.nvkr/cli-go-proof"
          cd '.nvkr/cli-go-proof/repo space:comma,quote"'
          for suite in contract cli; do
            # shellcheck disable=SC2024
            sudo --non-interactive "$binary" run artifact-test --artifact "$artifact" --plan "$plan" \
              --suite "$suite" --keep > "$proof/$suite.log" 2>&1
          done
          for workspace in .nvkr/artifact-tests/cli-*; do
            suite="$(sudo jq -r .suite "$workspace/result.json")"
            sudo cp "$workspace/result.json" "$proof/$suite-result.json"
            sudo cp "$workspace/tests.jsonl" "$proof/$suite-tests.jsonl"
            sudo tar -czf "$proof/$suite-import.tgz" -C "$workspace" nvke
          done
          sha256sum "$artifact" > "$proof/artifact-after.sha256"
          cmp "$proof/artifact-before.sha256" "$proof/artifact-after.sha256"
      - name: Remove host credentials and make private records readable
        if: always()
        run: |
          set -euo pipefail
          sudo git config --global --unset-all credential.https://github.com/dsx-ai-factory/nvke.helper || true
          sudo git config --global --unset-all credential.https://github.com/dsx-ai-factory/nvke.useHttpPath || true
          sudo unlink "$RUNNER_TEMP/nvke-go-helper.root.token" || true
          sudo unlink "$RUNNER_TEMP/nvke-go-helper.root" || true
          sudo chown -R "$(id -u):$(id -g)" .nvkr/cli-go-proof
      - name: Retain raw candidate records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-cli-proof-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            .nvkr/cli-go-proof/*.json
            .nvkr/cli-go-proof/*.jsonl
            .nvkr/cli-go-proof/*.txt
            .nvkr/cli-go-proof/*.sha256
            .nvkr/cli-go-proof/*.log
            .nvkr/cli-go-proof/*.tgz
            .nvkr/cli-go-proof/inputs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
