# Companion implementation: https://github.com/dsx-ai-factory/nke-recipes/pull/59
# Full mode runs only from this trusted main workflow. A pre-merge candidate
# requires an exact copy-pr-bot mirror. Candidate code receives the pinned
# private NKE source and a network-capable KVM runner, but never its credential.

---
name: NKE OS validation

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character nke-recipes commit to validate
        required: true
        type: string
      approved_nke_commit:
        description: Exact NKE commit approved for a full secret-backed validation
        required: false
        type: string
      arch:
        description: Native architecture for toolchain or full image validation
        required: true
        default: arm64
        type: choice
        options: [both, amd64, arm64]
      mode:
        description: Check KVM access, build the toolchain, or run full image validation
        required: true
        default: toolchain
        type: choice
        options: [preflight, toolchain, full]
      mirror_pr:
        description: Optional PR number whose copy-pr-bot mirror and current PR head must equal commit_sha
        required: false
        type: string
      retain_qcow2:
        description: Upload the multi-GB QCOW2 after a successful full validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    name: Select exact commit and native runners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.select.outputs.commit }}
      legs: ${{ steps.select.outputs.legs }}
      mode: ${{ steps.select.outputs.mode }}
      mirror_pr: ${{ steps.select.outputs.mirror_pr }}
      nke_commit: ${{ steps.source.outputs.commit }}
      nke_tree: ${{ steps.source.outputs.tree }}
      retain_qcow2: ${{ steps.select.outputs.retain_qcow2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate selection
        id: select
        env:
          DISPATCH_ARCH: ${{ inputs.arch }}
          DISPATCH_COMMIT: ${{ inputs.commit_sha }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_MIRROR_PR: ${{ inputs.mirror_pr }}
          DISPATCH_RETAIN_QCOW2: ${{ inputs.retain_qcow2 }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            push)
              commit="${EVENT_SHA}"
              arch=both
              mode=full
              mirror_pr=''
              retain_qcow2=true
              ;;
            workflow_dispatch)
              commit="${DISPATCH_COMMIT}"
              arch="${DISPATCH_ARCH}"
              mode="${DISPATCH_MODE}"
              mirror_pr="${DISPATCH_MIRROR_PR}"
              retain_qcow2="${DISPATCH_RETAIN_QCOW2}"
              ;;
            *) echo "unsupported validation event: ${EVENT_NAME}" >&2; exit 1 ;;
          esac
          if [[ ! "${commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be one exact lowercase 40-character SHA" >&2
            exit 1
          fi
          case "${mode}" in
            preflight|toolchain|full) ;;
            *) echo "unsupported validation mode: ${mode}" >&2; exit 1 ;;
          esac
          if [[ "${mode}" == preflight ]]; then
            # The approved, credential-free probe executes this workflow's own
            # exact branch commit, not a separately selected candidate checkout.
            if [[ "${EVENT_NAME}" != workflow_dispatch || "${EVENT_REF}" != refs/heads/* ||
                  "${commit}" != "${EVENT_SHA}" || -n "${mirror_pr}" || "${retain_qcow2}" != false ]]; then
              echo "preflight requires an exact dispatched branch commit, no mirror and no image upload" >&2
              exit 1
            fi
          elif [[ "${EVENT_REF}" != refs/heads/main ]]; then
            echo "toolchain and full validation must run from the trusted main workflow" >&2
            exit 1
          fi
          case "${retain_qcow2}" in
            true|false) ;;
            *) echo "retain_qcow2 must be true or false" >&2; exit 1 ;;
          esac
          if [[ "${mode}" == preflight ]]; then
            test "$(git rev-parse HEAD)" = "${commit}"
          elif [[ -n "${mirror_pr}" ]]; then
            if [[ ! "${mirror_pr}" =~ ^[1-9][0-9]*$ ]]; then
              echo "mirror_pr must be a positive pull request number" >&2
              exit 1
            fi
            mirror_commit="$(gh api "repos/${REPOSITORY}/git/ref/heads/pull-request/${mirror_pr}" --jq '.object.sha')" || {
              echo "copy-pr-bot mirror pull-request/${mirror_pr} is unavailable" >&2
              exit 1
            }
            pr_json="$(gh api "repos/${REPOSITORY}/pulls/${mirror_pr}")" || {
              echo "unable to inspect PR ${mirror_pr}" >&2
              exit 1
            }
            IFS=$'\t' read -r pr_commit pr_state pr_repo pr_base pr_draft <<<"$(
              jq -r '[.head.sha, .state, .head.repo.full_name, .base.ref, .draft] | @tsv' <<<"${pr_json}"
            )"
            if [[ "${mirror_commit}" != "${commit}" || "${pr_commit}" != "${commit}" ||
                  "${pr_state}" != open || "${pr_repo}" != "${REPOSITORY}" ||
                  "${pr_base}" != main || "${pr_draft}" != false ]]; then
              echo "commit_sha ${commit} is not the authenticated, ready in-repository PR ${mirror_pr} tip" >&2
              echo "mirror=${mirror_commit} head=${pr_commit} state=${pr_state} repository=${pr_repo} base=${pr_base} draft=${pr_draft}" >&2
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "${commit}" origin/main; then
              echo "commit_sha is not reachable from main; select its exact mirror_pr" >&2
              exit 1
            fi
          fi
          git cat-file -e "${commit}^{commit}"
          if [[ "${mode}" == toolchain ]]; then
            amd64='{"arch":"amd64","runner":"ubuntu-24.04"}'
            arm64='{"arch":"arm64","runner":"ubuntu-24.04-arm"}'
          else
            # NKE main uses arc-arm64-kvm; NKE PR #1100 selects
            # arc-amd64-kvm. Neither establishes access from nke-recipes;
            # verify both scale sets are granted before a full dispatch.
            amd64='{"arch":"amd64","runner":"arc-amd64-kvm"}'
            arm64='{"arch":"arm64","runner":"arc-arm64-kvm"}'
          fi
          case "${arch}" in
            amd64) legs="[${amd64}]" ;;
            arm64) legs="[${arm64}]" ;;
            both) legs="[${amd64},${arm64}]" ;;
            *) echo "unsupported architecture selection: ${arch}" >&2; exit 1 ;;
          esac
          {
            echo "commit=${commit}"
            echo "legs=${legs}"
            echo "mode=${mode}"
            echo "mirror_pr=${mirror_pr}"
            echo "retain_qcow2=${retain_qcow2}"
          } >>"${GITHUB_OUTPUT}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.select.outputs.mode == 'full'
        with:
          go-version-file: .go-version
          cache: false

      - name: Build trusted catalog reader
        if: steps.select.outputs.mode == 'full'
        run: make build

      - name: Check out selected authored inputs without persisted credentials
        if: steps.select.outputs.mode == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.select.outputs.commit }}
          path: .candidate-inputs
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the recipe-owned NKE source pin
        id: source
        if: steps.select.outputs.mode == 'full'
        env:
          VALIDATED_LEGS: ${{ steps.select.outputs.legs }}
        run: |
          set -euo pipefail
          mapfile -t required_arches < <(jq -r '.[].arch' <<<"${VALIDATED_LEGS}")
          for target_arch in "${required_arches[@]}"; do
            input_dir=.candidate-inputs/definitions/nke-os
            test -f "${input_dir}/definition-${target_arch}-kvm.yaml" || {
              echo "missing maintained ${target_arch} KVM Definition" >&2
              exit 1
            }
            test -f "${input_dir}/environment-local-linux-${target_arch}-docker.yaml" || {
              echo "missing maintained ${target_arch} Docker Environment" >&2
              exit 1
            }
          done
          # Reject drift in locked toolchain source pins. Candidate build scripts
          # and the resulting image remain untrusted diagnostic inputs; this
          # comparison does not establish a toolchain trust boundary.
          candidate_lock=.candidate-inputs/toolchains/nkd-packer/toolchain.lock.json
          test -f "${candidate_lock}" || {
            echo "candidate toolchain lock is missing" >&2
            exit 1
          }
          jq -n -e --slurpfile candidate "${candidate_lock}" \
            --slurpfile reviewed toolchains/nkd-packer/toolchain.lock.json '
            def valid_ids:
              type == "object" and
              (keys | sort) == ["amd64", "arm64"] and
              all(.[]; . == null or (type == "string" and test("^sha256:[0-9a-f]{64}$")));
            ($candidate | length) == 1 and ($reviewed | length) == 1 and
            ($candidate[0] as $input |
              ($reviewed[0] | del(.localImages, .localPodmanImages, .localDockerImages)) as $trusted |
              ($input | del(.localImages, .localPodmanImages, .localDockerImages)) == $trusted and
              if $input | has("localImages") then
                ($input | has("localPodmanImages") | not) and
                ($input | has("localDockerImages") | not) and
                ($input.localImages | valid_ids)
              else
                ($input | has("localPodmanImages")) and
                ($input | has("localDockerImages")) and
                ($input.localPodmanImages | valid_ids) and
                ($input.localDockerImages | valid_ids)
              end)
          ' >/dev/null || {
            jq -n -r --slurpfile candidate "${candidate_lock}" \
              --slurpfile reviewed toolchains/nkd-packer/toolchain.lock.json '
              if ($candidate | length) != 1 then
                "candidate lock must contain exactly one JSON document"
              else
                ($candidate[0] | del(.localImages, .localPodmanImages, .localDockerImages)) as $input |
                ($reviewed[0] | del(.localImages, .localPodmanImages, .localDockerImages)) as $trusted |
                [($input | keys[]), ($trusted | keys[])] | unique |
                map(select($input[.] != $trusted[.])) |
                "mismatched locked fields: " + join(", ")
              end
            ' >&2 || true
            echo "candidate toolchain pins or local image IDs are invalid; use toolchain mode or land reviewed pins first" >&2
            exit 1
          }
          pin="$(bin/nkdctl catalog source-pin \
            --data .candidate-inputs/definitions/nke-os/catalog nke-os)"
          # One lock entry cannot establish the full component/overlay closure.
          # New input schemas must land in main before this trusted reader.
          for target_arch in "${required_arches[@]}"; do
            input_dir=.candidate-inputs/definitions/nke-os
            plan="$(bin/nkdctl run plan \
              --definition "${input_dir}/definition-${target_arch}-kvm.yaml" \
              --environment "${input_dir}/environment-local-linux-${target_arch}-docker.yaml" --json)"
            jq -L scripts -e --argjson pin "${pin}" \
              'include "nke-os-plan"; nke_source_closure($pin)' <<<"${plan}" >/dev/null || {
              echo "selected ${target_arch} NKE source closure disagrees with the approved pin" >&2
              exit 1
            }
          done
          {
            echo "commit=$(jq -er '.commit' <<<"${pin}")"
            echo "tree=$(jq -er '.treeHash' <<<"${pin}")"
          } >>"${GITHUB_OUTPUT}"

      # Main pushes use the pin from the merged catalog and validated Plans.
      # Manual full runs additionally require the dispatch value to match it;
      # this consistency check is not independent approval of candidate code.
      - name: Check the manually selected NKE source pin
        if: steps.select.outputs.mode == 'full' && github.event_name == 'workflow_dispatch'
        env:
          APPROVED_NKE_COMMIT: ${{ inputs.approved_nke_commit }}
          PINNED_NKE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          if [[ ! "${APPROVED_NKE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "approved_nke_commit must be one exact lowercase 40-character SHA" >&2
            exit 1
          fi
          if [[ "${PINNED_NKE_COMMIT}" != "${APPROVED_NKE_COMMIT}" ]]; then
            echo "recipe-selected NKE commit ${PINNED_NKE_COMMIT} does not match approved ${APPROVED_NKE_COMMIT}" >&2
            exit 1
          fi

  validate-kvm:
    name: NKE KVM preflight (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.mode == 'preflight'
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Record exact workflow and runner
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_ARCH: ${{ runner.arch }}
        run: |
          printf 'Workflow commit: %s\nRunner: %s\nArchitecture: %s\n' \
            "${WORKFLOW_SHA}" "${RUNNER_NAME}" "${RUNNER_ARCH}"

      - name: Admit native KVM runner
        run: &native_kvm_preflight |
          set -euo pipefail
          id
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::Missing /dev/kvm for ${{ matrix.arch }}"
            exit 1
          fi
          stat -c '%U:%G %a' /dev/kvm
          # The scale set must provide access through its KVM group or device
          # configuration. A build job must not change host device permissions.
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::Runner identity needs read/write access to /dev/kvm; configure the runner's KVM group or device access"
            exit 1
          fi
          # This preflight only checks access. NKD independently admits KVM and
          # guards Docker's device projection before invoking Packer.
          exec 3<>/dev/kvm
          exec 3>&-

  validate-toolchain:
    name: NKE OS toolchain (${{ matrix.arch }})
    needs: select
    if: needs.select.outputs.mode == 'toolchain'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build and validate pinned native toolchain
        id: toolchain
        env:
          CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          mkdir -p .nkd/evidence
          printf '%s\n' 'unqualified-diagnostic' >.nkd/evidence/evidence-scope
          toolchains/nkd-packer/build.sh --arch '${{ matrix.arch }}' \
            2>&1 | tee ".nkd/evidence/toolchain-${{ matrix.arch }}.log"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Prove Docker identity bind on native daemon
        env:
          NKD_TEST_DOCKER_TOOLCHAIN_IMAGE: localhost/nkd-packer-toolchain:dev-${{ matrix.arch }}
        run: go test ./pkg/nkd/pipeline -run '^TestDockerPackerIdentityBind$' -count=1

      # This observation is candidate-influenced diagnostic output. It never
      # authorizes a lock update or a release identity.
      - name: Record exact native toolchain image ID
        if: always() && steps.toolchain.outcome == 'success'
        run: |
          set -euo pipefail
          docker image inspect --format '{{.Id}}' \
            "localhost/nkd-packer-toolchain:dev-${{ matrix.arch }}" \
            | tee ".nkd/evidence/toolchain-${{ matrix.arch }}.image-id"

      - name: Upload toolchain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nke-os-${{ matrix.arch }}-toolchain-${{ needs.select.outputs.commit }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .nkd/evidence/evidence-scope
            .nkd/evidence/toolchain-${{ matrix.arch }}.*

  fetch-nke-source:
    name: Fetch exact NKE source
    needs: select
    if: needs.select.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_digest: ${{ steps.package.outputs.archive_digest }}
    steps:
      # This job contains no checkout or executable code from the selected
      # candidate. Its NKE credential never enters either build runner job.
      - name: Check out exact pinned NKE source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dsx-ai-factory/nke
          ref: ${{ needs.select.outputs.nke_commit }}
          token: ${{ secrets.NKE_SOURCE_TOKEN }}
          path: .trusted/nke
          fetch-depth: 1
          persist-credentials: false

      - name: Authenticate and package credential-free source
        id: package
        env:
          NKE_COMMIT: ${{ needs.select.outputs.nke_commit }}
          NKE_TREE: ${{ needs.select.outputs.nke_tree }}
        run: |
          set -euo pipefail
          test "$(git -C .trusted/nke rev-parse HEAD)" = "${NKE_COMMIT}"
          test "$(git -C .trusted/nke rev-parse 'HEAD^{tree}')" = "${NKE_TREE}"
          mkdir -p .handoff
          git clone --quiet --no-local --no-hardlinks .trusted/nke .handoff/nke
          git -C .handoff/nke checkout --quiet --detach "${NKE_COMMIT}"
          git -C .handoff/nke remote remove origin
          test "$(git -C .handoff/nke rev-parse HEAD)" = "${NKE_COMMIT}"
          test "$(git -C .handoff/nke rev-parse 'HEAD^{tree}')" = "${NKE_TREE}"
          config_keys="$(git -C .handoff/nke config --local --name-only --list)"
          while IFS= read -r key; do
            case "${key}" in
              core.repositoryformatversion|core.filemode|core.bare|core.logallrefupdates|core.ignorecase|core.precomposeunicode) ;;
              *) echo "source handoff contains unexpected Git configuration key" >&2; exit 1 ;;
            esac
          done <<<"${config_keys}"
          tar -C .handoff -cf .handoff/nke-source.tar nke
          digest="$(sha256sum .handoff/nke-source.tar | cut -d' ' -f1)"
          echo "archive_digest=${digest}" >>"${GITHUB_OUTPUT}"

      - name: Upload one-day NKE source handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nke-os-source-${{ github.run_id }}
          overwrite: true
          path: .handoff/nke-source.tar
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 1

  validate-full:
    name: NKE OS full validation (${{ matrix.arch }})
    needs: [select, fetch-nke-source]
    if: needs.select.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.legs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 420
    steps:
      - name: Admit native KVM runner
        run: *native_kvm_preflight

      - name: Download exact NKE source handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nke-os-source-${{ github.run_id }}
          path: .trusted-transfer

      - name: Authenticate and unpack pinned NKE source
        env:
          NKE_COMMIT: ${{ needs.select.outputs.nke_commit }}
          NKE_TREE: ${{ needs.select.outputs.nke_tree }}
          SOURCE_ARCHIVE_DIGEST: ${{ needs.fetch-nke-source.outputs.archive_digest }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_ARCHIVE_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "${SOURCE_ARCHIVE_DIGEST}" .trusted-transfer/nke-source.tar \
            | sha256sum -c -
          mkdir -p .trusted
          tar -xf .trusted-transfer/nke-source.tar -C .trusted
          test "$(git -C .trusted/nke rev-parse HEAD)" = "${NKE_COMMIT}"
          test "$(git -C .trusted/nke rev-parse 'HEAD^{tree}')" = "${NKE_TREE}"

      - name: Check out the selected NKD candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.commit }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize retained evidence
        working-directory: .candidate
        env:
          CANDIDATE_COMMIT: ${{ needs.select.outputs.commit }}
          MIRROR_PR: ${{ needs.select.outputs.mirror_pr }}
          NKE_COMMIT: ${{ needs.select.outputs.nke_commit }}
          NKE_TREE: ${{ needs.select.outputs.nke_tree }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p .nkd/evidence
          candidate_tree="$(git rev-parse 'HEAD^{tree}')"
          jq -n \
            --arg scope unqualified-diagnostic \
            --arg candidateCommit "${CANDIDATE_COMMIT}" \
            --arg candidateTree "${candidate_tree}" \
            --arg mirrorPR "${MIRROR_PR}" \
            --arg nkeCommit "${NKE_COMMIT}" \
            --arg nkeTree "${NKE_TREE}" \
            --arg runID "${RUN_ID}" \
            --arg runAttempt "${RUN_ATTEMPT}" \
            --arg workflowSHA "${WORKFLOW_SHA}" \
            --arg runnerName "${RUNNER_NAME}" \
            --arg runnerOS "${RUNNER_OS}" \
            --arg runnerArch "${RUNNER_ARCH}" \
            --arg targetArch "${TARGET_ARCH}" \
            '{schemaVersion:"nkd.dev/nke-os-validation/v1", scope:$scope,
              candidateCommit:$candidateCommit, candidateTree:$candidateTree,
              mirrorPR:$mirrorPR, workflowSHA:$workflowSHA,
              nkeCommit:$nkeCommit, nkeTree:$nkeTree,
              runID:$runID, runAttempt:$runAttempt, targetArch:$targetArch,
              runner:{name:$runnerName, os:$runnerOS, arch:$runnerArch}}' \
            >.nkd/evidence/context.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .candidate/.go-version
          cache: false

      - name: Check guarded Packer dispatch on the admitted KVM runner
        working-directory: .candidate
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          NKD_REQUIRE_KVM_TEST: '1'
        run: |
          set -euo pipefail
          go test ./pkg/nkd/pipeline -run '^TestRunPackerContainerClassifiesBuildExit$' -count=1 -v \
            2>&1 | tee ".nkd/evidence/packer-dispatch-${{ matrix.arch }}.log"

      - name: Build one QCOW2 through the NKD lifecycle
        id: lifecycle
        working-directory: .candidate
        env:
          CONTAINER_RUNTIME: docker
          NKE_LOCAL_CLONE: ${{ github.workspace }}/.trusted/nke
          NKE_OS_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          attempt="gha-${{ matrix.arch }}-${{ needs.select.outputs.commit }}"
          echo "${attempt}" >".nkd/evidence/attempt-${{ matrix.arch }}"
          scripts/nke-os-local.sh "${attempt}" 4 \
            2>&1 | tee ".nkd/evidence/lifecycle-${{ matrix.arch }}.log"

      - name: Record diagnostic QCOW2 identity
        working-directory: .candidate
        env:
          ARCH: ${{ matrix.arch }}
          NKE_COMMIT: ${{ needs.select.outputs.nke_commit }}
          NKE_TREE: ${{ needs.select.outputs.nke_tree }}
          RUNNER_ARCH: ${{ runner.arch }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          attempt="$(cat ".nkd/evidence/attempt-${ARCH}")"
          output_dir=".nkd/runs/${attempt}/outputs"
          qcow="${output_dir}/nke-node-image-${ARCH}.qcow2"
          test -f "${qcow}"
          test "$(find "${output_dir}" -maxdepth 1 -type f -name '*.qcow2' | wc -l | tr -d ' ')" = 1
          digest="$(sha256sum "${qcow}" | cut -d' ' -f1)"
          size="$(stat -c %s "${qcow}")"
          printf 'sha256:%s\n' "${digest}" >".nkd/evidence/qcow2-${ARCH}.digest"
          printf '%s\n' "${size}" >".nkd/evidence/qcow2-${ARCH}.size"
          jq --arg digest "sha256:${digest}" --argjson size "${size}" \
            '. + {qcow2:{digest:$digest, size:$size}}' \
            .nkd/evidence/context.json >.nkd/evidence/metadata.json
          {
            echo "### NKE OS ${ARCH} diagnostic validation"
            echo
            echo "- Evidence scope: unqualified diagnostic"
            echo "- NKE commit: \`${NKE_COMMIT}\`"
            echo "- NKE tree: \`${NKE_TREE}\`"
            echo "- Runner: \`${RUNNER_NAME}\` (\`${RUNNER_OS}/${RUNNER_ARCH}\`)"
            echo "- QCOW2 digest: \`sha256:${digest}\`"
            echo "- QCOW2 size: \`${size}\` bytes"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Record exact native toolchain image ID
        if: always() && (steps.lifecycle.outcome == 'success' || steps.lifecycle.outcome == 'failure')
        working-directory: .candidate
        env:
          ARCH: ${{ matrix.arch }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        run: |
          set -euo pipefail
          attempt="$(cat ".nkd/evidence/attempt-${ARCH}")"
          plan=".nkd/runs/${attempt}/.runner/plan.json"
          if [[ ! -f "${plan}" ]]; then
            if [[ "${LIFECYCLE_OUTCOME}" == success ]]; then
              echo "::error::Successful lifecycle did not retain its executable Plan"
              exit 1
            fi
            echo "::notice::No executable Plan was recorded before lifecycle failure; no toolchain observation is available"
            exit 0
          fi
          image="$(jq -er '
            [.builds[].executionGraph.nodes[] |
              select(.kind == "build" and .builderType == "vm-image") | .toolchain] |
            if length == 1 then .[0] else error("expected exactly one disk toolchain") end
          ' "${plan}")"
          # Select the smoke image from the Plan, not a mutable development tag.
          test "$(docker image inspect --format '{{.Id}}' "${image}")" = "${image}" || {
            echo "::error::Observed toolchain image does not match the executable Plan"
            exit 1
          }
          printf '%s\n' "${image}" | tee ".nkd/evidence/toolchain-${ARCH}.image-id"

      - name: Run source-owned boot smoke
        working-directory: .candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          attempt="$(cat ".nkd/evidence/attempt-${ARCH}")"
          qcow=".nkd/runs/${attempt}/outputs/nke-node-image-${ARCH}.qcow2"
          # This image was built by candidate code; the smoke result remains
          # diagnostic and does not authenticate the toolchain or disk.
          image="$(cat ".nkd/evidence/toolchain-${ARCH}.image-id")"
          [[ "${image}" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "missing exact observed ${ARCH} Packer toolchain image ID" >&2
            exit 1
          }
          mkdir -p ".nkd/boot-smoke/${ARCH}"
          identity_dir="${PWD}/.nkd/boot-smoke-identity/${ARCH}"
          install -d -m 0700 "${identity_dir}"
          printf 'nkd:x:%s:%s:NKD Builder:/work:/bin/sh\n' "$(id -u)" "$(id -g)" \
            >"${identity_dir}/passwd"
          printf 'nkd:x:%s:\n' "$(id -g)" >"${identity_dir}/group"
          chmod 0400 "${identity_dir}/passwd" "${identity_dir}/group"
          kvm_group="$(stat -c %g /dev/kvm)"
          docker run --rm --pull=never --network=none --read-only --cap-drop=all \
            --security-opt no-new-privileges --device /dev/kvm --group-add "${kvm_group}" \
            --user "$(id -u):$(id -g)" --tmpfs /tmp:rw,nosuid,nodev \
            --mount "type=bind,src=${identity_dir}/passwd,dst=/etc/passwd,readonly" \
            --mount "type=bind,src=${identity_dir}/group,dst=/etc/group,readonly" \
            --volume "${GITHUB_WORKSPACE}/.trusted/nke:/nke:ro" \
            --volume "${PWD}/${qcow}:/nke-node-image-${ARCH}.qcow2:ro" \
            --volume "${PWD}/.nkd/boot-smoke/${ARCH}:/work:rw" \
            --env ARCH="${ARCH}" --entrypoint bash "${image}" -ec '
              ssh-keygen -q -t ed25519 -N "" -f /work/id_ed25519
              QCOW=/nke-node-image-${ARCH}.qcow2 SSH_KEY=/work/id_ed25519 REQUIRE_ACCELERATION=1 \
                /nke/os-image/packer/scripts/boot-smoke.sh
            ' 2>&1 | tee ".nkd/evidence/boot-smoke-${ARCH}.log"

      - name: Upload full validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nke-os-${{ matrix.arch }}-evidence-${{ needs.select.outputs.commit }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: |
            .candidate/.nkd/evidence/**
            .candidate/.nkd/runs/gha-${{ matrix.arch }}-${{ needs.select.outputs.commit }}/.runner/plan.json
            .candidate/.nkd/runs/gha-${{ matrix.arch }}-${{ needs.select.outputs.commit }}/diagnostics/packer/**
            .candidate/.nkd/runs/gha-${{ matrix.arch }}-${{ needs.select.outputs.commit }}/lifecycle.json

      - name: Upload retained QCOW2
        if: success() && needs.select.outputs.retain_qcow2 == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nke-os-${{ matrix.arch }}-qcow2-${{ needs.select.outputs.commit }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
          path: .candidate/.nkd/runs/gha-${{ matrix.arch }}-${{ needs.select.outputs.commit }}/outputs/nke-node-image-${{ matrix.arch }}.qcow2
