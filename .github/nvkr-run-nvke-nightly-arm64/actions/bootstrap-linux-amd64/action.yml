    - name: 'Install NVKR runner'
      run: |
        set -eu
        export CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOBIN="$RUNNER_TEMP/nvkr-runner"
        if [ -f cmd/nvkr/main.go ]; then package=./cmd/nvkr; else package=github.com/dsx-ai-factory/nvkr/cmd/nvkr@latest; fi
        go install -trimpath -ldflags '-X main.version=dev -X main.commit=unknown' "$package"
        mv "$GOBIN/nvkr" nvkr-exec
      shell: bash -e {0}
    - name: 'Download NVKR runtime inputs'
      uses: ./.github/nvkr-run-nvke-nightly-arm64/actions/ci-download
      with:
        name: 'nvkr-runtime-inputs'
        path: '.nvkr/runtime-inputs'
        nvkr-ci-storage-read-token: ${{ inputs.nvkr-ci-storage-read-token }}
    - name: 'Install NVKR runtime inputs'
      run: |
        ./nvkr-exec factory github install-runtime-inputs --plan .github/nvkr-run-nvke-nightly-arm64/plan.json
      shell: bash -e {0}
    - name: Verify committed Run generation is current
      id: validate-catalog
      env:
        GIT_CONFIG_COUNT: '4'
        GIT_CONFIG_GLOBAL: '/dev/null'
        GIT_CONFIG_KEY_0: 'credential.helper'
        GIT_CONFIG_KEY_1: 'credential.useHttpPath'
        GIT_CONFIG_KEY_2: 'url.https://github.com/dsx-ai-factory/nvke.insteadOf'
        GIT_CONFIG_KEY_3: 'credential.https://github.com/dsx-ai-factory/nvke.helper'
        GIT_CONFIG_NOSYSTEM: '1'
        GIT_CONFIG_VALUE_0: ''
        GIT_CONFIG_VALUE_1: 'true'
        GIT_CONFIG_VALUE_2: 'https://github.com/dsx-ai-factory/nvke'
        GIT_CONFIG_VALUE_3: '!f() { if [ "$1" = get ]; then printf ''%s\n'' ''username=x-access-token'' "password=$NVKR_PIN_SOURCE_TOKEN_0"; fi; }; f'
        GIT_TERMINAL_PROMPT: '0'
        NVKR_PIN_SOURCE_TOKEN_0: ${{ inputs.nvkr-pin-source-token-0 }}
