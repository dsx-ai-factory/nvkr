name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]

body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I searched existing issues and found no duplicates
          required: true
        - label: This is not a security vulnerability. I will report security vulnerabilities privately as described in the [security policy](https://github.com/dsx-ai-factory/nke-recipes/blob/main/SECURITY.md)
          required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened and what did you expect?
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How severe is this issue for you?
      options:
        - Blocking (cannot proceed)
        - High (major functionality broken)
        - Medium (workaround exists)
        - Low (minor issue)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Catalog — pins (pins.lock.yaml)
        - Catalog — registry (sources / constraints / build commands)
        - Definitions — output selection / catalog substitutions
        - Environment — execution or publication configuration
        - Run — planning, generation, or execution
        - Release — verification or consumption
        - CLI (nkdctl)
        - Generator / pipeline emission
        - Signing / provenance / evidence
        - Docs / examples
        - Other / Unknown
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      description: Did this work in a previous version?
      options:
        - "Yes, this worked before (please specify version below)"
        - "No, this is a new use case"
        - "Unknown / first time using this feature"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps or observed pattern
      description: Provide reliable reproduction steps, or for an intermittent failure, its observed frequency and conditions.
      placeholder: |
        1. Step one
        2. Step two
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - NKE Recipes CLI version (`nkdctl --version`) or source commit SHA:
        - OS and architecture:
        - Go version:
        - Operation (definition, run, resolve, catalog, or release; include subcommand):
        - Engine and Environment file path (if applicable; file name/path only, not contents; redact private hostnames):
        - Container runtime and version (if applicable):
        - Relevant tool versions (for example Packer, cosign, or Syft):
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command used
      description: Paste the exact CLI command(s) that triggered the issue. Redact credentials, secrets, and private hostnames, including tokens in URLs.
      placeholder: |
        ```bash
        nkdctl resolve --data path/to/catalog --component kubectl --platform linux/amd64
        ```
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Include the coded error, exit status, and smallest relevant log excerpt when available. Redact credentials, secrets, and private hostnames.
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Anything else that might help (recent upgrade, related issues, or workarounds?).
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow the project's [Code of Conduct](https://github.com/dsx-ai-factory/nke-recipes/blob/main/CODE_OF_CONDUCT.md)
          required: true
