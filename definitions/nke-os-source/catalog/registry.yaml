    constraint: 1.6.0
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  containerd-2-1-7:
    repo: https://github.com/containerd/containerd
    constraint: 2.1.7
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  containerd-2-2-3:
    repo: https://github.com/containerd/containerd
    constraint: 2.2.3
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  containerd-2-3-0:
    repo: https://github.com/containerd/containerd
    constraint: 2.3.0
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  kubernetes-1-34-2:
    repo: https://github.com/kubernetes/kubernetes
    constraint: 1.34.2
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  kubernetes-1-35-3:
    repo: https://github.com/kubernetes/kubernetes
    constraint: 1.35.3
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  kubernetes-1-36-3:
    repo: https://github.com/kubernetes/kubernetes
    constraint: 1.36.3
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
components:
  tpm-attestor-agent-1-9-0:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: spire-tpm-1-9-0
    outputType: raw
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        go build -mod=vendor -ldflags "-s -w -buildid=" \
          -o /src/nkd-output/tpm_attestor_agent ./cmd/tpm_attestor_agent
    writeDir: nkd-output
    artifactPath: nkd-output/tpm_attestor_agent
  get-tpm-pubhash-1-9-0:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: spire-tpm-1-9-0
    outputType: raw
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        go build -mod=vendor -ldflags "-s -w -buildid=" \
          -o /src/nkd-output/get_tpm_pubhash ./cmd/get_tpm_pubhash
    writeDir: nkd-output
    artifactPath: nkd-output/get_tpm_pubhash
  crictl-1-34-0:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: crictl-1-34-0
    outputType: raw
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        go build -mod=vendor -ldflags "-s -w -buildid= -X sigs.k8s.io/cri-tools/pkg/version.Version=$BUILD_VERSION" \
          -o /src/nkd-output/crictl ./cmd/crictl
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: nkd-output
    artifactPath: nkd-output/crictl
  crictl-1-35-0:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: crictl-1-35-0
    outputType: raw
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        go build -mod=vendor -ldflags "-s -w -buildid= -X sigs.k8s.io/cri-tools/pkg/version.Version=$BUILD_VERSION" \
          -o /src/nkd-output/crictl ./cmd/crictl
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: nkd-output
    artifactPath: nkd-output/crictl
  crictl-1-36-0:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: crictl-1-36-0
    outputType: raw
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        go build -mod=vendor -ldflags "-s -w -buildid= -X sigs.k8s.io/cri-tools/pkg/version.Version=$BUILD_VERSION" \
          -o /src/nkd-output/crictl ./cmd/crictl
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: nkd-output
    artifactPath: nkd-output/crictl
  helm-3-20-2:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: helm-3-20-2
    outputType: raw
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        # Match the pinned upstream Makefile's client-go-derived defaults.
        client_version="$(go list -mod=vendor -m k8s.io/client-go | awk '{print $2}')"
        test "$client_version" = v0.35.1
        IFS=. read -r client_major k8s_minor client_patch <<<"${client_version#v}"
        k8s_major=$((client_major + 1))
        # Removed negative-test fixture links are not cmd/helm compilation inputs.
        go build -mod=vendor -ldflags "-s -w -buildid= -X helm.sh/helm/v3/pkg/chartutil.k8sVersionMajor=$k8s_major -X helm.sh/helm/v3/pkg/chartutil.k8sVersionMinor=$k8s_minor -X helm.sh/helm/v3/pkg/lint/rules.k8sVersionMajor=$k8s_major -X helm.sh/helm/v3/pkg/lint/rules.k8sVersionMinor=$k8s_minor -X helm.sh/helm/v3/internal/version.version=$BUILD_VERSION -X helm.sh/helm/v3/internal/version.gitCommit=$GIT_VERSION -X helm.sh/helm/v3/internal/version.gitTreeState=clean" \
          -o /src/nkd-output/helm ./cmd/helm
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: nkd-output
    artifactPath: nkd-output/helm
  cni-plugins-1-6-0:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: cni-plugins-1-6-0
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        mkdir -p /src/nkd-output/bin
        for directory in plugins/meta/* plugins/main/* plugins/ipam/*; do
          test -d "$directory" || continue
          plugin="$(basename "$directory")"
          test "$plugin" != windows || continue
          go build -mod=vendor -ldflags "-s -w -buildid= -X github.com/containernetworking/plugins/pkg/utils/buildversion.BuildVersion=$BUILD_VERSION" \
            -o "/src/nkd-output/bin/$plugin" "./$directory"
        done
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/bin \
          -cf /src/nkd-output/cni-plugins-1-6-0.tar .
    writeDir: nkd-output
    artifactPath: nkd-output/cni-plugins-1-6-0.tar
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
  containerd-2-1-7:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: containerd-2-1-7
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
        mkdir -p /src/nkd-output/bin
        for binary in containerd ctr containerd-shim-runc-v2; do
          tags=urfave_cli_no_docs
          if test "$binary" = containerd-shim-runc-v2; then tags="$tags no_grpc"; fi
          go build -mod=vendor -tags "$tags" \
            -ldflags "-s -w -buildid= -X github.com/containerd/containerd/v2/version.Version=$BUILD_VERSION -X github.com/containerd/containerd/v2/version.Revision=$GIT_VERSION -X github.com/containerd/containerd/v2/version.Package=github.com/containerd/containerd/v2" \
            -o "/src/nkd-output/bin/$binary" "./cmd/$binary"
        done
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/bin \
          -cf /src/nkd-output/containerd-2-1-7.tar .
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: nkd-output
    artifactPath: nkd-output/containerd-2-1-7.tar
  containerd-2-2-3:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: containerd-2-2-3
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOPROXY=off
