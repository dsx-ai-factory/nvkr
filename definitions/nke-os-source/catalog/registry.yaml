apiVersion: nkd.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nke-os-public-sources
  description: Direct public-source OS binary producers. Experimental; not the complete node-image closure.
sources:
  spire-tpm-1-9-0:
    repo: https://github.com/spiffe/spire-tpm-plugin
    constraint: 1.9.0
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
    vendorCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
        pins="$(sha256sum go.mod go.sum)"
        timeout --kill-after=10s 240s go mod download
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        GOPROXY=off timeout --kill-after=10s 60s go mod verify
        GOPROXY=off timeout --kill-after=10s 120s go mod vendor
        printf '%s\n' "$pins" | sha256sum --quiet -c -
  crictl-1-34-0:
    repo: https://github.com/kubernetes-sigs/cri-tools
    constraint: 1.34.0
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  crictl-1-35-0:
    repo: https://github.com/kubernetes-sigs/cri-tools
    constraint: 1.35.0
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  crictl-1-36-0:
    repo: https://github.com/kubernetes-sigs/cri-tools
    constraint: 1.36.0
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
  helm-3-20-2:
    repo: https://github.com/helm/helm
    constraint: 3.20.2
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
    vendorCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
        pins="$(sha256sum go.mod go.sum)"
        timeout --kill-after=10s 240s go mod download
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        GOPROXY=off timeout --kill-after=10s 60s go mod verify
        GOPROXY=off timeout --kill-after=10s 120s go mod vendor
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        # Upstream negative-test fixtures are not inputs to cmd/helm. Remove only
        # these exact, pinned external symlinks before closure authentication.
        test "$(readlink pkg/chart/loader/testdata/frobnitz_with_dev_null/null)" = /dev/null
        test "$(readlink internal/third_party/dep/fs/testdata/symlinks/invalid-symlink)" = /non/existing/file
        test "$(readlink internal/third_party/dep/fs/testdata/symlinks/windows-file-symlink)" = C:/Users/ibrahim/go/src/github.com/golang/dep/internal/fs/testdata/test.file
        git rm -- pkg/chart/loader/testdata/frobnitz_with_dev_null/null \
          internal/third_party/dep/fs/testdata/symlinks/invalid-symlink \
          internal/third_party/dep/fs/testdata/symlinks/windows-file-symlink
  helm-4-1-4:
    repo: https://github.com/helm/helm
    constraint: 4.1.4
    toolchainImagesByArch:
      amd64: docker.io/library/golang@sha256:e114385c58e7280d2f56d6cf374219dda33fef8eb77f72e9f290ccae6160bd90
      arm64: docker.io/library/golang@sha256:27da97ffaed4bbb1263c44a8e423a72a1547830ee14a70fdb0cef3f6268a1b8b
    vendorCommand:
      - bash
      - -ec
      - |
        export GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=
        pins="$(sha256sum go.mod go.sum)"
        timeout --kill-after=10s 240s go mod download
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        GOPROXY=off timeout --kill-after=10s 60s go mod verify
        GOPROXY=off timeout --kill-after=10s 120s go mod vendor
        printf '%s\n' "$pins" | sha256sum --quiet -c -
        # Diagnostic Local preparation only; held ExecNode source admission
        # rejects these fixtures before vendor execution (see the README).
        test "$(readlink internal/chart/v3/loader/testdata/frobnitz_with_dev_null/null)" = /dev/null
        test "$(readlink pkg/chart/v2/loader/testdata/frobnitz_with_dev_null/null)" = /dev/null
        test "$(readlink internal/third_party/dep/fs/testdata/symlinks/invalid-symlink)" = /non/existing/file
        test "$(readlink internal/third_party/dep/fs/testdata/symlinks/windows-file-symlink)" = C:/Users/ibrahim/go/src/github.com/golang/dep/internal/fs/testdata/test.file
        git rm -- internal/chart/v3/loader/testdata/frobnitz_with_dev_null/null \
          pkg/chart/v2/loader/testdata/frobnitz_with_dev_null/null \
          internal/third_party/dep/fs/testdata/symlinks/invalid-symlink \
          internal/third_party/dep/fs/testdata/symlinks/windows-file-symlink
