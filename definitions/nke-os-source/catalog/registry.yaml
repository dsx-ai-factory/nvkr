      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: 'clean'
    writeDir: nkd-output
    artifactPath: nkd-output/kubernetes-1-34-2.tar
  kubernetes-1-35-3:
