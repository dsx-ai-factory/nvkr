        for binary in kubeadm kubectl kubelet kube-apiserver kube-controller-manager kube-scheduler kube-proxy; do
          go build -mod=vendor -tags selinux,notest,grpcnotrace \
            -ldflags "-s -w -buildid= -X k8s.io/component-base/version.gitVersion=$KUBE_GIT_VERSION -X k8s.io/component-base/version.gitCommit=$KUBE_GIT_COMMIT -X k8s.io/component-base/version.gitMajor=$KUBE_GIT_MAJOR -X k8s.io/component-base/version.gitMinor=$KUBE_GIT_MINOR -X k8s.io/component-base/version.gitTreeState=$KUBE_GIT_TREE_STATE -X k8s.io/component-base/version.buildDate=$build_date -X k8s.io/client-go/pkg/version.gitVersion=$KUBE_GIT_VERSION -X k8s.io/client-go/pkg/version.gitCommit=$KUBE_GIT_COMMIT -X k8s.io/client-go/pkg/version.gitMajor=$KUBE_GIT_MAJOR -X k8s.io/client-go/pkg/version.gitMinor=$KUBE_GIT_MINOR -X k8s.io/client-go/pkg/version.gitTreeState=$KUBE_GIT_TREE_STATE -X k8s.io/client-go/pkg/version.buildDate=$build_date" \
            -o "/src/nkd-output/bin/$binary" "./cmd/$binary"
        done
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/bin \
          -cf /src/nkd-output/kubernetes-1-35-3.tar .
    versionStamp:
      KUBE_GIT_VERSION: '{{.Tag}}'
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: 'clean'
    writeDir: nkd-output
