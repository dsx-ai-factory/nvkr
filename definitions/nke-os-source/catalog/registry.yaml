        for binary in containerd ctr containerd-shim-runc-v2; do
          tags=urfave_cli_no_docs
          if test "$binary" = containerd-shim-runc-v2; then tags="$tags no_grpc"; fi
          go build -mod=vendor -tags "$tags" \
            -ldflags "-s -w -buildid= -X github.com/containerd/containerd/v2/version.Version=$BUILD_VERSION -X github.com/containerd/containerd/v2/version.Revision=$GIT_VERSION -X github.com/containerd/containerd/v2/version.Package=github.com/containerd/containerd/v2" \
            -o "/src/nkd-output/bin/$binary" "./cmd/$binary"
        done
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
