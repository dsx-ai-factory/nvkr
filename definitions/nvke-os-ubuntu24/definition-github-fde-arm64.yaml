apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-os-ubuntu24-fde-arm64
  description: Build one Ubuntu 24.04.5 native public-bootstrap FDE disk; build-only candidate.
catalog:
  base: ../nvke-v1/catalog
outputs:
  - name: nvke-node-fde-ubuntu24-arm64
    platform: linux/arm64
    format: disk-image
    catalog:
      base: ../nvke-m2/os-catalog
      overlays: [../nvke-m2/native-toolchains.yaml, ubuntu24.json]
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-arm64
      - nvke-patched-installer-iso
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso
