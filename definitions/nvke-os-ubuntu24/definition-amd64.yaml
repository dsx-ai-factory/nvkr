apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-os-ubuntu24-amd64
  description: Ubuntu 24.04.5 plain disk on native Linux AMD64 with KVM.
catalog:
  base: ../nvke-m2/os-catalog
  overlays: [../nvke-m2/native-toolchains.yaml, ubuntu24.json]
outputs:
  - name: nvke-node-image-ubuntu24-amd64
    platform: linux/amd64
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-image-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
