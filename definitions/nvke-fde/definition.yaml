apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-fde
  description: Build one native AMD64 FDE image with its required materials and the public bootstrap placeholder for feature-branch iteration.
catalog:
  base: ../nvke-v1/catalog
outputs:
  - name: nvke-node-fde-amd64
    platform: linux/amd64
    catalog:
      base: ../nvke-m2/os-catalog
      overlays: [../nvke-m2/native-toolchains.yaml]
    format: disk-image
    components:
      - dsx-imds-node-attestor-agent
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - spire-agent-upstream
      - spire-tpm-attestor-upstream
      - spire-tpm-pubhash-upstream
      - ubuntu-installer-iso-amd64
