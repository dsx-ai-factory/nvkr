apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../nvke-controller/catalog
cosignTool: cosign
kind: Definition
metadata:
  description: Build Linux AMD64/ARM64 CWE images as one OCI index, its controller chart and CLI binaries;
    acquire the four external charts selected by NVKE v0.21.0.
  name: nvke-deploy
outputs:
- components:
  - nvke-controller-chart
  format: helm-oci
  helm:
    images:
      controller: cwe
  name: controller-chart
  platform: linux/amd64
- components:
  - nvke-controller
  format: oci
  name: cwe
  platforms:
  - linux/amd64
  - linux/arm64
- catalog:
    base: ../nvke-v1/catalog
  components:
  - nvkectl
  format: executable
  name: nvkectl-linux-amd64
  platform: linux/amd64
- catalog:
    base: ../nvke-v1/catalog
  components:
  - nvkectl
  format: executable
  name: nvkectl-linux-arm64
  platform: linux/arm64
- components:
  - postgresql-chart
  format: helm-oci
  name: postgresql
  platform: linux/amd64
- components:
  - spire-chart
  format: helm-oci
  name: spire
  platform: linux/amd64
- components:
  - spire-crds-chart
  format: helm-oci
  name: spire-crds
  platform: linux/amd64
- components:
  - temporal-chart
  format: helm-oci
  name: temporal
  platform: linux/amd64
sbomTool: syft
