apiVersion: nvkr.dev/environment/v1
kind: Environment
metadata:
  name: nvke-ovn-source-github
  description: Candidate OVN publication through the existing GitHub OCI delivery path. Requires default-branch admission and fork-readable NVKE_SOURCE_TOKEN.
publication:
  mode: per-output-v1
  repositoryPrefix: ghcr.io/dsx-ai-factory/nvkr/m2-candidate
  credentialRef: github:GITHUB_TOKEN
runtime:
  runtime: docker
  buildNetworkPolicy: producer-declared
signing:
  identity: ^https://github\.com/dsx-ai-factory/nvkr/\.github/workflows/nvkr-run\.yml@refs/heads/main$
  issuer: https://token.actions.githubusercontent.com
  mode: cosign
sourceAccess:
  https://github.com/dsx-ai-factory/ovn-kubernetes:
    credentialRef: github:NVKE_SOURCE_TOKEN
    mirror: https://github.com/dsx-ai-factory/ovn-kubernetes
utilityContainer: busybox@sha256:29989570aeecad61a019f684218ea74d4b8c1c74f9e0abeb34ca926b81174ee1
utilityPlatform: linux/amd64
