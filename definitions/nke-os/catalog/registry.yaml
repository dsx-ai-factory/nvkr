apiVersion: nkd.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nke-os
  description: Non-FDE NKE node image from explicit authenticated component outputs.
sources:
  nke-os:
    repo: https://github.com/dsx-ai-factory/nke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      # Substitution-only baseline, not a maintained or reproducible Docker pin.
      # Each Docker attempt freezes its own observed ID before Plan execution.
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51
    vendorCommand:
      - bash
      - -ec
      - |
        cd agent
        GOWORK=off go mod vendor
  nke-cni-calico-source:
    repo: https://github.com/dsx-ai-factory/nke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51
    vendorCommand:
      - bash
      - -ec
      - |
        make -C os-image/packages/cni-calico bundle nfpm \
          ARCH={{.Arch}} BIN_DIR=/usr/local/bin
  ovn-kubernetes:
    repo: https://github.com/ovn-kubernetes/ovn-kubernetes
    constraint: 1.4.x
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51
  nke-kubeadm-distro-source:
    repo: https://github.com/dsx-ai-factory/nke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51
    vendorCommand:
      - bash
      - -ec
      - |
        make -C os-image/packages/kubeadm-distro bundle nfpm \
          ARCH={{.Arch}} BIN_DIR=/usr/local/bin
  nke-spire-agent-source:
    repo: https://github.com/dsx-ai-factory/nke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51
    vendorCommand:
      - bash
      - -ec
      - |
        make -C os-image/packages/spire-agent bundle nfpm \
          ARCH={{.Arch}} BIN_DIR=/usr/local/bin
components:
  nke-agent:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: nke-os
    cgo: true
    outputType: host-package
    buildCommand:
      - bash
      - -ec
      - |
        GOWORK=off GOFLAGS=-mod=vendor make -C agent deb-{{.Arch}} \
          VERSION=v0.2.1-rc.6-109-g726f7694 \
          NFPM_BIN=/usr/local/bin/nfpm \
          DEB_OUTPUT=/src/agent/bin/nke-agent.deb
    writeDir: agent/bin
    artifactPath: agent/bin/nke-agent.deb
  nke-cni-calico:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: nke-cni-calico-source
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        mkdir -p /src/nkd-output/work /src/nkd-output/calico
        cp -a os-image/packages/cni-common os-image/packages/cni-calico \
          /src/nkd-output/work/
        CNI=cni-calico PRODUCT=Calico CONTENT_KIND=manifests \
          CONTENT_SPEC=/src/nkd-output/work/cni-calico/packaging/nfpm-manifests.yaml \
          NFPM_BIN=/usr/local/bin/nfpm ARCH={{.Arch}} DEB_REVISION=1 \
          /src/nkd-output/work/cni-common/build-deb.sh v3.30.1 \
          /src/os-image/packages/cni-calico/dist/v3.30.1 \
          /src/nkd-output/calico
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/calico \
          -cf /src/nkd-output/nke-cni-calico.tar .
    writeDir: nkd-output
    artifactPath: nkd-output/nke-cni-calico.tar
  nke-cni-ovn:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: nke-os
    builderType: oci-hermetic
    outputType: tarball
    materials:
      ovn-chart: ovn-kubernetes-chart
      ovn-image: ovn-kube-ubuntu
    buildCommand:
      - bash
      - -ec
      - |
        readonly stage=/src/nkd-output/stage
        readonly work=/src/nkd-output/work
        mkdir -p "${stage}/charts" "${work}" /src/nkd-output/ovn
        cp -a os-image/packages/cni-common os-image/packages/cni-ovn \
          "${work}/"
        tar -xf /nkd/inputs/materials/ovn-chart -C "${stage}/charts"
        gzip -n -9 -c /nkd/inputs/materials/ovn-image >"${stage}/images.tgz"
        printf '%s  ovn-images_1.4.0_linux_{{.Arch}}.tgz\n' \
          "$(sha256sum "${stage}/images.tgz" | cut -d' ' -f1)" \
          >"${stage}/images.tgz.sha256"
        CNI=cni-ovn PRODUCT=OVN CONTENT_KIND=charts \
          CONTENT_SPEC="${work}/cni-ovn/packaging/nfpm-charts.yaml" \
          NFPM_BIN=/usr/local/bin/nfpm ARCH={{.Arch}} DEB_REVISION=1 \
          "${work}/cni-common/build-deb.sh" 1.4.0 "${stage}" \
          /src/nkd-output/ovn
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/ovn \
          -cf /src/nkd-output/nke-cni-ovn.tar .
    writeDir: nkd-output
    artifactPath: nkd-output/nke-cni-ovn.tar
  ovn-kube-ubuntu:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: ovn-kubernetes
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    outputType: oci-image
    buildCommand:
      - buildctl-daemonless.sh
      - build
      - --frontend
      - dockerfile.v0
      - --local
      - context=/src
      - --local
      - dockerfile=/src/dist/images
      - --opt
      - filename=Dockerfile.ubuntu
      - --opt
      - platform=linux/{{.Arch}}
      - --opt
      - build-arg:OVN_KUBERNETES_DIR=.
      - --opt
      - build-arg:BUILDER_IMAGE=quay.io/projectquay/golang@sha256:74560d1d7488711be460297046d5b8423dc21e81f2a0953b36ef6c8ec37a15cb
      - --opt
      - build-arg:KUBECTL_MINOR=1.36
      - --opt
      - build-arg:UBUNTU_BASE_IMAGE=docker.io/library/ubuntu@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
      - --output
      - type=oci,dest=/src/nkd-output/ovn-kube-ubuntu.oci.tar,oci-mediatypes=true,rewrite-timestamp=true,name=ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu:release-1.4
    writeDir: nkd-output
    artifactPath: nkd-output/ovn-kube-ubuntu.oci.tar
  ovn-kubernetes-chart:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: ovn-kubernetes
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        readonly chart=/src/helm/ovn-kubernetes
        readonly out=/src/nkd-output/ovn-kubernetes
        test -f "${chart}/Chart.yaml"
        grep -qx 'version: 1.4.0' "${chart}/Chart.yaml"
        mkdir -p "${out}"
        cp -a "${chart}/." "${out}/"
        cat >"${out}/values-nke.yaml" <<'EOF'
        tags:
          ovs-node: false
        global:
          image:
            repository: ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu
            tag: release-1.4
        EOF
        find "${out}" -type d -exec chmod 0755 {} +
        find "${out}" -type f -exec chmod 0644 {} +
        find "${out}" -exec touch -d '2026-01-01 00:00:00Z' {} +
        tar --sort=name --mtime='2026-01-01 00:00:00Z' \
          --owner=0 --group=0 --numeric-owner -C /src/nkd-output \
          -cf /src/nkd-output/ovn-kubernetes-chart.tar ovn-kubernetes
    writeDir: nkd-output
    artifactPath: nkd-output/ovn-kubernetes-chart.tar
  nke-image-inputs:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: nke-os
    builderType: oci-hermetic
    outputType: tarball
    materials:
      agent: nke-agent
      calico: nke-cni-calico
      kubeadm-distro: nke-kubeadm-distro
      ovn: nke-cni-ovn
      spire-agent: nke-spire-agent
    buildCommand:
      - bash
      - -ec
      - |
        exec python3 /src/os-image/packer/scripts/compose-image-inputs.py \
          --materials-dir /nkd/inputs/materials \
          --source-files-dir /src/os-image/files \
          --output /src/nkd-output/image-inputs.tar \
          --source-date-epoch "$SOURCE_DATE_EPOCH"
    writeDir: nkd-output
    artifactPath: nkd-output/image-inputs.tar
  nke-kubeadm-distro:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: nke-kubeadm-distro-source
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        mkdir -p /src/nkd-output/work /src/nkd-output/kubeadm-distro
        cp -a os-image/packages/kubeadm-distro /src/nkd-output/work/
        for version in v1.36.3 v1.35.3 v1.34.2; do
          PEER_VERSIONS='v1.36.3 v1.35.3 v1.34.2' DEB_REVISION=1 \
            NFPM_BIN=/usr/local/bin/nfpm ARCH={{.Arch}} \
            /src/nkd-output/work/kubeadm-distro/packaging/build-deb.sh \
            "$version" "/src/os-image/packages/kubeadm-distro/dist/$version" \
            /src/nkd-output/kubeadm-distro
        done
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/kubeadm-distro \
          -cf /src/nkd-output/nke-kubeadm-distro.tar .
    writeDir: nkd-output
    artifactPath: nkd-output/nke-kubeadm-distro.tar
  nke-node-image:
    platforms: [linux/arm64]
    fromSource: true
    source: nke-os
    builderType: vm-image
    buildNetwork: default
    outputType: disk-image
    disk:
      format: qcow2
      encryption: none
    buildRequirements:
      resources:
        cpuMillis: 8000
        memoryMiB: 10240
        ephemeralStorageMiB: 65536
      allowedHostPlatforms: [linux/arm64]
      capabilities:
        - name: kvm
          policy: forbidden
      timeoutSeconds: 21600
    packer:
      projectPath: os-image/packer
      packerVersion: 1.15.4
      buildName: nke-node-non-fde.qemu.nke-non-fde
      architectureVariable: architecture
      acceleratorVariable: accelerator
      materialManifestVariable: material_manifest
      materialManifest:
        schemaVersion: nke.dev/os-image-materials/v1
        kinds:
          image-inputs: archive
          installer-iso: disk-image
      outputDirectoryVariable: output_directory
      sshPrivateKeyVariable: ssh_private_key_file
      sshPublicKeyVariable: ssh_public_key_file
      buildLogDirectoryVariable: build_log_directory
      variables:
        boot_wait: 30s
        # The pinned QEMU 10.1.2/AAVMF TCG closure stalls in UEFI with
        # max,pauth-impdef=on. cortex-a57 reaches the patched ARM64 GRUB menu
        # and remains within Ubuntu's ARMv8 baseline.
        cpu_model: cortex-a57
        efi_firmware_code: /usr/share/AAVMF/AAVMF_CODE.no-secboot.fd
        efi_firmware_vars: /usr/share/AAVMF/AAVMF_VARS.fd
        guest_memory_mib: 4096
        ssh_timeout: 180m
    materials:
      image-inputs: nke-image-inputs
      installer-iso: nke-patched-installer-iso
    artifactPath: non-fde/nke-node.qcow2
  nke-node-image-amd64:
    platforms: [linux/amd64]
    fromSource: true
    source: nke-os
    builderType: vm-image
    buildNetwork: default
    outputType: disk-image
    disk:
      format: qcow2
      encryption: none
    buildRequirements:
      resources:
        cpuMillis: 8000
        memoryMiB: 10240
        ephemeralStorageMiB: 65536
      allowedHostPlatforms: [linux/amd64]
      capabilities:
        - name: kvm
          policy: required
      timeoutSeconds: 21600
    packer:
      projectPath: os-image/packer
      packerVersion: 1.15.4
      buildName: nke-node-non-fde.qemu.nke-non-fde
      architectureVariable: architecture
      acceleratorVariable: accelerator
      materialManifestVariable: material_manifest
      materialManifest:
        schemaVersion: nke.dev/os-image-materials/v1
        kinds:
          image-inputs: archive
          installer-iso: disk-image
      outputDirectoryVariable: output_directory
      sshPrivateKeyVariable: ssh_private_key_file
      sshPublicKeyVariable: ssh_public_key_file
      buildLogDirectoryVariable: build_log_directory
      variables:
        efi_firmware_code: /usr/share/OVMF/OVMF_CODE_4M.fd
        efi_firmware_vars: /usr/share/OVMF/OVMF_VARS_4M.fd
        ssh_timeout: 180m
    materials:
      image-inputs: nke-image-inputs
      installer-iso: nke-patched-installer-iso-amd64
    artifactPath: non-fde/nke-node.qcow2
  nke-patched-installer-iso:
    platforms: [linux/arm64]
    fromSource: true
    source: nke-os
    builderType: oci-hermetic
    outputType: raw
    materials:
      installer-source: ubuntu-installer-iso
    buildCommand:
      - bash
      - /src/os-image/packer/scripts/patch-installer-iso.sh
      - /nkd/inputs/materials/installer-source
      - /src/nkd-output/installer.iso
    writeDir: nkd-output
    artifactPath: nkd-output/installer.iso
  nke-spire-agent:
    platforms: [linux/amd64, linux/arm64]
    fromSource: true
    source: nke-spire-agent-source
    outputType: tarball
    buildCommand:
      - bash
      - -ec
      - |
        mkdir -p /src/nkd-output/work/os-image/packages /src/nkd-output/spire-agent
        cp -a os-image/packages/spire-agent /src/nkd-output/work/os-image/packages/
        cp -a os-image/files /src/nkd-output/work/os-image/
        SPIRE_VERSION=1.14.1 TPM_PLUGIN_VERSION=1.9.0 DEB_REVISION=1 \
          NFPM_BIN=/usr/local/bin/nfpm \
          /src/nkd-output/work/os-image/packages/spire-agent/packaging/build-deb.sh \
          {{.Arch}} /src/os-image/packages/spire-agent/dist/1.14.1+tpm1.9.0/{{.Arch}} \
          /src/nkd-output/spire-agent
        tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/nkd-output/spire-agent \
          -cf /src/nkd-output/nke-spire-agent.tar .
    writeDir: nkd-output
    artifactPath: nkd-output/nke-spire-agent.tar
  ubuntu-installer-iso:
    platforms: [linux/arm64]
    source: nke-os
    outputType: raw
    prebuilt:
      url: https://cdimage.ubuntu.com/ubuntu/releases/26.04.1/release/ubuntu-26.04.1-live-server-arm64.iso
      evidence:
        none: true
  ubuntu-installer-iso-amd64:
    platforms: [linux/amd64]
    source: nke-os
    outputType: raw
    prebuilt:
      url: https://releases.ubuntu.com/26.04.1/ubuntu-26.04.1-live-server-amd64.iso
      evidence:
        none: true
  nke-patched-installer-iso-amd64:
    platforms: [linux/amd64]
    fromSource: true
    source: nke-os
    builderType: oci-hermetic
    outputType: raw
    materials:
      installer-source: ubuntu-installer-iso-amd64
    buildCommand:
      - bash
      - /src/os-image/packer/scripts/patch-installer-iso.sh
      - /nkd/inputs/materials/installer-source
      - /src/nkd-output/installer.iso
    writeDir: nkd-output
    artifactPath: nkd-output/installer.iso
