apiVersion: nkd.dev/definition/v5
kind: Definition
metadata:
  name: nke-os-amd64-kvm
  description: Build the AMD64 non-FDE NKE node QCOW2 on a native KVM host.
catalog:
  base: ./catalog
outputs:
  - name: nke-node-image-amd64
    platform: linux/amd64
    format: disk-image
    components:
      - nke-agent
      - nke-cni-calico
      - nke-cni-ovn
      - nke-image-inputs
      - nke-kubeadm-distro
      - nke-node-image-amd64
      - nke-patched-installer-iso-amd64
      - nke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
