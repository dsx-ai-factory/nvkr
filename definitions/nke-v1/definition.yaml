apiVersion: nkd.dev/definition/v4
catalog:
  base: ./catalog
cosignTool: cosign
kind: Definition
metadata:
  description: Build the NKE CLI, CWE runtime image and quickstart Helm bundle from
    pinned source.
  name: nke-v1
outputs:
- components:
  - cwe
  format: oci
  name: cwe
  platform: linux/amd64
- components:
  - nke-helm
  format: helm-oci
  helm:
    images:
      controller: cwe
  name: nke-helm
  platform: linux/amd64
- components:
  - nkectl
  format: executable
  name: nkectl
  platform: linux/amd64
sbomTool: syft
