apiVersion: nkd.dev/environment/v1
kind: Environment
metadata:
  name: nke-local
  description: Local development registry and dry-run signing policy.
utilityContainer: golang@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6
utilityPlatform: linux/amd64
runtime:
  runtime: docker
sbomTool: syft
tools:
  syft:
    format: tar-gzip
    url: https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
    archiveDigest: sha256:8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
    executablePath: syft
    executableDigest: sha256:abca2def61de9952fa06d3977bb1e064818facb9badfce502b450d3d6846a91f
destinations:
  local-helm:
    kind: oci
    ref: 127.0.0.1:5000/nke/helm:development
    anonymous: true
    plainHTTP: true
  local-cwe:
    kind: oci
    ref: 127.0.0.1:5000/nke/cwe:development
    anonymous: true
    plainHTTP: true
  local-registry:
    kind: oci
    ref: 127.0.0.1:5000/nke/nkectl:v0.1.0-rc.2
    anonymous: true
    plainHTTP: true
publish:
  cwe: local-cwe
  nke-helm: local-helm
  nkectl: local-registry
signing:
  mode: dry-run
  identity: '^local$'
  issuer: https://nkd.dev/local
