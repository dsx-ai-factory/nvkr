apiVersion: nkd.dev/environment/v1
kind: Environment
metadata:
  name: nke-github
  description: GitHub hosted-runner publication settings with a pinned identity policy.
utilityContainer: busybox@sha256:29989570aeecad61a019f684218ea74d4b8c1c74f9e0abeb34ca926b81174ee1
utilityPlatform: linux/amd64
runtime:
  runtime: docker
sbomTool: syft
tools:
  syft:
    format: tar-gzip
    url: https://github.com/anchore/syft/releases/download/v1.51.1/syft_1.51.1_linux_amd64.tar.gz
    archiveDigest: sha256:8fcb33017a0dc1058298c923c436d19dfa68ae93968e0b423248542e3afb9fc3
    executablePath: syft
    executableDigest: sha256:abca2def61de9952fa06d3977bb1e064818facb9badfce502b450d3d6846a91f
  cosign:
    format: raw
    url: https://github.com/sigstore/cosign/releases/download/v2.6.3/cosign-linux-amd64
    archiveDigest: sha256:7c78a7f2efc00088bd788a758db6e0928e79f3e0eb83eb5d3c499ed98da4c4f4
    executablePath: cosign-linux-amd64
    executableDigest: sha256:7c78a7f2efc00088bd788a758db6e0928e79f3e0eb83eb5d3c499ed98da4c4f4
sourceAccess:
  https://github.com/NVIDIA/nke:
    mirror: https://github.com/njhensley/nke
    credentialRef: github:NKE_SOURCE_TOKEN
destinations:
  ghcr-helm:
    kind: oci
    ref: ghcr.io/njhensley/nke-recipes/helm:development
    credentialRef: github:GITHUB_TOKEN
  ghcr-cwe:
    kind: oci
    ref: ghcr.io/njhensley/nke-recipes/cwe:development
    credentialRef: github:GITHUB_TOKEN
  ghcr:
    kind: oci
    ref: ghcr.io/njhensley/nke-recipes/nkectl:v0.1.0-rc.2
    credentialRef: github:GITHUB_TOKEN
publish:
  cwe: ghcr-cwe
  nke-helm: ghcr-helm
  nkectl: ghcr
signing:
  mode: cosign
  identity: '^https://github\.com/njhensley/nke-recipes/\.github/workflows/nkd-run\.yml@refs/heads/main$'
  issuer: https://token.actions.githubusercontent.com
  cosignTool: cosign
