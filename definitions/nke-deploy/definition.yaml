apiVersion: nkd.dev/definition/v4
catalog:
  base: ../nke-controller/catalog
cosignTool: cosign
kind: Definition
metadata:
  description: Build CWE and its controller chart; acquire the four external charts
    selected by NKE v0.21.0.
  name: nke-deploy
outputs:
- components:
  - nke-controller-chart
  format: helm-oci
  helm:
    images:
      controller: cwe
  name: controller-chart
  platform: linux/amd64
- components:
  - nke-controller
  format: oci
  name: cwe
  platform: linux/amd64
- components:
  - postgresql-chart
  format: helm-oci
  name: postgresql
  platform: linux/amd64
- components:
  - spire-chart
  format: helm-oci
  name: spire
  platform: linux/amd64
- components:
  - spire-crds-chart
  format: helm-oci
  name: spire-crds
  platform: linux/amd64
- components:
  - temporal-chart
  format: helm-oci
  name: temporal
  platform: linux/amd64
sbomTool: syft
