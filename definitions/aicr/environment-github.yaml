apiVersion: nkd.dev/environment/v1
kind: Environment
metadata:
  name: github-aicr
  description: Replace the destination and supply registry credentials before hosted publication.
utilityContainer: golang@sha256:fe5d57d3b718e7a4986bae156c2d73f44973bfd313073aed08a4de6692bb6161
utilityPlatform: linux/amd64
destinations:
  aicr-registry:
    kind: oci
    ref: ghcr.io/example-ai-factory/nke/aicr:h100
    credentialRef: github:NKD_REGISTRY_AUTH
publish:
  gpu-runtime: aicr-registry
