kind: RecipeMetadata
apiVersion: nkd.dev/recipe/v1alpha1
metadata:
  name: base
spec:
  # The abstract root is intentionally component-free. A global base is applied to
  # every category; putting Kubernetes artifacts here would contaminate independent
  # platform-services and accelerated-runtime recipes.
  constraints:
    - name: k8s.version
      value: ">= 1.25"
