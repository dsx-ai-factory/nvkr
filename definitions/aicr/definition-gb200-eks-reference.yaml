apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: aicr-gb200-eks-training-reference
  description: AICR eks/gb200/ubuntu/training bundles in all six upstream deployer formats; build evidence only.
# Reuse maintained action and cosign pins; bundle producers use the catalog below.
catalog:
  base: ../nvke-v1/catalog
cosignTool: cosign
outputs:
  - name: aicr-gb200-eks-training-reference-argocd
    platform: linux/arm64
    catalog:
      base: ./catalog
    format: bundle-oci
    components: [aicr-gb200-eks-training-reference-argocd]
  - name: aicr-gb200-eks-training-reference-argocd-helm
    platform: linux/arm64
    catalog:
      base: ./catalog
    format: bundle-oci
    components: [aicr-gb200-eks-training-reference-argocd-helm]
  - name: aicr-gb200-eks-training-reference-flux
    platform: linux/arm64
    catalog:
      base: ./catalog
    format: bundle-oci
    components: [aicr-gb200-eks-training-reference-flux]
  - name: aicr-gb200-eks-training-reference-helm
    platform: linux/arm64
    catalog:
      base: ./catalog
    format: bundle-oci
    components: [aicr-gb200-eks-training-reference-helm]
  - name: aicr-gb200-eks-training-reference-helmfile
    platform: linux/arm64
    catalog:
      base: ./catalog
    format: bundle-oci
    components: [aicr-gb200-eks-training-reference-helmfile]
  - name: aicr-gb200-eks-training-reference-terraform
    platform: linux/arm64
    catalog:
      base: ./catalog
    format: bundle-oci
    components: [aicr-gb200-eks-training-reference-terraform]
