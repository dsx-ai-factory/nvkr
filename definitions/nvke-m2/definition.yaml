apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvke-m2
  description: Build the maintained CLI, controller, configurable deployment charts and native non-FDE and public-bootstrap FDE node images for AMD64 and ARM64, and acquire operator tooling plus AMD64 and ARM64 non-test runtime images selected by NVKE deployment values at 33fb71b2f4224b470ebc628a9165fc4b92870406 in one Run.
catalog:
  base: ../nvke-v1/catalog
sbomTool: syft
cosignTool: cosign
outputs:
  - name: controller-chart
    platform: linux/amd64
    catalog:
      base: ../nvke-controller/catalog
    format: helm-oci
    components:
      - nvke-controller-chart
    helm:
      images:
        controller: cwe
  - name: csi-node-driver-registrar-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - csi-node-driver-registrar-image
  - name: csi-node-driver-registrar-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - csi-node-driver-registrar-image
  - name: cwe
    platforms: [linux/amd64, linux/arm64]
    catalog:
      base: ../nvke-controller/catalog
    format: oci
    components:
      - nvke-controller
  - name: nvke-node-fde-amd64
    platform: linux/amd64
    catalog:
      base: ./os-catalog
      overlays: [./native-toolchains.yaml]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
  - name: nvke-node-fde-arm64
    platform: linux/arm64
    catalog:
      base: ./os-catalog
      overlays: [./native-toolchains.yaml]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-fde-arm64
      - nvke-patched-installer-iso
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso
  - name: nvke-node-image-amd64
    platform: linux/amd64
    catalog:
      base: ./os-catalog
      overlays: [./native-toolchains.yaml]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-image-amd64
      - nvke-patched-installer-iso-amd64
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso-amd64
  - name: nvke-node-image-arm64
    platform: linux/arm64
    catalog:
      base: ./os-catalog
      overlays: [./native-toolchains.yaml]
    format: disk-image
    components:
      - nvke-agent
      - nvke-cni-calico
      - nvke-cni-ovn
      - nvke-image-inputs
      - nvke-kubeadm-distro
      - nvke-node-image
      - nvke-patched-installer-iso
      - nvke-spire-agent
      - ovn-kube-ubuntu
      - ovn-kubernetes-chart
      - ubuntu-installer-iso
  - name: nvkectl
    platform: linux/amd64
    format: executable
    components:
      - nvkectl
  - name: nvkectl-linux-arm64
    platform: linux/arm64
    format: executable
    components:
      - nvkectl
  - name: operator-tools
    platform: linux/amd64
    catalog:
      base: ./catalog
    format: executable
    components:
      - helm
      - kubectl
  - name: postgresql
    platform: linux/amd64
    catalog:
      base: ../nvke-controller/catalog
    format: helm-oci
    components:
      - postgresql-chart
  - name: postgresql-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - postgresql-image
  - name: postgresql-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - postgresql-image
  - name: spiffe-csi-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spiffe-csi-image
  - name: spiffe-csi-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spiffe-csi-image
  - name: spire
    platform: linux/amd64
    catalog:
      base: ../nvke-controller/catalog
    format: helm-oci
    components:
      - spire-chart
  - name: spire-agent-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-agent-image
  - name: spire-agent-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-agent-image
  - name: spire-bash-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-bash-image
  - name: spire-bash-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-bash-image
  - name: spire-controller-manager-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-controller-manager-image
  - name: spire-controller-manager-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-controller-manager-image
  - name: spire-crds
    platform: linux/amd64
    catalog:
      base: ../nvke-controller/catalog
    format: helm-oci
    components:
      - spire-crds-chart
  - name: spire-oidc-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-oidc-image
  - name: spire-oidc-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-oidc-image
  - name: spire-server-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-server-image
  - name: spire-server-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-server-image
  - name: spire-tpm-server-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-tpm-server-image
  - name: spire-tpm-server-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - spire-tpm-server-image
  - name: temporal
    platform: linux/amd64
    catalog:
      base: ../nvke-controller/catalog
    format: helm-oci
    components:
      - temporal-chart
  - name: temporal-admin-tools-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - temporal-admin-tools-image
  - name: temporal-admin-tools-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - temporal-admin-tools-image
  - name: temporal-server-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - temporal-server-image
  - name: temporal-server-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - temporal-server-image
  - name: temporal-ui-image
    platform: linux/amd64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - temporal-ui-image
  - name: temporal-ui-image-arm64
    platform: linux/arm64
    catalog:
      base: ./image-catalog
    format: oci
    components:
      - temporal-ui-image
