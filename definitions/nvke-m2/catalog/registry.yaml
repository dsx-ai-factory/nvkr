apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-operator-tools
  description: Acquire operator executables from pinned upstream release assets, without rebuilding or installing their archives.
components:
  helm:
    source: helm
    platforms:
      - linux/amd64
    outputType: host-package
    prebuilt:
      releaseExecutable: true
      evidence:
        none: true
  kubectl:
    source: kubectl
    platforms:
      - linux/amd64
    outputType: host-package
    prebuilt:
      releaseExecutable: true
      evidence:
        none: true
sources:
  helm:
    repo: https://github.com/helm/helm
    constraint: 4.1.4
    tool:
      format: tar-gzip
      url: https://get.helm.sh/helm-{{.Tag}}-linux-amd64.tar.gz
      platform: linux/amd64
      executablePath: linux-amd64/helm
  kubectl:
    repo: https://github.com/kubernetes/kubernetes
    constraint: 1.36.3
    tool:
      format: raw
      url: https://dl.k8s.io/release/{{.Tag}}/bin/linux/amd64/kubectl
      platform: linux/amd64
      executablePath: kubectl
