apiVersion: nkd.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: capnico-local
  description: Source-built CAPNICo at the NKE deployment baseline; source-owned Dockerfile, not an acquired controller image.
components:
  capnico-controller:
    fromSource: true
    source: capnico
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:f8a833b2de9d68e27f0815e4a737abdfaf8a2e4c615650557df11025101557b4
    artifactPath: bin/capnico-controller-{{.Arch}}.oci.tar
    writeDir: bin
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src/. --local dockerfile=/src --opt platform=linux/{{.Arch}} --output type=oci,dest=/src/bin/capnico-controller-{{.Arch}}.oci.tar,oci-mediatypes=true
    outputType: oci-image
    platforms:
    - linux/arm64
sources:
  capnico:
    repo: https://github.com/dsx-ai-factory/cluster-api-provider-nico
    constraint: 0.0.45
    toolchainImage: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
