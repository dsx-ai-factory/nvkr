apiVersion: nvkr.dev/definition/v5
kind: Definition
metadata:
  name: nvsentinel-os-ubuntu2604-arm64
  description: Existing non-FDE NVKE OS recipe with source-built NVSentinel installed
    from image inputs; unsigned local candidate.
catalog:
  base: ./os-catalog
  overlays:
  - ./nvsentinel-os-ubuntu2604-arm64.json
outputs:
- name: nvsentinel-os-ubuntu2604-arm64
  platform: linux/arm64
  format: disk-image
  components:
  - nvke-agent
  - nvke-cni-calico
  - nvke-cni-ovn
  - nvke-image-inputs
  - nvke-kubeadm-distro
  - nvke-node-image
  - nvke-patched-installer-iso
  - nvke-spire-agent
  - nvsentinel-platform-connectors-os-ubuntu2604-arm64
  - ovn-kube-ubuntu
  - ovn-kubernetes-chart
  - ubuntu-installer-iso
