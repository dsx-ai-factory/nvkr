apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvsentinel-native-candidate
  description: Local platform-connectors Debian and image producers with a digest-bound source Helm chart. No hosted publication or complete node bundle.
sources:
  nvsentinel:
    repo: https://github.com/NVIDIA/NVSentinel
    vendorCommand:
      - sh
      - -ec
      - |
        test "$(go env GOVERSION)" = go1.27.0
        cd platform-connectors
        GOTOOLCHAIN=local GOWORK=off go mod vendor
        GOTOOLCHAIN=local GOWORK=off go mod verify
  syft-amd64:
    constraint: 1.51.1
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platform: linux/amd64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_linux_amd64.tar.gz
  syft-arm64:
    constraint: 1.51.1
    repo: https://github.com/anchore/syft
    tool:
      executablePath: syft
      format: tar-gzip
      platform: linux/arm64
      url: https://github.com/anchore/syft/releases/download/{{.Tag}}/syft_{{.Version}}_linux_arm64.tar.gz
components:
  nvsentinel-platform-connectors-deb:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms: [linux/amd64, linux/arm64]
    outputType: debian-package
    patches:
      - name: native-platform-connectors.patch
        sha256: sha256:8bb933341f83a2926019971c2d627939ed724db8e704c38f4fb4369093765763
    debian:
      routes:
        - target:
            distribution: ubuntu-24.04
            platform: linux/amd64
          toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-24.04-amd64@sha256:1899450dc69deea10ed06d07de70fd2bf6b4d3cb6952c679d359cdcd6b6376e7
          buildCommand: [sh, /src/distros/debian/build-platform-connectors.sh, amd64, ubuntu-24.04]
          writeDir: nvkr-output
          artifactPath: nvkr-output/nvsentinel-platform-connectors_amd64.deb
        - target:
            distribution: ubuntu-24.04
            platform: linux/arm64
          toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-24.04-arm64@sha256:3ebca79a900100ed1ef6ee9903b7d26a0ee45320a9dff49f91610142d8d11581
          buildCommand: [sh, /src/distros/debian/build-platform-connectors.sh, arm64, ubuntu-24.04]
          writeDir: nvkr-output
          artifactPath: nvkr-output/nvsentinel-platform-connectors_arm64.deb
        - target:
            distribution: ubuntu-26.04
            platform: linux/amd64
          toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-26.04-amd64@sha256:fb19d5e7aa08d6d870eabff80fb012d6edf1c73cebad636f3d977bbbc7ad5eb8
          buildCommand: [sh, /src/distros/debian/build-platform-connectors.sh, amd64, ubuntu-26.04]
          writeDir: nvkr-output
          artifactPath: nvkr-output/nvsentinel-platform-connectors_amd64.deb
        - target:
            distribution: ubuntu-26.04
            platform: linux/arm64
          toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-26.04-arm64@sha256:257df633515584e9d56f9679042afb9f2ef2cd0c6c2d9d6f2691a6bbb31effcf
          buildCommand: [sh, /src/distros/debian/build-platform-connectors.sh, arm64, ubuntu-26.04]
          writeDir: nvkr-output
          artifactPath: nvkr-output/nvsentinel-platform-connectors_arm64.deb

  nvsentinel-platform-connectors-image:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms: [linux/amd64, linux/arm64]
    outputType: oci-image
    toolchainImage: docker.io/library/nvkr-nvsentinel-ko@sha256:db6673b34993ad5bc933e90b89c332d30ae2f7e1a302bfddb8e7e34a53442a6a
    patches:
      - name: native-platform-connectors-image.patch
        sha256: sha256:f64cc4abafdf16ecb8628c2423c5234de29f025d4d9e1324d12f85e37d0af216
    buildCommand: [sh, /src/distros/oci/build-platform-connectors.sh, '{{.Arch}}']
    writeDir: nvkr-output
    artifactPath: nvkr-output/platform-connectors.oci.tar
    versionStamp:
      BUILD_VERSION: '{{.Tag}}'
      GIT_VERSION: '{{.Commit}}'
  nvsentinel-chart:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    toolchainImage: docker.io/library/nvkr-nvsentinel-ko@sha256:db6673b34993ad5bc933e90b89c332d30ae2f7e1a302bfddb8e7e34a53442a6a
    platforms: [linux/amd64, linux/arm64]
    outputType: tarball
    patches:
      - name: native-platform-connectors-helm.patch
        sha256: sha256:4245f4d7f6779932d3afcb119dbcae061ca4eb40d83583c7c070014c60a0fb8c
    helm:
      chart: .
      images:
        platform-connectors:
          values:
            digest: platformConnector.image.digest
    buildCommand:
      - sh
      - -ec
      - |
        test -f /src/distros/kubernetes/nvsentinel/Chart.yaml
        test -f /src/distros/kubernetes/nvsentinel/Chart.lock
        tar --format=ustar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 \
          --numeric-owner -C /src/distros/kubernetes -cf /src/nvkr-output/nvsentinel-chart.tar nvsentinel
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-chart.tar

  # Existing host-package material route, as used by the NVKE agent.
  nvsentinel-platform-connectors-os-ubuntu2404-amd64:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms:
    - linux/amd64
    outputType: host-package
    toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-24.04-amd64@sha256:1899450dc69deea10ed06d07de70fd2bf6b4d3cb6952c679d359cdcd6b6376e7
    patches:
    - name: native-platform-connectors.patch
      sha256: sha256:8bb933341f83a2926019971c2d627939ed724db8e704c38f4fb4369093765763
    buildCommand:
    - sh
    - /src/distros/debian/build-platform-connectors.sh
    - amd64
    - ubuntu-24.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_amd64.deb
  nvsentinel-platform-connectors-os-ubuntu2404-arm64:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms:
    - linux/arm64
    outputType: host-package
    toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-24.04-arm64@sha256:3ebca79a900100ed1ef6ee9903b7d26a0ee45320a9dff49f91610142d8d11581
    patches:
    - name: native-platform-connectors.patch
      sha256: sha256:8bb933341f83a2926019971c2d627939ed724db8e704c38f4fb4369093765763
    buildCommand:
    - sh
    - /src/distros/debian/build-platform-connectors.sh
    - arm64
    - ubuntu-24.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_arm64.deb
  nvsentinel-platform-connectors-os-ubuntu2604-amd64:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms:
    - linux/amd64
    outputType: host-package
    toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-26.04-amd64@sha256:fb19d5e7aa08d6d870eabff80fb012d6edf1c73cebad636f3d977bbbc7ad5eb8
    patches:
    - name: native-platform-connectors.patch
      sha256: sha256:8bb933341f83a2926019971c2d627939ed724db8e704c38f4fb4369093765763
    buildCommand:
    - sh
    - /src/distros/debian/build-platform-connectors.sh
    - amd64
    - ubuntu-26.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_amd64.deb
  nvsentinel-platform-connectors-os-ubuntu2604-arm64:
    source: nvsentinel
    fromSource: true
    builderType: oci-hermetic
    platforms:
    - linux/arm64
    outputType: host-package
    toolchainImage: docker.io/library/nvkr-nvsentinel-ubuntu-26.04-arm64@sha256:257df633515584e9d56f9679042afb9f2ef2cd0c6c2d9d6f2691a6bbb31effcf
    patches:
    - name: native-platform-connectors.patch
      sha256: sha256:8bb933341f83a2926019971c2d627939ed724db8e704c38f4fb4369093765763
    buildCommand:
    - sh
    - /src/distros/debian/build-platform-connectors.sh
    - arm64
    - ubuntu-26.04
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvsentinel-platform-connectors_arm64.deb
