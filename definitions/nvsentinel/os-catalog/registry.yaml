apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvsentinel-nvke-os-inputs-local
  description: Existing NVKE OS graph with an explicitly source-built NVSentinel host package; unsigned local candidates.
sources:
  nvke-os:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch: &id001
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db
    vendorCommand:
    - bash
    - -ec
    - "cd agent\nexport GOENV=off GOWORK=off GOTOOLCHAIN=local GOFLAGS=\npins=\"$(sha256sum go.mod go.sum)\"\n#\
      \ Distinct equivalent URLs avoid Go's per-proxy cached metadata errors.\n# Go owns transport fallback; checksum\
      \ failures never select another proxy.\n# Keep direct fallback limited to a missing proxy module (404/410).\n\
      proxy=https://proxy.golang.org\nGOPROXY=\"${proxy}|${proxy}/|${proxy}//,direct\" \\\n  timeout --kill-after=10s\
      \ 540s go mod download || {\n    status=$?; echo 'agent module download failed or exceeded 540s' >&2; exit\
      \ \"$status\";\n  }\nprintf '%s\\n' \"$pins\" | sha256sum --quiet -c - || {\n  echo 'agent module pins changed\
      \ during download' >&2; exit 1;\n}\n# Offline verification and vendoring run once, after acquisition succeeds.\n\
      GOPROXY=off timeout --kill-after=10s 60s go mod verify || {\n  status=$?; echo 'agent module cache verification\
      \ failed or exceeded 60s' >&2; exit \"$status\";\n}\nGOPROXY=off timeout --kill-after=10s 180s go mod vendor\
      \ || {\n  status=$?; echo 'agent offline vendoring failed or exceeded 180s' >&2; exit \"$status\";\n}\nprintf\
      \ '%s\\n' \"$pins\" | sha256sum --quiet -c - || {\n  echo 'agent module pins changed during vendoring' >&2;\
      \ exit 1;\n}\n"
  nvke-cni-calico-source:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db
    vendorCommand:
    - bash
    - -ec
    - "make -C os-image/packages/cni-calico bundle nfpm \\\n  ARCH={{.Arch}} BIN_DIR=/usr/local/bin NFPM_BIN=/usr/local/bin/nfpm\n"
  ovn-kubernetes:
    repo: https://github.com/ovn-kubernetes/ovn-kubernetes
    constraint: 1.4.x
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db
  nvke-kubeadm-distro-source:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db
    vendorCommand:
    - bash
    - -ec
    - "make -C os-image/packages/kubeadm-distro bundle nfpm \\\n  ARCH={{.Arch}} BIN_DIR=/usr/local/bin NFPM_BIN=/usr/local/bin/nfpm\n"
  nvke-spire-agent-source:
    repo: https://github.com/dsx-ai-factory/nvke.git
    constraint: 0.1.x
    tagPrefix: os-image/
    toolchainImagesByArch:
      amd64: sha256:3a570c987e819cc2852258499f3bc56fec088b0ba5e0f45a17124ddcc24d60a0
      arm64: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db
    vendorCommand:
    - bash
    - -ec
    - "make -C os-image/packages/spire-agent bundle nfpm \\\n  ARCH={{.Arch}} BIN_DIR=/usr/local/bin NFPM_BIN=/usr/local/bin/nfpm\n"
  nvsentinel:
    repo: https://github.com/NVIDIA/NVSentinel
    vendorCommand:
    - sh
    - -ec
    - 'test "$(go env GOVERSION)" = go1.27.0

      cd platform-connectors

      GOTOOLCHAIN=local GOWORK=off go mod vendor

      GOTOOLCHAIN=local GOWORK=off go mod verify

      '
  nvke-os-consumer:
    repo: https://github.com/dsx-ai-factory/nvke.git
    toolchainImagesByArch: *id001
components:
  nvke-agent:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: nvke-os
    cgo: true
    outputType: host-package
    buildCommand:
    - bash
    - -ec
    - "GOWORK=off GOFLAGS=-mod=vendor make -C agent deb-{{.Arch}} \\\n  VERSION=v0.2.1-81-gff21ba8 \\\n  NFPM_BIN=/usr/local/bin/nfpm\
      \ \\\n  DEB_OUTPUT=/src/agent/bin/nvke-agent.deb\n"
    writeDir: agent/bin
    artifactPath: agent/bin/nvke-agent.deb
  nvke-cni-calico:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: nvke-cni-calico-source
    outputType: tarball
    buildCommand:
    - bash
    - -ec
    - "mkdir -p /src/nvkr-output/work /src/nvkr-output/calico\ncp -a os-image/packages/cni-common os-image/packages/cni-calico\
      \ \\\n  /src/nvkr-output/work/\nCNI=cni-calico PRODUCT=Calico CONTENT_KIND=manifests \\\n  CONTENT_SPEC=/src/nvkr-output/work/cni-calico/packaging/nfpm-manifests.yaml\
      \ \\\n  NFPM_BIN=/usr/local/bin/nfpm ARCH={{.Arch}} DEB_REVISION=1 \\\n  /src/nvkr-output/work/cni-common/build-deb.sh\
      \ v3.30.1 \\\n  /src/os-image/packages/cni-calico/dist/v3.30.1 \\\n  /src/nvkr-output/calico\ntar --sort=name\
      \ --mtime=\"@$SOURCE_DATE_EPOCH\" --owner=0 --group=0 \\\n  --numeric-owner -C /src/nvkr-output/calico \\\n\
      \  -cf /src/nvkr-output/nvke-cni-calico.tar .\n"
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvke-cni-calico.tar
  nvke-cni-ovn:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: nvke-os
    builderType: oci-hermetic
    outputType: tarball
    materials:
      ovn-chart: ovn-kubernetes-chart
      ovn-image: ovn-kube-ubuntu
    buildCommand:
    - bash
    - -ec
    - "readonly stage=/src/nvkr-output/stage\nreadonly work=/src/nvkr-output/work\nmkdir -p \"${stage}/charts\"\
      \ \"${work}\" /src/nvkr-output/ovn\ncp -a os-image/packages/cni-common os-image/packages/cni-ovn \\\n  \"\
      ${work}/\"\ntar -xf /nvkr/inputs/materials/ovn-chart -C \"${stage}/charts\"\ngzip -n -9 -c /nvkr/inputs/materials/ovn-image\
      \ >\"${stage}/images.tgz\"\nprintf '%s  ovn-images_1.4.0_linux_{{.Arch}}.tgz\\n' \\\n  \"$(sha256sum \"${stage}/images.tgz\"\
      \ | cut -d' ' -f1)\" \\\n  >\"${stage}/images.tgz.sha256\"\nCNI=cni-ovn PRODUCT=OVN CONTENT_KIND=charts \\\
      \n  CONTENT_SPEC=\"${work}/cni-ovn/packaging/nfpm-charts.yaml\" \\\n  NFPM_BIN=/usr/local/bin/nfpm ARCH={{.Arch}}\
      \ DEB_REVISION=1 \\\n  \"${work}/cni-common/build-deb.sh\" 1.4.0 \"${stage}\" \\\n  /src/nvkr-output/ovn\n\
      tar --sort=name --mtime=\"@$SOURCE_DATE_EPOCH\" --owner=0 --group=0 \\\n  --numeric-owner -C /src/nvkr-output/ovn\
      \ \\\n  -cf /src/nvkr-output/nvke-cni-ovn.tar .\n"
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvke-cni-ovn.tar
  ovn-kube-ubuntu:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: ovn-kubernetes
    builderType: buildkit-rootless
    toolchainImage: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    outputType: oci-image
    buildCommand:
    - buildctl-daemonless.sh
    - build
    - --frontend
    - dockerfile.v0
    - --local
    - context=/src
    - --local
    - dockerfile=/src/dist/images
    - --opt
    - filename=Dockerfile.ubuntu
    - --opt
    - platform=linux/{{.Arch}}
    - --opt
    - build-arg:OVN_KUBERNETES_DIR=.
    - --opt
    - build-arg:BUILDER_IMAGE=quay.io/projectquay/golang@sha256:506a668eb4c763a964ffc4d4ad0125d45d75aac899392be7e5d39380f8452564
    - --opt
    - build-arg:KUBECTL_MINOR=1.36
    - --opt
    - build-arg:UBUNTU_BASE_IMAGE=docker.io/library/ubuntu@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    - --output
    - type=oci,dest=/src/nvkr-output/ovn-kube-ubuntu.oci.tar,oci-mediatypes=true,rewrite-timestamp=true,name=ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu:release-1.4
    writeDir: nvkr-output
    artifactPath: nvkr-output/ovn-kube-ubuntu.oci.tar
  ovn-kubernetes-chart:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: ovn-kubernetes
    outputType: tarball
    buildCommand:
    - bash
    - -ec
    - "readonly chart=/src/helm/ovn-kubernetes\nreadonly out=/src/nvkr-output/ovn-kubernetes\ntest -f \"${chart}/Chart.yaml\"\
      \ngrep -qx 'version: 1.4.0' \"${chart}/Chart.yaml\"\nmkdir -p \"${out}\"\ncp -a \"${chart}/.\" \"${out}/\"\
      \ncat >\"${out}/values-nke.yaml\" <<'EOF'\ntags:\n  ovs-node: false\nglobal:\n  image:\n    repository: ghcr.io/ovn-kubernetes/ovn-kubernetes/ovn-kube-ubuntu\n\
      \    tag: release-1.4\nEOF\nfind \"${out}\" -type d -exec chmod 0755 {} +\nfind \"${out}\" -type f -exec chmod\
      \ 0644 {} +\nfind \"${out}\" -exec touch -d '2026-01-01 00:00:00Z' {} +\ntar --sort=name --mtime='2026-01-01\
      \ 00:00:00Z' \\\n  --owner=0 --group=0 --numeric-owner -C /src/nvkr-output \\\n  -cf /src/nvkr-output/ovn-kubernetes-chart.tar\
      \ ovn-kubernetes\n"
    writeDir: nvkr-output
    artifactPath: nvkr-output/ovn-kubernetes-chart.tar
  nvke-image-inputs:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: nvke-os-consumer
    builderType: oci-hermetic
    outputType: tarball
    materials:
      agent: nvke-agent
      calico: nvke-cni-calico
      kubeadm-distro: nvke-kubeadm-distro
      ovn: nvke-cni-ovn
      spire-agent: nvke-spire-agent
      nvsentinel: nvsentinel-platform-connectors-os-ubuntu2604-arm64
    buildCommand:
    - bash
    - -ec
    - "exec python3 /src/os-image/packer/scripts/compose-image-inputs.py \\\n  --architecture {{.Arch}} \\\n  --materials-dir\
      \ /nvkr/inputs/materials \\\n  --nvsentinel-package /nvkr/inputs/materials/nvsentinel \\\n  --source-files-dir\
      \ /src/os-image/files \\\n  --output /src/nvkr-output/image-inputs.tar \\\n  --source-date-epoch \"$SOURCE_DATE_EPOCH\"\
      \n"
    writeDir: nvkr-output
    artifactPath: nvkr-output/image-inputs.tar
    patches:
    - &id002
      name: nvke-os-package-input.patch
      sha256: sha256:e5ffe0e241609eb90814bafc6296f4660f51975c1105bdc246082ce3a3dc0705
  nvke-kubeadm-distro:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: nvke-kubeadm-distro-source
    outputType: tarball
    buildCommand:
    - bash
    - -ec
    - "mkdir -p /src/nvkr-output/work /src/nvkr-output/kubeadm-distro\ncp -a os-image/packages/kubeadm-distro /src/nvkr-output/work/\n\
      for version in v1.36.3 v1.35.3 v1.34.2; do\n  PEER_VERSIONS='v1.36.3 v1.35.3 v1.34.2' DEB_REVISION=1 \\\n\
      \    NFPM_BIN=/usr/local/bin/nfpm ARCH={{.Arch}} \\\n    /src/nvkr-output/work/kubeadm-distro/packaging/build-deb.sh\
      \ \\\n    \"$version\" \"/src/os-image/packages/kubeadm-distro/dist/$version\" \\\n    /src/nvkr-output/kubeadm-distro\n\
      done\ntar --sort=name --mtime=\"@$SOURCE_DATE_EPOCH\" --owner=0 --group=0 \\\n  --numeric-owner -C /src/nvkr-output/kubeadm-distro\
      \ \\\n  -cf /src/nvkr-output/nvke-kubeadm-distro.tar .\n"
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvke-kubeadm-distro.tar
  nvke-node-fde-amd64:
    platforms:
    - linux/amd64
    fromSource: true
    source: nvke-os
    builderType: vm-image
    buildNetwork: default
    outputType: disk-image
    disk:
      format: qcow2
      encryption: luks2
    buildRequirements:
      resources:
        cpuMillis: 8000
        memoryMiB: 10240
        ephemeralStorageMiB: 65536
      allowedHostPlatforms:
      - linux/amd64
      capabilities:
      - name: kvm
        policy: required
      timeoutSeconds: 21600
    packer:
      projectPath: os-image/packer
      packerVersion: 1.15.4
      buildName: nke-node-fde.qemu.nke-fde
      architectureVariable: architecture
      acceleratorVariable: accelerator
      materialManifestVariable: material_manifest
      materialManifest:
        schemaVersion: nke.dev/os-image-materials/v1
        kinds:
          image-inputs: archive
          installer-iso: disk-image
      outputDirectoryVariable: output_directory
      sshPrivateKeyVariable: ssh_private_key_file
      sshPublicKeyVariable: ssh_public_key_file
      buildLogDirectoryVariable: build_log_directory
      acquisitionArchive: fde/apt-acquisitions.tar
      variables:
        capture_apt_acquisitions: 'true'
        efi_firmware_code: /usr/share/OVMF/OVMF_CODE_4M.fd
        efi_firmware_vars: /usr/share/OVMF/OVMF_VARS_4M.fd
        luks_passphrase: changeit
        ssh_timeout: 180m
    materials:
      image-inputs: nvke-image-inputs
      installer-iso: nvke-patched-installer-iso-amd64
    artifactPath: fde/nke-node.qcow2
  nvke-node-fde-arm64:
    platforms:
    - linux/arm64
    fromSource: true
    source: nvke-os
    builderType: vm-image
    buildNetwork: default
    outputType: disk-image
    disk:
      format: qcow2
      encryption: luks2
    buildRequirements:
      resources:
        cpuMillis: 8000
        memoryMiB: 10240
        ephemeralStorageMiB: 65536
      allowedHostPlatforms:
      - linux/arm64
      capabilities:
      - name: kvm
        policy: required
      timeoutSeconds: 21600
    packer:
      projectPath: os-image/packer
      packerVersion: 1.15.4
      buildName: nke-node-fde.qemu.nke-fde
      architectureVariable: architecture
      acceleratorVariable: accelerator
      materialManifestVariable: material_manifest
      materialManifest:
        schemaVersion: nke.dev/os-image-materials/v1
        kinds:
          image-inputs: archive
          installer-iso: disk-image
      outputDirectoryVariable: output_directory
      sshPrivateKeyVariable: ssh_private_key_file
      sshPublicKeyVariable: ssh_public_key_file
      buildLogDirectoryVariable: build_log_directory
      acquisitionArchive: fde/apt-acquisitions.tar
      variables:
        capture_apt_acquisitions: 'true'
        efi_firmware_code: /usr/share/AAVMF/AAVMF_CODE.no-secboot.fd
        efi_firmware_vars: /usr/share/AAVMF/AAVMF_VARS.fd
        guest_memory_mib: 4096
        luks_passphrase: changeit
        ssh_timeout: 180m
    materials:
      image-inputs: nvke-image-inputs
      installer-iso: nvke-patched-installer-iso
    artifactPath: fde/nke-node.qcow2
  nvke-node-image:
    platforms:
    - linux/arm64
    fromSource: true
    source: nvke-os-consumer
    builderType: vm-image
    buildNetwork: default
    outputType: disk-image
    disk:
      format: qcow2
      encryption: none
    buildRequirements:
      resources:
        cpuMillis: 8000
        memoryMiB: 10240
        ephemeralStorageMiB: 65536
      allowedHostPlatforms:
      - linux/arm64
      capabilities:
      - name: kvm
        policy: required
      timeoutSeconds: 21600
    packer:
      projectPath: os-image/packer
      packerVersion: 1.15.4
      buildName: nvke-node-non-fde.qemu.nvke-non-fde
      architectureVariable: architecture
      acceleratorVariable: accelerator
      materialManifestVariable: material_manifest
      materialManifest:
        schemaVersion: nvke.nvidia.com/os-image-materials/v1
        kinds:
          image-inputs: archive
          installer-iso: disk-image
      outputDirectoryVariable: output_directory
      sshPrivateKeyVariable: ssh_private_key_file
      sshPublicKeyVariable: ssh_public_key_file
      buildLogDirectoryVariable: build_log_directory
      acquisitionArchive: non-fde/apt-acquisitions.tar
      variables:
        capture_apt_acquisitions: 'true'
        efi_firmware_code: /usr/share/AAVMF/AAVMF_CODE.no-secboot.fd
        efi_firmware_vars: /usr/share/AAVMF/AAVMF_VARS.fd
        guest_memory_mib: 4096
        ssh_timeout: 180m
    materials:
      image-inputs: nvke-image-inputs
      installer-iso: nvke-patched-installer-iso
    artifactPath: non-fde/nvke-node.qcow2
    patches:
    - *id002
  nvke-node-image-amd64:
    platforms:
    - linux/amd64
    fromSource: true
    source: nvke-os-consumer
    builderType: vm-image
    buildNetwork: default
    outputType: disk-image
    disk:
      format: qcow2
      encryption: none
    buildRequirements:
      resources:
        cpuMillis: 8000
        memoryMiB: 10240
        ephemeralStorageMiB: 65536
      allowedHostPlatforms:
      - linux/amd64
      capabilities:
      - name: kvm
        policy: required
      timeoutSeconds: 21600
    packer:
      projectPath: os-image/packer
      packerVersion: 1.15.4
      buildName: nvke-node-non-fde.qemu.nvke-non-fde
      architectureVariable: architecture
      acceleratorVariable: accelerator
      materialManifestVariable: material_manifest
      materialManifest:
        schemaVersion: nvke.nvidia.com/os-image-materials/v1
        kinds:
          image-inputs: archive
          installer-iso: disk-image
      outputDirectoryVariable: output_directory
      sshPrivateKeyVariable: ssh_private_key_file
      sshPublicKeyVariable: ssh_public_key_file
      buildLogDirectoryVariable: build_log_directory
      acquisitionArchive: non-fde/apt-acquisitions.tar
      variables:
        capture_apt_acquisitions: 'true'
        efi_firmware_code: /usr/share/OVMF/OVMF_CODE_4M.fd
        efi_firmware_vars: /usr/share/OVMF/OVMF_VARS_4M.fd
        ssh_timeout: 180m
    materials:
      image-inputs: nvke-image-inputs
      installer-iso: nvke-patched-installer-iso-amd64
    artifactPath: non-fde/nvke-node.qcow2
    patches:
    - *id002
  nvke-patched-installer-iso:
    platforms:
    - linux/arm64
    fromSource: true
    source: nvke-os
    builderType: oci-hermetic
    outputType: raw
    materials:
      installer-source: ubuntu-installer-iso
    buildCommand:
    - bash
    - /src/os-image/packer/scripts/patch-installer-iso.sh
    - /nvkr/inputs/materials/installer-source
    - /src/nvkr-output/installer.iso
    writeDir: nvkr-output
    artifactPath: nvkr-output/installer.iso
  nvke-spire-agent:
    platforms:
    - linux/amd64
    - linux/arm64
    fromSource: true
    source: nvke-spire-agent-source
    outputType: tarball
    buildCommand:
    - bash
    - -ec
    - "mkdir -p /src/nvkr-output/work/os-image/packages /src/nvkr-output/spire-agent\ncp -a os-image/packages/spire-agent\
      \ /src/nvkr-output/work/os-image/packages/\ncp -a os-image/files /src/nvkr-output/work/os-image/\nSPIRE_VERSION=1.14.1\
      \ TPM_PLUGIN_VERSION=1.9.0 DEB_REVISION=1 \\\n  NFPM_BIN=/usr/local/bin/nfpm \\\n  /src/nvkr-output/work/os-image/packages/spire-agent/packaging/build-deb.sh\
      \ \\\n  {{.Arch}} /src/os-image/packages/spire-agent/dist/1.14.1+tpm1.9.0/{{.Arch}} \\\n  /src/nvkr-output/spire-agent\n\
      tar --sort=name --mtime=\"@$SOURCE_DATE_EPOCH\" --owner=0 --group=0 \\\n  --numeric-owner -C /src/nvkr-output/spire-agent\
      \ \\\n  -cf /src/nvkr-output/nvke-spire-agent.tar .\n"
    writeDir: nvkr-output
    artifactPath: nvkr-output/nvke-spire-agent.tar
  ubuntu-installer-iso:
    platforms:
    - linux/arm64
    source: nvke-os
    outputType: raw
    prebuilt:
      url: https://cdimage.ubuntu.com/ubuntu/releases/26.04.1/release/ubuntu-26.04.1-live-server-arm64.iso
      evidence:
        none: true
  ubuntu-installer-iso-amd64:
    platforms:
    - linux/amd64
    source: nvke-os
    outputType: raw
    prebuilt:
      url: https://releases.ubuntu.com/26.04.1/ubuntu-26.04.1-live-server-amd64.iso
      evidence:
        none: true
  nvke-patched-installer-iso-amd64:
    platforms:
    - linux/amd64
    fromSource: true
    source: nvke-os
    builderType: oci-hermetic
    outputType: raw
    materials:
      installer-source: ubuntu-installer-iso-amd64
    buildCommand:
    - bash
    - /src/os-image/packer/scripts/patch-installer-iso.sh
    - /nvkr/inputs/materials/installer-source
    - /src/nvkr-output/installer.iso
    writeDir: nvkr-output
    artifactPath: nvkr-output/installer.iso
