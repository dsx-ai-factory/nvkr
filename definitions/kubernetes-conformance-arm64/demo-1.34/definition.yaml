apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../hydrophone-catalog
kind: Definition
metadata:
  name: kubernetes-conformance-demo-1-34-arm64
outputs:
  - catalog:
      base: ../image-catalog
    components:
      - busybox-image
    format: oci
    name: busybox-image-arm64
    platform: linux/arm64
  - catalog:
      base: ./image-catalog
    components:
      - conformance-image
    format: oci
    name: conformance-image-arm64
    platform: linux/arm64
  - components:
      - hydrophone
    format: executable
    name: hydrophone-arm64
    platform: linux/arm64
  - catalog:
      base: ./kubectl-catalog
    components:
      - kubectl
    format: executable
    name: kubectl-arm64
    platform: linux/arm64
