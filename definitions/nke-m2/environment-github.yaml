apiVersion: nkd.dev/environment/v1
kind: Environment
metadata:
  description: M2 candidate publication namespace; native disk execution classes and measured inspection profiles must pass admission before use.
  name: nke-m2-github
publication:
  credentialRef: github:GITHUB_TOKEN
  repositoryPrefix: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate
runtime:
  runtime: podman
  buildNetworkPolicy: producer-declared
signing:
  identity: ^https://github\.com/dsx-ai-factory/nke-recipes/\.github/workflows/nkd-run\.yml@refs/heads/main$
  issuer: https://token.actions.githubusercontent.com
  mode: cosign
sourceAccess:
  https://github.com/dsx-ai-factory/nke:
    credentialRef: github:NKE_SOURCE_TOKEN
    mirror: https://github.com/dsx-ai-factory/nke
  https://github.com/dsx-ai-factory/nke.git:
    credentialRef: github:NKE_SOURCE_TOKEN
    mirror: https://github.com/dsx-ai-factory/nke
utilityContainer: busybox@sha256:29989570aeecad61a019f684218ea74d4b8c1c74f9e0abeb34ca926b81174ee1
utilityPlatform: linux/amd64
