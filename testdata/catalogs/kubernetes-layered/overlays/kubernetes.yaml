kind: RecipeMetadata
apiVersion: nkd.dev/recipe/v1alpha1
metadata:
  name: kubernetes
spec:
  base: base
  criteria:
    # ADR-12 §1: the recipe-selection axis is `category`, not `role`. The `kubernetes`
    # category produces EVERY node-level binary under ONE recipe identity; node role
    # (control-plane | worker) is a COMPOSITION/SKU filter applied at delivery via each
    # component's `roles` affinity (registry.yaml) — it does not select a recipe and is
    # excluded from recipeDigest. So control-plane and worker share this one identity.
    category: kubernetes
  # The control-plane-only services layered on the shared substrate (base): etcd, the
  # three kube control-plane binaries, cluster DNS, Helm, and the pause image. Together
  # with base's shared substrate this is the full Tier-1 set (15 components); a worker
  # SKU is the subset whose `roles` include `worker`.
  componentRefs:
    - name: etcd
    - name: kube-apiserver
    - name: kube-controller-manager
    - name: kube-scheduler
    - name: pause
    - name: coredns
    - name: helm
