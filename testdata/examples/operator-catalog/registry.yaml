aicrProfiles:
  h100-runtime:
    accelerator: h100
    digest: sha256:f6fbb6626affcaab365ab2c8926d343b1c441af95bc4612f3ad7c695870b19e9
    generatorDigest: sha256:3b011745112ecee0c216310c732cbe13f474a21a20da6bc09476a2ee8d840a2a
    identity: h100-eks-ubuntu-training
    intent: training
    os: ubuntu
    repo: https://github.com/NVIDIA/aicr
    service: eks
apiVersion: nkd.dev/catalog/v3
components:
  acme-kubectl:
    artifactPath: _output/local/bin/linux/amd64/kubectl
    buildCommand:
    - make
    - WHAT=cmd/kubectl
    - KUBE_BUILD_PLATFORMS=linux/amd64
    cgo: false
    fromSource: true
    outputType: host-package
    platforms:
    - linux/amd64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  acme-kubectl-bin:
    outputType: host-package
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      evidence:
        none: true
      url: https://dl.k8s.io/release/{{.Tag}}/bin/linux/{{.Arch}}/kubectl
    source: k8s
  acme-pause:
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      evidence:
        none: true
      image: registry.k8s.io/pause:3.10
    source: k8s
kind: SourceBuildRegistry
metadata:
  description: 'Example operator-authored catalog. Passed via `--data examples/operator-catalog`
    it FULLY replaces the embedded NVIDIA default — none of its sources, recipes,
    or components are shared with it. This is the release-train seam (docs/versioning.md):
    an operator tracks their own catalog + lock without depending on nkdctl''s default.'
  name: acme-operator
sources:
  k8s:
    constraint: 1.32.x
    repo: https://github.com/kubernetes/kubernetes
    toolchainImage: sha256:9e4d7fdad5d2b10609edfb3f0cadb7b4ca7bea6a9d2e42bca6b175de85c8d8d2
