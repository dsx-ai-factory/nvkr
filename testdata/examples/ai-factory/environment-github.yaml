apiVersion: nkd.dev/environment/v1
kind: Environment
metadata:
  name: github-production
  description: Registry destinations are independently selected settings.
utilityContainer: golang@sha256:fe5d57d3b718e7a4986bae156c2d73f44973bfd313073aed08a4de6692bb6161
utilityPlatform: linux/amd64
destinations:
  tenant-registry:
    kind: oci
    ref: ghcr.io/example-ai-factory/nke/tenant:1.32.0-h100
    credentialRef: github:NKD_REGISTRY_AUTH
publish:
  worker-binaries: tenant-registry
runtime:
  toolchainRegistry: ghcr.io/example-ai-factory
