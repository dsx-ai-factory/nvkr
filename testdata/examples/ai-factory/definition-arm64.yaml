apiVersion: nkd.dev/definition/v2
catalog:
  base: ../../catalogs/kubernetes-layered
  overlays:
  - supplier-kubectl.yaml
clusters:
- aicrBundle:
    acceleratedNodeSelectors:
    - nvidia.com/gpu.present=true
    acceleratedNodeTolerations:
    - nvidia.com/gpu=present:NoSchedule
    deployer: helm
    storageClass: gp3
    workloadSelectors:
    - nkd.dev/tenant=gpu
  cni: cni-plugins
  members:
  - output: gpu-runtime
  - output: worker-binaries
    role: gpu-worker
  name: gpu-tenant
  type: tenant
  validationRequirements:
  - aicr-bundle-verified
  - kubernetes-node-smoke
kind: Definition
metadata:
  description: Native ARM64 GPU worker deliverables and their tenant cluster view.
  name: nke-gpu-tenant-arm64
outputs:
- format: helm-oci
  name: gpu-runtime
  recipe: h100-runtime
- apt:
    component: main
    distribution: stable
  components:
  - containerd
  - crictl
  - kubeadm
  - kubectl
  - kubelet
  - runc
  format: apt-repository
  name: worker-apt
  recipe: gpu-node
- components:
  - containerd
  - crictl
  - kubeadm
  - kubectl
  - kubelet
  - runc
  format: executable
  name: worker-binaries
  recipe: gpu-node
recipes:
- criteria:
    arch: arm64
    category: kubernetes
    k8sVersion: 1.32.0
    os: ubuntu
  name: gpu-node
- aicrGenerator: aicr
  catalog:
    base: ../layered-catalog
  criteria:
    arch: arm64
    category: accelerated-runtime
    k8sVersion: 1.32.0
    os: ubuntu
  name: h100-runtime
  parameters:
    accelerator: h100
    intent: training
    service: eks
