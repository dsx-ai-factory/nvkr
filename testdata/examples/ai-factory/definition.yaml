apiVersion: nkd.dev/definition/v5
catalog:
  base: ../../catalogs/kubernetes-layered
  overlays:
  - supplier-kubectl.yaml
kind: Definition
metadata:
  description: Pinned GPU runtime and worker deliverables.
  name: nke-gpu-tenant
outputs:
- catalog:
    base: ../layered-catalog
  components:
  - gpu-runtime-chart
  format: helm-oci
  name: gpu-runtime
  platform: linux/amd64
- apt:
    component: main
    distribution: stable
  components:
  - containerd
  - crictl
  - kubeadm
  - kubectl
  - kubelet
  - runc
  format: apt-repository
  name: worker-apt
  platform: linux/amd64
- components:
  - containerd
  - crictl
  - kubeadm
  - kubectl
  - kubelet
  - runc
  format: executable
  name: worker-binaries
  platform: linux/amd64
