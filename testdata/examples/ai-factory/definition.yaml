apiVersion: nkd.dev/definition/v4
catalog:
  base: ../../catalogs/kubernetes-layered
  overlays:
  - supplier-kubectl.yaml
kind: Definition
metadata:
  description: Pinned GPU runtime and worker deliverables with explicit AICR rendering
    settings.
  name: nke-gpu-tenant
outputs:
- aicr:
    bundle:
      acceleratedNodeSelectors:
      - nvidia.com/gpu.present=true
      acceleratedNodeTolerations:
      - nvidia.com/gpu=present:NoSchedule
      deployer: helm
      storageClass: gp3
      workloadSelectors:
      - nkd.dev/tenant=gpu
    generator: aicr
    profile: h100-runtime
  catalog:
    base: ../layered-catalog
  format: helm-oci
  name: gpu-runtime
  platform: linux/amd64
- apt:
    component: main
    distribution: stable
  components:
  - containerd
  - crictl
  - kubeadm
  - kubectl
  - kubelet
  - runc
  format: apt-repository
  name: worker-apt
  platform: linux/amd64
- components:
  - containerd
  - crictl
  - kubeadm
  - kubectl
  - kubelet
  - runc
  format: executable
  name: worker-binaries
  platform: linux/amd64
