apiVersion: nvkr.dev/environment/v1
kind: Environment
metadata:
  name: laptop-registry
toolchainAccess:
  publicRoots:
    - docker.io/library/golang
    - ghcr.io/example-ai-factory
runtime:
  imageLocations:
    nvkr-toolchain-go: ghcr.io/example-ai-factory/nvkr-toolchain-go
    nvkr-toolchain-cgo: ghcr.io/example-ai-factory/nvkr-toolchain-cgo
publication:
  anonymous: true
  plainHTTP: true
  repositoryPrefix: localhost:5000/nvke
utilityContainer: golang@sha256:fe5d57d3b718e7a4986bae156c2d73f44973bfd313073aed08a4de6692bb6161
utilityPlatform: linux/amd64
