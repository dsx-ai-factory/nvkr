kind: RecipeMixin
apiVersion: nkd.dev/recipe/v1alpha1
metadata:
  name: os-ubuntu
spec:
  # An orthogonal, single-axis fragment (defined once, composed by any overlay). It
  # contributes only constraints/componentRefs — here an OS precondition for the worker
  # node's kubelet lane.
  constraints:
    - name: os.release
      value: ubuntu
