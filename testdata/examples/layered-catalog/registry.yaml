apiVersion: nvkr.dev/catalog/v3
components:
  capi-core:
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      evidence:
        none: true
      image: registry.k8s.io/cluster-api/cluster-api-controller:v1.9.5
    source: k8s
  kube-apiserver:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kube-apiserver
    buildCommand:
    - make
    - WHAT=cmd/kube-apiserver
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kube-controller-manager:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kube-controller-manager
    buildCommand:
    - make
    - WHAT=cmd/kube-controller-manager
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  gpu-runtime-chart:
    artifactPath: out/gpu-runtime.tar
    buildCommand:
    - tar
    - --sort=name
    - --owner=0
    - --group=0
    - --numeric-owner
    - -cf
    - out/gpu-runtime.tar
    - helm
    cgo: false
    fromSource: true
    outputType: tarball
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    writeDir: out
  kube-proxy:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kube-proxy
    buildCommand:
    - make
    - WHAT=cmd/kube-proxy
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kubectl:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kubectl
    buildCommand:
    - make
    - WHAT=cmd/kubectl
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: host-package
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kubelet:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kubelet
    buildCommand:
    - make
    - WHAT=cmd/kubelet
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: host-package
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  pause:
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      evidence:
        none: true
      image: registry.k8s.io/pause:3.10
    source: k8s
kind: SourceBuildRegistry
metadata:
  description: Pinned component catalog for direct Definition output selection.
    Each component declares its supported target platforms. Resolve the kubectl
    producer with `nvkr resolve --data testdata/examples/layered-catalog
    --component kubectl --platform linux/amd64`.
  name: layered-demo
sources:
  k8s:
    constraint: 1.32.x
    repo: https://github.com/kubernetes/kubernetes
    toolchainImage: sha256:9e4d7fdad5d2b10609edfb3f0cadb7b4ca7bea6a9d2e42bca6b175de85c8d8d2
