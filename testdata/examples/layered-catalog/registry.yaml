  pause:
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      evidence:
        none: true
      image: registry.k8s.io/pause:3.10
    source: k8s
kind: SourceBuildRegistry
metadata:
  description: Pinned component and AICR profile catalog for direct Definition output
    selection. Each component declares its supported target platforms. Resolve the
    kubectl producer with `nkdctl resolve --data testdata/examples/layered-catalog
    --component kubectl --platform linux/amd64`.
  name: layered-demo
sources:
  aicr:
    constraint: 0.18.x
    repo: https://github.com/NVIDIA/aicr
    tool:
      executablePath: aicr
      format: tar-gzip
      platform: linux/amd64
      url: https://github.com/NVIDIA/aicr/releases/download/{{.Tag}}/aicr_{{.Version}}_linux_amd64.tar.gz
  k8s:
    constraint: 1.32.x
    repo: https://github.com/kubernetes/kubernetes
    toolchainImage: sha256:9e4d7fdad5d2b10609edfb3f0cadb7b4ca7bea6a9d2e42bca6b175de85c8d8d2
