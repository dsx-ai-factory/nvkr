aicrProfiles:
  h100-runtime:
    accelerator: h100
    digest: sha256:f6fbb6626affcaab365ab2c8926d343b1c441af95bc4612f3ad7c695870b19e9
    generatorDigest: sha256:50287efe53d4b0aeb5c36c7ef792b4039509ae8f0ff5078d48369c09305a676f
    identity: h100-eks-ubuntu-training
    intent: training
    os: ubuntu
    repo: https://github.com/NVIDIA/aicr
    service: eks
apiVersion: nkd.dev/catalog/v3
components:
  capi-core:
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    prebuilt:
      evidence:
        none: true
      image: registry.k8s.io/cluster-api/cluster-api-controller:v1.9.5
    source: k8s
  kube-apiserver:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kube-apiserver
    buildCommand:
    - make
    - WHAT=cmd/kube-apiserver
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kube-controller-manager:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kube-controller-manager
    buildCommand:
    - make
    - WHAT=cmd/kube-controller-manager
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kube-proxy:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kube-proxy
    buildCommand:
    - make
    - WHAT=cmd/kube-proxy
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kubectl:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kubectl
    buildCommand:
    - make
    - WHAT=cmd/kubectl
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: host-package
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
    writeDir: _output
  kubelet:
    artifactPath: _output/local/bin/linux/{{.Arch}}/kubelet
    buildCommand:
    - make
    - WHAT=cmd/kubelet
    - KUBE_BUILD_PLATFORMS=linux/{{.Arch}}
    cgo: false
    fromSource: true
    outputType: host-package
    platforms:
    - linux/amd64
    - linux/arm64
    source: k8s
    versionStamp:
      KUBE_GIT_COMMIT: '{{.Commit}}'
      KUBE_GIT_MAJOR: '{{.Major}}'
      KUBE_GIT_MINOR: '{{.Minor}}'
      KUBE_GIT_TREE_STATE: clean
      KUBE_GIT_VERSION: '{{.Tag}}'
