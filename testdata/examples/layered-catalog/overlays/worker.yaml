kind: RecipeMetadata
apiVersion: nkd.dev/recipe/v1alpha1
metadata:
  name: node-common
spec:
  base: base
  criteria:
    category: kubernetes
  # This category parent adds node-wide components once. The Ubuntu-specialized leaf
  # inherits it, and SKU role affinity later filters the resolved members without
  # changing recipe identity.
  componentRefs:
    - name: kubectl
    - name: pause
    - name: kubelet
    - name: kube-proxy
  mixins:
    - os-ubuntu
