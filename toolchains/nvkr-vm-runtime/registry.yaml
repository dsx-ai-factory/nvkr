apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvkr-vm-runtime
sources:
  mkosi:
    repo: https://github.com/systemd/mkosi
    constraint: '*'
  packer-amd64:
    repo: https://github.com/hashicorp/packer
    constraint: 1.16.2
    tool:
      format: zip
      platform: linux/amd64
      url: https://releases.hashicorp.com/packer/{{.Version}}/packer_{{.Version}}_linux_amd64.zip
      executablePath: packer
      companions: [LICENSE.txt]
  packer-plugin-qemu-amd64:
    repo: https://github.com/hashicorp/packer-plugin-qemu
    constraint: 1.1.8
    tool:
      format: zip
      platform: linux/amd64
      url: https://releases.hashicorp.com/packer-plugin-qemu/{{.Version}}/packer-plugin-qemu_{{.Version}}_linux_amd64.zip
      executablePath: packer-plugin-qemu_v1.1.8_x5.0_linux_amd64
      companions: [LICENSE.txt]
components:
  packer-amd64:
    source: packer-amd64
    outputType: host-package
    platforms: [linux/amd64]
    prebuilt:
      releaseExecutable: true
      evidence:
        none: true
  packer-plugin-qemu-amd64:
    source: packer-plugin-qemu-amd64
    outputType: host-package
    platforms: [linux/amd64]
    prebuilt:
      releaseExecutable: true
      evidence:
        none: true
  vm-runtime-amd64:
    source: mkosi
    fromSource: true
    builderType: mkosi
    outputType: oci-image
    platforms: [linux/amd64]
    artifactPath: nvkr-output/runtime
