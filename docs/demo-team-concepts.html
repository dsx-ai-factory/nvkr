cli/ tags whose version part matches 0.1.x.","The maintained lock selects cli/v0.1.0-rc.2 at ed9fb09b04fd40bf331d25df2222206ffaca593e.","The separate nke-controller source uses controller/ tags from the same repository. A repository URL alone is not a source identity."],"group":"author","slide":3,"flow":[["Source name","nke"],["Version policy","cli/ + 0.1.x"],["Lock entry","Exact commit + tree"]],"displayBadge":"Implemented","exampleLabel":"Exact source declaration excerpt from definitions/nke-v1/catalog/registry.yaml.","exampleFoot":"Exact source declaration excerpt from definitions/nke-v1/catalog/registry.yaml.","flowCaption":"Simplified sources view. Follow the numbered steps below.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true}],"keywords":["sources","yaml",""]},{"id":"producers","title":"Component producers","oneSentence":"A component producer declares how to build or acquire a named component and what it emits.","why":"Keep build knowledge reusable and give the compiler an exact output contract.","badge":"implemented","sourcePaths":["definitions/nke-v1/catalog/registry.yaml","pkg/nkd/catalog/direct_producer_test.go","docs/adr/0011-composition-and-resolution-semantics.md"],"exampleLanguage":"yaml","example":"components:\n  nke-helm:\n    source: nke-controller\n    fromSource: true\n    platforms: [linux/amd64]\n    outputType: tarball\n    artifactPath: bin/nke-helm.tar\n    writeDir: bin\n    buildCommand:\n      - sh\n      - -ec\n      - >-\n        tar --sort=name --mtime=\"@$SOURCE_DATE_EPOCH\"\n        --owner=0 --group=0 --numeric-owner\n        -C /src/controller/deploy/charts\n        -cf /src/bin/nke-helm.tar controller","explanation":["The source supplies exact checkout and inherited toolchain inputs. The producer supplies the command and expected artifact path.","This source producer emits a tarball. The Definition later requests Helm OCI packaging.","Acquired producers declare pinned upstream bytes instead. The generated graph uses acquisition instead of compilation."],"group":"author","slide":3,"flow":[["Pinned source","Controller chart"],["Build instruction","Create chart archive"],["Produced bytes","Declared artifact path"]],"displayBadge":"Implemented","exampleLabel":"Real producer excerpt; its Helm image-slot declaration is shown in the Helm bindings example.","exampleFoot":"Real producer excerpt; its Helm image-slot declaration is shown in the Helm bindings example.","flowCaption":"Simplified component producers view. Follow the numbered steps below.","actions":[{"label":"Builder types","href":"#builders","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"keywords":["producers","yaml",""]},{"id":"definition","title":"Definitions & outputs","oneSentence":"A Definition names every required output, its exact producers, platform and package format.","why":"Make “done” measurable before execution begins.","badge":"implemented","sourcePaths":["definitions/nke-v1/definition.yaml","pkg/nkd/definition/model.go","docs/adr/0017-cli-sdk-foundation-and-package-topology.md"],"exampleLanguage":"yaml","example":"apiVersion: nkd.dev/definition/v4\nkind: Definition\nmetadata:\n  name: nke-v1\ncatalog:\n  base: ./catalog\noutputs:\n  - name: cwe\n    components: [cwe]\n    platform: linux/amd64\n    format: oci\n  - name: nkectl\n    components: [nkectl]\n    platform: linux/amd64\n    format: executable","explanation":["This shortened maintained example selects one image and one executable. The full nke-v1 Definition also selects its Helm chart.","Every output is independently required. Two outputs with the same Build Digest still require their own observed results and evidence.","Unknown components, duplicate selections and unsupported platforms fail admission. Membership is explicit."],"group":"author","slide":2,"flow":[["Output name","cwe"],["Selected producer","cwe"],["Delivery format","OCI / linux/amd64"]],"displayBadge":"Implemented","exampleLabel":"Shortened maintained Definition; the omitted chart output is shown separately.","exampleFoot":"Shortened maintained Definition; the omitted chart output is shown separately.","flowCaption":"Simplified definitions & outputs view. Follow the numbered steps below.","actions":[{"label":"Catalogs","href":"#catalog","secondary":true},{"label":"Helm image bindings","href":"#helm-bindings","secondary":true}],"keywords":["definition","yaml",""]},{"id":"environment","title":"Environments","oneSentence":"An Environment supplies execution routes, publication destinations, credential references and signing policy.","why":"Use the same build intent with a local or hosted execution setting.","badge":"implemented","sourcePaths":["definitions/nke-v1/environment-github.yaml","definitions/nke-v1/environment-local.yaml","pkg/nkd/lifecycle/environment_contract_test.go"],"exampleLanguage":"yaml","example":"apiVersion: nkd.dev/environment/v1\nkind: Environment\nmetadata:\n  name: nke-github\nruntime:\n  runtime: docker\npublication:\n  credentialRef: github:GITHUB_TOKEN\n  repositoryPrefix: ghcr.io/dsx-ai-factory/nke-recipes\nsourceAccess:\n  https://github.com/dsx-ai-factory/nke:\n    credentialRef: github:NKE_SOURCE_TOKEN\n    mirror: https://github.com/dsx-ai-factory/nke","explanation":["These fields are an excerpt of the maintained GitHub Environment. It also pins utility execution settings and the accepted signer identity.","Credentials are references. The generated workflow scopes source access separately from build operations.","Changing a registry destination changes transport and Plan settings while preserving a build’s logical content identity when its selected build inputs are unchanged."],"miniDemo":[{"label":"Destination change","before":"ghcr.io/team-a/product","after":"registry.example/product","effect":"Publication routes and Plan change; unchanged producer graphs retain their Build Digests."}],"group":"author","slide":2,"flow":[["Same Definition","What should ship"],["Environment","Where and how to run"],["Prepared Plan","Exact execution settings"]],"displayBadge":"Implemented","exampleLabel":"Environment excerpt; use the complete maintained file for commands.","exampleFoot":"Environment excerpt; use the complete maintained file for commands.","flowCaption":"Simplified environments view. Follow the numbered steps below.","actions":[{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true},{"label":"Generator adapters","href":"#generators","secondary":true}],"keywords":["environment","yaml",""]},{"id":"pinning","title":"Immutable pins","oneSentence":"Pinning resolves allowed upstream versions to immutable source identities and acquired-byte digests.","why":"The next run uses recorded inputs rather than whatever a moving tag happens to name.","badge":"implemented","sourcePaths":["definitions/nke-v1/catalog/pins.lock.yaml","docs/adr/0022-catalog-pinning-and-the-lock-contract.md","pkg/nkd/catalog/pin_test.go"],"exampleLanguage":"yaml","example":"# Exact maintained lock excerpt — machine-managed\npins:\n  nke:\n    tag: cli/v0.1.0-rc.2\n    commit: ed9fb09b04fd40bf331d25df2222206ffaca593e\n    treeHash: 309887e8cdb8ee24a39785b864390eda3afce5ec\n    sourceDateEpoch: 1787066575","explanation":["The tag is the release label; commit, tree and source epoch freeze the source identity.","Tools and acquired artifacts add exact archive, executable or platform content digests as their contracts require.","Preview with catalog bump --dir \u003ccatalog> --check \u003csource>. Pending changes return NKD-E-DIFF and leave the lock unchanged."],"miniDemo":[{"label":"Source pin changes","before":"app/v1.0.0","after":"app/v1.0.1","effect":"In the maintained authoring lab, cli-amd64, cli-arm64, controller and controller-chart change Build Digest; tools outputs retain theirs."}],"group":"compose","slide":3,"flow":[["Allowed version","cli/ + 0.1.x"],["Resolved source","Tag + commit + tree"],["Frozen input","Reusable exact identity"]],"displayBadge":"Implemented","exampleLabel":"Exact lock excerpt. The preview command uses placeholders for the chosen catalog and source.","exampleFoot":"Exact lock excerpt. The preview command uses placeholders for the chosen catalog and source.","flowCaption":"Simplified immutable pins view. Follow the numbered steps below.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true},{"label":"Catalog maintenance","href":"#maintenance","secondary":true}],"quiz":{"prompt":"Which input should a repeatable build consume?","choices":[{"label":"A moving tag","result":"Resolve the permitted tag through the lock writer first. A label by itself does not freeze its source bytes."},{"label":"The recorded lock","result":"Commit, tree and source epoch freeze the selected source. Acquired inputs carry their required content digests."}]},"keywords":["pinning","yaml",""]},{"id":"pin-sets","title":"Coordinated pin sets","oneSentence":"A pin set maps an upstream version file to an explicit group of source or acquired-artifact pins.","why":"Update a coordinated release together and reject partial or invented membership.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/catalog/registry.yaml","docs/examples/authoring-lab/README.md","docs/generic-pin-set-example.md","pkg/nkd/catalog/pin_set_integration_test.go"],"exampleLanguage":"yaml","example":"sources:\n  platform:\n    repo: https://authoring.example.invalid/platform\n    tagPrefix: platform/v\n    constraint: 1.0.x\n    pinSet:\n      file: versions.yaml\n      members:\n        app: {source: app, path: 'dependencies[name=app].version'}\n        tools: {source: tools, path: 'dependencies[name=tools].version'}\n  app:\n    repo: https://authoring.example.invalid/platform\n    tagPrefix: app/v\n    pinnedBy: platform","explanation":["The local authoring lab supplies this fixture repository; the displayed source excerpt omits toolchain and tools declarations.","Pinning platform reads versions.yaml from its exact pinned tree, then updates the umbrella and members in one lock transaction.","An app pin cannot be bumped independently. Load-time validation re-derives membership and versions from the pinned upstream bytes."],"group":"compose","slide":3,"flow":[["Umbrella pin","platform/v1.0.x"],["Version file","dependencies[]"],["Member pins","app + tools"]],"displayBadge":"Implemented","exampleLabel":"Maintained local fixture excerpt; example.invalid is intentionally mapped to a local Git repository by the lab.","exampleFoot":"Maintained local fixture excerpt; example.invalid is intentionally mapped to a local Git repository by the lab.","flowCaption":"Simplified coordinated pin sets view. Follow the numbered steps below.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Catalog maintenance","href":"#maintenance","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"keywords":["pin-sets","yaml",""]},{"id":"overlays","title":"Catalog overlays","oneSentence":"An ordered overlay replaces a whole producer against the exact preceding catalog state.","why":"Use another supplier without copying an entire catalog or silently inheriting incompatible fields.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/run.sh","docs/examples/authoring-lab/README.md","pkg/nkd/catalog/stack.go","pkg/nkd/catalog/stack_test.go"],"exampleLanguage":"yaml","example":"# Shape of the authoring lab’s generated supplier overlay\napiVersion: nkd.dev/catalog-overlay/v3\nkind: CatalogOverlay\nname: supplier-doctor\nrequiresCatalogDigest: \u003cexact predecessor catalog digest>\ncomponents:\n  doctor:\n    version: 1.0.0\n    sourceDateEpoch: 1735689600\n    prebuilt:\n      url: https://authoring.example.invalid/supplier/doctor.sh\n      digests:\n        amd64: \u003cexact supplier SHA-256>\n        arm64: \u003cexact supplier SHA-256>\n      evidence: {none: true}","explanation":["The lab computes both displayed digest placeholders from actual fixture inputs. This schematic excerpt is not a runnable overlay.","Overlay A pins the base digest. Overlay B pins A’s resulting digest. Reordering, skipping or replaying against a changed predecessor fails.","Replacement preserves the component’s supported platforms and output type. A changed contract needs a new component name."],"miniDemo":[{"label":"Global overlay","before":"doctor: source build","after":"doctor: acquired supplier bytes","effect":"The diagnostics and tools outputs change Build Digest. The compiler switches doctor from build to acquisition."},{"label":"Stale predecessor","before":"Overlay pins original catalog","after":"The base source pin advances","effect":"NKD-E-UNVERIFIED-REF; the old overlay is refused."}],"group":"compose","slide":5,"flow":[["Base catalog","Exact predecessor"],["Ordered overlay","Whole producer replacement"],["Effective catalog","New resolved identity"]],"displayBadge":"Implemented","exampleLabel":"Schematic shape from the runnable authoring lab; digest placeholders are intentionally visible.","exampleFoot":"Schematic shape from the runnable authoring lab; digest placeholders are intentionally visible.","flowCaption":"Simplified catalog overlays view. Follow the numbered steps below.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Scoped substitutions","href":"#substitutions","secondary":true},{"label":"Toolchain substitutions","href":"#toolchain-substitutions","secondary":true}],"quiz":{"prompt":"What happens if the base changes under an existing overlay?","choices":[{"label":"Keep the old overlay","result":"The predecessor binding no longer matches. NKD rejects the overlay with NKD-E-UNVERIFIED-REF."},{"label":"Review and rebind it","result":"Create an overlay against the new exact predecessor and review the resulting producer replacement."}]},"keywords":["overlays","yaml",""]},{"id":"substitutions","title":"Scoped substitutions","oneSentence":"A product can select a different producer or apply an alternate catalog stack to one named output.","why":"Change exactly one deliverable while keeping other selections reviewable.","badge":"implemented","sourcePaths":["docs/examples/authoring-lab/definition.yaml","docs/examples/authoring-lab/run.sh","docs/catalog-definition-authoring.md"],"exampleLanguage":"yaml","example":"# Per-output catalog variant from the authoring lab\n- name: tools\n  components: [doctor, status]\n  platform: linux/amd64\n  format: executable\n  catalog:\n    base: ./catalog\n    overlays: [supplier.json]\n\n# Separate component-selection variant\n- name: diagnostics\n  components: [doctor-alt]\n  platform: linux/amd64\n  format: executable","explanation":["These are two independently authored variants, shown side by side. The first confines the supplier overlay to tools.","The second keeps the diagnostics output name but selects the existing doctor-alt producer.","The complete fixture Definitions are compiled and compared by the authoring lab; there is no generic inheritance or deep-merge language."],"miniDemo":[{"label":"Only this catalog stack","before":"tools → base doctor","after":"tools → supplier doctor","effect":"Only tools changes. diagnostics still selects base doctor."},{"label":"Only this selection","before":"diagnostics → doctor","after":"diagnostics → doctor-alt","effect":"Only diagnostics changes. Output membership remains the same."}],"group":"compose","slide":5,"flow":[["Output: tools","Scoped catalog stack"],["Supplier doctor","Changed producer"],["Other outputs","Keep their own selections"]],"displayBadge":"Implemented","exampleLabel":"Output excerpts from two separate maintained fixture variants.","exampleFoot":"Output excerpts from two separate maintained fixture variants.","flowCaption":"Simplified scoped substitutions view. Follow the numbered steps below.","actions":[{"label":"Run the composition lab ↗","href":"demo-team-walkthrough.html#composition"},{"label":"Catalog overlays","href":"#overlays","secondary":true},{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true}],"quiz":{"prompt":"Where should the supplier replacement apply?","choices":[{"label":"Every selecting output","result":"A global catalog overlay affects all outputs whose selected graph includes that replaced producer."},{"label":"Only tools","result":"Use the tools output’s catalog stack. diagnostics continues using the base producer."},{"label":"Only diagnostics","result":"Select doctor-alt for diagnostics. The output name stays the same while its selected producer changes."}]},"keywords":["substitutions","yaml",""]},{"id":"toolchain-substitutions","title":"Toolchain substitutions","oneSentence":"The overlay schema permits a narrow toolchain-pin change for one architecture and an explicit producer set.","why":"Move a reviewed execution image while making both the old assumptions and affected producers visible.","badge":"implemented","sourcePaths":["definitions/nke-m2/native-toolchains.yaml","pkg/nkd/catalog/stack.go","pkg/nkd/catalog/stack_test.go","docs/adr/0022-catalog-pinning-and-the-lock-contract.md"],"exampleLanguage":"yaml","example":"# Exact ARM64 entry from the maintained M2 overlay\ntoolchainSubstitutions:\n  - arch: arm64\n    from: sha256:03a8b35467adfd1fc3ca496adf87ac0cd23ce35782290409d2832578eaad7d51\n    to: ghcr.io/dsx-ai-factory/nke-recipes/m2-candidate/toolchains/packer@sha256:ad467e43ae0ee7f3aaf5b646a117003623b9ea23de035630dc7f5c844758e0db\n    components:\n      - nke-agent\n      - nke-cni-calico\n      - nke-cni-ovn\n      - nke-image-inputs\n      - nke-kubeadm-distro\n      - nke-node-image\n      - nke-patched-installer-iso\n      - nke-spire-agent\n      - ovn-kubernetes-chart","explanation":["The containing overlay also pins requiresCatalogDigest. Each named from-source producer must carry the exact old ARM64 toolchain pin.","The list must be sorted and duplicate-free. Unknown producers, old-pin mismatches and duplicate substitutions fail.","This is the sole field-level catalog overlay operation. The effective catalog and selected Build identities bind the replacement."],"group":"compose","slide":8,"flow":[["Exact old image","For one architecture"],["Explicit component set","Sorted reviewed membership"],["Exact new image","Updated build inputs"]],"displayBadge":"Implemented","exampleLabel":"Exact ARM64 entry; containing overlay header and its AMD64 entry are omitted.","exampleFoot":"Exact ARM64 entry; containing overlay header and its AMD64 entry are omitted.","flowCaption":"Simplified toolchain substitutions view. Follow the numbered steps below.","actions":[{"label":"OS images","href":"#os-images","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"keywords":["toolchain-substitutions","yaml",""]},{"id":"version-stamps","title":"Version stamps","oneSentence":"Producer templates render version and commit values from the resolved source pin.","why":"Make embedded version information traceable to the exact source selection.","badge":"implemented","sourcePaths":["definitions/nke-v1/catalog/registry.yaml","definitions/nke-v1/catalog/pins.lock.yaml","pkg/nkd/catalog/nkev1_stamp_test.go","docs/adr/0022-catalog-pinning-and-the-lock-contract.md"],"exampleLanguage":"yaml","example":"# Exact nkectl producer excerpt\nversionStamp:\n  NKECTL_CAPI_VERSION: v1.12.3\n  NKECTL_COMMIT: '{{slice .Commit 0 8}}'\n  NKECTL_DATE: '{{.Date}}'\n  NKECTL_VERSION: '{{.ModuleTag}}'\n\n# With the maintained nke source pin:\n# NKECTL_COMMIT = ed9fb09b\n# NKECTL_VERSION = cli/v0.1.0-rc.2","explanation":["The nkectl build command consumes these values in its Go linker flags.","ModuleTag retains the complete monorepo tag; prefix-aware version fields derive from the version part.","These are resolved producer inputs, not deployment-context substitutions. Unknown template tokens fail."],"group":"compose","slide":3,"flow":[["Pinned source","Commit + tag + epoch"],["Producer template","Version / commit / date"],["Build inputs","Embedded version fields"]],"displayBadge":"Implemented","exampleLabel":"Exact maintained producer excerpt plus values derived from its current lock.","exampleFoot":"Exact maintained producer excerpt plus values derived from its current lock.","flowCaption":"Simplified version stamps view. Follow the numbered steps below.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Component producers","href":"#producers","secondary":true}],"keywords":["version-stamps","yaml",""]},{"id":"helm-bindings","title":"Helm image bindings","oneSentence":"The Definition binds a named chart slot to an image output; the catalog maps that slot to a digest field.","why":"Ship a chart carrying the exact packaged image digest while allowing a downstream registry choice.","badge":"implemented","sourcePaths":["definitions/nke-v1/definition.yaml","definitions/nke-v1/catalog/registry.yaml","docs/declarative-helm-bindings.md","pkg/nkd/definition/helm_test.go"],"exampleLanguage":"yaml","example":"# Definition: which output fills the slot?\n- name: nke-helm\n  components: [nke-helm]\n  platform: linux/amd64\n  format: helm-oci\n  helm:\n    images:\n      controller: cwe\n\n# Catalog producer: where does the digest go?\nhelm:\n  chart: .\n  images:\n    controller:\n      values:\n        digest: image.digest","explanation":["The compiler derives package/nke-helm → package/cwe. The image package must exist before chart binding.","The verified image digest is written to image.digest. Chart template bytes remain unchanged.","The chart’s Build Digest identifies its source graph; the complete Plan and resulting package capture the image relationship. A packaging change need not change every downstream Build Digest."],"group":"compose","slide":3,"flow":[["cwe image output","Observed OCI digest"],["controller slot","image.digest"],["Final chart","Bound package + evidence"]],"displayBadge":"Implemented","exampleLabel":"Two excerpts from the maintained Definition and catalog; they belong in different files.","exampleFoot":"Two excerpts from the maintained Definition and catalog; they belong in different files.","flowCaption":"Simplified helm image bindings view. Follow the numbered steps below.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Producer & artifact graphs","href":"#graphs","secondary":true},{"label":"Dependency SBOMs","href":"#sbom","secondary":true}],"keywords":["helm-bindings","yaml",""]},{"id":"maintenance","title":"Catalog maintenance","oneSentence":"Catalog refresh combines a candidate pin update with matching generated Run files.","why":"Keep source updates and generated pipelines together as a reviewable change.","badge":"implemented","sourcePaths":["docs/catalog-maintenance.md","docs/examples/catalog-maintenance/nke-deploy.yaml","pkg/nkd/catalogmaintenance/refresh_test.go"],"exampleLanguage":"shell","example":"bin/nkdctl catalog refresh \\\n  --config docs/examples/catalog-maintenance/nke-deploy.yaml \\\n  --check --json\n\n# Render a maintenance workflow for review:\nbin/nkdctl catalog update-ci \\\n  --config docs/examples/catalog-maintenance/nke-deploy.yaml \\\n  > /tmp/nke-catalog-maintenance.yml","explanation":["Use a CLI matching the generator version recorded in the current bundle; the current bundle must pass drift admission first.","Preview resolves candidate pins without writing. It returns NKD-E-DIFF when a change is available; preview alone does not claim candidate execution.","Apply uses the atomic lock owner, regenerates and checks. Lock and generated-bundle replacement remain separate transactions.","Optional GitHub candidate workflows produce a read-only review patch. Automatic PR publication remains capability-gated."],"group":"compose","slide":12,"flow":[["Preview pins","No lock writes"],["Apply in scratch","Regenerate + check"],["Review candidate","Pins + generated patch"]],"displayBadge":"Implemented","exampleLabel":"Read-only maintenance preview from the maintained guide; private source access may be required.","exampleFoot":"Preview and workflow rendering require source access and matching generator identity. Rendering does not install or schedule a workflow.","flowCaption":"Simplified catalog maintenance view. Follow the numbered steps below.","actions":[{"label":"Coordinated pin sets","href":"#pin-sets","secondary":true},{"label":"The generated CI bundle","href":"#pipeline","secondary":true}],"keywords":["maintenance","shell",""]},{"id":"plan","title":"The generated Plan","oneSentence":"A Plan freezes the selected producers, expected outputs and execution/evidence/publication work.","why":"Review the complete workload before running it.","badge":"CLI exercised","sourcePaths":["docs/plan-and-graph-inspection.md","docs/demo-team-guide.md"],"exampleLanguage":"sh","example":"bin/nkdctl run plan \\\n  --definition definitions/nke-v1/definition.yaml \\\n  --environment definitions/nke-v1/environment-github.yaml \\\n  --json > /tmp/nkd-team-plan.json\n\nbin/nkdctl run plan --plan /tmp/nkd-team-plan.json --pretty","explanation":["The canonical JSON stream is the saved Plan. Pretty JSON is a display projection and is rejected as canonical Plan input.","Text inspection shows Build Digests, producer instructions, arguments, source/tool pins, dependencies, artifact operations and publication routes.","A Plan describes intended work. It does not prove that any producer or verification step ran."],"group":"execute","slide":4,"flow":[["Definition","Selected outputs"],["Resolve & compile","Pinned work + Environment"],["Canonical Plan","Saved inspection record"]],"displayBadge":"Cli exercised","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Simplified the generated plan view. Follow the numbered steps below.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"Producer & artifact graphs","href":"#graphs","secondary":true},{"label":"Semantic Plan diffs","href":"#plan-diff","secondary":true}],"keywords":["plan","sh",""]},{"id":"graphs","title":"Producer & artifact graphs","oneSentence":"Producer and artifact views answer different questions; the complete graph joins them.","why":"Follow an exact named output from its source and materials through evidence and publication.","badge":"CLI exercised","sourcePaths":["docs/plan-and-graph-inspection.md","docs/evidence/2026-10-06-team-demo-pipeline/plan.json"],"exampleLanguage":"sh","example":"bin/nkdctl run graph --plan /tmp/nkd-team-plan.json \\\n  --view producers --format mermaid\n\nbin/nkdctl run graph --plan /tmp/nkd-team-plan.json \\\n  --view artifacts --format dot\n\nbin/nkdctl run graph --plan /tmp/nkd-team-plan.json \\\n  --view complete --format json","explanation":["Producers: source acquisition, instructions, material requirements and terminal producer checks.","Artifacts: factory operations, their inputs/outputs, required output slots and publication routes.","Complete: joins producer instructions to operation/artifact edges. Exports support Mermaid, DOT and JSON.","Graph edges describe dependency and transport relationships; planned signing nodes are not signature evidence."],"group":"execute","slide":4,"flow":[["Producer view","Instructions + materials"],["Complete view","Joined relationships"],["Artifact view","Operations + output slots"]],"displayBadge":"Cli exercised","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Related views and boundaries; arrows show explanation order, not execution dependencies.","actions":[{"label":"Explore the real Plan ↗","href":"demo-team-explorer.html#plan/cwe"},{"label":"The generated Plan","href":"#plan","secondary":true},{"label":"Artifacts & identities","href":"#artifacts","secondary":true}],"quiz":{"prompt":"Which question are you asking?","choices":[{"label":"How is it built?","result":"Choose the producer view for source, instructions and material dependencies."},{"label":"How do bytes move?","result":"Choose the artifact view for operation inputs/outputs, output slots and publication routes."},{"label":"How does it connect?","result":"Choose the complete view to join producer instructions with operation and artifact relationships."}]},"keywords":["graphs","sh",""]},{"id":"plan-diff","title":"Semantic Plan diffs","oneSentence":"Semantic Plan comparison separates logical build changes from execution and transport changes.","why":"Show the impact of a pin or environment edit without reading a huge JSON diff.","badge":"Contract-tested","sourcePaths":["docs/plan-and-graph-inspection.md","pkg/nkd/planview"],"exampleLanguage":"sh","example":"bin/nkdctl run diff \\\n  --before before-plan.json --after after-plan.json\n\n# Show every changed field; useful after reviewing the summary.\nbin/nkdctl run diff \\\n  --before before-plan.json --after after-plan.json --details","explanation":["A source commit, toolchain pin or build argv change affects the selected logical Build identity.","A registry destination or execution route can change Plan identity while preserving a Build Digest.","Named collections are compared by their keys; output additions do not masquerade as replacement of every following output.","--exit-code returns status 3 when Plans differ. This explains changes; run generate --check detects drift in the entire generated bundle."],"group":"execute","slide":5,"flow":[["Before Plan","Exact saved input"],["Semantic comparison","Named fields + identities"],["After Plan","Explain affected work"]],"displayBadge":"Contract-tested","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Simplified semantic plan diffs view. Follow the numbered steps below.","actions":[{"label":"Immutable pins","href":"#pinning","secondary":true},{"label":"Catalog overlays","href":"#overlays","secondary":true}],"quiz":{"prompt":"What did you change?","choices":[{"label":"Source commit","result":"The affected logical Build Digests change; the complete Plan also changes."},{"label":"Registry destination","result":"Transport and Plan settings change. With the same selected producer graph, Build Digests can remain unchanged."}]},"keywords":["plan-diff","sh",""]},{"id":"generators","title":"Generator adapters","oneSentence":"The GitHub adapter renders a generated workflow and canonical Plan from admitted Definition and Environment inputs.","why":"Review the same frozen instructions locally and in the generated hosted pipeline.","badge":"implemented","sourcePaths":["pkg/nkd/factory/generate.go","docs/adr/0018-pipeline-ir-and-ci-adapter-emission.md","docs/adr/0021-generated-pipeline-maintenance-and-lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"shell","example":"bin/nkdctl run generate \\\n  --definition definitions/nke-v1/definition.yaml \\\n  --environment definitions/nke-v1/environment-github.yaml \\\n  --engine github --root \"$SCRATCH\"\n\n# Repeat exactly to check generated bytes:\nbin/nkdctl run generate \\\n  --definition definitions/nke-v1/definition.yaml \\\n  --environment definitions/nke-v1/environment-github.yaml \\\n  --engine github --root \"$SCRATCH\" --check","explanation":["Set SCRATCH to a prepared demo checkout containing these same authored inputs. The existing catalog demo script stages it automatically.","The rendered workflow executes the authoritative complete Plan. The manifest binds generated files and Plan/workflow digests; the Plan records exact input identities.","GitHub is the maintained hosted generator. Local execution uses run local. GitLab, Tekton and Argo generation return NKD-E-ENGINE-CAPABILITY before output.","AICR accelerated-runtime rendering has been removed and is deferred in ADR-12; historical examples do not establish current adapter support."],"miniDemo":[{"label":"Generated-file drift","before":"Workflow matches the exact admitted inputs","after":"A generated workflow byte is edited","effect":"The matching --check command fails instead of silently accepting the change."}],"group":"execute","slide":6,"flow":[["Shared Plan","Admitted instructions"],["GitHub adapter","Provider rendering"],["Actions workflow","Generated execution"]],"displayBadge":"Implemented","exampleLabel":"Current CLI syntax; docs/demo-team-catalog.sh provides the prepared scratch workspace.","exampleFoot":"Current CLI syntax; docs/demo-team-catalog.sh provides the prepared scratch workspace.","flowCaption":"Simplified generator adapters view. Follow the numbered steps below.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"The generated CI bundle","href":"#pipeline","secondary":true},{"label":"Builder types","href":"#builders","secondary":true}],"scope":"The maintained hosted adapter is GitHub. GitLab, Tekton and Argo are unavailable; AICR accelerated-runtime rendering was removed and remains deferred.","scopeTitle":"Current adapter support","keywords":["generators","shell",""]},{"id":"pipeline","title":"The generated CI bundle","oneSentence":"Generation produces a workflow, a canonical Plan and an ownership manifest that must regenerate byte-for-byte.","why":"Review authored intent and generated changes together, then detect any drift before a build starts.","badge":"Generated and hosted-exercised","sourcePaths":["docs/adr/0018-pipeline-ir-and-ci-adapter-emission.md","docs/adr/0021-generated-pipeline-maintenance-and-lifecycle.md","docs/adr/reconciliation.md"],"exampleLanguage":"text","example":"Authored\n  definition.yaml\n  environment-github.yaml\n  catalog/registry.yaml + pins.lock.yaml\n\nGenerated\n  .github/workflows/nkd-run.yml\n  .github/nkd-run/plan.json\n  .github/nkd-run/manifest.json\n\nCheck\n  Repeat run generate with the same inputs + --check","explanation":["The workflow is the provider-facing entry point. Its jobs dispatch the operations recorded in the canonical Plan.","The manifest binds generated paths, modes and hashes, plus the Plan and workflow digests. The Plan records the exact authored input identities.","The matching run generate --check invocation regenerates in memory and rejects missing, changed or unexpected generated bytes.","Generic hosted runners are the default. The explicit native-kvm-v1 policy admits only its named native AMD64/ARM64 disk routes."],"group":"execute","slide":6,"flow":[["Authored inputs","Definition + Environment"],["Generated bundle","Workflow + Plan + manifest"],["Byte-exact check","Same inputs + generator"]],"displayBadge":"Generated and hosted-exercised","exampleLabel":"Generated bundle map from the maintained repository layout","exampleFoot":"The manifest owns exact generated paths. Use the guided demo to generate safely in a scratch checkout.","flowCaption":"Simplified the generated ci bundle view. Follow the numbered steps below.","actions":[{"label":"Try the catalog walkthrough ↗","href":"demo-team-walkthrough.html#catalog"},{"label":"Generator adapters","href":"#generators","secondary":true},{"label":"Runs & completeness","href":"#execution","secondary":true}],"keywords":["pipeline","text",""]},{"id":"builders","title":"Builder types","oneSentence":"Builder types select how component bytes are made; packaging format remains a separate decision.","why":"Mix CLI, container, chart and disk outputs without hiding their runtime requirements.","badge":"Current implementation boundary","sourcePaths":["pkg/nkd/catalog/types.go","docs/adr/0010-pluggable-builder-types.md","docs/adr/reconciliation.md","pkg/nkd/pipeline/local_build.go","pkg/nkd/pipeline/execution_identity.go","pkg/nkd/buildgraph/nix_test.go"],"exampleLangua ssed in the featured workflow.","The disks are unencrypted QCOW2. Each browse view exposes exact wrapper identity, declared payload digest/size and 11 evidence memberships.","build-provenance-v1 explicitly defers deep disk inspection and reconciliation. Full disk SBOM, FDE and qualified reproduction are not established."],"group":"execute","slide":8,"flow":[["Materials","Agent + packages + ISO"],["Packer / native KVM","Explicit platform + capacity"],["QCOW2 output","Build-provenance evidence"]],"displayBadge":"Both native candidate outputs completed","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Simplified os images view. Follow the numbered steps below.","actions":[{"label":"Follow the OS material graph ↗","href":"demo-team-explorer.html#plan/nke-node-image-arm64"},{"label":"Toolchain substitutions","href":"#toolchain-substitutions","secondary":true},{"label":"Release navigation","href":"#browse","secondary":true}],"scope":"Both disk outputs use build-provenance-v1. Deep disk inspection, a full disk SBOM, FDE and qualified reproduction are outside this candidate’s claim.","scopeTitle":"This candidate’s disk evidence","keywords":["os-images","yaml",""]},{"id":"evidence-lanes","title":"Evidence lanes","oneSentence":"Planning, hosted build evidence and qualified reproduction establish different claims.","why":"Make the presentation precise without burying the audience in implementation details.","badge":"Current supported scope","sourcePaths":["docs/lifecycle.md","docs/adr/reconciliation.md","docs/evidence/2026-10-06-team-demo-pipeline.md"],"exampleLanguage":"text","example":"static-unqualified   Dry-run / diagnostic descriptions\npipeline-attested    Hosted workflow production evidence\nqualified            Exact-byte reproduction + stronger gates","explanation":["The featured Run is pipeline-attested. Its release control metadata separately retains qualification: diagnostic.","Current nced runtime images. Build-provenance disk evidence is not a full-disk inventory."],"group":"trust","slide":12,"flow":[["Exact subject","Binary / image / chart"],["Stage inventory","Normalized CycloneDX"],["Signed bundle","Subject-bound evidence"]],"displayBadge":"Recorded signed evidence","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Simplified dependency sboms view. Follow the numbered steps below.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Production provenance","href":"#provenance","secondary":true},{"label":"Signing & attestations","href":"#signing","secondary":true}],"keywords":["sbom","text",""]},{"id":"provenance","title":"Production provenance","oneSentence":"Production provenance binds exact subjects to their producing workflow and inputs.","why":"Help a consumer decide whether the observed producer matches its trusted policy.","badge":"Recorded candidate","sourcePaths":["docs/publication-architecture.md","docs/evidence/2026-10-06-team-demo-pipeline/release-predicate.json","docs/evidence/2026-10-06-team-demo-pipeline/release-verification.json"],"exampleLanguage":"json","example":"{\n  \"predicateType\": \"https://slsa.dev/provenance/v1\",\n  \"cosignVersion\": \"v3.1.3\",\n  \"observedIssuer\": \"https://token.actions.githubusercontent.com\",\n  \"observedIdentity\": \"https://github.com/dsx-ai-factory/nke-recipes/.github/workflows/nkd-run.yml@refs/heads/codex/m2-arc-validation\"\n}","explanation":["The featured candidate records SLSA provenance v1 and the GitHub Actions OIDC issuer.","Its observed signer is the exact validation-branch workflow shown here. The maintained Environment accepts main instead.","Authenticating provenance requires checking signatures, subject binding and the consumer policy. Reading this record does not re-run those checks."],"group":"trust","slide":7,"flow":[["Exact artifact","Immutable subject"],["Production statement","Workflow + materials"],["Consumer policy","Authenticate the claim"]],"displayBadge":"Recorded candidate","exampleLabel":"Projection of the retained workflow verification record","exampleFoot":"Verification-record excerpt; this is not the complete SLSA provenance predicate.","flowCaption":"Simplified production provenance view. Follow the numbered steps below.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Signing & attestations","href":"#signing","secondary":true},{"label":"Verification policy","href":"#verification","secondary":true}],"keywords":["provenance","json",""]},{"id":"signing","title":"Signing & attestations","oneSentence":"The generated workflow signs exact OCI subjects with a pinned cosign tool and a configured workflow identity.","why":"Give consumers a verifiable producer identity bound to immutable references.","badge":"Workflow verification recorded","sourcePaths":["pkg/nkd/sign/oci.go","docs/publication-architecture.md","docs/evidence/2026-10-06-team-demo-pipeline/release-signature.json","docs/evidence/2026-10-06-team-demo-pipeline/release-verification.json"],"exampleLanguage":"sh","example":"# Commands invoked by the signing adapter in the admitted workflow:\ncosign sign --yes --new-bundle-format \"$ARTIFACT_REF\"\ncosign attest --yes --new-bundle-format \\\n  --type slsaprovenance1 --predicate \"$PREDICATE\" \"$ARTIFACT_REF\"","explanation":["NKD has no public nkdctl sign subcommand. Signing is a generated, capability-admitted pipeline operation.","The featured release and both disk verification records say signatureVerified: true, attestationVerified: true and dryRun: false.","SBOMs use their own subject-bound CycloneDX attestation bundles. Artifact signatures, production provenance and inventories serve different purposes.","These commands show adapter behavior, not a suggested local signing demo. This   └─ nke-node-image-arm64@sha256:… → QCOW2 + material evidence","explanation":["The root is an OCI index with canonical metadata. Output names, exact sibling references and evidence membership live in that metadata.","Deliverables and their evidence remain in output repositories; NKD does not copy every payload into the release repository.","M2 per-output-v1 publishes and verifies each output route, then assembles metadata for the frozen complete output set.","Publication is not an atomic registry transaction. Failures can leave partial remote objects; completion still requires all gates."],"group":"trust","slide":9,"flow":[["Published outputs","Owning repositories"],["Membership metadata","Artifacts + evidence"],["Immutable root","One release entry point"]],"displayBadge":"Recorded 34-output publication","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Simplified release publication view. Follow the numbered steps below.","actions":[{"label":"Explore the recorded release ↗","href":"demo-team-explorer.html#publication/nke-node-image-arm64"},{"label":"Release navigation","href":"#browse","secondary":true},{"label":"Signing & attestations","href":"#signing","secondary":true}],"keywords":["release","text",""]},{"id":"browse","title":"Release navigation","oneSentence":"PR #108 reads bounded metadata and evidence for an exact release reference.","why":"Inspect a multi-gigabyte OS-image release quickly enough to explain it.","badge":"Live GHCR replay passed","sourcePaths":["docs/evidence/2026-10-06-team-demo-pipeline.md","docs/evidence/2026-10-06-team-demo-pipeline/pr108-browse.json"],"exampleLanguage":"sh","example":"bin/nkdctl release browse --reference \"$RELEASE_REF\" \\\n  --output nke-node-image-arm64 --format text\n\nbin/nkdctl release browse --reference \"$RELEASE_REF\" \\\n  --output nke-node-image-arm64 --format mermaid","explanation":["Full text, JSON and Mermaid views passed for the tion; GitHub publication/signing\n  Metadata-only release browsing; scoped consumer verification\n\nExplicitly bounded\n  Native ARC QCOW2: named routes; build-provenance disk mode\n  Full disk inspection: separate diagnostics and deferred acceptance\n\nUnavailable in this end-to-end tour\n  Qualified/full-release acceptance; FDE; air-gap lifecycle\n  Additional CI renderers; automatic maintenance PR publication\n  AICR accelerated-runtime rendering; deployment orchestration","explanation":["The latest implementation record owns support claims; historical documents retain the narrower scope of their original runs.","The featured candidate demonstrates hosted execution and signing for its exact commit and branch exception.","Current main-only M2 production inputs and independent full-payload candidate consumption still require their own execution evidence."],"group":"trust","slide":12,"flow":[["Implemented","Code + contract checks"],["Exercised","Exact recorded run"],["Accepted","Consumer-selected scope"]],"displayBadge":"Current reconciliation","exampleLabel":"Concrete example · interpretation below","exampleFoot":"Concrete example · interpretation below","flowCaption":"Related views and boundaries; arrows show explanation order, not execution dependencies.","actions":[{"label":"The public lifecycle","href":"#lifecycle","secondary":true},{"label":"Evidence lanes","href":"#evidence-lanes","secondary":true}],"keywords":["capabilities","text",""]}]</script>
<script>
'use strict';
const concepts=JSON.parse(document.getElementById('concept-data').textContent), $=id=>document.getElementById(id);
const groups=[['author','01 / Author the intent'],['compose','02 / Compose and resolve'],['execute','03 / Inspect and execute'],['trust','04 / Publish and trust']];
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
let active=null,step=0;
const requestedSlide=Number(new URLSearchParams(location.search).get('from'));
const from=Number.isInteger(requestedSlide)&&requestedSlide>=1&&requestedSlide<=13?requestedSlide:0;
if(Number.isInteger(from)&&from>=1&&from<=13){$('back-deck').href='nkd-team-tour.html#'+from;$('back-deck').textContent='← Back to slide '+from;}
function topicHref(id){return '#'+id;}
function withOrigin(href){if(!href.startsWith('demo-team-explorer.html'))return href;const parts=href.split('#');return parts[0]+'?from='+(from||active?.slide||1)+(parts[1]?'#'+parts[1]:'');}
function nav(){const query=$('search').value.trim().toLowerCase();let count=0;$('topic-nav').innerHTML=groups.map(([group,label])=>{const list=concepts.filter(c=>c.group===group&&(!query||[c.title,c.oneSentence,c.id,...(c.keywords||[])].join(' ').toLowerCase().includes(query)));count+=list.length;return list.length?'<div class="group-name">'+escapeHTML(label)+'</div>'+list.map(c=>'<a class="topic-link" href="'+topicHref(c.id)+'"'+(active?.id===c.id?' aria-current="page"':'')+'><span>'+String(concepts.indexOf(c)+1).padStart(2,'0')+'</span>'+escapeHTML(c.title)+'</a>').join(''):'';}).join('');if(!count)$('topic-nav').innerHTML='<p class="empty-search">No matches. Try “pin”, “graph” or “sign”.</p>';if(query){$('topic-nav').classList.add('open');$('toggle-nav').setAttribute('aria-expanded','true');}$('overview-link').toggleAttribute('aria-current',!active);if(!active)$('overview-link').setAttribute('aria-current','page');}
function home(){active=null;$('main').innerHTML='<div class="eyebrow">A field guide for the team</div><h1>Every concept.<br>One connected system.</h1><p class="lead">Start with what should ship. Follow the exact inputs, the generated work, and the evidence that travels with the release.</p><div class="intro-meta"><span class="pill">'+concepts.length+' focused examples</span><span class="pill green">Works offline</span><span class="pill">Based on PR #108</span></div><div class="journey" aria-label="NKD concept journey">'+[['catalog','Catalog','Reusable producers'],['definition','Definition','Named outputs'],['plan','Plan','Resolved work'],['pipeline','Pipeline','Generated CI'],['artifacts','Artifacts','Exact bytes'],['release','Release','Connected evidence']].map(([id,name,sub],i)=>'<a href="#'+id+'"><small>0'+(i+1)+' / '+sub+'</small>'+name+'</a>').join('')+'</div>'+groups.map(([group,label])=>'<section class="home-group"><div class="group-head"><h2>'+escapeHTML(label.slice(5))+'</h2><span>'+escapeHTML(label.slice(0,2))+' / Choose a concrete example</span></div><div class="cards">'+concepts.filter(c=>c.group===group).map(c=>'<a class="concept-card" href="#'+c.id+'"><div class="card-top"><span>'+String(concepts.indexOf(c)+1).padStart(2,'0')+'</span><span aria-hidden="true">↗</span></div><h3>'+escapeHTML(c.title)+'</h3><p>'+escapeHTML(c.cardDescription||c.oneSentence)+'</p></a>').join('')+'</div></section>').join('')+'<div class="home-banner"><div><div class="eyebrow">Follow the real candidate</div><h2 style="margin:9px 0 0">34 outputs. Two OS images. One release.</h2><p>Use the saved graphs offline, then replay the native commands in the guided demos.</p></div><a class="button" href="demo-team-walkthrough.html">Start the walkthrough →</a></div><p class="footer-note">Public lifecycle: Definition → Run → Release. Plans and graphs are generated records. Examples explain current implementation; evidence and acceptance retain their own scope.</p>';nav();}
function codeMarkup(raw,language){return raw.split('\n').map(line=>{if(/^\s*#/.test(line))return '<span class="comment">'+escapeHTML(line)+'</span>';let safe=escapeHTML(line);if(/yaml|yml/.test(language))safe=safe.replace(/^(\s*(?:- )?)([\w.-]+)(:)/,'$1<span class="key">$2</span>$3');return safe;}).join('\n');}
function diagram(c){const nodes=c.flow||[['Declare','Inputs'],['Resolve','Exact work'],['Inspect','Result']],width=900,gap=40,w=(width-40-gap*(nodes.length-1))/nodes.length;return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 122" role="img" aria-label="'+escapeHTML(c.flowCaption||c.title+' concept flow')+'"><defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6789b0"/></marker></defs>'+nodes.map(([name,sub],i)=>{const x=20+i*(w+gap);return (i?'<line class="flow-line" x1="'+(x-gap+5)+'" y1="59" x2="'+(x-10)+'" y2="59" marker-end="url(#flow-arrow)"/>':'')+'<g class="flow-node'+(i===0?' active':'')+'"><rect x="'+x+'" y="17" width="'+w+'" height="84" rx="10"/><text class="node-title" x="'+(x+w/2)+'" y="53" text-anchor="middle">'+escapeHTML(name)+'</text><text class="node-sub" x="'+(x+w/2)+'" y="78" text-anchor="middle">'+escapeHTML(sub)+'</text></g>';}).join('')+'</svg><div class="mobile-flow" aria-label="'+escapeHTML(c.title)+' flow">'+nodes.map(([name,sub],i)=>'<div class="flow-node'+(i===0?' active':'')+'"><strong>'+escapeHTML(name)+'</strong><small>'+escapeHTML(sub)+'</small></div>').join('')+'</div>';}
function renderTopic(c){active=c;step=0;const index=concepts.indexOf(c),paragraphs=c.explanation||[];$('main').innerHTML='<div class="breadcrumb"><a href="#overview">All concepts</a><span>/</span><span>'+escapeHTML(groups.find(g=>g[0]===c.group)?.[1].slice(5)||'')+'</span></div><div class="topic-head"><div class="eyebrow">Concept '+String(index+1).padStart(2,'0')+' / '+concepts.length+'</div><h1>'+escapeHTML(c.title)+'</h1><p class="lead">'+escapeHTML(c.oneSentence)+'</p><div class="topic-meta"><span class="pill '+(c.badge==='deferred'?'amber':'green')+'">'+escapeHTML(c.displayBadge||c.badge||'Implemented')+'</span><span class="plain">'+escapeHTML(c.exampleLabel||'Focused teaching example · see source notes for context')+'</span></div></div><figure class="flow">'+diagram(c)+'<figcaption class="flow-caption">'+escapeHTML(c.flowCaption||'Simplified concept view. Open the graph explorer for the recorded dependency graph.')+'</figcaption></figure><div class="example-layout"><section class="example" aria-label="Concrete example"><div class="example-top"><span>'+escapeHTML(c.exampleTitle||c.exampleLanguage||'Example')+'</span><button type="button" class="copy" id="copy-example">Copy example</button></div><pre id="example-code"><code>'+codeMarkup(c.example||'',c.exampleLanguage||'')+'</code></pre><div class="example-foot">'+escapeHTML(c.exampleFoot||'Excerpts may omit surrounding fields. Commands with placeholders need your own values.')+'</div></section><section class="explain"><h2>Why it matters</h2><p class="why">'+escapeHTML(c.why)+'</p><p class="steps-label">Walk the example</p><div class="walk-steps" aria-label="Explanation steps">'+paragraphs.map((p,i)=>'<button type="button" data-step="'+i+'" aria-label="Step '+(i+1)+'" aria-pressed="'+(i===0)+'">'+(i+1)+'</button>').join('')+'</div><div class="step-text" id="step-text" aria-live="polite"></div><div class="step-nav"><button type="button" id="step-prev">← Previous step</button><button type="button" id="step-next">Next step →</button></div></section></div>'+(c.miniDemo?.length?'<section class="change-demo"><div class="steps-label">A concrete change</div><h3>See what changes — and what stays put.</h3><div class="change-options">'+c.miniDemo.map((d,i)=>'<button type="button" data-change="'+i+'" aria-pressed="'+(i===0)+'">'+escapeHTML(d.label)+'</button>').join('')+'</div><div class="change-pair"><div><small>Before</small><p id="change-before"></p></div><span aria-hidden="true">→</span><div><small>After</small><p id="change-after"></p></div></div><p class="change-effect" id="change-effect" aria-live="polite"></p></section>':'')+(c.quiz?'<section class="quiz"><div class="steps-label">Try a decision</div><h3>'+escapeHTML(c.quiz.prompt)+'</h3><div class="choices">'+c.quiz.choices.map((a,i)=>'<button type="button" data-choice="'+i+'" aria-pressed="false">'+escapeHTML(a.label)+'</button>').join('')+'</div><p class="quiz-result" id="quiz-result" aria-live="polite">Select an option to see the effect.</p></section>':'')+(c.scope?'<div class="scope"><strong>'+escapeHTML(c.scopeTitle||'What this example establishes')+'</strong>'+escapeHTML(c.scope)+'</div>':'')+'<div class="related">'+(c.actions||[]).map(a=>'<a class="button'+(a.secondary?' secondary':'')+'" href="'+escapeHTML(withOrigin(a.href))+'">'+escapeHTML(a.label)+'</a>').join('')+'<a class="button secondary" href="nkd-team-tour.html#'+(from||c.slide||1)+'">Back to slide '+(from||c.slide||1)+' →</a></div><details class="sources"><summary>Source notes · exact files and scope</summary><p>'+escapeHTML(c.sourceNote||'Checked against PR #108. Source paths are provided for maintainers; the explanation and navigation work offline.')+'</p><ul>'+(c.sourcePaths||[]).map(p=>'<li>'+escapeHTML(p)+'</li>').join('')+'</ul></details><nav class="pager" aria-label="Neighboring concepts">'+(index?'<a href="#'+concepts[index-1].id+'"><small>← Previous concept</small>'+escapeHTML(concepts[index-1].title)+'</a>':'<a href="#overview"><small>← Back</small>All concepts</a>')+(index<concepts.length-1?'<a href="#'+concepts[index+1].id+'"><small>Next concept →</small>'+escapeHTML(concepts[index+1].title)+'</a>':'<a href="demo-team-walkthrough.html"><small>Next →</small>Try the guided demos</a>')+'</nav>';
 document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>showStep(Number(b.dataset.step))));$('step-prev').addEventListener('click',()=>showStep(step-1));$('step-next').addEventListener('click',()=>showStep(step+1));$('copy-example').addEventListener('click',copyExample);document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));$('quiz-result').textContent=c.quiz.choices[Number(b.dataset.choice)].result;}));if(c.miniDemo?.length){document.querySelectorAll('[data-change]').forEach(b=>b.addEventListener('click',()=>showChange(Number(b.dataset.change))));showChange(0);}showStep(0);nav();}
function showChange(n){const change=active.miniDemo[n];$('change-before').textContent=change.before;$('change-after').textContent=change.after;$('change-effect').textContent=change.effect;document.querySelectorAll('[data-change]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.change)===n)));}
function showStep(n){step=Math.max(0,Math.min(active.explanation.length-1,n));$('step-text').textContent=active.explanation[step]||'';document.querySelectorAll('[data-step]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.step)===step)));$('step-prev').disabled=step===0;$('step-next').disabled=step===active.explanation.length-1;for(const selector of ['.flow svg .flow-node','.mobile-flow .flow-node']){const nodes=document.querySelectorAll(selector);nodes.forEach((node,i)=>node.classList.toggle('active',i===Math.min(nodes.length-1,Math.floor(step*nodes.length/active.explanation.length))));}}
async function copyExample(){try{if(!navigator.clipboard)throw Error('No clipboard');await navigator.clipboard.writeText(active.example);$('copy-example').textContent='Copied';$('status').textContent='Example copied.';}catch{const range=document.createRange();range.selectNodeContents($('example-code'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);$('copy-example').textContent='Selected · copy now';$('status').textContent='Example selected. Use your system copy shortcut.';}}
function route(event){let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{id='overview';}if(id==='main'){$('main').focus();return;}if(!id||id==='overview'){home();}else{const c=concepts.find(c=>c.id===id);if(c)renderTopic(c);else{$('main').innerHTML='<section class="not-found"><h1>Choose a concept.</h1><p>This topic is not in the guide.</p><a class="button" href="#overview">Open the gallery →</a></section>';active=null;nav();}}document.title=active?'NKD · '+active.title:'NKD · Concepts in action';window.scrollTo(0,0);$('topic-nav').classList.remove('open');$('toggle-nav').setAttribute('aria-expanded','false');if(event?.type==='hashchange')$('main').focus({preventScroll:true});}
$('search').addEventListener('input',nav);$('search').addEventListener('keydown',event=>{if(event.key==='Enter'){const first=$('topic-nav').querySelector('a');if(first)location.hash=first.hash;}});$('toggle-nav').addEventListener('click',()=>{const open=$('topic-nav').classList.toggle('open');$('toggle-nav').setAttribute('aria-expanded',String(open));});window.addEventListener('hashchange',route);route();
</script></body></html>
