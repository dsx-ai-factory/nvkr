apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-external-charts
  description: External chart packages selected by one NVKE controller deploy path.
sources:
  nvke-controller:
    repo: https://github.com/dsx-ai-factory/nvke
    tagPrefix: controller/
    constraint: 0.1.x
    pinSet:
      format: nvke-deploy-v1
      file: controller/deploy/nke-sbom/nke-deploy.yaml
      members:
        postgresql: {artifact: postgresql-chart}
        spire: {artifact: spire-chart}
        spire-crds: {artifact: spire-crds-chart}
        temporal: {artifact: temporal-chart}
      accounted:
        nke-base-config: {type: template}
        spire-tpm-pubhashes: {type: manifest}
        spire-server-nodeport: {type: manifest}
        spire-oidc-provider-nodeport: {type: manifest}
        capnico: {type: manifest}
        controller: {type: helm, path: ../charts/controller}
components:
  postgresql-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: postgresql
        repository: oci://registry-1.docker.io/bitnamicharts
      evidence: {none: true}
  spire-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: spire
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence: {none: true}
  spire-crds-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: spire-crds
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence: {none: true}
  temporal-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: temporal
        repository: https://go.temporal.io/helm-charts
      evidence: {none: true}
