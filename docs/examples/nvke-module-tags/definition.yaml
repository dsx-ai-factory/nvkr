apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../../../inputs/catalogs/nvke/module-tags
cosignTool: cosign
kind: Definition
metadata:
  description: Build the NVKE CLI, CWE runtime image and upstream controller Helm chart from
    pinned source.
  name: nvke-v1
outputs:
- components:
  - cwe
  format: oci
  name: cwe
  platform: linux/amd64
- components:
  - nvke-helm
  format: helm-oci
  helm:
    images:
      controller: cwe
  name: nvke-helm
  platform: linux/amd64
- components:
  - nvkectl
  format: executable
  name: nvkectl
  platform: linux/amd64
sbomTool: syft
