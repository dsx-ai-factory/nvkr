apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../../../inputs/catalogs/nvke
cosignTool: cosign-module-tags
kind: Definition
metadata:
  description: Build the NVKE CLI, nvke-controller runtime image and upstream controller Helm chart from
    pinned source.
  name: nvke-module-tags
outputs:
- components:
  - nvke-controller-module-tags
  format: oci
  name: nvke-controller
  platform: linux/amd64
- components:
  - nvke-helm
  format: helm-oci
  helm:
    images:
      controller: nvke-controller
  name: nvke-helm
  platform: linux/amd64
- components:
  - nvkectl-module-tags
  format: executable
  name: nvkectl
  platform: linux/amd64
sbomTool: syft-module-tags
