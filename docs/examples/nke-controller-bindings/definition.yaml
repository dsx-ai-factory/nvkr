apiVersion: nkd.dev/definition/v4
kind: Definition
metadata:
  name: nke-controller-bindings
catalog:
  base: .
outputs:
  - name: controller-chart
    components: [controller-chart]
    format: helm-oci
    platform: linux/amd64
    helm:
      images:
        controller: cwe
  - name: cwe
    components: [cwe]
    format: oci
    platform: linux/amd64
  - name: postgresql
    format: helm-oci
    platform: linux/amd64
    components: [postgresql-chart]
  - name: spire
    format: helm-oci
    platform: linux/amd64
    components: [spire-chart]
  - name: spire-crds
    format: helm-oci
    platform: linux/amd64
    components: [spire-crds-chart]
  - name: temporal
    format: helm-oci
    platform: linux/amd64
    components: [temporal-chart]
