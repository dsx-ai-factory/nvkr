apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../../../inputs/catalogs/tools
kind: Definition
metadata:
  description: Build the Linux arm64 NVKE CLI, controller image and image-bound controller
    chart from pinned source.
  name: nvke-tutorial-arm64
outputs:
- catalog:
    base: ../../../inputs/catalogs/nvke
  components:
  - nvke-controller
  format: oci
  name: nvke-controller
  platform: linux/arm64
- catalog:
    base: ../../../inputs/catalogs/nvke
  components:
  - nvke-controller-chart
  format: helm-oci
  helm:
    images:
      controller: nvke-controller
  name: nvke-controller-chart
  platform: linux/arm64
- catalog:
    base: ../../../inputs/catalogs/nvke
  components:
  - nvkectl
  format: executable
  name: nvkectl
  platform: linux/arm64
sbomTool: syft
