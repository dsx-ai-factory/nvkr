apiVersion: nvkr.dev/definition/v5
catalog:
  base: ../../../inputs/catalogs/nvke
cosignTool: cosign
kind: Definition
metadata:
  description: Build the Linux amd64 NVKE CLI, controller image and image-bound controller
    chart from pinned source.
  name: nvke-tutorial-amd64
outputs:
- components:
  - nvke-controller
  format: oci
  name: nvke-controller
  platform: linux/amd64
- components:
  - nvke-controller-chart
  format: helm-oci
  helm:
    images:
      controller: nvke-controller
  name: nvke-controller-chart
  platform: linux/amd64
- components:
  - nvkectl
  format: executable
  name: nvkectl
  platform: linux/amd64
sbomTool: syft
