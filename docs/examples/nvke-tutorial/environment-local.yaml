apiVersion: nvkr.dev/environment/v1
kind: Environment
metadata:
  description: Local development registry and dry-run signing policy.
  name: nvke-local
# `nvkr run local --source-override nvke=<constraint-or-commit>` builds NVKE at
# another version for one Run; other sources keep their reviewed pins.
overridable:
  sources:
    nvke:
      repository: https://github.com/dsx-ai-factory/nvke
publication:
  anonymous: true
  plainHTTP: true
  repositoryPrefix: 127.0.0.1:5000/nvke
runtime:
  runtime: docker
signing:
  identity: ^local$
  issuer: https://nvkr.dev/local
  mode: dry-run
utilityContainer: golang@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6
utilityPlatform: linux/amd64
