apiVersion: nvkr.dev/catalog/v3
kind: SourceBuildRegistry
metadata:
  name: nvke-controller-bindings
  description: External chart packages selected by one NVKE controller deploy path.
sources:
  nvke-controller:
    repo: https://github.com/dsx-ai-factory/nvke
    constraint: v0.22.0
    toolchainImage: golang@sha256:0d1d3a794be25f809dd2cb3160d8c73276c4056a9f8242a138e908ddeee7b6b6
    pinSet:
      format: nvke-deploy-v1
      file: deploy/nico/nvke-deploy.yaml
      members:
        postgresql: {artifact: postgresql-chart}
        spire: {artifact: spire-chart}
        spire-crds: {artifact: spire-crds-chart}
        temporal: {artifact: temporal-chart}
      accounted:
        nvke-base-config: {type: template}
        spire-tpm-pubhashes: {type: manifest}
        spire-server-nodeport: {type: manifest}
        spire-oidc-provider-nodeport: {type: manifest}
        capnico: {type: manifest}
        controller: {type: helm, path: ../../controller/deploy/charts/controller, chartName: nvke-controller}
        nktp: {type: helm, path: ../../nktp/deploy/charts/nktp}
components:
  cwe:
    artifactPath: bin/cwe.oci.tar
    buildCommand:
    - sh
    - -ec
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=/src --local
      dockerfile=/src/controller --opt platform=linux/amd64 --opt "build-arg:BUILD_VERSION=$BUILD_VERSION"
      --opt "build-arg:GIT_VERSION=$GIT_VERSION" --opt "build-arg:SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
      --output type=oci,dest=/src/bin/cwe.oci.tar,oci-mediatypes=true
    builderType: buildkit-rootless
    fromSource: true
    outputType: oci-image
    platforms:
    - linux/amd64
    source: nvke-controller
    toolchainImage: moby/buildkit@sha256:80b15f0735e87bab7bf59ec4d695dfb4a7cfb25521cf56dc75d6f256285b63ef
    versionStamp:
      BUILD_VERSION: '{{.ModuleTag}}'
      GIT_VERSION: '{{.Commit}}'
    writeDir: bin
  controller-chart:
    helm:
      chart: .
      images:
        controller:
          values:
            digest: image.digest
    source: nvke-controller
    fromSource: true
    outputType: tarball
    platforms: [linux/amd64]
    artifactPath: bin/controller-chart.tar
    writeDir: bin
    buildCommand:
      - sh
      - -ec
      - 'tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -C /src/controller/deploy/charts -cf /src/bin/controller-chart.tar controller'
  postgresql-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: postgresql
        repository: oci://registry-1.docker.io/bitnamicharts
      evidence: {none: true}
  spire-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: spire
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence: {none: true}
  spire-crds-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: spire-crds
        repository: https://spiffe.github.io/helm-charts-hardened/
      evidence: {none: true}
  temporal-chart:
    platforms: [linux/amd64, linux/arm64]
    pinnedBy: nvke-controller
    outputType: raw
    prebuilt:
      chart:
        name: temporal
        repository: https://go.temporal.io/helm-charts
      evidence: {none: true}
